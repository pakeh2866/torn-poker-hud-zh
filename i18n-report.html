15207, "zline": 15209, "decl": "syncEmojiIndicators", "en": "Often overplays marginal hands", "zh": "经常过度游戏边缘牌", "kind": "sentence"}, {"line": 15208, "zline": 15210, "decl": "syncEmojiIndicators", "en": "Loose caller (card-verified)", "zh": "松跟注（已牌面验证）", "kind": "sentence"}, {"line": 15269, "zline": 15271, "decl": "buildOpponentHintHtml", "en": "Stop trying to bluff them off hands — they call with anything. Sit back and trap. When you flop strong, check and let them bet into you, then raise. Tighten your preflop range and be patient. Their chips will come to you — don't rush it.", "zh": "别想诈唬他们弃牌——他们什么牌都跟。坐等陷阱。当你翻牌中了强牌，过牌让他们下注，然后加注。收紧你的翻前范围，耐心等待。他们的筹码会主动送上门——别着急。", "kind": "sentence"}, {"line": 15270, "zline": 15272, "decl": "buildOpponentHintHtml", "en": "Don't fold too quickly to their bets — they fire a lot of bluffs. Call them down with medium-strength hands more than you normally would. 3-bet them back for value when you have it, and let their own aggression cost them chips.", "zh": "别太快弃牌给他们——他们打了很多诈唬。用中等牌力多跟注，比平时更多一些。有牌力的时候反加注3-bet，让他们自己的激进打法付出筹码代价。", "kind": "sentence"}, {"line": 15271, "zline": 15273, "decl": "buildOpponentHintHtml", "en": "Most dangerous player at the table. Their range is tight and strong — respect their bets. Fold marginal hands when they show resistance. Don't try to run bluffs without a clear read. If they raise on a scary board, believe them. Pick up pots when they're not in the hand and avoid big confrontations without a strong holding.", "zh": "桌上最危险的玩家。他们的范围紧且强——尊重他们的下注。当他们表现出抵抗时，弃掉边缘牌。没有明确读牌不要试图诈唬。如果他们在危险的牌面加注，相信他们。当他们不参与底池时捡走底池，没有强牌避免正面交锋。", "kind": "sentence"}, {"line": 15272, "zline": 15274, "decl": "buildOpponentHintHtml", "en": "This is your ATM. They play way too many hands and barely raise — just call and call. Value bet relentlessly with any made hand. Don't bluff them, don't get fancy. Bet big when you have it, check when you don't. They'll pay you off with bottom pair and gutshot draws all day long.", "zh": "这是你的提款机。他们玩太多牌了，几乎不加注——只会跟注、跟注。有成型牌就无情地价值下注。别诈唬他们，别玩花哨的。有牌就下大注，没牌就过牌。他们会用底对和卡顺听牌一直支付你。", "kind": "sentence"}, {"line": 15273, "zline": 15275, "decl": "buildOpponentHintHtml", "en": "Never bluff them. They will call down to the river with bottom pair — full stop. Your only weapon is value. Bet big when you have it. Don't slow-play or trap. Thin value bets work here too — even top pair with a weak kicker is worth multiple streets. Just show up at showdown with the better hand.", "zh": "永远别诈唬他们。他们会用底对跟注到河牌——句号。你唯一的武器就是价值。有牌就下大注。别慢打或设陷阱。薄价值下注也有效——即使顶对弱踢脚也值得多条街下注。只需要在摊牌时拿出更好的牌就行。", "kind": "sentence"}, {"line": 15274, "zline": 15276, "decl": "buildOpponentHintHtml", "en": "Even tighter than a nit — they play almost nothing. Steal their blinds every single orbit from any position. When they finally put chips in, run. Their range is AA/KK/AK and not much else. Don't waste a single chip trying to play back at them unless you're holding the nuts.", "zh": "比nit还紧——他们几乎不玩牌。每圈从任何位置偷他们的盲注。当他们终于往底池里投筹码时，快跑。他们的范围就是AA/KK/AK，没别的了。除非你拿着坚果牌，否则别浪费一个筹码试图反打他们。", "kind": "sentence"}, {"line": 15275, "zline": 15277, "decl": "buildOpponentHintHtml", "en": "Steal their blinds relentlessly from late position — they fold almost everything. When they finally show resistance, get out immediately. Their bets mean a very strong hand. Take the easy money repeatedly and don't pay them off when they wake up.", "zh": "从后位无情地偷他们的盲注——他们几乎什么都弃牌。当他们终于表现出抵抗时，立即撤退。他们的下注意味着非常强的牌。反复拿这些轻松的钱，别在他们\"醒过来\"时支付他们。", "kind": "sentence"}, {"line": 15276, "zline": 15278, "decl": "buildOpponentHintHtml", "en": "C-bet almost every flop — they check-fold a lot. Steal blinds freely. When they call or raise, slow down and reassess. They avoid confrontation heavily, so their aggression is almost always real strength. Pick up small pots constantly, bleed them out.", "zh": "几乎每个翻牌都C-bet——他们经常过牌-弃牌。随意偷盲。当他们跟注或加注时，放慢节奏重新评估。他们极力避免对抗，所以他们的激进几乎总是真牌。持续捡走小底池，慢慢放干他们的血。", "kind": "sentence"}, {"line": 15277, "zline": 15279, "decl": "buildOpponentHintHtml", "en": "Value bet relentlessly. They'll call with middle pair, weak draws, anything marginal. Don't bother bluffing — they call too much for it to work consistently. Play straightforward ABC poker and make them pay every single street when you have something real.", "zh": "无情地价值下注。他们会用中对、弱听牌、任何边缘牌跟注。别费心诈唬了——他们跟注太多，诈唬很难持续有效。打直接的ABC扑克，当你真有牌时，每条街都让他们付出代价。", "kind": "sentence"}, {"line": 15278, "zline": 15280, "decl": "buildOpponentHintHtml", "en": "No clear pattern yet — don't make fancy plays until you have a proper read. Watch how they respond to bets. Do they fold? Do they call? Do they fight back? Use the next few hands to build a real picture before committing big chips.", "zh": "还没有明确的模式——在你有清晰的读牌之前，别玩花哨的。观察他们如何回应下注。他们弃牌吗？跟注吗？反击吗？用接下来几手牌建立真实画像，然后再投入大筹码。", "kind": "sentence"}, {"line": 15279, "zline": 15281, "decl": "buildOpponentHintHtml", "en": "Not enough hands seen yet. Play standard poker and observe their tendencies.", "zh": "观察的手牌还不够多。打标准扑克，观察他们的倾向。", "kind": "sentence"}, {"line": 15283, "zline": 15285, "decl": "buildOpponentHintHtml", "en": "How to Play Against", "zh": "对抗 的策略", "kind": "term"}, {"line": 15381, "zline": 15383, "decl": "vsPool", "en": "Specific Exploits", "zh": "具体漏洞", "kind": "term"}, {"line": 15388, "zline": 15390, "decl": "vsPool", "en": "Specific Exploits", "zh": "具体漏洞", "kind": "term"}, {"line": 15395, "zline": 15397, "decl": "vsPool", "en": "Don't tilt-call because they're being annoying. Every bad call is chips you're giving away. Wait for a real hand and trap.", "zh": "别因为他们烦人就情绪化跟注。每次糟糕的跟注都是在白送筹码。等一手真牌然后设陷阱。", "kind": "sentence"}, {"line": 15399, "zline": 15401, "decl": "vsPool", "en": "", "zh": "翻前", "kind": "term"}, {"line": 15399, "zline": 15401, "decl": "vsPool", "en": "s preflop — well above the Torn average of and one of the highest at the table. Tighten your opening range when they have position or are in the blinds.", "zh": "率为 ——桌上最高的之一。当他们有位置或在盲注位时，收紧你的开池范围。", "kind": "sentence"}, {"line": 15401, "zline": 15403, "decl": "vsPool", "en": "Wins", "zh": "摊牌胜率为", "kind": "term"}, {"line": 15401, "zline": 15403, "decl": "vsPool", "en": "of showdowns reached — when they call to the river, they usually have it. Don't fire into them on wet boards without the goods.", "zh": "——当他们跟注到河牌时，通常真有牌。没有好牌别在湿润牌面往他们身上开火。", "kind": "sentence"}, {"line": 15403, "zline": 15405, "decl": "vsPool", "en": "Rarely folds AND wins at showdown a lot — do not bluff. Only put chips in when you're confident you're ahead.", "zh": "很少弃牌，而且摊牌赢率很高——不要诈唬。只有当你确信领先时才投入筹码。", "kind": "sentence"}, {"line": 15405, "zline": 15407, "decl": "vsPool", "en": "Tight range, almost always strong. Fold marginal hands to their bets. Don't try to outplay them without the nuts.", "zh": "范围紧，几乎总是强牌。对他们的下注弃掉边缘牌。没有坚果牌别想胜过他们。", "kind": "sentence"}, {"line": 15407, "zline": 15409, "decl": "vsPool", "en": "Watch their position — a TAG raising in position is value, not a steal. Don't 3-bet light expecting a fold.", "zh": "注意他们的位置——TAG在有位置时加注是价值，不是偷盲。别指望轻量3-bet就能让他们弃牌。", "kind": "sentence"}, {"line": 15409, "zline": 15411, "decl": "vsPool", "en": "Don't get frustrated when they suck out — bad players get lucky short term. Stay disciplined, keep value betting, the math wins over time.", "zh": "别因为他们反超就沮丧——差玩家短期内也会走运。保持纪律，持续价值下注，长期来看数学会赢。", "kind": "sentence"}, {"line": 15411, "zline": 15413, "decl": "vsPool", "en": "Almost never folds post-flop (", "zh": "翻牌后几乎从不弃牌（", "kind": "sentence"}, {"line": 15411, "zline": 15413, "decl": "vsPool", "en": ") — your bluffs are burning chips. Only bet when you have real equity or a made hand.", "zh": "）——你的诈唬在烧筹码。只有当你真的有赢率或成型牌时才下注。", "kind": "sentence"}, {"line": 15413, "zline": 15415, "decl": "vsPool", "en": "Large raise sizes (avg", "zh": "大额加注尺寸（均占筹码的", "kind": "term"}, {"line": 15413, "zline": 15415, "decl": "vsPool", "en": "% of stack) — when they raise, they're committed. Don't try to push them off it.", "zh": "%）——他们加注时已经投入了。别试图把他们赶走。", "kind": "sentence"}, {"line": 15430, "zline": 15432, "decl": "gambledRate", "en": "Watch Out For", "zh": "注意", "kind": "term"}, {"line": 15497, "zline": 15499, "decl": "buildStartingHandCard", "en": "And you've never raised it — raising builds bigger pots when you're ahead.", "zh": "而且你从未加注过——当你领先时加注能建立更大的底池。", "kind": "sentence"}, {"line": 15513, "zline": 15515, "decl": "noLeaksNote", "en": "Starting Hand Report", "zh": "起手牌报告", "kind": "term"}, {"line": 15534, "zline": 15536, "decl": "buildFoldDisciplineCard", "en": "Folded strong hands", "zh": "弃掉了强牌", "kind": "term"}, {"line": 15534, "zline": 15536, "decl": "buildFoldDisciplineCard", "en": "times", "zh": "次", "kind": "term"}, {"line": 15534, "zline": 15536, "decl": "buildFoldDisciplineCard", "en": ". Review whether the bet sizing justified it —", "zh": "。回顾一下当时的尺度是否真的该弃——", "kind": "sentence"}, {"line": 15534, "zline": 15536, "decl": "buildFoldDisciplineCard", "en": "times is a pattern.", "zh": "次已经成模式了。", "kind": "term"}, {"line": 15536, "zline": 15538, "decl": "buildFoldDisciplineCard", "en": "Folded a strong hand once", "zh": "有一次弃掉了强牌", "kind": "sentence"}, {"line": 15536, "zline": 15538, "decl": "buildFoldDisciplineCard", "en": ". Could be correct — monitor if it becomes a pattern.", "zh": "。可能是正确的——观察是否形成模式。", "kind": "sentence"}, {"line": 15542, "zline": 15544, "decl": "buildFoldDisciplineCard", "en": "Folded draws that completed", "zh": "在成牌的听牌上弃牌", "kind": "sentence"}, {"line": 15542, "zline": 15544, "decl": "buildFoldDisciplineCard", "en": "out of", "zh": "次里有", "kind": "term"}, {"line": 15542, "zline": 15544, "decl": "buildFoldDisciplineCard", "en": "times", "zh": "次", "kind": "term"}, {"line": 15542, "zline": 15544, "decl": "buildFoldDisciplineCard", "en": ". You may be folding too early when pot odds justify calling.", "zh": "。赔率够跟的时候，你可能弃得太早了。", "kind": "sentence"}, {"line": 15544, "zline": 15546, "decl": "buildFoldDisciplineCard", "en": "Folded", "zh": "弃掉了", "kind": "term"}, {"line": 15544, "zline": 15546, "decl": "buildFoldDisciplineCard", "en": "draws —", "zh": "次听牌——", "kind": "term"}, {"line": 15544, "zline": 15546, "decl": "buildFoldDisciplineCard", "en": "hit,", "zh": "次成牌，", "kind": "term"}, {"line": 15544, "zline": 15546, "decl": "buildFoldDisciplineCard", "en": "missed. Fold discipline on draws looks reasonable.", "zh": "次没成。听牌上的弃牌纪律看起来合理。", "kind": "sentence"}, {"line": 15548, "zline": 15550, "decl": "buildFoldDisciplineCard", "en": "Correctly folded nothing", "zh": "正确地弃掉空气牌", "kind": "sentence"}, {"line": 15548, "zline": 15550, "decl": "buildFoldDisciplineCard", "en": "times", "zh": "次", "kind": "term"}, {"line": 15548, "zline": 15550, "decl": "buildFoldDisciplineCard", "en": ". Good discipline — don't call just because you're invested.", "zh": "。纪律不错——别因为已经投了钱就跟。", "kind": "sentence"}, {"line": 15551, "zline": 15553, "decl": "buildFoldDisciplineCard", "en": "Folded marginal hands", "zh": "在边缘牌上弃牌", "kind": "term"}, {"line": 15551, "zline": 15553, "decl": "buildFoldDisciplineCard", "en": "times", "zh": "次", "kind": "term"}, {"line": 15551, "zline": 15553, "decl": "buildFoldDisciplineCard", "en": ". Judgment calls — no clear leak unless you're folding them to minimum bets.", "zh": "。这属于判断题——除非你面对最小注也弃，否则不算明显漏洞。", "kind": "sentence"}, {"line": 15554, "zline": 15556, "decl": "buildFoldDisciplineCard", "en": "Fold Discipline", "zh": "弃牌纪律", "kind": "term"}, {"line": 15576, "zline": 15578, "decl": "buildTurnRiverCourageCard", "en": "Turn fold rate is", "zh": "转牌弃牌率", "kind": "term"}, {"line": 15576, "zline": 15578, "decl": "buildTurnRiverCourageCard", "en": "— reasonable. No obvious leak.", "zh": "——还算合理，没有明显漏洞。", "kind": "sentence"}, {"line": 15588, "zline": 15590, "decl": "buildTurnRiverCourageCard", "en": "River fold rate is", "zh": "河牌 fold rate is", "kind": "term"}, {"line": 15595, "zline": 15597, "decl": "buildTurnRiverCourageCard", "en": "You fold a lot on both late streets. Aggressive opponents will barrel you relentlessly — you're giving up pots you've already invested in.", "zh": "你在两条后街都弃牌很多。激进的对手会无情地连续下注——你在放弃已经投入了的底池。", "kind": "sentence"}, {"line": 15597, "zline": 15599, "decl": "buildTurnRiverCourageCard", "en": "You call down hard on both streets. Make sure you're not paying off value bets with weak holdings.", "zh": "你在两条街都硬跟到底。确保你没有用弱牌支付别人的价值下注。", "kind": "sentence"}, {"line": 15601, "zline": 15603, "decl": "buildTurnRiverCourageCard", "en": "Turn & River Courage", "zh": "转牌与河牌勇气", "kind": "term"}, {"line": 15634, "zline": 15636, "decl": "pct", "en": "Position Awareness", "zh": "位置意识", "kind": "term"}, {"line": 15669, "zline": 15671, "decl": "buildUncontestedCard", "en": "Uncontested Wins", "zh": "不战而胜", "kind": "term"}, {"line": 15872, "zline": 15874, "decl": "buildSelfHintHtml", "en": "You're in almost every hand and betting constantly. This occasionally bullies weaker players into folding, but any patient player with a real hand will stack you. You're bleeding chips on the hands you have no business being in.", "zh": "你几乎每手牌都参与，不停地押注。这偶尔能欺负弱玩家弃牌，但任何有耐心且有真牌的玩家都会清空你。你在那些不该进的牌局中流血筹码。", "kind": "sentence"}, {"line": 15873, "zline": 15875, "decl": "buildSelfHintHtml", "en": "Aggressive and involved — this can be a strong winning style when backed by real hand equity. You can accumulate chips fast, but you can spew them equally fast. The line between LAG and Maniac is discipline in hand selection.", "zh": "激进且参与度高——当有真实手牌赢率支持时，这可以是一种很强的赢利风格。你可以快速积累筹码，但也能同样快地挥霍掉。LAG和Maniac之间的界限在于起手牌选择的纪律性。", "kind": "sentence"}, {"line": 15874, "zline": 15876, "decl": "buildSelfHintHtml", "en": "You're playing the most profitable style in a casual pool. Selective hand selection, aggressive when you play, hard to put on a hand. The biggest risk from here is getting bored and gradually drifting your range wider.", "zh": "你在休闲局中打的是最盈利的风格。选择性起手牌，玩的时候就激进，很难被读牌。最大的风险是感到无聊，逐渐把范围放宽。", "kind": "sentence"}, {"line": 15875, "zline": 15877, "decl": "buildSelfHintHtml", "en": "You're playing far too many hands and almost never raising when you do. This is the most expensive style in poker — you're giving every opponent at the table correct odds and free information every hand. The good news: the fix is simple and the improvement will be dramatic.", "zh": "你玩的牌太多太多了，而且几乎从不加注。这是扑克中最昂贵的风格——你在每一手牌都给桌上每个对手正确的赔率和免费信息。好消息是：修复方法很简单，改善效果会非常显著。", "kind": "sentence"}, {"line": 15876, "zline": 15878, "decl": "buildSelfHintHtml", "en": "You enter a lot of pots but rarely raise. You're consistently calling with hands that should either fold or raise — callers fund other people's winnings. You're giving opponents correct odds to draw against you every hand.", "zh": "你进入很多底池但很少加注。你一直用应该弃牌或加注的牌在跟注——跟注者是在资助别人的赢利。你在每一手牌都给对手正确的听牌赔率。", "kind": "sentence"}, {"line": 15877, "zline": 15879, "decl": "buildSelfHintHtml", "en": "You fold almost everything. Your range is so tight that everyone at the table knows exactly what you have when you play a hand. You're giving up all the small pots and only winning when you have the absolute best of it — which isn't enough to grow your stack.", "zh": "你几乎弃掉一切。你的范围太紧了，桌上每个人都知道你玩牌时拿的是什么。你放弃了所有小底池，只有在拿到绝对最好的牌时才能赢——这不足以增长你的筹码。", "kind": "sentence"}, {"line": 15878, "zline": 15880, "decl": "buildSelfHintHtml", "en": "You're playing so tight you're leaving money on the table. You avoid bad spots — but you're also never stealing blinds, never applying pressure, and every player at the table has noticed they can fold when you bet.", "zh": "你玩得太紧了，把筹码留在了桌上。你避免了坏局面——但你也从不偷盲，从不施加压力，而且桌上每个玩家都注意到你下注时他们可以弃牌。", "kind": "sentence"}, {"line": 15879, "zline": 15881, "decl": "buildSelfHintHtml", "en": "You play few hands and don't raise enough when you do. That combo means you win small pots and lose small pots — but your chip count doesn't grow. You're playing scared money and giving away value every session.", "zh": "你玩的牌不多，玩的时候加注也不够。这个组合意味着你赢小底池、输小底池——但你的筹码数不会增长。你在玩害怕的钱，每次session都在白送价值。", "kind": "sentence"}, {"line": 15880, "zline": 15882, "decl": "buildSelfHintHtml", "en": "You're playing a lot of hands but checking and calling instead of betting and raising. This is one of the most expensive styles in poker. You give better-positioned and more aggressive players free information and cheap odds to outdraw you constantly.", "zh": "你玩了很多牌，但总是过牌和跟注，而不是下注和加注。这是扑克中最昂贵的风格之一。你给有位置优势、更激进的玩家免费信息和便宜的赔率，让他们不断反超你。", "kind": "sentence"}, {"line": 15881, "zline": 15883, "decl": "buildSelfHintHtml", "en": "Your play doesn't have a consistent enough pattern yet — could be genuine adaptation, could be inconsistency. Keep playing and check back once there's more data.", "zh": "你的打法还没有足够一致的模式——可能是真正的适应，也可能是不稳定。继续玩，等有更多数据后再回来看。", "kind": "sentence"}, {"line": 15882, "zline": 15884, "decl": "buildSelfHintHtml", "en": "Not enough hands tracked yet. Keep playing and come back.", "zh": "追踪的手牌还不够。继续玩，稍后再来。", "kind": "sentence"}, {"line": 15892, "zline": 15894, "decl": "buildSelfHintHtml", "en": "Across hands your stats sit between and , with the closest fit. A blended profile is fine when it's deliberate, and it makes you harder to read. Check the stat notes below to see which half of the blend earns and which leaks.", "zh": "手牌下来，你的数据介于 和 之间，更接近 。混合型只要是有意为之就不成问题，反而更难被读穿。看看下面的数据说明，就知道混合的两半里哪一半在赚钱、哪一半在漏钱。", "kind": "sentence"}, {"line": 15896, "zline": 15898, "decl": "buildSelfHintHtml", "en": "You Are:", "zh": "你的类型:", "kind": "term"}, {"line": 15901, "zline": 15903, "decl": "buildSelfHintHtml", "en": "— you're entering too many pots. Aim for", "zh": "— 你进入太多底池了. 目标范围", "kind": "sentence"}, {"line": 15901, "zline": 15903, "decl": "buildSelfHintHtml", "en": ". Start folding weak suited connectors, off-suit Broadway hands below J, and any hand you're \"hoping works out\".", "zh": ". 开始弃掉弱同花连牌、J以下的不同花高张, and any hand you're \"hoping works out\".", "kind": "sentence"}, {"line": 15922, "zline": 15924, "decl": "buildSelfHintHtml", "en": "— raising a lot preflop. Make sure you have hands that can handle a 3-bet or a caller who connects with the flop.", "zh": "— 翻前加注太多了。确保你选的牌扛得住 3-bet，也扛得住跟注后中了翻牌的对手。", "kind": "sentence"}, {"line": 15929, "zline": 15931, "decl": "buildSelfHintHtml", "en": "Your", "zh": "你的", "kind": "term"}, {"line": 15929, "zline": 15931, "decl": "buildSelfHintHtml", "en": "post-flop aggression is", "zh": "翻后攻击率是", "kind": "term"}, {"line": 15929, "zline": 15931, "decl": "buildSelfHintHtml", "en": "— you check and call too often. Bet your strong hands and semi-bluff draws. Passive play leaks value every session.", "zh": "——过牌和跟注太多。强牌要下注，听牌要半诈唬。被动打法每局都在白丢价值。", "kind": "sentence"}, {"line": 15931, "zline": 15933, "decl": "buildSelfHintHtml", "en": "Your", "zh": "你的", "kind": "term"}, {"line": 15931, "zline": 15933, "decl": "buildSelfHintHtml", "en": "post-flop aggression is", "zh": "翻后攻击率是", "kind": "term"}, {"line": 15931, "zline": 15933, "decl": "buildSelfHintHtml", "en": "— good balance.", "zh": "——平衡得不错。", "kind": "term"}, {"line": 15933, "zline": 15935, "decl": "buildSelfHintHtml", "en": "Your", "zh": "你的", "kind": "term"}, {"line": 15933, "zline": 15935, "decl": "buildSelfHintHtml", "en": "post-flop aggression is", "zh": "翻后攻击率是", "kind": "term"}, {"line": 15933, "zline": 15935, "decl": "buildSelfHintHtml", "en": "— you're firing a lot. Pick opponents who actually fold.", "zh": "——你开火很多。挑那些真会弃牌的对手下手。", "kind": "sentence"}, {"line": 15937, "zline": 15939, "decl": "buildSelfHintHtml", "en": "Your Stats Breakdown", "zh": "你的数据分解", "kind": "term"}, {"line": 15978, "zline": 15980, "decl": "buildSelfHintHtml", "en": "Bet your strong hands post-flop instead of checking", "zh": "翻后用下注代替过牌来打你的强牌", "kind": "sentence"}, {"line": 15978, "zline": 15980, "decl": "buildSelfHintHtml", "en": "— top pair on a dry board, a flopped flush draw, two pair — all deserve a bet. Passive play leaks value every session.", "zh": "— 干燥牌面的顶对、翻牌同花听牌、两对——都值得下注。被动打法每一局都在白白丢掉价值。", "kind": "sentence"}, {"line": 15980, "zline": 15982, "decl": "buildSelfHintHtml", "en": "— before calling, ask yourself \"should I raise here instead?\" The answer is yes more often than you think.", "zh": "— 在跟注之前，先问自己\"我这里是不是该加注？\" 答案是你应该适当多加注.", "kind": "sentence"}, {"line": 15983, "zline": 15985, "decl": "buildSelfHintHtml", "en": "Path to", "zh": "通往 之路", "kind": "term"}, {"line": 16002, "zline": 16004, "decl": "epPos", "en": "You're folding to turn bets", "zh": "面对转牌下注你有", "kind": "sentence"}, {"line": 16002, "zline": 16004, "decl": "epPos", "en": "of the time — even TAG players shouldn't be this exploitable on the turn.", "zh": "的时候弃牌——就算是紧凶型，也不该在转牌这么容易被针对。", "kind": "sentence"}, {"line": 16004, "zline": 16006, "decl": "epPos", "en": "River fold rate is", "zh": "河牌弃牌率", "kind": "term"}, {"line": 16004, "zline": 16006, "decl": "epPos", "en": "— getting high even for a TAG. Bluffers will find this.", "zh": "——对紧凶型来说也偏高了。诈唬的人会盯上这点。", "kind": "sentence"}, {"line": 16008, "zline": 16010, "decl": "epPos", "en": "Don't drift. The biggest leak for TAG players is gradually opening weaker hands out of boredom — that VPIP starts creeping up a few percent, then a few more. If the table is passive and no one fights back, you can add controlled aggression with suited connectors in position. Otherwise, stay the course.", "zh": "别漂移。TAG玩家最大的漏洞是出于无聊逐渐打开更弱的牌——VPIP开始悄悄上涨几个百分点，然后又几个百分点。如果牌桌被动，没人反击，你可以在有位置时用同花连牌增加可控的侵略性。否则，坚持住。", "kind": "sentence"}, {"line": 16009, "zline": 16011, "decl": "epPos", "en": "Stay Sharp", "zh": "保持敏锐", "kind": "term"}, {"line": 16098, "zline": 16100, "decl": "fmtAmt", "en": "OB", "zh": "超池", "kind": "term"}, {"line": 16098, "zline": 16100, "decl": "fmtAmt", "en": "probe", "zh": "试探", "kind": "term"}, {"line": 16150, "zline": 16152, "decl": "showRow", "en": "no showdown", "zh": "无争议", "kind": "term"}, {"line": 16150, "zline": 16152, "decl": "showRow", "en": "Won uncontested", "zh": "无争议获胜", "kind": "term"}, {"line": 16176, "zline": 16178, "decl": "LABEL_MAP", "en": "↩ Folded strong hand", "zh": "↩ 弃强牌", "kind": "term"}, {"line": 16177, "zline": 16179, "decl": "LABEL_MAP", "en": "↩ Good fold — strong hand, right call", "zh": "↩ 好弃牌——强牌，正确决定", "kind": "sentence"}, {"line": 16178, "  "zline": 17564, "decl": "leaderboardTier", "en": "Reg", "zh": "职业", "kind": "term"}, {"line": 17562, "zline": 17564, "decl": "leaderboardTier", "en": "Tight, selective, and winning at showdown — treat with caution.", "zh": "紧、有选择性且在摊牌赢钱——谨慎对待。", "kind": "sentence"}, {"line": 17563, "zline": 17565, "decl": "leaderboardTier", "en": "Regular", "zh": "普通", "kind": "term"}, {"line": 17563, "zline": 17565, "decl": "leaderboardTier", "en": "Average profile — no strong read either way yet.", "zh": "平均数据——尚无明确解读。", "kind": "sentence"}, {"line": 17588, "zline": 17590, "decl": "TIER_FILTERS", "en": "Whale", "zh": "鲸鱼", "kind": "term"}, {"line": 17588, "zline": 17590, "decl": "TIER_FILTERS", "en": "Fish", "zh": "鱼", "kind": "term"}, {"line": 17588, "zline": 17590, "decl": "TIER_FILTERS", "en": "Reg", "zh": "职业", "kind": "term"}, {"line": 17588, "zline": 17590, "decl": "TIER_FILTERS", "en": "Regular", "zh": "普通", "kind": "term"}, {"line": 17588, "zline": 17590, "decl": "TIER_FILTERS", "en": "Unknown", "zh": "未知", "kind": "term"}, {"line": 17773, "zline": 17775, "decl": "patternCount", "en": "Triple barrel bluff", "zh": "三重枪诈唬", "kind": "term"}, {"line": 17775, "zline": 17777, "decl": "patternCount", "en": "Probably chasing the flush with", "zh": "可能是在用", "kind": "sentence"}, {"line": 17775, "zline": 17777, "decl": "patternCount", "en": "— missed and kept firing anyway.", "zh": "追同花 — 没中但继续开枪。", "kind": "sentence"}, {"line": 17776, "zline": 17778, "decl": "patternCount", "en": "Likely on a straight draw that bricked.", "zh": "很可能是顺子听牌没中。", "kind": "sentence"}, {"line": 17777, "zline": 17779, "decl": "patternCount", "en": "triple-barrelling a bluff — compulsive bluffer. 4-bet or float and let them hang themselves.", "zh": "连续三枪诈唬 — 强迫性诈唬者。4-bet或漂浮跟注，让他们自取灭亡。", "kind": "sentence"}, {"line": 17777, "zline": 17779, "decl": "patternCount", "en": "Note the board texture he picks for triple barrels.", "zh": "注意他选择三枪诈唬的牌面结构。", "kind": "sentence"}, {"line": 17778, "zline": 17780, "decl": "patternCount", "en": "Committed three streets with nothing.", "zh": "三街连续下注但没有任何牌。", "kind": "sentence"}, {"line": 17781, "zline": 17783, "decl": "patternCount", "en": "Bluffed to showdown", "zh": "诈唬到摊牌", "kind": "term"}, {"line": 17784, "zline": 17786, "decl": "patternCount", "en": "High flush card, understandable semi-bluff", "zh": "高同花牌，可以理解的半诈唬", "kind": "sentence"}, {"line": 17784, "zline": 17786, "decl": "patternCount", "en": "Low flush card, bad spot to bluff", "zh": "低同花牌，不适合诈唬的位置", "kind": "sentence"}, {"line": 17785, "zline": 17787, "decl": "patternCount", "en": "— chasing with", "zh": "— 在听同花牌面上用", "kind": "term"}, {"line": 17785, "zline": 17787, "decl": "patternCount", "en": "on a flush-draw board.", "zh": "追牌。", "kind": "term"}, {"line": 17785, "zline": 17787, "decl": "patternCount", "en": "Didn't catch it. Classic chaser. Bet them off draws hard, they call too wide.", "zh": "没追上。经典追牌者。用下注赶走他们的听牌，他们跟注范围太宽。", "kind": "sentence"}, {"line": 17787, "zline": 17789, "decl": "patternCount", "en": "Probable straight draw that missed. Bluffed into the wrong person. Note the connected board — this player bets when they pick up equity, even low equity.", "zh": "可能是顺子听牌没中。诈唬错了人。注意关联牌面 — 这个玩家在有胜率时就会下注，即使胜率很低。", "kind": "sentence"}, {"line": 17801, "zline": 17803, "decl": "patternCount", "en": "Slowplay trap — checked with then raised. Be cautious when this player checks. They're willing to give a free card to spring a trap. a strong hand", "zh": "慢打陷阱 — 在 过牌 然后加注。这位玩家过牌时需谨慎。他们愿意送免费牌来设陷阱。 持有 持强牌", "kind": "sentence"}, {"line": 17806, "zline": 17808, "decl": "patternCount", "en": "3-bet bluff", "zh": "3-bet 诈唬", "kind": "term"}, {"line": 17808, "zline": 17810, "decl": "patternCount", "en": "3-bet bluffing", "zh": "3-bet诈唬", "kind": "term"}, {"line": 17808, "zline": 17810, "decl": "patternCount", "en": ". Either a serial bluffer or overvaluing marginal hands. Consider 4-betting light — they're folding or playing badly postflop.", "zh": "。要么是连续诈唬者，要么是高估了边缘牌。考虑用轻4-bet — 他们会弃牌或翻牌后打得很差。", "kind": "sentence"}, {"line": 17809, "zline": 17811, "decl": "patternCount", "en": "3-bet with nothing", "zh": "用空气牌3-bet", "kind": "term"}, {"line": 17809, "zline": 17811, "decl": "patternCount", "en": ". Could be a one-off or a pattern. Track frequency — if they do it again, 4-bet them.", "zh": "。可能是一次性的，也可能是模式。追踪频率 — 如果他们再做一次，就4-bet他们。", "kind": "sentence"}, {"line": 17812, "zline": 17814, "decl": "patternCount", "en": "Called off big stack with weak hand", "zh": "用弱牌跟注大筹码", "kind": "sentence"}, {"line": 17814, "zline": 17816, "decl": "patternCount", "en": "Chasing the flush with . Called off and missed. Textbook chaser. Bet them off draws — they won't fold but they'll often miss. — high card, pot odds might have looked okay — low card, terrible odds a big chunk", "zh": "用 追同花 。投入了 然后没中。教科书式追牌者。用下注赶走他们的听牌 — 他们不会弃牌但经常不中。 — 高牌，底池赔率可能看起来还行 — 低牌，赔率很差 大量筹码", "kind": "sentence"}, {"line": 17816, "zline": 17818, "decl": "patternCount", "en": "Called a big bet drawing to a straight.", "zh": "用顺子听牌跟注大注。", "kind": "sentence"}, {"line": 17816, "zline": 17818, "decl": "patternCount", "en": "stack at risk on a draw. Can be exploited — deny equity hard on draw-heavy boards.", "zh": "筹码冒险追牌。可被利用 — 在听牌多的牌面上强硬拒绝胜率。", "kind": "sentence"}, {"line": 17816, "zline": 17818, "decl": "patternCount", "en": "Significant", "zh": "大量", "kind": "term"}, {"line": 17817, "zline": 17819, "decl": "patternCount", "en": "Called off", "zh": "用", "kind": "term"}, {"line": 17817, "zline": 17819, "decl": "patternCount", "en": "with", "zh": "投入", "kind": "term"}, {"line": 17817, "zline": 17819, "decl": "patternCount", "en": "— no draw, just bad call. Station tendencies. Value bet mercilessly, don't bluff.", "zh": "筹码 — 没有听牌，纯粹是糟糕的跟注。站台式倾向。无情地价值下注，不要诈唬。", "kind": "sentence"}, {"line": 17817, "zline": 17819, "decl": "patternCount", "en": "big", "zh": "弱牌", "kind": "term"}, {"line": 17817, "zline": 17819, "decl": "patternCount", "en": "a weak hand", "zh": "大额", "kind": "term"}, {"line": 17820, "zline": 17822, "decl": "patternCount", "en": "Limp-reraise preflop", "zh": "翻前平跟反加", "kind": "term"}, {"line": 17821, "zline": 17823, "decl": "patternCount", "en": "Limp-reraise with", "zh": "用", "kind": "term"}, {"line": 17821, "zline": 17823, "decl": "patternCount", "en": "— classic trap with premiums (AA/KK). When this player limps and re-raises, give them maximum credit. Fold unless you have the nuts.", "zh": "溜入-再加注 — 经典的超强牌陷阱（AA/KK）。当这位玩家溜入并反加时，给予最大尊重。除非你有坚果，否则弃牌。", "kind": "sentence"}, {"line": 17821, "zline": 17823, "decl": "patternCount", "en": "a hand", "zh": "一手牌", "kind": "term"}, {"line": 17825, "zline": 17827, "decl": "patternCount", "en": "Donk-bet flop into PFA", "zh": "翻牌反主动下注打翻前攻击者", "kind": "term"}, {"line": 17826, "zline": 17828, "decl": "patternCount", "en": "Donk-bet into the preflop aggressor and took it down. Either very strong or found a spot the PFA couldn't defend. Watch if they repeat this — could be a positional exploit or just luck.", "zh": "向翻牌前攻击者反主动下注并拿下底池。要么是非常强，要么是找到了PFA无法防守的场合。注意他们是否重复此行为 — 可能是位置剥削或只是运气好。", "kind": "sentence"}, {"line": 17827, "zline": 17829, "decl": "patternCount", "en": "Donk-bet into the preflop aggressor and lost. Doesn't respect position. Easy to exploit — raise their donk-bets and they'll fold or misplay.", "zh": "向翻牌前攻击者反主动下注并输掉。不尊重位置。容易被利用 — 加注他们的反主动下注，他们会弃牌或打错。", "kind": "sentence"}, {"line": 17854, "zline": 17856, "decl": "renderAutoTagEntry", "en": "Hand", "zh": "手牌", "kind": "term"}, {"line": 17863, "zline": 17865, "decl": "renderAutoTagEntry", "en": "Board", "zh": "牌面", "kind": "term"}, {"line": 17901, "zline": 17903, "decl": "showAutoTagsModal", "en": "Notable Plays —", "zh": "Notable 入池率 —", "kind": "term"}, {"line": 18038, "zline": 18040, "decl": "STREETS", "en": "Pre", "zh": "翻前", "kind": "term"}, {"line": 18038, "zline": 18040, "decl": "STREETS", "en": "Flop", "zh": "翻牌", "kind": "term"}, {"line": 18038, "zline": 18040, "decl": "STREETS", "en": "Turn", "zh": "转牌", "kind": "term"}, {"line": 18038, "zline": 18040, "decl": "STREETS", "en": "River", "zh": "河牌", "kind": "term"}, {"line": 18091, "zline": 18093, "decl": "showPrevCoachModal", "en": "Previous Hands — Coach Advice", "zh": "历史手牌——教练建议", "kind": "sentence"}, {"line": 18116, "zline": 18118, "decl": "showPrevCoachModal", "en": "Previous Hands — Coach Advice", "zh": "历史手牌——教练建议", "kind": "sentence"}, {"line": 18227, "zline": 18229, "decl": "showCoachGlossaryModal", "en": "Stack-to-Pot Ratio — your effective stack divided by the pot. Tells you how committed you already are.", "zh": "筹码底池比——你的有效筹码除以底池，用来判断你已经陷得多深。", "kind": "sentence"}, {"line": 18227, "zline": 18229, "decl": "showCoachGlossaryModal", "en": "SPR under 3 = you're nearly pot-committed — calling a shove often makes sense even with one pair.", "zh": "SPR 低于 3 = 接近套池——就算只有一对，跟全下通常也划算。", "kind": "sentence"}, {"line": 18227, "zline": 18229, "decl": "showCoachGlossaryModal", "en": "SPR 3–8 = mid-depth — don't overcommit without a strong hand.", "zh": "SPR 3–8 = 中等深度——没有强牌别过度投入。", "kind": "sentence"}, {"line": 18227, "zline": 18229, "decl": "showCoachGlossaryModal", "en": "SPR over 8 = deep stack — one pair rarely wins a big pot. Be careful.", "zh": "SPR 高于 8 = 深筹码——一对很少能赢下大池，谨慎点。", "kind": "sentence"}, {"line": 18230, "zline": 18232, "decl": "showCoachGlossaryModal", "en": "Which player's starting hands connect better with the current board. The preflop raiser's range hits high, dry boards harder. The caller's range hits low, connected boards harder.", "zh": "谁的起手牌和当前牌面更契合。翻前加注者的范围更容易命中高张、干燥的牌面；跟注者的范围更容易命中低张、连张的牌面。", "kind": "sentence"}, {"line": 18230, "zline": 18232, "decl": "showCoachGlossaryModal", "en": "Example: Board A-K-2 rainbow → raiser has the range edge (AK, AA, KK are in their range).", "zh": "例：牌面 A-K-2 彩虹 → 加注者有范围优势（AK、AA、KK 都在他的范围里）。", "kind": "sentence"}, {"line": 18230, "zline": 18232, "decl": "showCoachGlossaryModal", "en": "Board 6-7-8 two-tone → caller has the range edge (they flatted with suited connectors and small pairs).", "zh": "牌面 6-7-8 双花 → 跟注者有范围优势（他用同花连牌和小对子平跟进来的）。", "kind": "sentence"}, {"line": 18248, "zline": 18250, "decl": "showCoachGlossaryModal", "en": "Coach Confidence", "zh": "教练置信度", "kind": "term"}, {"line": 18264, "zline": 18266, "decl": "showHelpModal", "en": "HUD Glossary", "zh": "HUD 术语表", "kind": "term"}, {"line": 18266, "zline": 18268, "decl": "showHelpModal", "en": "Stats", "zh": "数据指标", "kind": "term"}, {"line": 18268, "zline": 18270, "decl": "showHelpModal", "en": "Voluntarily Put $ In Pot \\u2014 how often they choose to enter a pot preflop (call or raise). High = loose, low = tight.", "zh": "自愿往底池里放钱——翻前主动进池（跟注或加注）的频率。越高越松，越低越紧。", "kind": "sentence"}, {"line": 18269, "zline": 18271, "decl": "showHelpModal", "en": "Preflop Raise % \\u2014 how often they raise before the flop. Should be close to VPIP for aggressive players; a big gap means they limp/call a lot.", "zh": "翻前加注率——翻前主动加注的频率。激进玩家的 PFR 应该接近 VPIP；差距大说明他经常溜入或跟注。", "kind": "sentence"}, {"line": 18270, "zline": 18272, "decl": "showHelpModal", "en": "Aggression Frequency \\u2014 how often they bet or raise (vs. call/check) post-flop. High = aggressive post-flop, low = passive.", "zh": "攻击频率——翻后主动下注或加注（相对于跟注/过牌）的频率。越高翻后越激进，越低越被动。", "kind": "sentence"}, {"line": 18271, "zline": 18273, "decl": "showHelpModal", "en": "Went To ShowDown \\u2014 how often they stick around until the cards are shown. High WTSD = hard to bluff off a hand.", "zh": "打到摊牌率——坚持到最后亮牌的比例。WTSD 越高，越难用诈唬把他打走。", "kind": "sentence"}, {"line": 18272, "zline": 18274, "decl": "showHelpModal", "en": "Won at ShowDown \\u2014 win rate when they do reach showdown. Low WSD with high WTSD = calling with weak hands.", "zh": "摊牌胜率——真正走到摊牌时的赢牌比例。WTSD 高而 WSD 低，说明他拿弱牌也跟到底。", "kind": "sentence"}, {"line": 18273, "zline": 18275, "decl": "showHelpModal", "en": "A re-raise preflop after someone already raised. Signals a very strong hand or a bluff squeeze.", "zh": "翻前在别人已经加注之后再反加。代表极强的牌，或是诈唬式挤压。", "kind": "sentence"}, {"line": 18274, "zline": 18276, "decl": "showHelpModal", "en": "Continuation Bet \\u2014 betting the flop after raising preflop. Standard move to take down pots without a strong hand.", "zh": "持续下注——翻前加注后，翻牌继续下注。这是不靠强牌也能拿下底池的标准打法。", "kind": "sentence"}, {"line": 18275, "zline": 18277, "decl": "showHelpModal", "en": "Just calling the big blind preflop instead of raising. Passive entry \\u2014 gives opponents good odds and hands initiative away.", "zh": "翻前只跟大盲而不加注。被动进池——送给对手好赔率，也把主动权交出去。", "kind": "sentence"}, {"line": 18276, "zline": 18278, "decl": "showHelpModal", "en": "Gap (VPIP\\u2013PFR)", "zh": "Gap (VPIP–PFR)", "kind": "term"}, {"line": 18276, "zline": 18278, "decl": "showHelpModal", "en": "Difference between how often they play hands vs. raise. A big gap means they call a lot more than they raise \\u2014 exploitable with aggression.", "zh": "进池率和加注率之间的差。差距大说明他跟注远多于加注——可以用激进来针对。", "kind": "sentence"}, {"line": 18279, "zline": 18281, "decl": "showHelpModal", "en": "Player Types", "zh": "玩家类型", "kind": "term"}, {"line": 18281, "zline": 18283, "decl": "showHelpModal", "en": "Sharp / TAG (Tight-Aggressive) \\u2014 plays a selective range but bets hard when in. The most dangerous type.", "zh": "紧凶型 / TAG——只玩精选范围，但一旦进池就打得凶。最危险的一类对手。", "kind": "sentence"}, {"line": 18282, "zline": 18284, "decl": "showHelpModal", "en": "Aggressive / LAG (Loose-Aggressive) \\u2014 plays many hands and puts pressure on everyone. Hard to read but can overplay.", "zh": "松凶型 / LAG——玩很多牌，给所有人施压。难以读牌，但容易打过头。", "kind": "sentence"}, {"line": 18283, "zline": 18285, "decl": "showHelpModal", "en": "Maniac \\u2014 plays almost everything and bets constantly. Very high VPIP and PFR. Chaotic and unpredictable.", "zh": "疯子——几乎什么都玩，还不停地打。VPIP 和 PFR 都极高，混乱且难以预测。", "kind": "sentence"}, {"line": 18284, "zline": 18286, "decl": "showHelpModal", "en": "Fish \\u2014 plays too many hands and almost never raises. Easy to exploit: bet for value, don't bluff.", "zh": "鱼——玩的牌太多，而且几乎不加注。很好针对：一路价值下注，别诈唬。", "kind": "sentence"}, {"line": 18285, "zline": 18287, "decl": "showHelpModal", "en": "Calling Station \\u2014 loose but passive. Will call you down to the river. Never try to bluff these players off a hand.", "zh": "跟注站——松但被动，会一路跟到河牌。永远别想用诈唬把他打走。", "kind": "sentence"}, {"line": 18286, "zline": 18288, "decl": "showHelpModal", "en": "Nit \\u2014 folds almost everything. Only plays very strong hands. Fold when they show aggression.", "zh": "紧弱型——几乎什么都弃，只玩很强的牌。他一表现出激进，直接弃牌。", "kind": "sentence"}, {"line": 18287, "zline": 18289, "decl": "showHelpModal", "en": "Rock \\u2014 even tighter than a Nit. Only absolute premiums. Treat their bets as the nuts.", "zh": "岩石——比紧弱型还紧，只玩绝对的好牌。他一下注，就当坚果处理。", "kind": "sentence"}, {"line": 18288, "zline": 18290, "decl": "showHelpModal", "en": "Cautious / Tight-Passive \\u2014 plays few hands and mostly checks/calls. Avoids confrontation. Low threat level.", "zh": "谨慎型——玩的牌很少，多数时候过牌或跟注，回避对抗。威胁等级低。", "kind": "sentence"}, {"line": 18289, "zline": 18291, "decl": "showHelpModal", "en": "Passive Gambler / Loose-Passive \\u2014 plays many hands but rarely bets or raises. Drifts and calls.", "zh": "松弱型——玩很多牌，但很少下注或加注，跟着牌漂、只会跟注。", "kind": "sentence"}, {"line": 18290, "zline": 18292, "decl": "showHelpModal", "en": "Unpredictable / Mixed \\u2014 no clear pattern detected yet. Under 25 hands this means \"not enough data to tell\".", "zh": "混合型——暂时看不出明显模式。少于 25 手时，意思是“样本还不够，看不出来”。", "kind": "sentence"}, {"line": 18291, "zline": 18293, "decl": "showHelpModal", "en": "Hybrid \\u2014 with 25+ hands, a Mixed player's badge names the styles their stats sit between, closest fit first. Letters:", "zh": "混合型——满 25 手之后，混合型玩家的徽章会标出他的数据介于哪几种风格之间，最接近的排前面。字母：", "kind": "sentence"}, {"line": 18291, "zline": 18293, "decl": "showHelpModal", "en": "Maniac,", "zh": "疯子,", "kind": "term"}, {"line": 18291, "zline": 18293, "decl": "showHelpModal", "en": "Aggressive,", "zh": "激进型,", "kind": "term"}, {"line": 18291, "zline": 18293, "decl": "showHelpModal", "en": "Sharp,", "zh": "紧凶型,", "kind": "term"}, {"line": 18291, "zline": 18293, "decl": "showHelpModal", "en": "Fish,", "zh": "鱼,", "kind": "term"}, {"line": 18291, "zline": 18293, "decl": "showHelpModal", "en": "Calling Station,", "zh": "跟注站,", "kind": "term"}, {"line": 18291, "zline": 18293, "decl": "showHelpModal", "en": "Rock,", "zh": "岩石,", "kind": "term"}, {"line": 18291, "zline": 18293, "decl": "showHelpModal", "en": "Nit,", "zh": "紧弱型,", "kind": "term"}, {"line": 18291, "zline": 18293, "decl": "showHelpModal", "en": "Cautious,", "zh": "谨慎型,", "kind": "term"}, {"line": 18291, "zline": 18293, "decl": "showHelpModal", "en": "Passive Gambler. With poker terms on:", "zh": "Passive Gambler. 开启扑克术语后：", "kind": "sentence"}, {"line": 18291, "zline": 18293, "decl": "showHelpModal", "en": "LAG,", "zh": "松凶型,", "kind": "term"}, {"line": 18291, "zline": 18293, "decl": "showHelpModal", "en": "TAG,", "zh": "紧凶型,", "kind": "term"}, {"line": 18291, "zline": 18293, "decl": "showHelpModal", "en": "Tight-Passive,", "zh": "紧弱型,", "kind": "term"}, {"line": 18291, "zline": 18293, "decl": "showHelpModal", "en": "Loose-Passive. A three-way blend like S/F/C is possible. Hover the badge for the full names.", "zh": "松弱型. 也可能出现 S/F/C 这种三风格混合。悬停徽章可看完整名称。", "kind": "sentence"}, {"line": 18294, "zline": 18296, "decl": "showHelpModal", "en": "Positions", "zh": "位置", "kind": "term"}, {"line": 18296, "zline": 18298, "decl": "showHelpModal", "en": "Early Position \\u2014 first seats to act preflop (UTG, UTG+1). You act before almost everyone \\u2014 play tighter here.", "zh": "前位——翻前最先行动的几个位置（UTG、UTG+1）。你几乎在所有人之前行动，这里要打得更紧。", "kind": "sentence"}, {"line": 18297, "zline": 18299, "decl": "showHelpModal", "en": "Middle Position \\u2014 seats between EP and the button. More info than EP, less than late position.", "zh": "中位——介于前位和按钮之间的位置。信息比前位多，比后位少。", "kind": "sentence"}, {"line": 18298, "zline": 18300, "decl": "showHelpModal", "en": "Late Position / Button \\u2014 last to act post-flop. Strongest position. Play more hands and steal more blinds here.", "zh": "后位 / 按钮——翻后最后行动，最强的位置。这里可以多玩牌、多偷盲。", "kind": "sentence"}, {"line": 18299, "zline": 18301, "decl": "showHelpModal", "en": "Cutoff \\u2014 one seat right of the Button. Second-best position. Good spot to steal blinds.", "zh": "CO（按钮前一位）——按钮右手边的位置，第二好的位置，偷盲的好地方。", "kind": "sentence"}, {"line": 18300, "zline": 18302, "decl": "showHelpModal", "en": "Small Blind \\u2014 posts half the forced bet. Acts first post-flop every street. Worst position post-flop.", "zh": "小盲——下半个强制注。翻后每条街都最先行动，是翻后最差的位置。", "kind": "sentence"}, {"line": 18301, "zline": 18303, "decl": "showHelpModal", "en": "Big Blind \\u2014 posts the full forced bet. Gets last action preflop but is out of position post-flop.", "zh": "大盲——下全额强制注。翻前最后行动，但翻后处于不利位置。", "kind": "sentence"}, {"line": 18302, "zline": 18304, "decl": "showHelpModal", "en": "Big Blind as a stack unit. \"20 BB\" means their stack is 20\\u00d7 the big blind.", "zh": "大盲作为筹码单位。“20 BB”表示他的筹码是大盲的 20 倍。", "kind": "sentence"}, {"line": 18305, "zline": 18307, "decl": "showHelpModal", "en": "Icons &amp; Indicators", "zh": "图标与标识", "kind": "term"}, {"line": 18307, "zline": 18309, "decl": "showHelpModal", "en": "Inline stats beside the badge — V: VPIP (hands played %), P: PFR (preflop raise %), A: AFq (postflop aggression %), 3B: preflop 3-bet % (appears after 10+ chances to 3-bet). A highlighted value means notably high or low for that stat. Hover the column for this legend in-game.", "zh": "徽章旁的一行数据——V：VPIP（入池率 %），P：PFR（翻前加注率 %），A：AFq（翻后攻击率 %），3B：翻前 3-bet 率 %（满 10 次 3-bet 机会后才显示）。数值高亮表示该指标明显偏高或偏低。游戏中把鼠标移到此列可查看这份说明。", "kind": "sentence"}, {"line": 18308, "zline": 18310, "decl": "showHelpModal", "en": "🎭 on badge", "zh": "🎭 徽章上", "kind": "term"}, {"line": 18308, "zline": 18310, "decl": "showHelpModal", "en": "Frequent bluffer — caught bluffing at showdown in 40%+ of verified hands. Their bets are often air.", "zh": "惯犯诈唬——已核实的手牌里有 40% 以上在摊牌被抓诈唬。他的下注常常是空气。", "kind": "sentence"}, {"line": 18309, "zline": 18311, "decl": "showHelpModal", "en": "🎯 on badge", "zh": "🎯 徽章上", "kind": "term"}, {"line": 18309, "zline": 18311, "decl": "showHelpModal", "en": "Draw chaser — chases flush or straight draws in 35%+ of verified hands. Often calls too wide when drawing.", "zh": "追牌型——已核实的手牌里有 35% 以上在追同花或顺子。追牌时经常跟得太宽。", "kind": "sentence"}, {"line": 18310, "zline": 18312, "decl": "showHelpModal", "en": "💎 on badge", "zh": "💎 徽章上", "kind": "term"}, {"line": 18310, "zline": 18312, "decl": "showHelpModal", "en": "Value player — shows up with strong hands at showdown 60%+ of the time. Their aggression is usually real.", "zh": "价值型——摊牌时有 60% 以上拿着强牌。他的激进通常是真的。", "kind": "sentence"}, {"line": 18311, "zline": 18313, "decl": "showHelpModal", "en": "🃏 on badge", "zh": "🃏 徽章上", "kind": "term"}, {"line": 18311, "zline": 18313, "decl": "showHelpModal", "en": "Overplays marginals — frequently bets/raises with weak holdings and loses at showdown. Calls them down.", "zh": "高估边缘牌——经常拿弱牌下注或加注，一到摊牌就输。跟到底就行。", "kind": "sentence"}, {"line": 18312, "zline": 18314, "decl": "showHelpModal", "en": "📞 on badge", "zh": "📞 徽章上", "kind": "term"}, {"line": 18312, "zline": 18314, "decl": "showHelpModal", "en": "Loose caller — calls down with weak hands in 25%+ of verified hands. Don't bluff these players.", "zh": "松跟型——已核实的手牌里有 25% 以上拿弱牌跟到底。别诈唬这类玩家。", "kind": "sentence"}, {"line": 18313, "zline": 18315, "decl": "showHelpModal", "en": "▼ on badge", "zh": "▼ 徽章上", "kind": "term"}, {"line": 18313, "zline": 18315, "decl": "showHelpModal", "en": "Stack drop — down 50%+ from their peak stack this session. May be tilting or short on chips.", "zh": "筹码下滑——本局从最高点跌去 50% 以上。可能上头了，也可能筹码不多了。", "kind": "sentence"}, {"line": 18314, "zline": 18316, "decl": "showHelpModal", "en": "▽ on badge", "zh": "▽ 徽章上", "kind": "term"}, {"line": 18314, "zline": 18316, "decl": "showHelpModal", "en": "Moderate stack drop — down 35–50% from peak. Worth keeping an eye on.", "zh": "中度下滑——从最高点跌去 35–50%，值得留意。", "kind": "sentence"}, {"line": 18315, "zline": 18317, "decl": "showHelpModal", "en": "! on badge", "zh": "! 徽章上", "kind": "term"}, {"line": 18315, "zline": 18317, "decl": "showHelpModal", "en": "Live alert — a notable pattern was detected this hand (e.g. limp-reraise, check-raise, 3-bet from a tight player). Hover to see details.", "zh": "实时警报——本手牌检测到值得注意的模式（例如溜入反加、过牌加注、紧手玩家 3-bet）。悬停查看详情。", "kind": "sentence"}, {"line": 18316, "zline": 18318, "decl": "showHelpModal", "en": "✎ N below seat", "zh": "✎ 座位下方 N", "kind": "term"}, {"line": 18316, "zline": 18318, "decl": "showHelpModal", "en": "Auto-tag count — the HUD has recorded N notable plays from this player (showdowns, bluffs, draws). Click to review them.", "zh": "自动标记数——HUD 已记录该玩家 N 次值得注意的打法（摊牌、诈唬、追牌）。点击查看。", "kind": "sentence"}, {"line": 18317, "zline": 18319, "decl": "showHelpModal", "en": "$amount below seat", "zh": "座位下方 $ 金额", "kind": "term"}, {"line": 18317, "zline": 18319, "decl": "showHelpModal", "en": "Torn net worth pulled from their profile. Colour shows wealth tier. Hover for their stack-to-wealth ratio — tells you how much this game matters to them.", "zh": "从对方资料页读到的 Torn 净资产。颜色代表财富层级。悬停可看他的筹码占净资产比例——能看出这局对他有多重要。", "kind": "sentence"}, {"line": 18318, "zline": 18320, "decl": "showHelpModal", "en": "Flag below seat", "zh": "座位下方的旗帜", "kind": "term"}, {"line": 18318, "zline": 18320, "decl": "showHelpModal", "en": "Faction flag — this player shares a Torn faction with someone else at the table. Doesn't mean they're colluding, but worth knowing.", "zh": "帮派标记——该玩家和桌上另一个人属于同一个 Torn 帮派。不一定是在串通，但值得知道。", "kind": "sentence"}, {"line": 18319, "zline": 18321, "decl": "showHelpModal", "en": "⚠ N below seat", "zh": "⚠ 座位下方 N", "kind": "term"}, {"line": 18319, "zline": 18321, "decl": "showHelpModal", "en": "Suspicious pattern — N concerning interactions detected between this player and another (soft play or whipsaw). Click for the full report.", "zh": "可疑模式——检测到该玩家与另一人之间有 N 次可疑互动（放水或拉扯）。点击查看完整报告。", "kind": "sentence"}, {"line": 18322, "zline": 18324, "decl": "showHelpModal", "en": "Other Concepts", "zh": "其他概念", "kind": "term"}, {"line": 18324, "zline": 18326, "decl": "showHelpModal", "en": "Short-stacked", "zh": "短筹码", "kind": "term"}, {"line": 18324, "zline": 18326, "decl": "showHelpModal", "en": "Less than ~20 BB. Strategy shifts to push/fold \\u2014 normal VPIP/PFR stats become less reliable.", "zh": "不足约 20 BB。策略转为推或弃——常规的 VPIP/PFR 数据会变得不太可靠。", "kind": "sentence"}, {"line": 18325, "zline": 18327, "decl": "showHelpModal", "en": "Rebuy", "zh": "重买", "kind": "term"}, {"line": 18325, "zline": 18327, "decl": "showHelpModal", "en": "Adding chips back after busting. Multiple rebuys can signal a tilting or gambling-style player.", "zh": "输光后重新买入筹码。多次重买可能说明这个玩家在上头，或者本身就是赌徒型。", "kind": "sentence"}, {"line": 18326, "zline": 18328, "decl": "showHelpModal", "en": "Tilt", "zh": "上头（tilt）", "kind": "term"}, {"line": 18326, "zline": 18328, "decl": "showHelpModal", "en": "Playing worse than normal due to frustration or losses. Watch for stack drops, rebuy sprees, and sudden aggression spikes.", "zh": "因为沮丧或亏损而打得比平时差。留意筹码下滑、连续重买和突然的激进爆发。", "kind": "sentence"}, {"line": 18327, "zline": 18329, "decl": "showHelpModal", "en": "Wet board", "zh": "湿润牌面", "kind": "term"}, {"line": 18327, "zline": 18329, "decl": "showHelpModal", "en": "A flop full of draw potential \\u2014 flush draws, straight draws, connected cards. Bluffs are riskier here.", "zh": "充满追牌可能的翻牌——同花听牌、顺子听牌、连牌很多。这种牌面诈唬风险更大。", "kind": "sentence"}, {"line": 18328, "zline": 18330, "decl": "showHelpModal", "en": "Dry board", "zh": "干燥牌面", "kind": "term"}, {"line": 18328, "zline": 18330, "decl": "showHelpModal", "en": "Disconnected, uncoordinated flop with few draws. C-bets and bluffs have higher success rates here.", "zh": "牌与牌之间不搭、追牌很少的翻牌。这种牌面 C-bet 和诈唬的成功率更高。", "kind": "sentence"}, {"line": 18329, "zline": 18331, "decl": "showHelpModal", "en": "Value bet", "zh": "价值下注", "kind": "term"}, {"line": 18329, "zline": 18331, "decl": "showHelpModal", "en": "Betting with a strong hand hoping to get called by worse hands. The opposite of a bluff.", "zh": "拿强牌下注，希望被更差的牌跟注。诈唬的反面。", "kind": "sentence"}, {"line": 18330, "zline": 18332, "decl": "showHelpModal", "en": "Probe bet", "zh": "探测下注", "kind": "term"}, {"line": 18330, "zline": 18332, "decl": "showHelpModal", "en": "Betting into the preflop aggressor on a later street to test if they still have a hand.", "zh": "在后面的街上主动向翻前加注者下注，试探他是否还有牌。", "kind": "sentence"}, {"line": 18467, "zline": 18469, "decl": "showSettingsModal", "en": ">High (15% VPIP shift)", "zh": ">高 (15% VPIP shift)", "kind": "term"}, {"line": 18468, "zline": 18470, "decl": "showSettingsModal", "en": ">Medium (20%)", "zh": ">中 (20%)", "kind": "term"}, {"line": 18470, "zline": 18472, "decl": "showSettingsModal", "en": ">Low (30%)", "zh": ">低 (30%)", "kind": "term"}, {"line": 18508, "zline": 18510, "decl": "showSettingsModal", "en": "Normally paused 1-on-1 since a heads-up villain's stats would blend into their multi-way numbers and skew both. Turn this on if you mostly play heads-up tables — the badge, coach reads, and VPIP/PFR will keep working instead of showing a neutral \"HU\" tag.", "zh": "单挑（1v1）时默认暂停，因为单挑对手的数据会混进他多人桌的数字里，把两边都带偏。如果你主要打单挑桌，就打开这一项——徽章、教练解读和 VPIP/PFR 会继续工作，而不是显示一个中性的 \"HU\" 标签。", "kind": "sentence"}, {"line": 18533, "zline": 18535, "decl": "showSettingsModal", "en": "Coach panel (phone)", "zh": "教练面板（手机）", "kind": "term"}, {"line": 18539, "zline": 18541, "decl": "showSettingsModal", "en": "Some people want Mr. Coach parked open the whole session instead of collapsing to a bubble after every tap elsewhere. Turn this off to keep the panel open until you tap the &minus; button yourself.", "zh": "有人希望教练面板整局都摊开着，而不是每次点别处就缩成一个小气泡。关掉这一项，面板就会一直保持展开，直到你自己点 &minus; 收起。", "kind": "sentence"}, {"line": 18546, "zline": 18548, "decl": "showSettingsModal", "en": "Turn Alert", "zh": "轮到你行动的提醒", "kind": "term"}, {"line": 18564, "zline": 18566, "decl": "showSettingsModal", "en": "Mr. Coach", "zh": "Mr. 教练", "kind": "term"}, {"line": 18566, "zline": 18568, "decl": "showSettingsModal", "en": "Coach mode", "zh": "教练模式", "kind": "term"}, {"line": 18592, "zline": 18594, "decl": "showSettingsModal", "en": "Coach history", "zh": "教练历史", "kind": "term"}, {"line": 18606, "zline": 18608, "decl": "showSettingsModal", "en": "Coach voice", "zh": "教练语气", "kind": "term"}, {"line": 18647, "zline": 18649, "decl": "showSettingsModal", "en": "Floating bubble showing the chance an active villain has a hand that beats you, based on their observed showdown range filtered by their preflop action and sizing. Click the bubble to open the full Range Reader modal (current hand · history · hands beating you). Turn off entirely if you don't want it on screen.", "zh": "浮动气泡，显示某个还在局中的对手拿到能赢你的牌的概率——基于他已被观察到的摊牌范围，并按他的翻前动作和尺度过滤。点气泡可打开完整的范围解读弹窗（当前手牌 · 历史 · 能赢你的牌）。完全不想让它出现在屏幕上，就关掉这一项。", "kind": "sentence"}, {"line": 18693, "zline": 18695, "decl": "showSettingsModal", "en": "Paste your Torn API key…", "zh": "粘贴你的 Torn API 密钥…", "kind": "sentence"}, {"line": 18709, "zline": 18711, "decl": "showSettingsModal", "en": "Coach panel", "zh": "教练面板", "kind": "term"}, {"line": 18977, "zline": 18979, "decl": "showSettingsModal", "en": "Done!", "zh": "完成！", "kind": "term"}, {"line": 18978, "zline": 18980, "decl": "showSettingsModal", "en": "Reset to default", "zh": "重置为默认", "kind": "term"}, {"line": 19019, "zline": 19021, "decl": "showSettingsModal", "en": "Main storage was empty this session, so", "zh": "本次会话主存储是空的，所以从 TornPDA 备份恢复了", "kind": "sentence"}, {"line": 19019, "zline": 19021, "decl": "showSettingsModal", "en": "players were restored from the TornPDA backup. Hand history and per-stake splits were not in the backup and will rebuild as you play.", "zh": "名玩家。牌局历史和按级别拆分的数据不在备份里，会随着你打牌重新建立。", "kind": "sentence"}, {"line": 19231, "zline": 19233, "decl": "checkSelfTilt", "en": "You've dropped", "zh": "自峰值已跌", "kind": "term"}, {"line": 19231, "zline": 19233, "decl": "checkSelfTilt", "en": "since your peak — but you're still", "zh": "——但本会话仍盈利", "kind": "sentence"}, {"line": 19231, "zline": 19233, "decl": "checkSelfTilt", "en": "up on the session. That's real money worth protecting.", "zh": "。这是值得保护的真实资金。", "kind": "sentence"}, {"line": 19233, "zline": 19235, "decl": "checkSelfTilt", "en": "You're also down", "zh": "本会话总体还亏了", "kind": "term"}, {"line": 19233, "zline": 19235, "decl": "checkSelfTilt", "en": "on the session overall.", "zh": "。", "kind": "term"}, {"line": 19238, "zline": 19240, "decl": "checkSelfTilt", "en": "Your last", "zh": "最近", "kind": "term"}, {"line": 19238, "zline": 19240, "decl": "checkSelfTilt", "en": "hands you've been playing", "zh": "手牌你比平时多玩了", "kind": "sentence"}, {"line": 19238, "zline": 19240, "decl": "checkSelfTilt", "en": "% more hands than usual — that's a tilt pattern.", "zh": "%——这是倾斜模式。", "kind": "sentence"}, {"line": 19238, "zline": 19240, "decl": "checkSelfTilt", "en": "Take a breath before the next one.", "zh": "下一手之前先深呼吸。", "kind": "sentence"}, {"line": 19328, "zline": 19330, "decl": "attachBadgesToSeats", "en": "View Torn profile", "zh": "查看 Torn 个人资料", "kind": "term"}, {"line": 19690, "zline": 19692, "decl": "updatePositionIndicator", "en": "You act first post-flop (", "zh": "你翻牌后最先行动（", "kind": "sentence"}, {"line": 19690, "zline": 19692, "decl": "updatePositionIndicator", "en": "of", "zh": "/", "kind": "term"}, {"line": 19691, "zline": 19693, "decl": "updatePositionIndicator", "en": "You act last post-flop — button position (", "zh": "你翻牌后最后行动 — 按钮位（", "kind": "sentence"}, {"line": 19691, "zline": 19693, "decl": "updatePositionIndicator", "en": "of", "zh": "/", "kind": "term"}, {"line": 19692, "zline": 19694, "decl": "updatePositionIndicator", "en": "You act of post-flop", "zh": "你翻牌后第 个行动（ / ）", "kind": "term"}, {"line": 20039, "zline": 20041, "decl": "Board / cards rows", "en": "/* Board / cards rows */", "zh": "/* 牌面 / cards rows */", "kind": "sentence"}, {"line": 20472, "zline": 20474, "decl": "Hand history modal", "en": "/* Hand history modal */", "zh": "/* 手牌 history modal */", "kind": "sentence"}, {"line": 20571, "zline": 20573, "decl": "Mr. Coach floating panel", "en": "/* Mr. Coach floating panel */", "zh": "/* 教练先生 悬浮面板 */", "kind": "sentence"}, {"line": 20744, "zline": 20746, "decl": "Table Session Log bubble", "en": "/* Table Session Log bubble */", "zh": "/* Table Session 日志 bubble */", "kind": "sentence"}, {"line": 20939, "zline": 20941, "decl": "Table Log modal content", "en": "/* Table Log modal content */", "zh": "/* Table 日志 modal content */", "kind": "sentence"}, {"line": 22085, "zline": 22087, "decl": "pct", "en": "And it keeps working. Won it uncontested", "zh": "而且一直奏效。他们无争议拿下", "kind": "sentence"}, {"line": 22085, "zline": 22087, "decl": "pct", "en": "of", "zh": "/", "kind": "term"}, {"line": 22085, "zline": 22087, "decl": "pct", "en": ". Nobody's made them show it, so they keep firing.", "zh": "。没人逼他们亮过牌，所以他们一直开火。", "kind": "sentence"}, {"line": 22337, "zline": 22339, "decl": "priced", "en": "Those two disagree, kid. Hand says fold, line says they're stabbing, and the price is right. Trust the line and call.", "zh": "这两个信号打架了，小子。手牌说该弃，行动线说他在试探，而价格又合适。信行动线，跟。", "kind": "sentence"}, {"line": 22342, "zline": 22344, "decl": "priced", "en": "Those two disagree, kid. Hand says fold, line says they're stabbing. Anything that beats a bluff, trust the line and call.", "zh": "这两个信号打架了，小子。手牌说该弃，行动线说他在试探。任何能打败诈唬的牌，信行动线，跟。", "kind": "sentence"}, {"line": 22457, "zline": 22459, "decl": "_quickBoardRead", "en": "Board's a blank for them.", "zh": "这个牌面对他们的范围是白板。他们范围里", "kind": "sentence"}, {"line": 22457, "zline": 22459, "decl": "_quickBoardRead", "en": "% of their range has nothing and they're firing anyway. That's air, pal.", "zh": "% 在这儿什么都没有，他们照样开火。那就是空气，老兄。", "kind": "sentence"}], "structs": [{"line": 1037, "zline": 1039, "decl": "parseHandRank", "en": "if (/royal flush/i.test(handName))     return 9;", "zh": "if (/royal flush|皇家同花顺/i.test(handName))     return 9;"}, {"line": 1038, "zline": 1040, "decl": "parseHandRank", "en": "if (/st ll $25 → need to win 25/125 = 20% to break even.", "old": "", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18223", "en": "MDF (Minimum Defense Frequency)", "old": "", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18224", "en": "The minimum share of your hands you need to continue (call or raise, not fold) against a bet, so your opponent can't print money by bluffing with any two cards. It's advice about your whole range, not a verdict on the one hand you're holding — the coach's fold/call read on your actual cards still comes first.", "old": "", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18229", "en": "Range edge", "old": "", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18233", "en": "Draw Equity", "old": "", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18235", "en": "~X% equity to river", "old": "~${rawEq}% equity 到河牌", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18236", "en": "Your chance of completing your draw by the river (two cards still to come on the flop).", "old": "", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18236", "en": "Calculated as: outs × 4 on the flop, outs × 2 on the turn.", "old": "", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18238", "en": "Outs", "old": "", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18239", "en": "Cards left in the deck that complete your hand.", "old": "", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18239", "en": "Flush draw = 9 outs (~36% to hit by river).", "old": "", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18239", "en": "Open-ended straight draw = 8 outs (~32%).", "old": "", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18239", "en": "Gutshot straight draw = 4 outs (~16%).", "old": "", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18241", "en": "Odds are there ✓", "old": "", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18242", "en": "Your draw equity beats what you need to call — the call is mathematically profitable long-term.", "old": "", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18242", "en": "Example: draw equity 36%, need 28% to call → call.", "old": "", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18244", "en": "Odds against you ✗", "old": "", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18245", "en": "Your draw equity falls short of the required call % — calling loses money over time unless you have other reasons (fold equity, implied odds).", "old": "", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18245", "en": "Example: draw equity 16%, need 33% to call → fold the gutshot.", "old": "", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18250", "en": "Thin read", "old": "微弱解读", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18253", "en": "Decent read", "old": "初步解读", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18254", "en": "10–25 hands observed. Stats are becoming meaningful. Player type labels are reasonably reliable.", "old": "", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18256", "en": "Solid read", "old": "可靠解读", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18257", "en": "25+ hands observed. Player type and exploit advice is based on a substantial sample — higher confidence.", "old": "", "risk": "", "decl": "showCoachGlossaryModal"}, {"line": "18275", "en": "Limp", "old": "", "risk": "", "decl": "showHelpModal"}, {"line": "18276", "en": "Gap (VPIP–PFR)", "old": "", "risk": "", "decl": "showHelpModal"}, {"line": "18298", "en": "LP / BTN", "old": "", "risk": "", "decl": "showHelpModal"}, {"line": "18302", "en": "BB (unit)", "old": "", "risk": "", "decl": "showHelpModal"}, {"line": "18339", "en": "🎁 A note from HopesG", "old": "", "risk": "", "decl": "showDonateModal"}, {"line": "18343", "en": "This script will always be free. No subscriptions, no paywalls — ever.", "old": "", "risk": "", "decl h strong hands like ${classesTxt}. Give this one real credit.", "old": "", "risk": "", "decl": "text"}, {"line": "21755", "en": "${lead}, they usually got strong hands like ${classesTxt} at this size. Respect it, kid.", "old": "", "risk": "", "decl": "text"}, {"line": "21758", "en": "${lead}, they've mostly shown up with wider, speculative hands like ${classesTxt}. Don't give this one too much credit.", "old": "", "risk": "", "decl": "text"}, {"line": "21759", "en": "${lead}, they usually got wider, speculative hands like ${classesTxt} at this size. Don't buy it, kid.", "old": "", "risk": "", "decl": "text"}, {"line": "21787", "en": " Sizing tell: ${name} has shown a strong hand ${pct}% of the time (${read.n} sampled) betting this ${bucketLabel} on the ${street}. Respect it.", "old": "", "risk": "", "decl": "bucketLabel"}, {"line": "21788", "en": " Sizing tell: ${name}'s shown the goods ${pct}% of the time (${read.n} sampled) with this ${bucketLabel} size on the ${street}, kid. Believe it.", "old": "", "risk": "", "decl": "bucketLabel"}, {"line": "21792", "en": " Sizing tell: ${name} has only shown a strong hand ${pct}% of the time (${read.n} sampled) with this ${bucketLabel} size on the ${street}. Light for value.", "old": "", "risk": "", "decl": "bucketLabel"}, {"line": "21793", "en": " Sizing tell: ${name}'s only got it ${pct}% of the time (${read.n} sampled) betting this ${bucketLabel} on the ${street}, pal. Don't buy it.", "old": "", "risk": "", "decl": "bucketLabel"}, {"line": "21824", "en": "checked option", "old": "", "risk": "", "decl": "_quickPreflopAction"}, {"line": "21886", "en": "raise preflop", "old": "翻前加注率", "risk": "", "decl": "PF"}, {"line": "21886", "en": "limp in", "old": "平跟率", "risk": "", "decl": "PF"}, {"line": "21886", "en": "call preflop", "old": "翻前跟注", "risk": "", "decl": "PF"}, {"line": "21887", "en": "check their option", "old": "", "risk": "", "decl": "PF"}, {"line": "21887", "en": "fold preflop", "old": "翻前弃牌", "risk": "", "decl": "PF const KIND = { sentence: '长句', term: '短标签', deleted: '删除项' };
let curDecl = '', curKind = '', curQ = '', viewMode = 'card';

function hl(t) {
  if (!curQ) return esc(t);
  const i = t.toLowerCase().indexOf(curQ);
  if (i < 0) return esc(t);
  return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + curQ.length)) + '</mark>' + esc(t.slice(i + curQ.length));
}
function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function match(r) {
  if (curDecl && r.decl !== curDecl) return false;
  if (curKind && r.kind !== curKind) return false;
  if (curQ) {
    const q = curQ;
    if (!(r.en.toLowerCase().includes(q) || r.zh.toLowerCase().includes(q) ||
          String(r.line).includes(q) || String(r.zline || r.line).includes(q))) return false;
  }
  return true;
}

function render() {
  const rows = D.rows.filter(match);
  const main = $('#main');
  const plain = !curDecl && !curKind && !curQ;
  let h = '';
  if (plain) h += kpis();
  if (viewMode === 'table') {
    main.innerHTML = h + tableView(rows) + (plain ? extraSections() : '');
    return;
  }
  if (!rows.length && !plain) {
    main.innerHTML = h + '<div class="empty">没有匹配的条目</div>'; return;
  }
  // 分组
  const groups = new Map();
  for (const r of rows) {
    if (!groups.has(r.decl)) groups.set(r.decl, []);
    groups.get(r.decl).push(r);
  }
  for (const [decl, list] of groups) {
    h += '<div class="grp" id="g-' + esc(decl) + '">' + esc(decl || '（文件顶层）') +
         '<small>' + list.length + ' 处</small></div>';
    for (const r of list) h += card(r);
  }
  if (plain) h += extraSections();
  h += '<div class="count">显示 ' + rows.length + ' 条对照。</div>';
  main.innerHTML = h;
}

function tableView(rows) {
  let h = '<table><thead><tr><th style="width:60px">行号</th><th style="width:150px">区块</th>' +
    '<th style="width:70px">类型</th><th style="width:38%">英文原文</th><th>中文译文</th></tr></thead><tbody>';
  for (const r of rows) {
    h += '<tr><td class="mono">' + lnCell(r) + '</td><td>' + esc(r.decl) + '</td><td>' +
      (KIND[r.kind] || r.kind) + '</td><td class="mono">' + hl(r.en) + '</td><td class="mono">' +
      (r.zh ? hl(r.zh) : '（已删除）') + '</td></tr>';
  }
  return h + '</tbody></table><div class="count">显示 ' + rows.length + ' 条对照。</div>';
}

function extraSections() {
  let h = '';
  if (D.meta && D.meta.length) {
    h += '<div class="grp" id="g-__meta">脚本元数据（userscript header）<small>' + D.meta.length + ' 组改动</small></div>';
    h += '<div class="count">脚本安装元信息：名称、命名空间、版本、更新地址等。这组改动的目的是让汉化版与原版互不覆盖，且安装后不会被引导更新回英文原版。</div>';
    const OPNAME = { '~': '整段重写', '+': '新增', '-': '删除' };
    for (const m of D.meta) {
      h += '<div class="row mrow"><div class="rh"><span class="tag d">' + (OPNAME[m.op] || m.op) +
           '</span></div><div class="pb">' +
           '<div class="half en"><span class="k en">原版</span><div class="v">' + blockLines(m.en) + '</div></div>' +
           '<div class="half zh"><span class="k zh">汉化版</span><div class="v">' + blockLines(m.zh) + '</div></div>' +
           '</div></div>';
    }
  }
  if (D.structs.length) {
    h += '<div class="grp" id="g-__struct">结构性改动（仅代码，无文案）<small>' + D.structs.length + ' 行</small></div>';
    for (const s of D.structs) h += structCard(s);
  }
  if (D.missed.length) {
    h += '<div class="grp" id="g-__missed">疑似漏译（这一行改过，但这句两边一模一样）<small>' + D.missed.length + ' 处</small></div>';
    h += '<div class="count">自动审计容易漏掉的：句子夹在 HTML 标签中间，或只汉化了半句。建议优先复核。</div>';
    h += '<table style="margin-top:8px"><thead><tr><th style="width:64px">行号</th><th>仍是英文</th><th style="width:150px">就近声明</th></tr></thead><tbody>';
    for (const t of D.missed) {
      h += '<tr><td class="mono">' + lnCell(t) + '</td><td class="mono">' + hl(t.en) + '</td><td>' + esc(t.decl) + '</td></tr>';
    }
    h += '</tbody></table>';
  }
  if (D.leftover.length) {
    h += '<div class="grp" id="g-__left">尚未汉化（剩余英文）<small>' + D.leftover.length + ' 条</small></div>';
    h += '<div class="count">这部分仍是英文，等后续处理；「风险」列非空的属于程序值，不能翻。</div>';
    h += '<table style="margin-top:8px"><thead><tr><th style="width:64px">行号</th><th>英文</th><th>旧版参考</th><th style="width:110px">就近声明</th><th style="width:56px">风险</th></tr></thead><tbody>';
    for (const t of D.leftover) {
      h += '<tr><td class="mono">' + esc(t.line) + '</td><td class="mono">' + hl(t.en) + '</td><td>' +
        esc(t.old || '—') + '</td><td>' + esc(t.decl) + '</td><td>' + esc(t.risk || '') + '</td></tr>';
    }
    h += '</tbody></table>';
  }
  return h;
}

function kpis() {
  const s = D.stats;
  return '<div class="kpis">' +
    kpi(s.pairs.toLocaleString(), '文案对照条目') +
    kpi(s.changed_lines.toLocaleString(), '被改动的行') +
    kpi(s.decls.toLocaleString(), '涉及区块') +
    kpi(s.leftover.toLocaleString(), '仍待汉化（英文）') +
    kpi(s.kinds.sentence || 0, '其中长句 ▸', 'sentence') +
    kpi(s.kinds.term || 0, '其中短标签 ▸', 'term') +
    kpi(s.missed || 0, '疑似漏译') +
    '</div>' + (s.zh_off ? '<div class="count" style="margin-top:10px">' +
      '汉化版脚本比英文原版多 ' + s.zh_off + ' 行（元数据区新增字段），所以正文行号有偏移：' +
      '<b>汉化版行号 = 原版行号 + ' + s.zh_off + '</b>；卡片上灰色的「→N」就是汉化版行号。' +
      '</div>' : '');
}
function kpi(v, l, k) {
  return '<div class="kpi' + (k ? ' click' : '') + '"' + (k ? ' data-k="' + k + '"' : '') +
    '><b>' + v + '</b><span>' + l + '</span></div>';
}

function lz(x) {
  return (x.zline && x.zline !== x.line)
    ? '<span style="font-style:normal;opacity:.5;font-size:11px;margin-left:4px">→' + x.zline + '</span>'
    : '';
}
function lnCell(x) { return '' + x.line + lz(x); }
function card(r) {
  return '<div class="row"><div class="rh"><span class="ln">L' + r.line + lz(r) + '</span>' +
    '<span>' + esc(r.decl) + '</span>' +
    '<span class="tag' + (r.kind === 'sentence' ? ' s' : r.kind === 'deleted' ? ' d' : '') + '">' +
    (KIND[r.kind] || r.kind) + '</span></div><div class="pb">' +
    '<div class="half en"><span class="k en">EN</span><div class="v">' + hl(r.en) + '</div></div>' +
    '<div class="half zh"><span class="k zh">ZH</span><div class="v">' + (r.zh ? hl(r.zh) : '（已删除）') + '</div></div>' +
    '</div></div>';
}
function blockLines(ls) {
  if (!ls || !ls.length) return '<span style="opacity:.45">（无）</span>';
  return ls.map(x => '<span style="display:inline-block;min-width:26px;opacity:.45;font-size:11px">' +
    x.n + '</span>' + esc(x.t)).join('<br>');
}
function structCard(s) {
  return '<div class="row"><div class="rh"><span class="ln">L' + s.line + lz(s) + '</span><span>' + esc(s.decl) +
    '</span><span class="tag d">代码</span></div><div class="pb">' +
    '<div class="half en"><span class="k en">EN</span><div class="v">' + esc(s.en) + '</div></div>' +
    '<div class="half zh"><span class="k zh">ZH</span><div class="v">' + esc(s.zh) + '</div></div></div></div>';
}

function nav() {
  const cnt = new Map();
  for (const r of D.rows) cnt.set(r.decl, (cnt.get(r.decl) || 0) + 1);
  let h = '<a class="on" data-d=""><b>全部</b><i>' + D.rows.length + '</i></a>';
  for (const d of D.decl_order) {
    if (!cnt.get(d)) continue;
    h += '<a data-d="' + esc(d) + '"><b title="' + esc(d) + '">' + esc(d || '（顶层）') + '</b><i>' + cnt.get(d) + '</i></a>';
  }
  h += '<div class="navsec">其他</div>';
  for (const [id, label, n] of [['g-__meta', '脚本元数据', (D.meta || []).length],
                                ['g-__struct', '结构性改动', D.structs.length],
                                ['g-__missed', '疑似漏译', D.missed.length],
                                ['g-__left', '尚未汉化', D.leftover.length]]) {
    h += '<a data-j="' + id + '"><b>' + label + '</b><i>' + n + '</i></a>';
  }
  $('#nav').innerHTML = h;
  $('#nav').onclick = e => {
    const a = e.target.closest('a'); if (!a) return;
    if (a.dataset.j) {
      if (curQ || curKind || curDecl) {
        curQ = ''; curKind = ''; curDecl = ''; $('#q').value = ''; $('#kind').value = '';
        viewMode = 'card'; $('#view').textContent = '▤ 表格';
        render(); nav();
      }
      const t = document.getElementById(a.dataset.j);
      if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    curDecl = a.dataset.d;
    [...$('#nav').children].forEach(x => x.classList.toggle('on', x === a));
    render();
  };
}

$('#q').oninput = e => { curQ = e.target.value.trim().toLowerCase(); render(); };
$('#kind').onchange = e => { curKind = e.target.value; render(); };
$('#view').onclick = e => {
  viewMode = viewMode === 'card' ? 'table' : 'card';
  e.target.textContent = viewMode === 'card' ? '▤ 表格' : '▦ 卡片';
  render();
};
$('#exp').onclick = () => {
  const rs = D.rows.filter(match);
  const t = ['行号\t区块\t类型\t英文原文\t中文译文'].concat(rs.map(r =>
    [r.line + (r.zline && r.zline !== r.line ? '/' + r.zline : ''), r.decl,
     KIND[r.kind] || r.kind, r.en, r.zh].join('\t'))).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + t], { type: 'text/tab-separated-values' }));
  a.download = '汉化对照.tsv'; a.click();
};
$('#main').addEventListener('click', e => {
  const k = e.target.closest('[data-k]');
  if (!k) return;
  curKind = curKind === k.dataset.k ? '' : k.dataset.k;
  $('#kind').value = curKind;
  render();
});
nav(); render();
</script></body></html>
