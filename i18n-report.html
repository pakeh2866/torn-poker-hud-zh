line": 18038, "zline": 18040, "decl": "STREETS", "en": "River", "zh": "河牌", "kind": "term"}, {"line": 18091, "zline": 18093, "decl": "showPrevCoachModal", "en": "Previous Hands — Coach Advice", "zh": "历史手牌——教练建议", "kind": "sentence"}, {"line": 18116, "zline": 18118, "decl": "showPrevCoachModal", "en": "Previous Hands — Coach Advice", "zh": "历史手牌——教练建议", "kind": "sentence"}, {"line": 18211, "zline": 18213, "decl": "showCoachGlossaryModal", "en": "Coach — Odds &amp; Terms", "zh": "教练 — 赔率与术语", "kind": "sentence"}, {"line": 18212, "zline": 18214, "decl": "showCoachGlossaryModal", "en": "Reading the Numbers", "zh": "读懂这些数字", "kind": "term"}, {"line": 18214, "zline": 18216, "decl": "showCoachGlossaryModal", "en": "Win % (Equity)", "zh": "胜率 %（Equity）", "kind": "term"}, {"line": 18215, "zline": 18217, "decl": "showCoachGlossaryModal", "en": "Your estimated chance of winning this hand right now, based on your cards, the board, and what hands the opponent likely holds.Example: \"18.5% in a 3-way pot\" — play this exact spot 100 times and you win roughly 18 of them. You're behind. Don't build a big pot.", "zh": "你当前这手牌的预计胜率——取决于你的底牌、公共牌，以及对手可能拿着的牌。例：「3 人底池里的 18.5%」——把这个局面重演 100 次，你大约赢 18 次。你正处于落后。不要做大底池。", "kind": "sentence"}, {"line": 18217, "zline": 18219, "decl": "showCoachGlossaryModal", "en": "Need X% to call", "zh": "需要 X% 才能跟注", "kind": "term"}, {"line": 18218, "zline": 18220, "decl": "showCoachGlossaryModal", "en": "The minimum win % for a call to make money long-term. If your equity beats this number, calling is profitable. If it doesn't, folding saves chips over time.Example: \"Need 28% to call\" — your hand wins 36% of the time → call is profitable. Your hand wins 20% → fold.", "zh": "长期来看，跟注要能赚钱所需的最低胜率。你的胜率高于这个数，跟注就是盈利的；低于这个数，弃牌长期能省下筹码。例：「跟注需要 28%」——你的牌有 36% 胜率 → 跟注盈利。只有 20% → 弃牌。", "kind": "sentence"}, {"line": 18220, "zline": 18222, "decl": "showCoachGlossaryModal", "en": "Pot odds", "zh": "底池赔率", "kind": "term"}, {"line": 18221, "zline": 18223, "decl": "showCoachGlossaryModal", "en": "What the bet size costs you relative to the pot. A small bet into a big pot is a cheap call (low % needed). A big bet into a small pot is expensive (high % needed).Example: Pot $100, opponent bets $25 — total pot becomes $125, you call $25 → need to win 25/125 = 20% to break even.", "zh": "下注额相对底池，要你付出多少代价。小注进大池是便宜的跟注（所需胜率低）；大注进小池很贵（所需胜率高）。例：底池 $100，对手下注 $25——总底池变成 $125，你花 $25 跟注 → 需要赢 25/125 = 20% 才能保本。", "kind": "sentence"}, {"line": 18223, "zline": 18225, "decl": "showCoachGlossaryModal", "en": "MDF (Minimum Defense Frequency)", "zh": "MDF（最低防守频率）", "kind": "sentence"}, {"line": 18224, "zline": 18226, "decl": "showCoachGlossaryModal", "en": "The minimum share of your hands you need to continue (call or raise, not fold) against a bet, so your opponent can't print money by bluffing with any two cards. It's advice about your whole range, not a verdict on the one hand you're holding — the coach's fold/call read on your actual cards still comes first.Example: Pot $100, opponent bets $50 — MDF ~67%. If you fold more than a third of your hands in this spot, bluffing becomes automatically profitable for them.", "zh": "面对下注时，你的范围里至少要有多大比例继续（跟注或加注，而不是弃牌），才能让对手没法用任意两张牌诈唬就白赚钱。这是针对你整个范围的建议，不是对你这手牌的判决——教练对你实际底牌的弃/跟判断依然优先。例：底池 $100，对手下注 $50——MDF 约 67%。如果你在这个局面弃掉超过三分之一的牌，他的诈唬就自动盈利了。", "kind": "sentence"}, {"line": 18227, "zline": 18229, "decl": "showCoachGlossaryModal", "en": "Stack-to-Pot Ratio — your effective stack divided by the pot. Tells you how committed you already are.SPR under 3 = you're nearly pot-committed — calling a shove often makes sense even with one pair.SPR 3–8 = mid-depth — don't overcommit without a strong hand.SPR over 8 = deep stack — one pair rarely wins a big pot. Be careful.", "zh": "筹码底池比——你的有效筹码除以底池，用来判断你已经陷得多深。SPR 低于 3 = 接近套池——就算只有一对，跟全下通常也划算。SPR 3–8 = 中等深度——没有强牌别过度投入。SPR 高于 8 = 深筹码——一对很少能赢下大池，谨慎点。", "kind": "sentence"}, {"line": 18229, "zline": 18231, "decl": "showCoachGlossaryModal", "en": "Range edge", "zh": "范围优势", "kind": "term"}, {"line": 18230, "zline": 18232, "decl": "showCoachGlossaryModal", "en": "Which player's starting hands connect better with the current board. The preflop raiser's range hits high, dry boards harder. The caller's range hits low, connected boards harder.Example: Board A-K-2 rainbow → raiser has the range edge (AK, AA, KK are in their range).Board 6-7-8 two-tone → caller has the range edge (they flatted with suited connectors and small pairs).", "zh": "谁的起手牌和当前牌面更契合。翻前加注者的范围更容易命中高张、干燥的牌面；跟注者的范围更容易命中低张、连张的牌面。例：牌面 A-K-2 彩虹 → 加注者有范围优势（AK、AA、KK 都在他的范围里）。牌面 6-7-8 双花 → 跟注者有范围优势（他用同花连牌和小对子平跟进来的）。", "kind": "sentence"}, {"line": 18233, "zline": 18235, "decl": "showCoachGlossaryModal", "en": "Draw Equity", "zh": "听牌胜率", "kind": "term"}, {"line": 18235, "zline": 18237, "decl": "showCoachGlossaryModal", "en": "~X% equity to river", "zh": "~X% 到河牌的胜率", "kind": "term"}, {"line": 18236, "zline": 18238, "decl": "showCoachGlossaryModal", "en": "Your chance of completing your draw by the river (two cards still to come on the flop).Calculated as: outs × 4 on the flop, outs × 2 on the turn.", "zh": "到河牌做成你这手听牌的概率（翻牌时还有两张牌没发）。算法：翻牌时 出路 × 4，转牌时 出路 × 2。", "kind": "sentence"}, {"line": 18238, "zline": 18240, "decl": "showCoachGlossaryModal", "en": "Outs", "zh": "出路", "kind": "term"}, {"line": 18239, "zline": 18241, "decl": "showCoachGlossaryModal", "en": "Cards left in the deck that complete your hand.Flush draw = 9 outs (~36% to hit by river).Open-ended straight draw = 8 outs (~32%).Gutshot straight draw = 4 outs (~16%).", "zh": "牌堆里还能补成你这手牌的牌。同花听牌 = 9 个出路（到河牌约 36% 成牌）。双头顺听牌 = 8 个出路（约 32%）。卡顺听牌 = 4 个出路（约 16%）。", "kind": "sentence"}, {"line": 18241, "zline": 18243, "decl": "showCoachGlossaryModal", "en": "Odds are there ✓", "zh": "赔率有利 ✓", "kind": "term"}, {"line": 18242, "zline": 18244, "decl": "showCoachGlossaryModal", "en": "Your draw equity beats what you need to call — the call is mathematically profitable long-term.Example: draw equity 36%, need 28% to call → call.", "zh": "你的听牌胜率高于跟注所需——这个跟注长期在数学上是盈利的。例：听牌胜率 36%，跟注需要 28% → 跟。", "kind": "sentence"}, {"line": 18244, "zline": 18246, "decl": "showCoachGlossaryModal", "en": "Odds against you ✗", "zh": "赔率不利 ✗", "kind": "term"}, {"line": 18245, "zline": 18247, "decl": "showCoachGlossaryModal", "en": "Your draw equity falls short of the required call % — calling loses money over time unless you have other reasons (fold equity, implied odds).Example: draw equity 16%, need 33% to call → fold the gutshot.", "zh": "你的听牌胜率达不到跟注所需的百分比——除非另有理由（弃牌权益、隐含赔率），否则长期跟注是亏钱的。例：听牌胜率 16%，跟注需要 33% → 弃掉卡顺。", "kind": "sentence"}, {"line": 18248, "zline": 18250, "decl": "showCoachGlossaryModal", "en": "Coach Confidence", "zh": "教练置信度", "kind": "term"}, {"line": 18250, "zline": 18252, "decl": "showCoachGlossaryModal", "en": "Thin read", "zh": "单薄解读", "kind": "term"}, {"line": 18251, "zline": 18253, "decl": "showCoachGlossaryModal", "en": "Fewer than ~10 hands observed on this player. The coach will still advise but the reads are based on limited data — treat them as early signals, not firm conclusions.", "zh": "观察到的这个玩家不足约 10 手。教练仍会给建议，但解读基于有限数据——当成早期信号，而不是确定结论。", "kind": "sentence"}, {"line": 18253, "zline": 18255, "decl": "showCoachGlossaryModal", "en": "Decent read", "zh": "尚可解读", "kind": "term"}, {"line": 18254, "zline": 18256, "decl": "showCoachGlossaryModal", "en": "10–25 hands observed. Stats are becoming meaningful. Player type labels are reasonably reliable.", "zh": "观察了 10–25 手。数据开始有意义，玩家类型标签基本可靠。", "kind": "sentence"}, {"line": 18256, "zline": 18258, "decl": "showCoachGlossaryModal", "en": "Solid read", "zh": "扎实解读", "kind": "term"}, {"line": 18257, "zline": 18259, "decl": "showCoachGlossaryModal", "en": "25+ hands observed. Player type and exploit advice is based on a substantial sample — higher confidence.", "zh": "观察了 25+ 手。玩家类型和针对建议基于足够的样本——置信度更高。", "kind": "sentence"}, {"line": 18264, "zline": 18266, "decl": "showHelpModal", "en": "HUD Glossary", "zh": "HUD 术语表", "kind": "term"}, {"line": 18266, "zline": 18268, "decl": "showHelpModal", "en": "Stats", "zh": "数据指标", "kind": "term"}, {"line": 18268, "zline": 18270, "decl": "showHelpModal", "en": "VPIPVoluntarily Put $ In Pot \\u2014 how often they choose to enter a pot preflop (call or raise). High = loose, low = tight.", "zh": "VPIP自愿往底池里放钱——翻前主动进池（跟注或加注）的频率。越高越松，越低越紧。", "kind": "sentence"}, {"line": 18269, "zline": 18271, "decl": "showHelpModal", "en": "PFRPreflop Raise % \\u2014 how often they raise before the flop. Should be close to VPIP for aggressive players; a big gap means they limp/call a lot.", "zh": "PFR翻前加注率——翻前主动加注的频率。激进玩家的 PFR 应该接近 VPIP；差距大说明他经常溜入或跟注。", "kind": "sentence"}, {"line": 18270, "zline": 18272, "decl": "showHelpModal", "en": "AFqAggression Frequency \\u2014 how often they bet or raise (vs. call/check) post-flop. High = aggressive post-flop, low = passive.", "zh": "AFq攻击频率——翻后主动下注或加注（相对于跟注/过牌）的频率。越高翻后越激进，越低越被动。", "kind": "sentence"}, {"line": 18271, "zline": 18273, "decl": "showHelpModal", "en": "WTSDWent To ShowDown \\u2014 how often they stick around until the cards are shown. High WTSD = hard to bluff off a hand.", "zh": "WTSD打到摊牌率——坚持到最后亮牌的比例。WTSD 越高，越难用诈唬把他打走。", "kind": "sentence"}, {"line": 18272, "zline": 18274, "decl": "showHelpModal", "en": "WSDWon at ShowDown \\u2014 win rate when they do reach showdown. Low WSD with high WTSD = calling with weak hands.", "zh": "WSD摊牌胜率——真正走到摊牌时的赢牌比例。WTSD 高而 WSD 低，说明他拿弱牌也跟到底。", "kind": "sentence"}, {"line": 18273, "zline": 18275, "decl": "showHelpModal", "en": "3-betA re-raise preflop after someone already raised. Signals a very strong hand or a bluff squeeze.", "zh": "3-bet翻前在别人已经加注之后再反加。代表极强的牌，或是诈唬式挤压。", "kind": "sentence"}, {"line": 18274, "zline": 18276, "decl": "showHelpModal", "en": "C-betContinuation Bet \\u2014 betting the flop after raising preflop. Standard move to take down pots without a strong hand.", "zh": "C-bet持续下注——翻前加注后，翻牌继续下注。这是不靠强牌也能拿下底池的标准打法。", "kind": "sentence"}, {"line": 18275, "zline": 18277, "decl": "showHelpModal", "en": "LimpJust calling the big blind preflop instead of raising. Passive entry \\u2014 gives opponents good odds and hands initiative away.", "zh": "Limp翻前只跟大盲而不加注。被动进池——送给对手好赔率，也把主动权交出去。", "kind": "sentence"}, {"line": 18276, "zline": 18278, "decl": "showHelpModal", "en": "Gap (VPIP\\u2013PFR)Difference between how often they play hands vs. raise. A big gap means they call a lot more than they raise \\u2014 exploitable with aggression.", "zh": "Gap (VPIP–PFR)进池率和加注率之间的差。差距大说明他跟注远多于加注——可以用激进来针对。", "kind": "sentence"}, {"line": 18279, "zline": 18281, "decl": "showHelpModal", "en": "Player Types", "zh": "玩家类型", "kind": "term"}, {"line": 18281, "zline": 18283, "decl": "showHelpModal", "en": "SHPSharp / TAG (Tight-Aggressive) \\u2014 plays a selective range but bets hard when in. The most dangerous type.", "zh": "SHP紧凶型 / TAG——只玩精选范围，但一旦进池就打得凶。最危险的一类对手。", "kind": "sentence"}, {"line": 18282, "zline": 18284, "decl": "showHelpModal", "en": "AGGAggressive / LAG (Loose-Aggressive) \\u2014 plays many hands and puts pressure on everyone. Hard to read but can overplay.", "zh": "AGG松凶型 / LAG——玩很多牌，给所有人施压。难以读牌，但容易打过头。", "kind": "sentence"}, {"line": 18283, "zline": 18285, "decl": "showHelpModal", "en": "MANManiac \\u2014 plays almost everything and bets constantly. Very high VPIP and PFR. Chaotic and unpredictable.", "zh": "MAN疯子——几乎什么都玩，还不停地打。VPIP 和 PFR 都极高，混乱且难以预测。", "kind": "sentence"}, {"line": 18284, "zline": 18286, "decl": "showHelpModal", "en": "FSHFish \\u2014 plays too many hands and almost never raises. Easy to exploit: bet for value, don't bluff.", "zh": "FSH鱼——玩的牌太多，而且几乎不加注。很好针对：一路价值下注，别诈唬。", "kind": "sentence"}, {"line": 18285, "zline": 18287, "decl": "showHelpModal", "en": "CLRCalling Station \\u2014 loose but passive. Will call you down to the river. Never try to bluff these players off a hand.", "zh": "CLR跟注站——松但被动，会一路跟到河牌。永远别想用诈唬把他打走。", "kind": "sentence"}, {"line": 18286, "zline": 18288, "decl": "showHelpModal", "en": "NITNit \\u2014 folds almost everything. Only plays very strong hands. Fold when they show aggression.", "zh": "NIT紧弱型——几乎什么都弃，只玩很强的牌。他一表现出激进，直接弃牌。", "kind": "sentence"}, {"line": 18287, "zline": 18289, "decl": "showHelpModal", "en": "RCKRock \\u2014 even tighter than a Nit. Only absolute premiums. Treat their bets as the nuts.", "zh": "RCK岩石——比紧弱型还紧，只玩绝对的好牌。他一下注，就当坚果处理。", "kind": "sentence"}, {"line": 18288, "zline": 18290, "decl": "showHelpModal", "en": "CTNCautious / Tight-Passive \\u2014 plays few hands and mostly checks/calls. Avoids confrontation. Low threat level.", "zh": "CTN谨慎型——玩的牌很少，多数时候过牌或跟注，回避对抗。威胁等级低。", "kind": "sentence"}, {"line": 18289, "zline": 18291, "decl": "showHelpModal", "en": "PSVPassive Gambler / Loose-Passive \\u2014 plays many hands but rarely bets or raises. Drifts and calls.", "zh": "PSV松弱型——玩很多牌，但很少下注或加注，跟着牌漂、只会跟注。", "kind": "sentence"}, {"line": 18290, "zline": 18292, "decl": "showHelpModal", "en": "MIXUnpredictable / Mixed \\u2014 no clear pattern detected yet. Under 25 hands this means \"not enough data to tell\".", "zh": "MIX混合型——暂时看不出明显模式。少于 25 手时，意思是“样本还不够，看不出来”。", "kind": "sentence"}, {"line": 18291, "zline": 18293, "decl": "showHelpModal", "en": "S/F, T/N, ...Hybrid \\u2014 with 25+ hands, a Mixed player's badge names the styles their stats sit between, closest fit first. Letters: M Maniac, A Aggressive, S Sharp, F Fish, C Calling Station, R Rock, N Nit, T Cautious, P Passive Gambler. With poker terms on: M Maniac, L LAG, T TAG, F Fish, CS Calling Station, R Rock, N Nit, TP Tight-Passive, LP Loose-Passive. A three-way blend like S/F/C is possible. Hover the badge for the full names.", "zh": "S/F, T/N, ...混合型——满 25 手之后，混合型玩家的徽章会标出他的数据介于哪几种风格之间，最接近的排前面。字母：M 疯子, A 激进型, S 紧凶型, F 鱼, C 跟注站, R 岩石, N 紧弱型, T 谨慎型, P 被动赌徒。 开启扑克术语后：M 疯子, L 松凶型, T 紧凶型, F 鱼, CS 跟注站, R 岩石, N 紧弱型, TP 紧弱型, LP 松弱型. 也可能出现 S/F/C 这种三风格混合。悬停徽章可看完整名称。", "kind": "sentence"}, {"line": 18294, "zline": 18296, "decl": "showHelpModal", "en": "Positions", "zh": "位置", "kind": "term"}, {"line": 18296, "zline": 18298, "decl": "showHelpModal", "en": "EPEarly Position \\u2014 first seats to act preflop (UTG, UTG+1). You act before almost everyone \\u2014 play tighter here.", "zh": "EP前位——翻前最先行动的几个位置（UTG、UTG+1）。你几乎在所有人之前行动，这里要打得更紧。", "kind": "sentence"}, {"line": 18297, "zline": 18299, "decl": "showHelpModal", "en": "MPMiddle Position \\u2014 seats between EP and the button. More info than EP, less than late position.", "zh": "MP中位——介于前位和按钮之间的位置。信息比前位多，比后位少。", "kind": "sentence"}, {"line": 18298, "zline": 18300, "decl": "showHelpModal", "en": "LP / BTNLate Position / Button \\u2014 last to act post-flop. Strongest position. Play more hands and steal more blinds here.", "zh": "LP / BTN后位 / 按钮——翻后最后行动，最强的位置。这里可以多玩牌、多偷盲。", "kind": "sentence"}, {"line": 18299, "zline": 18301, "decl": "showHelpModal", "en": "COCutoff \\u2014 one seat right of the Button. Second-best position. Good spot to steal blinds.", "zh": "COCO（按钮前一位）——按钮右手边的位置，第二好的位置，偷盲的好地方。", "kind": "sentence"}, {"line": 18300, "zline": 18302, "decl": "showHelpModal", "en": "SBSmall Blind \\u2014 posts half the forced bet. Acts first post-flop every street. Worst position post-flop.", "zh": "SB小盲——下半个强制注。翻后每条街都最先行动，是翻后最差的位置。", "kind": "sentence"}, {"line": 18301, "zline": 18303, "decl": "showHelpModal", "en": "BBBig Blind \\u2014 posts the full forced bet. Gets last action preflop but is out of position post-flop.", "zh": "BB大盲——下全额强制注。翻前最后行动，但翻后处于不利位置。", "kind": "sentence"}, {"line": 18302, "zline": 18304, "decl": "showHelpModal", "en": "BB (unit)Big Blind as a stack unit. \"20 BB\" means their stack is 20\\u00d7 the big blind.", "zh": "BB (unit)大盲作为筹码单位。“20 BB”表示他的筹码是大盲的 20 倍。", "kind": "sentence"}, {"line": 18305, "zline": 18307, "decl": "showHelpModal", "en": "Icons &amp; Indicators", "zh": "图标与标识", "kind": "term"}, {"line": 18307, "zline": 18309, "decl": "showHelpModal", "en": "V / P / A / 3BInline stats beside the badge — V: VPIP (hands played %), P: PFR (preflop raise %), A: AFq (postflop aggression %), 3B: preflop 3-bet % (appears after 10+ chances to 3-bet). A highlighted value means notably high or low for that stat. Hover the column for this legend in-game.", "zh": "V / P / A / 3B徽章旁的一行数据——V：VPIP（入池率 %），P：PFR（翻前加注率 %），A：AFq（翻后攻击率 %），3B：翻前 3-bet 率 %（满 10 次 3-bet 机会后才显示）。数值高亮表示该指标明显偏高或偏低。游戏中把鼠标移到此列可查看这份说明。", "kind": "sentence"}, {"line": 18308, "zline": 18310, "decl": "showHelpModal", "en": "🎭 on badgeFrequent bluffer — caught bluffing at showdown in 40%+ of verified hands. Their bets are often air.", "zh": "🎭 徽章上惯犯诈唬——已核实的手牌里有 40% 以上在摊牌被抓诈唬。他的下注常常是空气。", "kind": "sentence"}, {"line": 18309, "zline": 18311, "decl": "showHelpModal", "en": "🎯 on badgeDraw chaser — chases flush or straight draws in 35%+ of verified hands. Often calls too wide when drawing.", "zh": "🎯 徽章上追牌型——已核实的手牌里有 35% 以上在追同花或顺子。追牌时经常跟得太宽。", "kind": "sentence"}, {"line": 18310, "zline": 18312, "decl": "showHelpModal", "en": "💎 on badgeValue player — shows up with strong hands at showdown 60%+ of the time. Their aggression is usually real.", "zh": "💎 徽章上价值型——摊牌时有 60% 以上拿着强牌。他的激进通常是真的。", "kind": "sentence"}, {"line": 18311, "zline": 18313, "decl": "showHelpModal", "en": "🃏 on badgeOverplays marginals — frequently bets/raises with weak holdings and loses at showdown. Calls them down.", "zh": "🃏 徽章上高估边缘牌——经常拿弱牌下注或加注，一到摊牌就输。跟到底就行。", "kind": "sentence"}, {"line": 18312, "zline": 18314, "decl": "showHelpModal", "en": "📞 on badgeLoose caller — calls down with weak hands in 25%+ of verified hands. Don't bluff these players.", "zh": "📞 徽章上松跟型——已核实的手牌里有 25% 以上拿弱牌跟到底。别诈唬这类玩家。", "kind": "sentence"}, {"line": 18313, "zline": 18315, "decl": "showHelpModal", "en": "▼ on badgeStack drop — down 50%+ from their peak stack this session. May be tilting or short on chips.", "zh": "▼ 徽章上筹码下滑——本局从最高点跌去 50% 以上。可能上头了，也可能筹码不多了。", "kind": "sentence"}, {"line": 18314, "zline": 18316, "decl": "showHelpModal", "en": "▽ on badgeModerate stack drop — down 35–50% from peak. Worth keeping an eye on.", "zh": "▽ 徽章上中度下滑——从最高点跌去 35–50%，值得留意。", "kind": "sentence"}, {"line": 18315, "zline": 18317, "decl": "showHelpModal", "en": "! on badgeLive alert — a notable pattern was detected this hand (e.g. limp-reraise, check-raise, 3-bet from a tight player). Hover to see details.", "zh": "! 徽章上实时警报——本手牌检测到值得注意的模式（例如溜入反加、过牌加注、紧手玩家 3-bet）。悬停查看详情。", "kind": "sentence"}, {"line": 18316, "zline": 18318, "decl": "showHelpModal", "en": "✎ N below seatAuto-tag count — the HUD has recorded N notable plays from this player (showdowns, bluffs, draws). Click to review them.", "zh": "✎ 座位下方 N自动标记数——HUD 已记录该玩家 N 次值得注意的打法（摊牌、诈唬、追牌）。点击查看。", "kind": "sentence"}, {"line": 18317, "zline": 18319, "decl": "showHelpModal", "en": "$amount below seatTorn net worth pulled from their profile. Colour shows wealth tier. Hover for their stack-to-wealth ratio — tells you how much this game matters to them.", "zh": "座位下方 $ 金额从对方资料页读到的 Torn 净资产。颜色代表财富层级。悬停可看他的筹码占净资产比例——能看出这局对他有多重要。", "kind": "sentence"}, {"line": 18318, "zline": 18320, "decl": "showHelpModal", "en": "Flag below seatFaction flag — this player shares a Torn faction with someone else at the table. Doesn't mean they're colluding, but worth knowing.", "zh": "座位下方的旗帜帮派标记——该玩家和桌上另一个人属于同一个 Torn 帮派。不一定是在串通，但值得知道。", "kind": "sentence"}, {"line": 18319, "zline": 18321, "decl": "showHelpModal", "en": "⚠ N below seatSuspicious pattern — N concerning interactions detected between this player and another (soft play or whipsaw). Click for the full report.", "zh": "⚠ 座位下方 N可疑模式——检测到该玩家与另一人之间有 N 次可疑互动（放水或拉扯）。点击查看完整报告。", "kind": "sentence"}, {"line": 18322, "zline": 18324, "decl": "showHelpModal", "en": "Other Concepts", "zh": "其他概念", "kind": "term"}, {"line": 18324, "zline": 18326, "decl": "showHelpModal", "en": "Short-stackedLess than ~20 BB. Strategy shifts to push/fold \\u2014 normal VPIP/PFR stats become less reliable.", "zh": "短筹码不足约 20 BB。策略转为推或弃——常规的 VPIP/PFR 数据会变得不太可靠。", "kind": "sentence"}, {"line": 18325, "zline": 18327, "decl": "showHelpModal", "en": "RebuyAdding chips back after busting. Multiple rebuys can signal a tilting or gambling-style player.", "zh": "重买输光后重新买入筹码。多次重买可能说明这个玩家在上头，或者本身就是赌徒型。", "kind": "sentence"}, {"line": 18326, "zline": 18328, "decl": "showHelpModal", "en": "TiltPlaying worse than normal due to frustration or losses. Watch for stack drops, rebuy sprees, and sudden aggression spikes.", "zh": "上头（tilt）因为沮丧或亏损而打得比平时差。留意筹码下滑、连续重买和突然的激进爆发。", "kind": "sentence"}, {"line": 18327, "zline": 18329, "decl": "showHelpModal", "en": "Wet boardA flop full of draw potential \\u2014 flush draws, straight draws, connected cards. Bluffs are riskier here.", "zh": "湿润牌面充满追牌可能的翻牌——同花听牌、顺子听牌、连牌很多。这种牌面诈唬风险更大。", "kind": "sentence"}, {"line": 18328, "zline": 18330, "decl": "showHelpModal", "en": "Dry boardDisconnected, uncoordinated flop with few draws. C-bets and bluffs have higher success rates here.", "zh": "干燥牌面牌与牌之间不搭、追牌很少的翻牌。这种牌面 C-bet 和诈唬的成功率更高。", "kind": "sentence"}, {"line": 18329, "zline": 18331, "decl": "showHelpModal", "en": "Value betBetting with a strong hand hoping to get called by worse hands. The opposite of a bluff.", "zh": "价值下注拿强牌下注，希望被更差的牌跟注。诈唬的反面。", "kind": "sentence"}, {"line": 18330, "zline": 18332, "decl": "showHelpModal", "en": "Probe betBetting into the preflop aggressor on a later street to test if they still have a hand.", "zh": "探测下注在后面的街上主动向翻前加注者下注，试探他是否还有牌。", "kind": "sentence"}, {"line": 18419, "zline": 18421, "decl": "showSettingsModal", "en": "⚙ HUD Settings", "zh": "⚙ HUD 设置", "kind": "term"}, {"line": 18424, "zline": 18426, "decl": "showSettingsModal", "en": "Badge Display", "zh": "徽章显示", "kind": "term"}, {"line": 18426, "zline": 18428, "decl": "showSettingsModal", "en": "Badge shows", "zh": "显示内容", "kind": "term"}, {"line": 18428, "zline": 18430, "decl": "showSettingsModal", "en": "Session (last N hands)", "zh": "本次会话（最近 N 手）", "kind": "term"}, {"line": 18429, "zline": 18431, "decl": "showSettingsModal", "en": "Lifetime", "zh": "累计", "kind": "term"}, {"line": 18433, "zline": 18435, "decl": "showSettingsModal", "en": "Session window", "zh": "会话窗口", "kind": "term"}, {"line": 18435, "zline": 18437, "decl": "showSettingsModal", "en": "15 hands", "zh": "15 手", "kind": "term"}, {"line": 18436, "zline": 18438, "decl": "showSettingsModal", "en": "25 hands", "zh": "25 手", "kind": "term"}, {"line": 18437, "zline": 18439, "decl": "showSettingsModal", "en": "30 hands", "zh": "30 手", "kind": "term"}, {"line": 18438, "zline": 18440, "decl": "showSettingsModal", "en": "50 hands", "zh": "50 手", "kind": "term"}, {"line": 18442, "zline": 18444, "decl": "showSettingsModal", "en": "Alert (!) on badge", "zh": "徽章上的警示 (!)", "kind": "term"}, {"line": 18444, "zline": 18446, "decl": "showSettingsModal", "en": "On", "zh": "开", "kind": "term"}, {"line": 18445, "zline": 18447, "decl": "showSettingsModal", "en": "Off", "zh": "关", "kind": "term"}, {"line": 18449, "zline": 18451, "decl": "showSettingsModal", "en": "Inline stats on badge", "zh": "徽章内联数据", "kind": "term"}, {"line": 18451, "zline": 18453, "decl": "showSettingsModal", "en": "On — VPIP/PFR/AFq/3-bet (desktop)", "zh": "开 — VPIP/PFR/AFq/3-bet（桌面端）", "kind": "sentence"}, {"line": 18452, "zline": 18454, "decl": "showSettingsModal", "en": "Off", "zh": "关", "kind": "term"}, {"line": 18456, "zline": 18458, "decl": "showSettingsModal", "en": "Close panel on outside click", "zh": "点击外部关闭面板", "kind": "sentence"}, {"line": 18458, "zline": 18460, "decl": "showSettingsModal", "en": "Off — close with ✕ only (default)", "zh": "关 — 只能用 ✕ 关闭（默认）", "kind": "sentence"}, {"line": 18459, "zline": 18461, "decl": "showSettingsModal", "en": "On — clicking outside closes it", "zh": "开 — 点击面板外部即关闭", "kind": "sentence"}, {"line": 18463, "zline": 18465, "decl": "showSettingsModal", "en": "Tilt Detection", "zh": "上头检测", "kind": "term"}, {"line": 18465, "zline": 18467, "decl": "showSettingsModal", "en": "Sensitivity", "zh": "灵敏度", "kind": "term"}, {"line": 18467, "zline": 18469, "decl": "showSettingsModal", "en": "High (15% VPIP shift)", "zh": "高（VPIP 变化 15%）", "kind": "term"}, {"line": 18468, "zline": 18470, "decl": "showSettingsModal", "en": "Medium (20%)", "zh": "中（20%）", "kind": "term"}, {"line": 18469, "zline": 18471, "decl": "showSettingsModal", "en": "Standard (25%) — default", "zh": "标准（25%）— 默认", "kind": "sentence"}, {"line": 18470, "zline": 18472, "decl": "showSettingsModal", "en": "Low (30%)", "zh": "低（30%）", "kind": "term"}, {"line": 18474, "zline": 18476, "decl": "showSettingsModal", "en": "Detection window", "zh": "检测窗口", "kind": "term"}, {"line": 18476, "zline": 18478, "decl": "showSettingsModal", "en": "5 hands (reactive)", "zh": "5 手（更灵敏）", "kind": "term"}, {"line": 18477, "zline": 18479, "decl": "showSettingsModal", "en": "8 hands — default", "zh": "8 手 — 默认", "kind": "term"}, {"line": 18478, "zline": 18480, "decl": "showSettingsModal", "en": "12 hands", "zh": "12 手", "kind": "term"}, {"line": 18479, "zline": 18481, "decl": "showSettingsModal", "en": "15 hands (stable)", "zh": "15 手（更稳定）", "kind": "term"}, {"line": 18483, "zline": 18485, "decl": "showSettingsModal", "en": "Tilt banner", "zh": "上头横幅", "kind": "term"}, {"line": 18485, "zline": 18487, "decl": "showSettingsModal", "en": "On — default", "zh": "开 — 默认", "kind": "term"}, {"line": 18486, "zline": 18488, "decl": "showSettingsModal", "en": "Off", "zh": "关", "kind": "term"}, {"line": 18489, "zline": 18491, "decl": "showSettingsModal", "en": "Floating banner when your play pattern shows tilt. Includes your session profit/loss so you know what's at stake.", "zh": "当你的打法出现上头迹象时弹出的浮动横幅。会带上你本次会话的盈亏，让你清楚正在拿什么去冒险。", "kind": "sentence"}, {"line": 18491, "zline": 18493, "decl": "showSettingsModal", "en": "Classification", "zh": "玩家分类", "kind": "term"}, {"line": 18493, "zline": 18495, "decl": "showSettingsModal", "en": "Min hands to classify", "zh": "开始分类所需最少手数", "kind": "term"}, {"line": 18495, "zline": 18497, "decl": "showSettingsModal", "en": "3 hands (fast)", "zh": "3 手（更快见结果）", "kind": "term"}, {"line": 18496, "zline": 18498, "decl": "showSettingsModal", "en": "5 hands — default", "zh": "5 手 — 默认", "kind": "term"}, {"line": 18497, "zline": 18499, "decl": "showSettingsModal", "en": "8 hands", "zh": "8 手", "kind": "term"}, {"line": 18498, "zline": 18500, "decl": "showSettingsModal", "en": "10 hands (strict)", "zh": "10 手（更严格）", "kind": "term"}, {"line": 18502, "zline": 18504, "decl": "showSettingsModal", "en": "Heads-up (1v1) stats", "zh": "单挑（1v1）数据", "kind": "term"}, {"line": 18504, "zline": 18506, "decl": "showSettingsModal", "en": "Paused — default", "zh": "暂停 — 默认", "kind": "term"}, {"line": 18505, "zline": 18507, "decl": "showSettingsModal", "en": "Keep tracking", "zh": "继续统计", "kind": "term"}, {"line": 18508, "zline": 18510, "decl": "showSettingsModal", "en": "Normally paused 1-on-1 since a heads-up villain's stats would blend into their multi-way numbers and skew both. Turn this on if you mostly play heads-up tables — the badge, coach reads, and VPIP/PFR will keep working instead of showing a neutral \"HU\" tag.", "zh": "单挑（1v1）时默认暂停，因为单挑对手的数据会混进他多人桌的数字里，把两边都带偏。如果你主要打单挑桌，就打开这一项——徽章、教练解读和 VPIP/PFR 会继续工作，而不是显示一个中性的 \"HU\" 标签。", "kind": "sentence"}, {"line": 18510, "zline": 18512, "decl": "showSettingsModal", "en": "Panel", "zh": "面板", "kind": "term"}, {"line": 18512, "zline": 18514, "decl": "showSettingsModal", "en": "Default tab", "zh": "默认标签页", "kind": "term"}, {"line": 18523, "zline": 18525, "decl": "showSettingsModal", "en": "Mobile", "zh": "手机端", "kind": "term"}, {"line": 18525, "zline": 18527, "decl": "showSettingsModal", "en": "Badge tap (phone)", "zh": "徽章点击（手机）", "kind": "term"}, {"line": 18527, "zline": 18529, "decl": "showSettingsModal", "en": "Single tap — open immediately", "zh": "单击 — 立即打开", "kind": "sentence"}, {"line": 18528, "zline": 18530, "decl": "showSettingsModal", "en": "Double tap — reduces accidental opens", "zh": "双击 — 减少误触", "kind": "sentence"}, {"line": 18531, "zline": 18533, "decl": "showSettingsModal", "en": "Double tap only applies on mobile. PC always uses single click.", "zh": "双击只在手机端生效；电脑端始终是单击。", "kind": "sentence"}, {"line": 18533, "zline": 18535, "decl": "showSettingsModal", "en": "Coach panel (phone)", "zh": "教练面板（手机）", "kind": "term"}, {"line": 18535, "zline": 18537, "decl": "showSettingsModal", "en": "Auto-close on outside tap — default", "zh": "点击外部自动关闭 — 默认", "kind": "sentence"}, {"line": 18536, "zline": 18538, "decl": "showSettingsModal", "en": "Stay open — minimize manually with &minus;", "zh": "保持展开 — 手动点 &minus; 收起", "kind": "sentence"}, {"line": 18539, "zline": 18541, "decl": "showSettingsModal", "en": "Some people want Mr. Coach parked open the whole session instead of collapsing to a bubble after every tap elsewhere. Turn this off to keep the panel open until you tap the &minus; button yourself.", "zh": "有人希望教练面板整局都摊开着，而不是每次点别处就缩成一个小气泡。关掉这一项，面板就会一直保持展开，直到你自己点 &minus; 收起。", "kind": "sentence"}, {"line": 18541, "zline": 18543, "decl": "showSettingsModal", "en": "Panel positions", "zh": "面板位置", "kind": "term"}, {"line": 18542, "zline": 18544, "decl": "showSettingsModal", "en": "Reset to default", "zh": "恢复默认位置", "kind": "term"}, {"line": 18544, "zline": 18546, "decl": "showSettingsModal", "en": "Use this if the coach panel or launcher button ends up off-screen.", "zh": "如果教练面板或启动按钮跑到屏幕外了，就用它恢复。", "kind": "sentence"}, {"line": 18546, "zline": 18548, "decl": "showSettingsModal", "en": "Turn Alert", "zh": "轮到你行动的提醒", "kind": "term"}, {"line": 18564, "zline": 18566, "decl": "showSettingsModal", "en": "Mr. Coach", "zh": "Mr. 教练", "kind": "term"}, {"line": 18566, "zline": 18568, "decl": "showSettingsModal", "en": "Coach mode", "zh": "教练模式", "kind": "term"}, {"line": 18592, "zline": 18594, "decl": "showSettingsModal", "en": "Coach history", "zh": "教练历史", "kind": "term"}, {"line": 18606, "zline": 18608, "decl": "showSettingsModal", "en": "Coach voice", "zh": "教练语气", "kind": "term"}, {"line": 18639, "zline": 18641, "decl": "showSettingsModal", "en": "Range Reader", "zh": "范围解读", "kind": "term"}, {"line": 18641, "zline": 18643, "decl": "showSettingsModal", "en": "Range Reader bubble", "zh": "范围解读气泡", "kind": "term"}, {"line": 18643, "zline": 18645, "decl": "showSettingsModal", "en": "On — default", "zh": "开 — 默认", "kind": "term"}, {"line": 18644, "zline": 18646, "decl": "showSettingsModal", "en": "Off — hide the bubble entirely", "zh": "关 — 完全隐藏气泡", "kind": "sentence"}, {"line": 18647, "zline": 18649, "decl": "showSettingsModal", "en": "Floating bubble showing the chance an active villain has a hand that beats you, based on their observed showdown range filtered by their preflop action and sizing. Click the bubble to open the full Range Reader modal (current hand · history · hands beating you). Turn off entirely if you don't want it on screen.", "zh": "浮动气泡，显示某个还在局中的对手拿到能赢你的牌的概率——基于他已被观察到的摊牌范围，并按他的翻前动作和尺度过滤。点气泡可打开完整的范围解读弹窗（当前手牌 · 历史 · 能赢你的牌）。完全不想让它出现在屏幕上，就关掉这一项。", "kind": "sentence"}, {"line": 18649, "zline": 18651, "decl": "showSettingsModal", "en": "Min showdowns to use a villain", "zh": "判定对手所需最少摊牌次数", "kind": "sentence"}, {"line": 18651, "zline": 18653, "decl": "showSettingsModal", "en": "3 shown hands", "zh": "3 手摊牌", "kind": "term"}, {"line": 18652, "zline": 18654, "decl": "showSettingsModal", "en": "4 shown hands — default", "zh": "4 手摊牌 — 默认", "kind": "sentence"}, {"line": 18653, "zline": 18655, "decl": "showSettingsModal", "en": "6 shown hands", "zh": "6 手摊牌", "kind": "term"}, {"line": 18654, "zline": 18656, "decl": "showSettingsModal", "en": "10 shown hands (strict)", "zh": "10 手摊牌（严格）", "kind": "term"}, {"line": 18657, "zline": 18659, "decl": "showSettingsModal", "en": "A villain needs at least this many showdown hands consistent with their current preflop line before their probability counts toward the aggregate. Lower = more reads but noisier; higher = fewer but more reliable.", "zh": "对手至少要有这么多手符合当前翻前线的摊牌记录，他的概率才会计入总体估算。调低 = 解读更多但更嘈杂；调高 = 更少但更可靠。", "kind": "sentence"}, {"line": 18693, "zline": 18695, "decl": "showSettingsModal", "en": "placeholder=\"Paste your Torn API key…\"", "zh": "placeholder=\"粘贴你的 Torn API 密钥…\"", "kind": "sentence"}, {"line": 18709, "zline": 18711, "decl": "showSettingsModal", "en": "Coach panel", "zh": "教练面板", "kind": "term"}, {"line": 18977, "zline": 18979, "decl": "showSettingsModal", "en": "Done!", "zh": "完成！", "kind": "term"}, {"line": 18978, "zline": 18980, "decl": "showSettingsModal", "en": "Reset to default", "zh": "重置为默认", "kind": "term"}, {"line": 19019, "zline": 19021, "decl": "showSettingsModal", "en": "Main storage was empty this session, so ${_storageHealth.restoredFromSeed} players were restored from the TornPDA backup. Hand history and per-stake splits were not in the backup and will rebuild as you play.", "zh": "本次会话主存储是空的，所以从 TornPDA 备份恢复了 ${_storageHealth.restoredFromSeed} 名玩家。牌局历史和按级别拆分的数据不在备份里，会随着你打牌重新建立。", "kind": "sentence"}, {"line": 19231, "zline": 19233, "decl": "checkSelfTilt", "en": "You've dropped ${fmtChips(lostFromPeak)} since your peak — but you're still ${fmtChips(profit)} up on the session. That's real money worth protecting.", "zh": "自峰值已跌 ${fmtChips(lostFromPeak)}——但本会话仍盈利 ${fmtChips(profit)}。这是值得保护的真实资金。", "kind": "sentence"}, {"line": 19233, "zline": 19235, "decl": "checkSelfTilt", "en": "You're also down ${fmtChips(Math.abs(profit))} on the session overall.", "zh": "本会话总体还亏了 ${fmtChips(Math.abs(profit))}。", "kind": "sentence"}, {"line": 19238, "zline": 19240, "decl": "checkSelfTilt", "en": "Your last ${win} hands you've been playing ${pctUp}% more hands than usual — that's a tilt pattern.${context} Take a breath before the next one.", "zh": "最近 ${win} 手牌你比平时多玩了 ${pctUp}%——这是倾斜模式。${context}下一手之前先深呼吸。", "kind": "sentence"}, {"line": 19328, "zline": 19330, "decl": "attachBadgesToSeats", "en": "View Torn profile", "zh": "查看 Torn 个人资料", "kind": "term"}, {"line": 19690, "zline": 19692, "decl": "updatePositionIndicator", "en": "You act first post-flop (${ord} of ${total})", "zh": "你翻牌后最先行动（${ord}/${total}）", "kind": "sentence"}, {"line": 19691, "zline": 19693, "decl": "updatePositionIndicator", "en": "You ac Don't buy it, kid.", "old": "", "risk": "", "decl": "text"}, {"line": "21789", "en": " Sizing tell: ${name} has shown a strong hand ${pct}% of the time (${read.n} sampled) betting this ${bucketLabel} on the ${street}. Respect it.", "old": "", "risk": "", "decl": "bucketLabel"}, {"line": "21790", "en": " Sizing tell: ${name}'s shown the goods ${pct}% of the time (${read.n} sampled) with this ${bucketLabel} size on the ${street}, kid. Believe it.", "old": "", "risk": "", "decl": "bucketLabel"}, {"line": "21794", "en": " Sizing tell: ${name} has only shown a strong hand ${pct}% of the time (${read.n} sampled) with this ${bucketLabel} size on the ${street}. Light for value.", "old": "", "risk": "", "decl": "bucketLabel"}, {"line": "21795", "en": " Sizing tell: ${name}'s only got it ${pct}% of the time (${read.n} sampled) betting this ${bucketLabel} on the ${street}, pal. Don't buy it.", "old": "", "risk": "", "decl": "bucketLabel"}, {"line": "21826", "en": "checked option", "old": "", "risk": "", "decl": "_quickPreflopAction"}, {"line": "21888", "en": "raise preflop", "old": "翻前加注率", "risk": "", "decl": "PF"}, {"line": "21888", "en": "limp in", "old": "平跟率", "risk": "", "decl": "PF"}, {"line": "21888", "en": "call preflop", "old": "翻前跟注", "risk": "", "decl": "PF"}, {"line": "21889", "en": "check their option", "old": "", "risk": "", "decl": "PF"}, {"line": "21889", "en": "fold preflop", "old": "翻前弃牌", "risk": "", "decl": "PF"}, {"line": "21903", "en": "medium sized", "old": "", "risk": "", "decl": "QR_BUCKET_LABEL"}, {"line": "21903", "en": "overbet sized", "old": "", "risk": "", "decl": "QR_BUCKET_LABEL"}, {"line": "22001", "en": "at this size", "old": "", "risk": "", "decl": "scope"}, {"line": "22002", "en": "at any size", "old": "", "risk": "", "decl": "scope"}, {"line": "22003", "en": "however they got into the pot", "old": "", "risk": "", "decl": "scope"}, {"line": "22004", "en": "whatever they did before", "old": "", "risk": "程序值", "decl": "scope"}, {"line": "22008", "en": "They ${lh.description} ${lh.total} times in the ${lh.handsTracked} hands you have on them, counting ${scope}.", "old": "", "risk": "", "decl": "scope"}, {"line": "22009", "en": "Duke's counted this one. They ${lh.description} ${lh.total} times across ${lh.handsTracked} hands, ${scope}.", "old": "", "risk": "", "decl": "scope"}, {"line": "22016", "en": "You got to see the cards ${lh.shown} of those: ${describeTierCounts(lh.tiers)}.", "old": "", "risk": "", "decl": "valuePct"}, {"line": "22020", "en": "That makes this a stab, not a value bet. They are representing more than they are holding, so do not fold anything decent to it.", "old": "", "risk": "", "decl": "valuePct"}, {"line": "22021", "en": "That's a stab, kid, not a value bet. They're representing way more than they've got. Don't you dare fold a decent hand to it.", "old": "", "risk": "", "decl": "valuePct"}, {"line": "22028", "en": "When they run this line they usually have the top of their range, a set or better ${lh.tiers.monster} of the ${lh.shown} times you saw it. Bluff catchers are no good here, you need the goods.", "old": "", "risk": "", "decl": "valuePct"}, {"line": "22029", "en": "They run this line with the nuts end of it, kid. Set or better ${lh.tiers.monster} of ${lh.shown}. Bluff catchers get you buried. Need the real thing.", "old": "", "risk": "", "decl": "valuePct"}, {"line": "22033", "en": "They have it here, but only just: two pair every one of the ${lh.tiers.twopair} times you saw the cards, never a set or better. Anything that beats two pair is a call, not a fold.", "old": "", "risk": "", "decl": "valuePct"}, {"line": "22034", "en": "They've got it, but only two pair, ${lh.tiers.twopair} for ${lh.tiers.twopair}, never better. You beat two pair? That's a call, kid.", "old": "", "risk": "", "decl": "valuePct"}, {"line": "22038", "en": "When they run this line they usually have it, ${valueN} of ${lh.shown} shown as two pair or better. Give this one real credit and save your bluff const KIND = { sentence: '长句', term: '短标签', deleted: '删除项', code: '代码', meta: '元数据' };
let curDecl = '', curKind = '', curQ = '', curScope = '', viewMode = 'card';

function hl(t) {
  if (!curQ) return esc(t);
  const i = t.toLowerCase().indexOf(curQ);
  if (i < 0) return esc(t);
  return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + curQ.length)) + '</mark>' + esc(t.slice(i + curQ.length));
}
function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function match(r) {
  if (curDecl && r.decl !== curDecl) return false;
  if (curKind && r.kind !== curKind) return false;
  if (curQ) {
    const q = curQ;
    if (!(r.en.toLowerCase().includes(q) || r.zh.toLowerCase().includes(q) ||
          String(r.line).includes(q) || String(r.zline || r.line).includes(q))) return false;
  }
  return true;
}

function scopeOn(k) {
  if (k.indexOf('kind:') === 0) return curKind === k.slice(5);
  return curScope === k;
}
function render() {
  const rows = D.rows.filter(match);
  const filtered = !!(curQ || curKind || curDecl);
  let h = kpis();
  const sc = curScope;
  if (sc === 'left') h += leftoverSection();
  else if (sc === 'missed') h += missedSection();
  else if (sc === 'fixed') h += fixedSection();
  else if (sc === 'lines') h += linesTable();
  else if (sc === 'meta') h += metaSection() + structSection();
  else if (sc === 'struct') h += structSection();
  else if (sc === 'changed') h += (viewMode === 'table' ? tableView(rows) : groupsHtml(rows));
  else if (viewMode === 'table') h += tableView(rows);
  else {
    h += groupsHtml(rows);
    if (!filtered) h += extraSections();
  }
  $('#main').innerHTML = h;
}

function groupsHtml(rows) {
  if (!rows.length) return '<div class="empty">没有匹配的条目</div>';
  const groups = new Map();
  for (const r of rows) {
    if (!groups.has(r.decl)) groups.set(r.decl, []);
    groups.get(r.decl).push(r);
  }
  let h = '';
  for (const [decl, list] of groups) {
    h += '<div class="grp" id="g-' + esc(decl) + '">' + esc(decl || '（文件顶层）') +
         '<small>' + list.length + ' 处</small></div>';
    for (const r of list) h += card(r);
  }
  return h + '<div class="count">显示 ' + rows.length + ' 条对照。</div>';
}

function tableView(rows) {
  if (!rows.length) return '<div class="empty">没有匹配的条目</div>';
  let h = '<table><thead><tr><th style="width:60px">行号</th><th style="width:150px">区块</th>' +
    '<th style="width:70px">类型</th><th style="width:38%">英文原文</th><th>中文译文</th></tr></thead><tbody>';
  for (const r of rows) {
    h += '<tr><td class="mono">' + lnCell(r) + '</td><td>' + esc(r.decl) + '</td><td>' +
      (KIND[r.kind] || r.kind) + '</td><td class="mono">' + hl(r.en) + '</td><td class="mono">' +
      (r.zh ? hl(r.zh) : '（已删除）') + '</td></tr>';
  }
  return h + '</tbody></table><div class="count">显示 ' + rows.length + ' 条对照。</div>';
}

function linesTable() {
  const m = new Map();
  const put = (line, zline, decl, k) => {
    if (!line) return;
    let it = m.get(line);
    if (!it) m.set(line, it = { line: line, zline: zline, decl: decl, n: 0, ks: [] });
    it.n++;
    if (it.ks.indexOf(k) < 0) it.ks.push(k);
  };
  for (const r of D.rows) put(r.line, r.zline, r.decl, r.kind);
  for (const s of D.structs) put(s.line, s.zline, s.decl, 'code');
  const list = Array.from(m.values()).sort((a, b) => a.line - b.line);
  let h = '<div class="grp" id="g-__lines">被改动的行（按行号排序）<small>' + list.length +
    ' 行 · 另有脚本元数据 ' + ((D.meta || []).length) + ' 组</small></div>';
  h += '<div class="count">同一行可能含多条文案改动。左列是英文原版行号，右列是汉化版行号。</div>';
  h += '<table style="margin-top:8px"><thead><tr><th style="width:110px">原版行号</th>' +
    '<th style="width:110px">汉化版行号</th><th style="width:180px">区块</th>' +
    '<th style="width:220px">改动类型</th><th>条数</th></tr></thead><tbody>';
  for (const it of list) {
    h += '<tr><td class="mono">' + it.line + '</td><td class="mono">' + (it.zline || '—') + '</td><td>' +
      esc(it.decl) + '</td><td>' + it.ks.map(k => KIND[k] || k).join(' / ') + '</td><td>' + it.n + '</td></tr>';
  }
  return h + '</tbody></table>';
}

function extraSections() {
  return metaSection() + structSection() + missedSection() + fixedSection() + leftoverSection();
}

// 固定不汉化：牌桌名等专有名词。既不是待办、也不是改动，只是「永久保持英文」的名单。

  if (!(D.fixedleft && D.fixedleft.length)) return '';
  const s = D.stats;
  let h = '<div class="grp" id="g-__fixed">🔒 固定不汉化（牌桌名等专有名词）<small>' +
    s.prot_names + ' 个名字 · ' + s.prot_blocks + ' 个区块 · ' + s.fixed_occ + ' 处</small></div>';

    }

  h += '<div class="grp" style="border-left-color:var(--zh);margin-top:18px">受保护的区块</div>';
  h += '<table><thead><tr><th style="width:170px">区块</th><th style="width:140px">原版行号</th>' +
    '<th style="width:140px">汉化版行号</th><th>包含的名字</th></tr></thead><tbody>';
  for (const b of (D.prot_blocks || [])) {
    h += '<tr><td class="mono">' + esc(b.decl) + '</td><td class="mono">' + b.start + '–' + b.end +

    '<th style="width:150px">就近声明</th></tr></thead><tbody>';

function metaSection() {
  if (!(D.meta && D.meta.length)) return '';
  let h = '<div class="grp" id="g-__meta">脚本元数据（userscript header）<small>' + D.meta.length + ' 组改动</small></div>';
  h += '<div class="count">脚本安装元信息：名称、命名空间、版本、更新地址等。这组改动的目的是让汉化版与原版互不覆盖，且安装后不会被引导更新回英文原版。</div>';

}

function structSection() {

function kpis() {
  const s = D.stats;
  return '<div class="kpis">' +
    kpi(s.pairs.toLocaleString(), '文案对照条目', 'changed') +
    kpi(s.changed_lines.toLocaleString(), '被改动的行', 'lines') +
    kpi(s.decls.toLocaleString(), '涉及区块', '') +
    kpi(s.leftover.toLocaleString(), '仍待汉化（英文）', 'left') +
    kpi(s.kinds.sentence || 0, '其中长句', 'kind:sentence') +
    kpi(s.kinds.term || 0, '其中短标签', 'kind:term') +
    kpi(s.missed || 0, '疑似漏译', 'missed') +
    kpi(s.fixed || 0, '🔒 固定不汉化', 'fixed') +
    kpi(((s.meta || 0) + s.structs), '元数据 / 代码改动', 'meta') +
    '</div>' + (s.zh_off ? '<div class="count" style="margin-top:10px">' +
      '汉化版脚本比英文原版多 ' + s.zh_off + ' 行（元数据区新增字段），所以正文行号有偏移：' +

      '</div>' : '') +
    '<div class="count" style="margin:-6px 0 14px">点上面的卡片按类别筛选，再点一次取消。</div>';
}
function kpi(v, l, k) {
  if (!k) return '<div class="kpi"><b>' + v + '</b><span>' + l + '</span></div>';
  return '<div class="kpi click' + (scopeOn(k) ? ' on' : '') + '" data-k="' + k + '"><b>' + v +
    '</b><span>' + l + '</span></div>';
}

function lz(x) {
  return (x.zline && x.zline !== x.line)
    ? '<span style="font-style:normal;opacity:.5;font-size:11px;margin-left:4px">→' + x.zline + '</span>'
    : '';
}
function lnCell(x) { return '' + x.line + lz(x); }
function card(r) {
  return '<div class="row"><div class="rh"><span class="ln">L' + r.line + lz(r) + '</span>' +
    '<span>' + esc(r.decl) + '</span>' +
    '<span class="tag' + (r.kind === 'sentence' ? ' s' : r.kind === 'deleted' ? ' d' : '') + '">' +
    (KIND[r.kind] || r.kind) + '</span></div><div class="pb">' +
    '<div class="half en"><span class="k en">EN</span><div class="v">' + hl(r.en) + '</div></div>' +
    '<div class="half zh"><span class="k zh">ZH</span><div class="v">' + (r.zh ? hl(r.zh) : '（已删除）') + '</div></div>' +
    '</div></div>';
}
function blockLines(ls) {
  if (!ls || !ls.length) return '<span style="opacity:.45">（无）</span>';
  return ls.map(x => '<span style="display:inline-block;min-width:26px;opacity:.45;font-size:11px">' +
    x.n + '</span>' + esc(x.t)).join('<br>');
}
function structCard(s) {
  return '<div class="row"><div class="rh"><span class="ln">L' + s.line + lz(s) + '</span><span>' + esc(s.decl) +
    '</span><span class="tag d">代码</span></div><div class="pb">' +
    '<div class="half en"><span class="k en">EN</span><div class="v">' + esc(s.en) + '</div></div>' +
    '<div class="half zh"><span class="k zh">ZH</span><div class="v">' + esc(s.zh) + '</div></div></div></div>';
}

function nav() {
  const cnt = new Map();
  for (const r of D.rows) cnt.set(r.decl, (cnt.get(r.decl) || 0) + 1);
  let h = '<a data-d=""' + ((curDecl || curScope) ? '' : ' class="on"') +
    '><b>全部</b><i>' + D.rows.length + '</i></a>';
  for (const d of D.decl_order) {
    if (!cnt.get(d)) continue;
    h += '<a data-d="' + esc(d) + '"' + (curDecl === d ? ' class="on"' : '') +
         '><b title="' + esc(d) + '">' + esc(d || '（顶层）') + '</b><i>' + cnt.get(d) + '</i></a>';
  }
  h += '<div class="navsec">其他</div>';
  for (const [id, sk, label, n] of [['g-__meta', 'meta', '脚本元数据', (D.meta || []).length],
                                    ['g-__struct', 'struct', '结构性改动', D.structs.length],
                                    ['g-__missed', 'missed', '疑似漏译', D.missed.length],
                                    ['g-__fixed', 'fixed', '🔒 固定不汉化', (D.fixedleft || []).length],
                                    ['g-__left', 'left', '尚未汉化', D.leftover.length]]) {
    h += '<a data-j="' + id + '"' + (curScope === sk ? ' class="on"' : '') +
         '><b>' + label + '</b><i>' + n + '</i></a>';
  }
  $('#nav').innerHTML = h;
  $('#nav').onclick = e => {
    const a = e.target.closest('a'); if (!a) return;
    if (a.dataset.j) {
      const sk = { 'g-__meta': 'meta', 'g-__struct': 'struct', 'g-__missed': 'missed',
                   'g-__fixed': 'fixed', 'g-__left': 'left' }[a.dataset.j];
      curScope = curScope === sk ? '' : sk;
      curQ = ''; curKind = ''; curDecl = '';
      $('#q').value = ''; $('#kind').value = '';
      render(); nav();
      return;
    }
    curDecl = a.dataset.d; curScope = '';
    render(); nav();
  };
}

$('#q').oninput = e => { curQ = e.target.value.trim().toLowerCase(); render(); };
$('#kind').onchange = e => { curKind = e.target.value; curScope = ''; render(); nav(); };
$('#view').onclick = e => {
  viewMode = viewMode === 'card' ? 'table' : 'card';
  e.target.textContent = viewMode === 'card' ? '▤ 表格' : '▦ 卡片';
  render();
};
$('#exp').onclick = () => {
  const rs = D.rows.filter(match);
  const t = ['行号\t区块\t类型\t英文原文\t中文译文'].concat(rs.map(r =>
    [r.line + (r.zline && r.zline !== r.line ? '/' + r.zline : ''), r.decl,
     KIND[r.kind] || r.kind, r.en, r.zh].join('\t'))).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + t], { type: 'text/tab-separated-values' }));
  a.download = '汉化对照.tsv'; a.click();
};
$('#main').addEventListener('click', e => {
  const el = e.target.closest('[data-k]');
  if (!el) return;
  const k = el.dataset.k;
  if (k.indexOf('kind:') === 0) {
    const v = k.slice(5);
    curKind = curKind === v ? '' : v;
    $('#kind').value = curKind;
  } else {
    curScope = curScope === k ? '' : k;
    curQ = ''; curDecl = ''; $('#q').value = '';
  }
  render(); nav();
});
nav(); render();
</script></body></html>
