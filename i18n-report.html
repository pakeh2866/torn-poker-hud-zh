子。", "kind": "sentence"}, {"line": 4605, "zline": 4607, "decl": "RANK_NAME", "en": "Watch out: ${texture.flushCards} flush-suit cards on that board — any flush draw out there beats your straight if it gets there.", "zh": "注意：那牌面上有 ${texture.flushCards} 张同花牌——任何同花听牌都能在成牌后打败你的顺子。", "kind": "sentence"}, {"line": 4610, "zline": 4612, "decl": "RANK_NAME", "en": "Straight on a paired board.${vulnNote}${straightFlushDrawWarning} Be cautious — full houses beat you, and${straightIsVulnerable ? ' higher straights are possible too.' : ' there may be a better straight out there.'}${posNoteNeutral}", "zh": "成牌顺子但在有对的牌面上。${vulnNote}${straightFlushDrawWarning} 小心——葫芦打败你，而且${straightIsVulnerable ? '可能还有更大的顺子。' : '外面可能有更好的顺子。'}${posNoteNeutral}", "kind": "sentence"}, {"line": 4611, "zline": 4613, "decl": "RANK_NAME", "en": "You got a straight but that board's got a pair on it.${vulnNoteDuke}${straightFlushDrawWarning} Full houses eat straights for breakfast, pal. Don't go building a monument to it.${posNoteNeutral}", "zh": "你成了顺子但牌面有一对。${vulnNoteDuke}${straightFlushDrawWarning} 葫芦拿顺子当早餐吃，伙计。别为它建纪念碑。${posNoteNeutral}", "kind": "sentence"}, {"line": 4617, "zline": 4619, "decl": "RANK_NAME", "en": "Straight on the river, but you're on the low end.${vulnNote}${straightFlushDrawWarning} Bet small for value — fold if they raise hard.${posNoteNeutral}", "zh": "河牌顺子，但你在低端。${vulnNote}${straightFlushDrawWarning} 小注拿价值——他们硬加注就弃牌。${posNoteNeutral}", "kind": "sentence"}, {"line": 4618, "zline": 4620, "decl": "RANK_NAME", "en": "Straight on the river but you're on the cheap end, kid.${vulnNoteDuke}${straightFlushDrawWarning} Sneak a small bet in — the second they raise hard, you get out.${posNoteNeutral}", "zh": "河牌顺子但你在便宜的一端，孩子。${vulnNoteDuke}${straightFlushDrawWarning} 偷偷塞个小注——他们一硬加注你就走人。${posNoteNeutral}", "kind": "sentence"}, {"line": 4621, "zline": 4623, "decl": "RANK_NAME", "en": "Straight made, but you're on the low end.${vulnNote}${straightFlushDrawWarning} Bet to charge draws, but fold t el}. Fish bet thin but can still have straights${flushDanger ? ' or flushes' : ''}. Marginal call — don't overcommit.${posNoteNeutral}", "zh": "两对面对鱼在 ${boardLabel} 上的下注。鱼下注很薄但也可能真的有顺子${flushDanger ? '或同花' : ''}。边缘跟注——别过度投入。${posNoteNeutral}", "kind": "sentence"}, {"line": 4765, "zline": 4767, "decl": "boardPairIsHigher", "en": "Two pair and a fish is betting on a ${boardLabel}. Fish bet thin but they can still have the real stuff. Marginal call — don't go deep, kid.${posNoteNeutral}", "zh": "两对，一条鱼在 ${boardLabel} 上下注了。鱼下注薄但他们也可能有真家伙。边缘跟注——别陷太深，小子。${posNoteNeutral}", "kind": "sentence"}, {"line": 4772, "zline": 4774, "decl": "boardPairIsHigher", "en": "Top two pair facing a bet from ${oppName} on a ${boardLabel}. They run wide — bluffs and thin value are in their range. Call is fine.${posNoteNeutral}", "zh": "顶两对面对 ${oppName} 在 ${boardLabel} 上的下注。他们范围很宽——诈唬和薄价值都在他们的范围内。跟注没问题。${posNoteNeutral}", "kind": "sentence"}, {"line": 4773, "zline": 4775, "decl": "boardPairIsHigher", "en": "Top two pair and ${oppName} is firing on a ${boardLabel}. They fire wide, kid — bluffs are real. Call is fine.${posNoteNeutral}", "zh": "顶两对，${oppName} 在 ${boardLabel} 上开火了。他们打得很宽，小子——诈唬是真的。跟注没问题。${posNoteNeutral}", "kind": "sentence"}, {"line": 4777, "zline": 4779, "decl": "boardPairIsHigher", "en": "Two pair facing a bet from ${oppName} on a ${boardLabel}. Known aggressor — bluffs and thin value are in their range. Calling is defensible, but be ready to be wrong.${posNoteNeutral}", "zh": "两对面对 ${oppName} 在 ${boardLabel} 上的下注。已知的攻击型玩家——诈唬和薄价值都在他们的范围内。跟注说得通，但准备好可能出错。${posNoteNeutral}", "kind": "sentence"}, {"line": 4778, "zline": 4780, "decl": "boardPairIsHigher", "en": "Two pair and ${oppName} is firing on a ${boardLabel}. They fire wide though — bluffs happen. Call ain't crazy, kid. Just know you might be behind.${posNoteNeutral}", "zh": "两对，${oppName} 在 ${boardLabel} 上开火了。他们打得很宽——诈唬时有发生。跟注不算疯，小子。只是要知道你可能落后。${posNoteNeutral}", "kind": "sentence"}, {"line": 4786, "zline": 4788, "decl": "bo sNote", "en": "Call or raise — top pair is worth fighting for here.", "zh": "跟注或加注——顶对值得在这里一争。", "kind": "sentence"}, {"line": 5181, "zline": 5183, "decl": "tpPosNote", "en": "${topPairWetWarning} Raise and make them draws pay a toll.", "zh": "${topPairWetWarning} 加注让那些听牌付过路费。", "kind": "sentence"}, {"line": 5181, "zline": 5183, "decl": "tpPosNote", "en": "Call or raise — top pair is your bread, fight for it.", "zh": "跟注或加注——顶对就是你的面包，为它而战。", "kind": "sentence"}, {"line": 5186, "zline": 5188, "decl": "tpPosNote", "en": "Top pair on the turn facing a bet.${wetStr}${tpSprNote}${tpPosNote}${oppStr}", "zh": "转牌上顶对面对下注。${wetStr}${tpSprNote}${tpPosNote}${oppStr}", "kind": "sentence"}, {"line": 5187, "zline": 5189, "decl": "tpPosNote", "en": "Top pair on the turn and they're betting into you, kid.${wetStrDuke}${tpSprNote}${tpPosNote}${oppStr}", "zh": "转牌上顶对，他们朝你下注了，孩子。${wetStrDuke}${tpSprNote}${tpPosNote}${oppStr}", "kind": "sentence"}, {"line": 5190, "zline": 5192, "decl": "tpPosNote", "en": "Top pair facing a bet.${wetStr}${tpSprNote}${tpPosNote}${oppStr}", "zh": "顶对面对下注。${wetStr}${tpSprNote}${tpPosNote}${oppStr}", "kind": "sentence"}, {"line": 5191, "zline": 5193, "decl": "tpPosNote", "en": "Top pair and they're coming at you, kid.${wetStrDuke}${tpSprNote}${tpPosNote}${oppStr}", "zh": "顶对，他们朝你来了，孩子。${wetStrDuke}${tpSprNote}${tpPosNote}${oppStr}", "kind": "sentence"}, {"line": 5195, "zline": 5197, "decl": "tpPosNote", "en": "${topPairWetWarning} Bet to charge them.", "zh": "${topPairWetWarning} 下注惩罚他们。", "kind": "term"}, {"line": 5195, "zline": 5197, "decl": "tpPosNote", "en": "Do not slow down.", "zh": "别减速。", "kind": "term"}, {"line": 5196, "zline": 5198, "decl": "tpPosNote", "en": "${topPairWetWarning} Bet and make em pay for their draws.", "zh": "${topPairWetWarning} 下注让他们的听牌付出代价。", "kind": "sentence"}, {"line": 5196, "zline": 5198, "decl": "tpPosNote", "en": "Don\\'t slow down, pal.", "zh": "别减速，伙计。", "kind": "term"}, {"line": 5201, "zline": 5203, "decl": "tpPosNote", "en": "Top pair on the turn. Bet for value and protection —${wetStr}${topPairSizingStr}${tpSprNote}${tpPosNote}${oppStr}", "zh": "转牌上顶对。下注获取价值和保护——${wetStr}${topPairSizingStr}${tpSprNote}${tpPosNote}${oppStr}", "kind": "sentence"}, {"line": 5202, "zline": 5204, "decl": "tpPosNote", "en": "Top pair on the turn, kid. Bet for value and run off the draws -${wetStrDuke}${topPairSizingStr}${tpSprNote}${tpPosNote}${oppStr}", "zh": "转牌上顶对，孩子。下注拿价值赶走听牌——${wetStrDuke}${topPairSizingStr}${tpSprNote}${tpPosNote}${oppStr}", "kind": "sentence"}, {"line": 5206, "zline": 5208, "decl": "tpPosNote", "en": "Top pair on a wet board. ${topPairWetWarning} Don't let draws in for free.${topPairSizingStr}${tpSprNote}${tpPosNote}${oppStr}", "zh": "湿润牌面上的顶对。${topPairWetWarning} 别让听牌免费进来。${topPairSizingStr}${tpSprNote}${tpPosNote}${oppStr}", "kind": "sentence"}, {"line": 5207, "zline": 5209, "decl": "tpPosNote", "en": "Top pair on a wet board. ${topPairWetWarning} Don't let the draws in for free.${topPairSizingStr}${tpSprNote}${tpPosNote}${oppStr}", "zh": "湿润牌面上的顶对。${topPairWetWarning} 别让听牌免费进来。${topPairSizingStr}${tpSprNote}${tpPosNote}${oppStr}", "kind": "sentence"}, {"line": 5211, "zline": 5213, "decl": "tpPosNote", "en": "Top pair. Bet for value.${topPairSizingStr} Do not let draws get there for free.${tpSprNote}${tpPosNote}${oppStr}", "zh": "顶对。下注拿价值。${topPairSizingStr} 别让听牌免费成牌。${tpSprNote}${tpPosNote}${oppStr}", "kind": "sentence"}, {"line": 5212, "zline": 5214, "decl": "tpPosNote", "en": "Top pair, kid. Your bread right there — bet for value.${topPairSizingStr} Don't let the draws get there for free.${tpSprNote}${tpPosNote}${oppStr}", "zh": "顶对，孩子。这就是你的面包——下注拿价值。${topPairSizingStr} 别让听牌免费成牌。${tpSprNote}${tpPosNote}${oppStr}", "kind": "sentence"}, {"line": 5218, "zline": 5220, "decl": "tpPosNote", "en": "open-ended straight draw", "zh": "双头顺听牌", "kind": "sentence"}, {"line": 5218, "zline": 5220, "decl": "tpPosNote", "en": "gutshot straight draw", "zh": "卡顺听牌", "kind": "term"}, {"line": 5221, "zline": 5223, "decl": "wetStr", "en": "Board is wet — a bet here means they likely have a draw or better.", "zh": "牌面湿润——在这里下注意味着他们可能有听牌或更好的牌。", "kind": "sentence"}, {"line": 5224, "zline": 5226, "decl": "wetStrDuke", "en": "Board's wet — a bet here means they probably got a draw or better.", "zh": "牌面湿——下注意味着他们可能有听牌或更好的牌。", "kind": "sentence"}, {"line": 5227, "zline": 5229, "decl": "wetStrDuke", "en": "Low pair + ${drawLabel} facing a bet. The draw adds equity — call if the price is right, but don't go stacking off.${sprNote}${posNote}${oppStr}", "zh": "低对 + ${drawLabel} 面对下注。听牌增加了胜率——价格合适就跟注，但别把筹码全压上。${sprNote}${posNote}${oppStr}", "kind": "sentence"}, {"line": 5228, "zline": 5230, "decl": "wetStrDuke", "en": "Low pair but you got a ${drawLabel} too, kid. That draw gives you outs — call if the price is right, but don't build a monster pot on it.${sprNote}${posNote}${oppStr}", "zh": "低对但你也有 ${drawLabel}，孩子。那个听牌给了你补牌——价格合适就跟，但别为它造怪物池。${sprNote}${posNote}${oppStr}", "kind": "sentence"}, {"line": 5232, "zline": 5234, "decl": "wetStrDuke", "en": "Low pair facing a bet. Marginal hand — fold to any real pressure.${wetStr}${sprNote}${posNote}${oppStr}", "zh": "低对面对下注。边缘牌——面对任何真正压力就弃牌。${wetStr}${sprNote}${posNote}${oppStr}", "kind": "sentence"}, {"line": 5233, "zline": 5235, "decl": "wetStrDuke", "en": "Low pair and they're betting into you. Get outta there when they push real money, kid.${wetStrDuke}${sprNote}${posNote}${oppStr}", "zh": "低对，他们朝你下注了。他们推真钱你就赶紧走人，孩子。${wetStrDuke}${sprNote}${posNote}${oppStr}", "kind": "sentence"}, {"line": 5237, "zline": 5239, "decl": "wetStrDuke", "en": "You have a pair but it is not top pair — but you also have an ${drawLabel}. Semi-playable: you have two ways to win. Don't overcommit, but the draw keeps you in it.${sprNote}${oppStr}", "zh": "你有一对但不是顶对——但你也有个 ${drawLabel}。半可玩性：你有两种获胜方式。别过度投入，但听牌让你留在里面。${sprNote}${oppStr}", "kind": "sentence"}, {"line": 5238, "zline": 5240, "decl": "wetStrDuke", "en": "Low pair ain't much, but that ${drawLabel} changes things, kid. You got two ways to win — pair holds or the straight gets there. Keep it reasonable.${sprNote}${oppStr}", "zh": "低对不算啥，但那个 ${drawLabel} 改变了局面，孩子。你有两种获胜方式——对子站住或顺子来。保持合理。${sprNote}${oppStr}", "kind": "sentence"}, {"line": 5242, "zline": 5244, "decl": "wetStrDuke", "en": "You have a pair but it is not top pair. Pot control - do not build a massive pot.${sprNote}${oppStr} Fold to a big raise.", "zh": "你有一对但不是顶对。控制底池——别造大池。${sprNote}${oppStr} 面对大加注就弃牌。", "kind": "sentence"}, {"line": 5243, "zline": 5245, "decl": "wetStrDuke", "en": "Low pair ain't gonna win you wars, kid. Keep it small or walk.${sprNote}${oppStr} Big raise? You fold.", "zh": "低对赢不了战争，孩子。保持小池或走人。${sprNote}${oppStr} 大加注？你就弃牌。", "kind": "sentence"}, {"line": 5251, "zline": 5253, "decl": "wetStr", "en": "Board is wet — fold to any real pressure.", "zh": "牌面湿润——面对任何真正压力就弃牌。", "kind": "sentence"}, {"line": 5254, "zline": 5256, "decl": "wetStrDuke", "en": "Board's wet — fold to any real pressure.", "zh": "牌面湿——面对任何真正压力就弃牌。", "kind": "sentence"}, {"line": 5258, "zline": 5260, "decl": "wetStrDuke", "en": "Pocket pair but the board has higher cards. Marginal — fold to any real pressure.${wetStr}${sprNote}${posNote}${oppStr}", "zh": "口袋对但牌面有更高的牌。边缘——面对任何真正压力就弃牌。${wetStr}${sprNote}${posNote}${oppStr}", "kind": "sentence"}, {"line": 5259, "zline": 5261, "decl": "wetStrDuke", "en": "Pocket pair but the board's running over you, kid. Fold to any real pressure.${wetStrDuke}${sprNote}${posNote}${oppStr}", "zh": "口袋对但牌面碾压了你，孩子。面对任何真正压力就弃牌。${wetStrDuke}${sprNote}${posNote}${oppStr}", "kind": "sentence"}, {"line": 5264, "zline": 5266, "decl": "wetStrDuke", "en": "Pocket pair, but the board has higher cards. Keep the pot small and fold to a big raise.${sprNote}${oppStr}", "zh": "口袋对，但牌面有更高的牌。保持底池小，面对大加注就弃牌。${sprNote}${oppStr}", "kind": "sentence"}, {"line": 5265, "zline": 5267, "decl": "wetStrDuke", "en": "Pocket pair but the board's got you outgunned, kid. Keep it small or walk when they raise.${sprNote}${oppStr}", "zh": "口袋对但牌面比你火力强，孩子。保持小池或他们加注你就走人。${sprNote}${oppStr}", "kind": "sentence"}, {"line": 5278, "zline": 5280, "decl": "wetStrDuke", "en": "Overcards facing a bet. You have nothing made yet — fold unless you have a solid read they are bluffing or the price is very cheap.${posNote}", "zh": "高张面对下注。你还没成牌——弃牌，除非你有可靠的读牌认为他们在诈唬，或者价格非常便宜。${posNote}", "kind": "sentence"}, {"line": 5279, "zline": 5281, "decl": "wetStrDuke", "en": "Overcards facing a bet. You ain't hit nothing yet, kid — get outta there unless you got a read they're running a bluff or the price is basically free.${posNote}", "zh": "高张面对下注。你啥也没中，孩子——赶紧走人，除非你读准他们在诈唬，或者价格基本免费。${posNote}", "kind": "sentence"}, {"line": 5284, "zline": 5286, "decl": "wetStrDuke", "en": "You have overcards - unimproved but live. One more card could give you top pair. Cheap street is fine; do not call a big bet without a stronger read.${posNote}", "zh": "你有高张——未成牌但有活力。再多一张牌可能给你顶对。便宜街没问题；没有更强的读牌就别跟大注。${posNote}", "kind": "sentence"}, {"line": 5285, "zline": 5287, "decl": "wetStrDuke", "en": "You ain't hit nothing yet but those high cards are live. One more card could hand you top pair. Take the cheap street, don't go blowing your stack on a prayer.${posNote}", "zh": "你啥也没中但那些高牌还活着。再多一张牌可能给你顶对。走便宜街，别靠祈祷把筹码打光。${posNote}", "kind": "sentence"}, {"line": 5293, "zline": 5295, "decl": "wetStrDuke", "en": "${rrEq.flush}% flush", "zh": "${rrEq.flush}% 同花", "kind": "term"}, {"line": 5294, "zline": 5296, "decl": "wetStrDuke", "en": "${rrEq.straight}% straight", "zh": "${rrEq.straight}% 顺子", "kind": "term"}, {"line": 5297, "zline": 5299, "decl": "wetStrDuke", "en": "backdoor flush draw (need runner-runner)", "zh": "后门同花听牌（需要 runner-runner）", "kind": "sentence"}, {"line": 5298, "zline": 5300, "decl": "wetStrDuke", "en": "backdoor straight draw (need runner-runner)", "zh": "后门顺子听牌（需要 runner-runner）", "kind": "sentence"}, {"line": 5299, "zline": 5301, "decl": "wetStrDuke", "en": "and", "zh": "和", "kind": "term"}, {"line": 5301, "zline": 5303, "decl": "wetStrDuke", "en": "You have not connected but you have a ${backdoorNote} (~${equityNote}). Don't call a significant bet for this alone. Fold unless you're getting a great price or have position.${posNote}", "zh": "你没有连接上但你有 ${backdoorNote}。低胜率——别仅仅因为这个就跟显著的下注。弃牌，除非你有很好的价格或有位置。${posNote}", "kind": "sentence"}, {"line": 5302, "zline": 5304, "decl": "wetStrDuke", "en": "You ain't connected but you got a ${backdoorNote} (~${equityNote}). Duke don't pay for runner-runner dreams. Fold unless the price is basically a gift.${posNote}", "zh": "你没连接上但你有 ${backdoorNote}。低胜率——杜克可不为 runner-runner 的梦想买单。弃牌，除非价格基本是送的。${posNote}", "kind": "sentence"}, {"line": 5305, "zline": 5307, "decl": "wetStrDuke", "en": "You haven't connected yet but have a ${backdoorNote} (~${equityNote}) — it adds a small reason to see the turn cheaply, but don't rely on it.${posNote}", "zh": "你还没连接上但有 ${backdoorNote}。低胜率（~4-6%）——这给了你一个便宜看转牌的小理由，但别依赖它。${posNote}", "kind": "sentence"}, {"line": 5306, "zline": 5308, "decl": "wetStrDuke", "en": "You ain't hit nothing yet but you got a ${backdoorNote} (~${equityNote}) — take the cheap turn if they give it, otherwise fold. Don't build your future on it.${posNote}", "zh": "你啥也没中但你有 ${backdoorNote}。低胜率，大概 4-6%——如果他们给便宜转牌就拿，否则弃牌。别把你的未来押在上面。${posNote}", "kind": "sentence"}, {"line": 5311, "zline": 5313, "decl": "wetStrDuke", "en": "You have not connected with the board and are facing a bet. Easy fold — you have no made hand and no strong draw.${posNote}", "zh": "你没有和牌面连接上并且面对下注。轻松弃牌——你没有成牌也没有强听牌。${posNote}", "kind": "sentence"}, {"line": 5312, "zline": 5314, "decl": "wetStrDuke", "en": "You connected with nothing on this board and they're betting. Easy fold - no made hand, no draw, no reason to be here, pal.${posNote}", "zh": "你和这牌面毫无关系，他们下注了。轻松弃牌——没成牌、没听牌、没理由在这，伙计。${posNote}", "kind": "sentence"}, {"line": 5315, "zline": 5317, "decl": "wetStrDuke", "en": "You have not connected with this board. You need a good reason to continue - a solid read on a bluff or a very cheap price.${posNote}", "zh": "你没有和这个牌面连接上。你需要一个好理由继续——可靠的读牌认为他们在诈唬，或者非常便宜的价格。${posNote}", "kind": "sentence"}, {"line": 5316, "zline": 5318, "decl": "wetStrDuke", "en": "You connected with nothing on this board. You need a real reason to continue, pal — a solid read they're bluffing or an almost-free price.${posNote}", "zh": "你和这牌面毫无关系。你需要一个真正的理由继续，伙计——可靠的读牌他们诈唬，或者几乎免费的价格。${posNote}", "kind": "sentence"}, {"line": 5513, "zline": 5515, "decl": "facingRaise", "en": "Re-raise — do not slow-play aces against multiple raisers. Thin the field now.", "zh": "再加注——不要在多人加注时慢打AA。现在减少人数。", "kind": "sentence"}, {"line": 5514, "zline": 5516, "decl": "facingRaise", "en": "Raise. Pocket aces are the best starting hand — raise big to narrow the field. Pitfall: limping or min-raising lets in cheap callers who can crack you with suited connectors or small pairs. Don't be tricky preflop.", "zh": "加注。口袋A是最好的起手牌——加大注码以减少入池人数。陷阱：溜入或最小加注会让便宜跟注者用同花连牌或小对子反超你。翻前别耍花样。", "kind": "sentence"}, {"line": 5516, "zline": 5518, "decl": "facingRaise", "en": "Pocket aces and there's already raises flying. Re-raise — you don't slow-play rockets against multiple raisers. Thin the field now.", "zh": "口袋A而且已经有加注飞来飞去。再加注——别在多人加注时慢打AA。现在清场。", "kind": "sentence"}, {"line": 5517, "zline": 5519, "decl": "facingRaise", "en": "Pocket aces, kid. The best hand in existence. Raise big and clear the riff-raff out. Don't limp, don't min-raise — some joker will crack you with a 7-2 suited if you let em in cheap.", "zh": "口袋A，孩子。世界上最好的牌。加注清走那些闲杂人等。别溜入，别最小加注——如果让他们便宜进来，某个小丑会用7-2同花干掉你。", "kind": "sentence"}, {"line": 5523, "zline": 5525, "decl": "facingRaise", "en": "Cowboys — re-raise. Strong enough to go all-in preflop. The only hand that beats you here is AA.", "zh": "KK——再加注。强到可以翻前全压。唯一能打败你的是AA。", "kind": "sentence"}, {"line": 5524, "zline": 5526, "decl": "facingRaise", "en": "Pocket kings. Raise big. Pitfall: many players over-fold KK when an ace hits the board — your opponent doesn't always have the ace. Don't auto-surrender to an ace without reads.", "zh": "口袋K。加注。陷阱：很多玩家在看到A时过度弃牌KK——对手并不总是有A。在没有读牌的情况下，不要见到A就自动认输。", "kind": "sentence"}, {"line": 5526, "zline": 5528, "decl": "facingRaise", "en": "Cowboys, pal. Re-raise and don't look back. Only thing that beats you is rockets. Go all-in preflop.", "zh": "KK，伙计。再加注，别回头。唯一能打败你的是AA。翻前全压。", "kind": "sentence"}, {"line": 5527, "zline": 5529, "decl": "facingRaise", "en": "Pocket kings. Raise big. Rookie mistake: folding this the second an ace hits the flop. They don't always have the ace — don't hand your chips over without a read.", "zh": "口袋K。加注大点。新手错误：翻牌一张A就弃牌。他们并不总是有A——没有读牌就别把筹码交出去。", "kind": "sentence"}, {"line": 5534, "zline": 5536, "decl": "facingRaise", "en": "Pocket queens — strong, but if you're facing a 4-bet from a tight player, you might be behind KK or AA. Re-raise with caution and consider the raiser's badge.", "zh": "口袋Q——强牌，但如果你面对紧手的4-bet，你可能落后于KK或AA。谨慎再加注，并考虑加注者的徽章。", "kind": "sentence"}, {"line": 5535, "zline": 5537, "decl": "facingRaise", "en": "Pocket queens. Raise. Pitfall: queens hate an ace or king on the flop. If a tight player bets into an A-high or K-high board, reassess. Your hand is one-pair strength post-flop.", "zh": "口袋Q。加注。陷阱：Q讨厌翻牌出现A或K。如果紧手在A高或K高牌面上下注，重新评估。你的牌翻后只有一对的强度。", "kind": "sentence"}, {"line": 5537, "zline": 5539, "decl": "facingRaise", "en": "Pocket queens facing multiple raises — strong hand but a tight 4-bettor might have you behind KK or AA. Re-raise with some respect for the action, pal.", "zh": "口袋Q面对多个加注——强牌但紧的4-bettor可能让你落后KK或AA。带着对行动的尊重再加注，伙计。", "kind": "sentence"}, {"line": 5538, "zline": 5540, "decl": "facingRaise", "en": "Pocket queens. Raise. Pitfall: queens fall apart when an ace or king lands. Tight player betting into that board? Reassess. You got one pair, not a miracle.", "zh": "口袋Q。加注。陷阱：当A或K出现时Q就崩了。紧手在那个牌面下注？重新评估。你只有一对，不是奇迹。", "kind": "sentence"}, {"line": 5546, "zline": 5548, "decl": "facingRaise", "en": "Pocket ${name} facing multiple raises — calling is safer than re-jamming. Overcards are likely.", "zh": "口袋${name}面对多个加注——跟注比重注更安全。高牌很可能存在。", "kind": "sentence"}, {"line": 5547, "zline": 5549, "decl": "facingRaise", "en": "Pocket ${name}. Raise, but be ready to fold if an overcard (A, K, Q) hits and a tight player shows real aggression. These hands are strong before the flop but become tricky after — don't over-commit when the board has overcards.", "zh": "口袋${name}。加注，但如果有高牌（A、K、Q）出现且紧手表现出真正的攻击性，准备好弃牌。这些牌翻前很强但翻后变得棘手——当牌面有高牌时不要过度投入。", "kind": "sentence"}, {"line": 5549, "zline": 5551, "decl": "facingRaise", "en": "Pocket ${name} and there's raises flying everywhere — calling is safer than re-jamming here, pal. Overcards are probably out there.", "zh": "口袋${name}而且加注到处飞——跟注比在这里重注更安全，伙计。高牌可能在外面。", "kind": "sentence"}, {"line": 5550, "zline": 5552, "decl": "facingRaise", "en": "Pocket ${name}. Raise, but keep your head. An overcard hits and a tight player starts showing teeth? Don't go broke on one pair.", "zh": "口袋${name}。加注，但保持清醒。高牌出现且紧手开始露出獠牙？别为一对破产。", "kind": "sentence"}, {"line": 5557, "zline": 5559, "decl": "facingRaise", "en": "Big Slick — re-raise. Strong enough to go all-in preflop against most ranges.", "zh": "AK——再加注。强到可以翻前全压，对抗大多数范围。", "kind": "sentence"}, {"line": 5558, "zline": 5560, "decl": "facingRaise", "en": "Ace-King${suited ? ' suited' : ''}. Raise. This is a premium drawing hand — it's not made yet. Pitfall: AK misses the flop about 2/3 of the time. Don't over-commit post-flop if you whiff. It's just ace-high.", "zh": "AK${suited ? ' 同花' : ''}。加注。这是一手顶级听牌牌型——还没成牌。陷阱：AK大约2/3的时间不中翻牌。如果你没中，翻后不要过度投入。它只是A高。", "kind": "sentence"}, {"line": 5560, "zline": 5562, "decl": "facingRaise", "en": "Big Slick${suited ? ' suited' : ''} — re-raise. Strong enough to go all-in preflop against most ranges, kid.", "zh": "AK${suited ? ' 同花' : ''}——再加注。强到可以翻前全压，对抗大多数范围，孩子。", "kind": "sentence"}, {"line": 5561, "zline": 5563, "decl": "facingRaise", "en": "Ace-King${suited ? ' suited' : ''}. Raise it. Premium drawing hand — but it ain't made yet. Misses the flop 2 out of 3 times. Don't go throwing your stack at a whiff. It's just ace-high until the board says otherwise.", "zh": "AK${suited ? ' 同花' : ''}。加注。顶级听牌牌型——但还没成牌。2/3的翻牌都不中。不要把你的筹码扔在不中的牌上。在牌面证明之前，它只是A高。", "kind": "sentence"}, {"line": 5568, "zline": 5570, "decl": "facingRaise", "en": "Ace-Queen suited — solid. Call or re-raise. Against an EP raiser, be cautious about AK or AA dominating you.", "zh": "Ace-Queen 同花——不错。跟注或再加注。面对 EP 加注者，小心 AK 或 AA 压制你。", "kind": "sentence"}, {"line": 5569, "zline": 5571, "decl": "facingRaise", "en": "Ace-Queen suited. Raise from ${posLabel}. Strong hand with nut-flush potential. Pitfall: AQ is behind AK — against a tight 3-bettor, you may be dominated.", "zh": "Ace-Queen 同花。从 ${posLabel} 加注。强牌，有坚果同花潜力。陷阱：AQ 落后于 AK——面对紧的 3-bettor，你可能被压制。", "kind": "sentence"}, {"line": 5571, "zline": 5573, "decl": "facingRaise", "en": "Ace-Queen suited — solid hand, pal. Call or re-raise. Tight EP raiser? Tread careful, AK or AA might have you dominated.", "zh": "Ace-Queen 同花——不错的牌，伙计。跟注或再加注。紧的 EP 加注者？小心点，AK 或 AA 可能压制你。", "kind": "sentence"}, {"line": 5572, "zline": 5574, "decl": "facingRaise", "en": "Ace-Queen suited. Raise from ${posLabel}. You got nut-flush potential on top of everything else. Pitfall: AQ loses to AK — tight 3-bettor is telling you something. Don't be stupid.", "zh": "Ace-Queen 同花。从 ${posLabel} 加注。除了别的之外你还有坚果同花潜力。陷阱：AQ 输给 AK——紧的 3-bettor 在告诉你什么。别犯傻。", "kind": "sentence"}, {"line": 5578, "zline": 5580, "decl": "facingRaise", "en": "Premium hand. Re-raise or go all-in. Don't just call a 3-bet with this.", "zh": "强牌。再加注或全压。别只是跟注 3-bet。", "kind": "sentence"}, {"line": 5579, "zline": 5581, "decl": "facingRaise", "en": "Premium hand. Raise if you haven't already.", "zh": "强牌。如果你还没加注，就加注。", "kind": "sentence"}, {"line": 5581, "zline": 5583, "decl": "facingRaise", "en": "Premium hand, kid. Re-raise or go all-in. Don't sit there calling a 3-bet with this.", "zh": "强牌，孩子。再加注或全压。别坐那跟注 3-bet。", "kind": "sentence"}, {"line": 5582, "zline": 5584, "decl": "facingRaise", "en": "Premium hand. You raise this — if you haven't already, what are you waiting for.", "zh": "强牌。你加注这个——如果你还没加，还等什么呢。", "kind": "sentence"}, {"line": 5589, "zline": 5591, "decl": "facingRaise", "en": "Pocket nines — call to see a flop. Overpairs are your goal. If an overcard-heavy board comes and you face aggression, be careful.", "zh": "口袋 9——跟注看翻牌。你的目标是超对。如果牌面出现大量高牌而且你面对进攻，要小心。", "kind": "sentence"}, {"line": 5590, "zline": 5592, "decl": "facingRaise", "en": "Pocket nines. Raise from ${posLabel}. Good hand but not bullet-proof post-flop — fold to heavy multi-street pressure on overcard boards.", "zh": "口袋 9。从 ${posLabel} 加注。好牌但翻后不是刀枪不入——在高牌牌面上面对多条街的重压就弃牌。", "kind": "sentence"}, {"line": 5592, "zline": 5594, "decl": "facingRaise", "en": "Pocket nines — call and see the flop. You want to flop an overpair. Board comes out with overcards and they start barking? Be careful, pal.", "zh": "口袋 9——跟注看翻牌。你想翻出超对。牌面全是高牌他们开始叫了？小心，伙计。", "kind": "sentence"}, {"line": 5593, "zline": 5595, "decl": "facingRaise", "en": "Pocket nines. Raise from ${posLabel}. Good hand, but it ain't armor — overcard board with heavy pressure means you gotta respect what they're selling.", "zh": "口袋 9。从 ${posLabel} 加注。好牌，但它不是盔甲——高牌牌面加上重压意味着你得尊重他们卖的货。", "kind": "sentence"}, {"line": 5600, "zline": 5602, "decl": "facingRaise", "en": "Ace-Queen offsuit facing a raise — calling is reasonable. Avoid 3-bet/calling off large portions of your stack, as AK dominates you.", "zh": "Ace-Queen 不同花面对加注——跟注是合理的。避免 3-bet 或把大部分筹码跟进去，AK 压制你。", "kind": "sentence"}, {"line": 5601, "zline": 5603, "decl": "facingRaise", "en": "Ace-Queen. Raise from ${posLabel}. Solid hand. Post-flop: top pair with good kicker. Pitfall: don't stack off against tight players — AK beats you.", "zh": "Ace-Queen。从 ${posLabel} 加注。扎实的牌。翻后：顶对带好踢脚。陷阱：别对紧手把筹码打光——AK 赢你。", "kind": "sentence"}, {"line": 5603, "zline": 5605, "decl": "facingRaise", "en": "Ace-Queen offsuit facing a raise — calling is reasonable. Don't go 3-bet calling off your whole stack, AK has you dominated.", "zh": "Ace-Queen 不同花面对加注——跟注是合理的，伙计。别拿 3-bet 把整个筹码都跟进去，AK 压制着你。", "kind": "sentence"}, {"line": 5604, "zline": 5606, "decl": "facingRaise", "en": "Ace-Queen. Raise from ${posLabel}. Solid hand — top pair with a good kicker is your bread. Pitfall: tight player comes over the top, think twice. AK eats this for breakfast.", "zh": "Ace-Queen。从 ${posLabel} 加注。扎实的牌——顶对带好踢脚就是你的饭碗。陷阱：紧手反加，你得想清楚。AK 拿这个当早饭。", "kind": "sentence"}, {"line": 5608, "zline": 5610, "decl": "facingRaise", "en": "Strong hand in the big blind. Raise it, don't let them see a cheap flop.", "zh": "大盲位的强牌。加注，别让他们便宜看翻牌。", "kind": "sentence"}, {"line": 5609, "zline": 5611, "decl": "facingRaise", "en": "Strong hand in the big blind. Raise it — don't let these bums see a cheap flop.", "zh": "大盲位的强牌，孩子。加注——别让这帮家伙便宜看翻牌。", "kind": "sentence"}, {"line": 5612, "zline": 5614, "decl": "facingRaise", "en": "Solid hand from ${posLabel}. Calling is fine, re-raising is fine if you have a read on the raiser.", "zh": "${posLabel} 位置的扎实牌。跟注可以，对加注者有读牌的话再加注也可以。", "kind": "sentence"}, {"line": 5613, "zline": 5615, "decl": "facingRaise", "en": "Solid hand from ${posLabel}. Call is fine, re-raise is fine ? you got enough to push back if you got a read on the raiser, kid.", "zh": "${posLabel} 位置的扎实牌，伙计。跟注可以，再加注也可以——对加注者有读牌的话，你有底气推回去。", "kind": "sentence"}, {"line": 5617, "zline": 5619, "decl": "facingRaise", "en": "Strong hand. Raise to isolate — ${limperCount} limper${limperCount > 1 ? 's' : ''} in.", "zh": "强牌。加注孤立——已经进来了 ${limperCount} 个溜入者。", "kind": "sentence"}, {"line": 5618, "zline": 5620, "decl": "facingRaise", "en": "Strong hand, kid. Raise to isolate — ${limperCount} limper${limperCount > 1 ? 's' : ''} already in.", "zh": "强牌，孩子。加注孤立——${limperCount} 个溜入者已经在了。", "kind": "sentence"}, {"line": 5621, "zline": 5623, "decl": "facingRaise", "en": "Strong hand. Open raise from ${posLabel}.", "zh": "强牌。从 ${posLabel} 开局加注。", "kind": "sentence"}, {"line": 5622, "zline": 5624, "decl": "facingRaise", "en": "Strong hand, kid. Open raise from ${posLabel} — don't limp this.", "zh": "强牌，孩子。从 ${posLabel} 开局加注——别溜入。", "kind": "sentence"}, {"line": 5627, "zline": 5629, "decl": "facingRaise", "en": "Decent hand. Check and see what the flop brings.", "zh": "可玩的牌。过牌看看翻牌会来什么。", "kind": "sentence"}, {"line": 5628, "zline": 5630, "decl": "facingRaise", "en": "Decent hand in the big blind and it's free. Check and see what comes out on the flop, pal.", "zh": "大盲注有好牌而且是免费的。过牌看看翻牌会来什么，伙计。", "kind": "sentence"}, {"line": 5631, "zline": 5633, "decl": "facingRaise", "en": "${suited ? 'Suited' : 'This'} hand has some potential but ${posLabel} makes it marginal. Folding to a raise is fine.", "zh": "${suited ? '同花' : '这手'}牌有些潜力但 ${posLabel} 让它变为边缘牌。面对加注弃牌是可以的。", "kind": "sentence"}, {"line": 5632, "zline": 5634, "decl": "facingRaise", "en": "${suited ? 'Suited hand' : 'This hand'} got some potential but ${posLabel} makes it a tough play. Fold to a raise, don't be a hero.", "zh": "${suited ? '同花牌' : '这手牌'}有些潜力但 ${posLabel} 让游戏变得困难。面对加注就弃牌，别当英雄。", "kind": "sentence"}, {"line": 5635, "zline": 5637, "decl": "facingRaise", "en": "Speculative hand. Worth a call${facingRaise ? ' to see a flop' : ''}, but don't put in much more without a strong flop.", "zh": "投机牌。值得跟注${facingRaise ? '看翻牌' : ''}，但没有强翻牌就别投入太多。", "kind": "sentence"}, {"line": 5636, "zline": 5638, "decl": "facingRaise", "en": "Speculative hand. Worth a call${facingRaise ? ' to see the flop' : ''}, but don't go building a pot around it without a strong board, kid.", "zh": "投机牌。值得跟注${facingRaise ? '看翻牌' : ''}，但别围绕它建池而没有强牌面，孩子。", "kind": "sentence"}, {"line": 5640, "zline": 5642, "decl": "facingRaise", "en": "There ${limperCount === 1 ? 'is' : 'are'} ${limperCount} limper${limperCount > 1 ? 's' : ''} in — you can call or raise to build the pot.", "zh": "有 ${limperCount} 个溜入者——你可以跟注或加注来建池。", "kind": "sentence"}, {"line": 5641, "zline": 5643, "decl": "facingRaise", "en": "${limperCount} limper${limperCount > 1 ? 's' : ''} already in, pal — call or raise to build the pot.", "zh": "${limperCount} 个溜入者已经在了，伙计——跟注或加注来建池。", "kind": "sentence"}, {"line": 5644, "zline": 5646, "decl": "facingRaise", "en": "Decent hand from ${posLabel}. Open raise is reasonable.", "zh": "${posLabel} 的可玩牌。开局加注是合理的。", "kind": "sentence"}, {"line": 5645, "zline": 5647, "decl": "facingRaise", "en": "Decent hand from ${posLabel}. Open raise is reasonable ? take the initiative, kid.", "zh": "${posLabel} 的可玩牌。开局加注是合理的？掌握主动权，孩子。", "kind": "sentence"}, {"line": 5650, "zline": 5652, "decl": "facingRaise", "en": "Weak hand but you're in the big blind with no raise. Check and take the free flop.", "zh": "弱牌但你在没有加注的大盲注位。过牌拿免费翻牌。", "kind": "sentence"}, {"line": 5651, "zline": 5653, "decl": "facingRaise", "en": "Weak hand but nobody raised and it's your big blind. Check it and take the free flop ? waste not, pal.", "zh": "弱牌但没人加注而且是大盲注。过牌拿免费翻牌？别浪费，伙计。", "kind": "sentence"}, {"line": 5655, "zline": 5657, "decl": "facingRaise", "en": "Folded to you in the small blind. Raise. Only one player left to act and your blind is already in, so this is a steal, not a hand you have to like. Give up cheap if the big blind fights back and you miss.", "zh": "前面全弃，轮到你小盲。加注。只剩一个人没行动，你的盲注也已经进去了——这是偷盲，不是那种你必须喜欢的牌。大盲反打、你又没中，就便宜放掉。", "kind": "sentence"}, {"line": 5656, "zline": 5658, "decl": "facingRaise", "en": "Weak hand, but ${posLabel} with the pot folded to you is a raise. Take a shot at the blinds and don't get married to it after the flop.", "zh": "弱牌，但在 ${posLabel} 位置、前面全弃到你这儿，这就是个加注。搏一把盲注，翻牌后别跟它死磕。", "kind": "sentence"}, {"line": 5658, "zline": 5660, "decl": "facingRaise", "en": "Folded to you in the small blind, kid. Raise it. One player left and your money's already in the middle, so you're stealing here, not falling in love. Big blind pushes back and you whiffed? Let it go cheap.", "zh": "前面全弃，轮到你小盲，小子。加注。就剩一个人，钱也已经进池了，你这是在偷，不是谈恋爱。大盲推回来你又没中？便宜放掉。", "kind": "sentence"}, { ound(drawRate * 100)}% draw chase rate — if the board is coordinated, count draws in their range.", "zh": "${Math.round(drawRate * 100)}% 追牌率——如果牌面有关联，把听牌算进他们的范围。", "kind": "sentence"}, {"line": 6791, "zline": 6793, "decl": "limpNote", "en": "${Math.round(drawRate * 100)}% draw chase rate — on a coordinated board, count draws in their range.", "zh": "${Math.round(drawRate * 100)}% 追牌率——在关联牌面上，把听牌算进他们的范围。", "kind": "sentence"}, {"line": 6808, "zline": 6810, "decl": "hudPush", "en": "They open wider in late position (${Math.round(posPfr * 100)}% LP PFR).", "zh": "他们在后位加注更宽（${Math.round(posPfr * 100)}% 后位 PFR）。", "kind": "sentence"}, {"line": 6809, "zline": 6811, "decl": "hudPush", "en": "They open wider in late position (${Math.round(posPfr * 100)}% LP PFR). Late seat, light fingers.", "zh": "他们在后位加注更宽（${Math.round(posPfr * 100)}% 后位 PFR）。后位，手松。", "kind": "sentence"}, {"line": 6813, "zline": 6815, "decl": "hudPush", "en": "They tighten up in early position (${Math.round(posVpip * 100)}% EP VPIP).", "zh": "他们在前位收紧（${Math.round(posVpip * 100)}% 前位 VPIP）。", "kind": "sentence"}, {"line": 6814, "zline": 6816, "decl": "hudPush", "en": "They tighten up in early position (${Math.round(posVpip * 100)}% EP VPIP). Up front, they ain't splashing.", "zh": "他们在前位收紧（${Math.round(posVpip * 100)}% 前位 VPIP）。在前面，他们不瞎搞。", "kind": "sentence"}, {"line": 6823, "zline": 6825, "decl": "hudPush", "en": "Low 3-bet rate (${Math.round(dm.threeBetPct * 100)}%) — this re-raise is usually strong.", "zh": "3-bet 率低（${Math.round(dm.threeBetPct * 100)}%）——这个再加注通常很强。", "kind": "sentence"}, {"line": 6824, "zline": 6826, "decl": "hudPush", "en": "Low 3-bet rate (${Math.round(dm.threeBetPct * 100)}%) — this re-raise is usually strong. Respect it.", "zh": "3-bet 率低（${Math.round(dm.threeBetPct * 100)}%）——这个再加注通常很强。尊重它。", "kind": "sentence"}, {"line": 6828, "zline": 6830, "decl": "hudPush", "en": "High 3-bet rate (${Math.round(dm.threeBetPct * 100)}%) — this re-raise can be wide.", "zh": "3-bet 率高（${Math.round(dm.threeBetPct * 100)}%）——这个再加注可能范围很宽。", "kind": "sentence"}, {"line": 6829, "zline": 6831, "decl": "hudPush", "en": "High 3-bet rate (${Math.round(dm.threeBetPct * 100)}%) — this re-raise can be wide. They like to swing.", "zh": "3-bet 率高（${Math.round(dm.threeBetPct * 100)}%）——这个再加注可能范围很宽。他们喜欢乱来。", "kind": "sentence"}, {"line": 6837, "zline": 6839, "decl": "hudPush", "en": "Folds to 3-bets ${Math.round(dm.foldTo3BetPct * 100)}% — well above the Torn average of ${Math.round(POOL_AVG.foldTo3Bet * 100)}%. Good spot to squeeze if you have a hand.", "zh": "面对3-bet弃牌率 ${Math.round(dm.foldTo3BetPct * 100)}%——如果你有牌，是好挤压时机。", "kind": "sentence"}, {"line": 6838, "zline": 6840, "decl": "hudPush", "en": "Folds to 3-bets ${Math.round(dm.foldTo3BetPct * 100)}% — they hate pressure way more than most of this pool. Good spot to squeeze.", "zh": "面对3-bet弃牌率 ${Math.round(dm.foldTo3BetPct * 100)}%——他们讨厌压力。好挤压时机。", "kind": "sentence"}, {"line": 6842, "zline": 6844, "decl": "hudPush", "en": "Only folds to 3-bets ${Math.round(dm.foldTo3BetPct * 100)}% — already below the Torn average of ${Math.round(POOL_AVG.foldTo3Bet * 100)}%. Don't light 3-bet this one.", "zh": "面对3-bet只弃牌 ${Math.round(dm.foldTo3BetPct * 100)}%——别轻率3-bet这个人。", "kind": "sentence"}, {"line": 6843, "zline": 6845, "decl": "hudPush", "en": "Only folds to 3-bets ${Math.round(dm.foldTo3BetPct * 100)}% — they call 3-bets more than most. Don't bluff squeeze.", "zh": "面对3-bet只弃牌 ${Math.round(dm.foldTo3BetPct * 100)}%——他们跟注3-bet。别诈唬挤压。", "kind": "sentence"}, {"line": 6851, "zline": 6853, "decl": "hudPush", "en": "They fold to flop bets ${Math.round(dm.foldVsFlopBet * 100)}% — above the Torn average of ${Math.round(POOL_AVG.foldVsFlopCbet * 100)}%. A c-bet often works.", "zh": "他们面对翻牌下注弃牌率 ${Math.round(dm.foldVsFlopBet * 100)}%——持续下注通常有效。", "kind": "sentence"}, {"line": 6852, "zline": 6854, "decl": "hudPush", "en": "They fold to flop bets ${Math.round(dm.foldVsFlopBet * 100)}% — above the Torn average of ${Math.round(POOL_AVG. t price, pal. If the odds weren't there, fold was right.${suffix}", "zh": "${opening} 听牌胜率需要合适的价格，伙计。如果赔率不够，弃牌是对的。${suffix}", "kind": "sentence"}, {"line": 9514, "zline": 9516, "decl": "buildFoldedEntry", "en": "${opening}${facedBet ? ' Marginal facing aggression.' : ' Marginal spot.'} Thin edge — protecting chips is reasonable.${suffix}", "zh": "${opening}${facedBet ? ' 面对进攻的边缘局面。' : ' 边缘局面。'}薄优势——保护筹码是合理的。${suffix}", "kind": "sentence"}, {"line": 9515, "zline": 9517, "decl": "buildFoldedEntry", "en": "${opening}${facedBet ? ' Marginal with a bet in your face.' : ' Marginal spot, pal.'} Thin edge — protecting chips is reasonable.${suffix}", "zh": "${opening}${facedBet ? ' 有人朝你下注的边缘局面。' : ' 边缘局面，伙计。'}薄优势——保护筹码是合理的。${suffix}", "kind": "sentence"}, {"line": 9526, "zline": 9528, "decl": "buildFoldedEntry", "en": "${aggressor.name} is tight — their range had you in bad shape there.", "zh": "${aggressor.name} 很紧——他们的范围让你处于很糟的境地。", "kind": "sentence"}, {"line": 9527, "zline": 9529, "decl": "buildFoldedEntry", "en": "${aggressor.name} is tight, kid — their range had you in bad shape.", "zh": "${aggressor.name} 很紧，小子——他们的范围让你陷入困境。", "kind": "sentence"}, {"line": 9529, "zline": 9531, "decl": "buildFoldedEntry", "en": "Even against someone who plays wide, that equity is not enough.", "zh": "即使面对打得宽的玩家，这点胜率也不够。", "kind": "sentence"}, {"line": 9530, "zline": 9532, "decl": "buildFoldedEntry", "en": "Even against a wide player, kid — that equity is not enough.", "zh": "即使面对宽范围的玩家，小子——这点胜率也不够。", "kind": "sentence"}, {"line": 9539, "zline": 9541, "decl": "buildFoldedEntry", "en": "${handPrefix}That ${hitWhat} hit after you folded. Stings to watch. But at ~${eq}% you were a big dog going in — you would need that to come in roughly 1 in ${Math.round(100 / Math.max(eq, 1))} times just to break even on a call. Most of the time it does not, and you lose the chips. You played it right.${oppCtx}", "zh": "${handPrefix}你弃牌后那个 ${hitWhat} 中了。看着确实心疼。但在 ~${eq}% 胜率时你当时是大落后——你需要大约 ${Math.round(10 是边缘牌。", "kind": "sentence"}, {"line": 10387, "zline": 10389, "decl": "interpretOpponentLine", "en": "Aggressor checked — could be anything from a draw brick to a trap${changeSuffix}.", "zh": "进攻者过牌——可能是从听牌落空到陷阱的任何情况${changeSuffix}。", "kind": "sentence"}, {"line": 10388, "zline": 10390, "decl": "interpretOpponentLine", "en": "Maniac went quiet — draw bricked or setting a trap${changeSuffix}. Don't assume weakness.", "zh": "疯子安静了——听牌落空或设陷阱${changeSuffix}。别以为是示弱。", "kind": "sentence"}, {"line": 10392, "zline": 10394, "decl": "interpretOpponentLine", "en": "Bet then checked — possible draw brick or slowing down${changeSuffix}.", "zh": "下注然后过牌——可能是听牌落空或减速${changeSuffix}。", "kind": "sentence"}, {"line": 10393, "zline": 10395, "decl": "interpretOpponentLine", "en": "Bet and then went quiet — draw bricked or doesn't like the board${changeSuffix}.", "zh": "下注然后安静了——听牌落空或不适应牌面${changeSuffix}。", "kind": "sentence"}, {"line": 10400, "zline": 10402, "decl": "interpretOpponentLine", "en": "Triple aggression from a tight player — this is almost always the nuts.", "zh": "紧手三重进攻——这几乎总是坚果牌。", "kind": "sentence"}, {"line": 10401, "zline": 10403, "decl": "interpretOpponentLine", "en": "Nit is firing on all cylinders — they almost never do this without the goods.", "zh": "Nit 火力全开——没有真牌他们几乎从不这样做。", "kind": "sentence"}, {"line": 10406, "zline": 10408, "decl": "interpretOpponentLine", "en": "Polarised line — could be a full bluff or a monster. Wide range here.", "zh": "极化线路——可能是纯诈唬或怪兽牌。范围很宽。", "kind": "sentence"}, {"line": 10407, "zline": 10409, "decl": "interpretOpponentLine", "en": "Could be air, could be the stone nuts — Maniacs run this line both ways.", "zh": "可能是空气，可能是坚果——疯子两种可能都有。", "kind": "sentence"}, {"line": 10411, "zline": 10413, "decl": "interpretOpponentLine", "en": "Three streets of aggression — strong hand or polarised bluff.", "zh": "三条街的进攻——强牌或极化诈唬。", "kind": "sentence"}, {"line": 10412, "zline": 10414, "decl": "interpretOpponentLine", "en": "Three barrels — either they've got it or they're committed to the bluff.", "zh": "三枪——要么他们有牌，要么他们诈唬到底了。", "kind": "sentence"}, {"line": 10419, "zline": 10421, "decl": "interpretOpponentLine", "en": "Checked flop then bet turn — likely a slow-played strong hand.", "zh": "过牌翻牌然后下注转牌——可能是慢打的强牌。", "kind": "sentence"}, {"line": 10420, "zline": 10422, "decl": "interpretOpponentLine", "en": "Nit skipped the flop and came out firing — classic trap. Be careful.", "zh": "Nit 跳过了翻牌然后开火——经典陷阱。小心。", "kind": "sentence"}, {"line": 10424, "zline": 10426, "decl": "interpretOpponentLine", "en": "Checked flop, betting now — potential trap or a delayed c-bet.", "zh": "过牌了翻牌，现在下注——可能是陷阱或延迟 c-bet。", "kind": "sentence"}, {"line": 10425, "zline": 10427, "decl": "interpretOpponentLine", "en": "Skipped the flop bet, now pulling the trigger — could be a trap or a delayed c-bet.", "zh": "跳过了翻牌下注，现在扣动扳机——可能是陷阱或延迟 c-bet。", "kind": "sentence"}, {"line": 10432, "zline": 10434, "decl": "interpretOpponentLine", "en": "Passive caller now betting — likely hit something or has a strong draw.", "zh": "被动的跟注者现在下注了——可能中了什么或有强听牌。", "kind": "sentence"}, {"line": 10433, "zline": 10435, "decl": "interpretOpponentLine", "en": "The calling station woke up — they hit something or have a big draw. Take it seriously.", "zh": "跟注站醒了——他们中了什么或有个大听牌。认真对待。", "kind": "sentence"}, {"line": 10437, "zline": 10439, "decl": "interpretOpponentLine", "en": "Called flop, now betting — floated with position or has a strong draw.", "zh": "跟了翻牌，现在下注——有位置 float 了或有强听牌。", "kind": "sentence"}, {"line": 10438, "zline": 10440, "decl": "interpretOpponentLine", "en": "Called the flop, now betting — float play or a strong draw getting aggressive.", "zh": "跟了翻牌，现在下注——float 打法或强听牌变激进了。", "kind": "sentence"}, {"line": 10444, "zline": 10446, "decl": "interpretOpponentLine", "en": "Called two streets, now raising — classic slowplay or just rivered a hand.", "zh": "跟了两条街，现在加注——经典慢打或刚在河牌成牌。", "kind": "sentence"}, {"line": 10445, "zline": 10447, "decl": "interpretOpponentLine", "en": "Two streets of calls and now a raise — slowplay or rivered something big. Danger signal.", "zh": "两条街跟注现在加注——慢打或在河牌中了大的。危险信号。", "kind": "sentence"}, {"line": 10452, "zline": 10454, "decl": "interpretOpponentLine", "en": "Donk betting multiple streets — usually a strong made hand on this profile.", "zh": "多条街 donk 下注——这种玩家通常有强成牌。", "kind": "sentence"}, {"line": 10453, "zline": 10455, "decl": "interpretOpponentLine", "en": "Fish leading into you twice — they've got something real. Don't bluff them off it.", "zh": "鱼领先下注两次——他们真有牌。别诈唬他们弃牌。", "kind": "sentence"}, {"line": 10457, "zline": 10459, "decl": "interpretOpponentLine", "en": "Donk betting multiple streets — strong made hand or a stubborn draw.", "zh": "多条街 donk 下注——强成牌或顽固听牌。", "kind": "sentence"}, {"line": 10458, "zline": 10460, "decl": "interpretOpponentLine", "en": "Donk-betting twice — strong hand or a draw that won't quit.", "zh": "两次 donk 下注——强牌或不放弃的听牌。", "kind": "sentence"}, {"line": 10465, "zline": 10467, "decl": "interpretOpponentLine", "en": "Preflop raiser went completely passive — almost certainly gave up.", "zh": "翻前加注者完全变被动了——几乎肯定放弃了。", "kind": "sentence"}, {"line": 10466, "zline": 10468, "decl": "interpretOpponentLine", "en": "Nit raised preflop and did nothing after — they gave up. Board missed them.", "zh": "Nit 翻前加注然后啥也没做——他们放弃了。牌面没中他们。", "kind": "sentence"}, {"line": 10470, "zline": 10472, "decl": "interpretOpponentLine", "en": "Preflop aggressor went passive — likely gave up or is holding a weak hand.", "zh": "翻前进攻者变被动——可能放弃了或拿着弱牌。", "kind": "sentence"}, {"line": 10471, "zline": 10473, "decl": "interpretOpponentLine", "en": "Raised preflop then checked twice — probably gave up. Weak range.", "zh": "翻前加注然后过牌两次——可能放弃了。弱范围。", "kind": "sentence"}, {"line": 10478, "zline": 10480, "decl": "interpretOpponentLine", "en": "Tight player c-bet the flop — likely has top pair or better.", "zh": "紧手玩家 c-bet 翻牌——可能有顶对或更好。", "kind": "sentence"}, {"line": 10479, "zline": 10481, "decl": "interpretOpponentLine", "en": "Nit raised preflop and fired the flop — they usually have something real.", "zh": "Nit 翻前加注并在翻牌开火——他们通常有点东西。", "kind": "sentence"}, {"line": 10482, "zline": 10484, "decl": "interpretOpponentLine", "en": "Aggressor c-bet — could be air or strong. Wide range on the flop.", "zh": "进攻者 c-bet——可能是空气或强牌。翻牌范围很宽。", "kind": "sentence"}, {"line": 10483, "zline": 10485, "decl": "interpretOpponentLine", "en": "Maniac c-bet — could be anything. Wait for the turn before reading too deep.", "zh": "疯子 c-bet——可能是任何东西。等转牌再看太深。", "kind": "sentence"}, {"line": 10486, "zline": 10488, "decl": "interpretOpponentLine", "en": "Raised preflop and bet the flop — standard c-bet range, wide possibilities.", "zh": "翻前加注并在翻牌下注——标准 c-bet 范围，可能性很广。", "kind": "sentence"}, {"line": 10487, "zline": 10489, "decl": "interpretOpponentLine", "en": "Raised and bet the flop — c-bet range, could be strong or just protecting.", "zh": "加注并下注翻牌——c-bet 范围，可能是强牌或只是保护。", "kind": "sentence"}, {"line": 10493, "zline": 10495, "decl": "interpretOpponentLine", "en": "Preflop raiser skipped the c-bet — likely missed the flop.", "zh": "翻前加注者跳过了 c-bet——可能没中翻牌。", "kind": "sentence"}, {"line": 10494, "zline": 10496, "decl": "interpretOpponentLine", "en": "Nit raised preflop but checked the flop — board probably missed them.", "zh": "Nit 翻前加注但过牌翻牌——牌面可能没中他们。", "kind": "sentence"}, {"line": 10497, "zline": 10499, "decl": "interpretOpponentLine", "en": "Preflop raiser checked the flop — missed their c-bet spot or slowing down.", "zh": "翻前加注者过牌了翻牌——错过了 c-bet 机会或放慢了。", "kind": "sentence"}, {"line": 10498, "zline": 10500, "decl": "interpretOpponentLine", "en": "Raised then went quiet on the flop — missed or decided to trap. Play carefully.", "zh": "加注后在翻牌安静了——没中或决定设陷阱。小心打。", "kind": "sentence"}, {"line": 10504, "zline": 10506, "decl": "interpretOpponentLine", "en": "Preflop caller leading out — likely hit the flop or has a draw.", "zh": "翻前跟注者领打——可能中了翻牌或有听牌。", "kind": "sentence"}, {"line": 10505, "zline": 10507, "decl": "interpretOpponentLine", "en": "Fish led into the flop — they hit something or have a draw they like.", "zh": "鱼领打翻牌——他们中了什么或有个他们喜欢的听牌。", "kind": "sentence"}, {"line": 10508, "zline": 10510, "decl": "interpretOpponentLine", "en": "Preflop caller donk-betting the flop — could be a strong hit or a blocking bet.", "zh": "翻前跟注者 donk 下注翻牌——可能是强力击中或阻挡下注。", "kind": "sentence"}, {"line": 10509, "zline": 10511, "decl": "interpretOpponentLine", "en": "Called preflop and came out betting — hit the flop or making a blocking bet.", "zh": "翻前跟注然后出来下注——中了翻牌或做阻挡下注。", "kind": "sentence"}, {"line": 10515, "zline": 10517, "decl": "interpretOpponentLine", "en": "Preflop caller checked the flop — passive so far, range is wide.", "zh": "翻前跟注者过牌了翻牌——目前被动，范围很宽。", "kind": "sentence"}, {"line": 10516, "zline": 10518, "decl": "interpretOpponentLine", "en": "Called preflop, checked the flop — passive, could be anything from a draw to a trap.", "zh": "翻前跟注，过牌翻牌——被动，可能从听牌到陷阱都有可能。", "kind": "sentence"}, {"line": 10522, "zline": 10524, "decl": "interpretOpponentLine", "en": "Called preflop and flop — passive caller, probably has a pair or a draw they won't let go.", "zh": "翻前和翻牌都跟注——被动跟注者，可能有一对或他们不放手的听牌。", "kind": "sentence"}, {"line": 10523, "zline": 10525, "decl": "interpretOpponentLine", "en": "Called twice and still in — fish with a draw or a made hand they're married to.", "zh": "跟注两次还在——鱼有听牌或他们不肯放手的成牌。", "kind": "sentence"}, {"line": 10526, "zline": 10528, "decl": "interpretOpponentLine", "en": "Called two streets without raising — could be a draw, a medium made hand, or a slowplay.", "zh": "两条街跟注没有加注——可能是听牌、中等成牌或慢打。", "kind": "sentence"}, {"line": 10527, "zline": 10529, "decl": "interpretOpponentLine", "en": "Two streets of calling — range is wide here, could be drawing or slow-playing.", "zh": "两条街跟注——范围很宽，可能是听牌或慢打。", "kind": "sentence"}, {"line": 10533, "zline": 10535, "decl": "interpretOpponentLine", "en": "Tight player raised the flop after calling preflop — strong hand or a big draw.", "zh": "紧手玩家翻前跟注后在翻牌加注——强牌或大听牌。", "kind": "sentence"}, {"line": 10534, "zline": 10536, "decl": "interpretOpponentLine", "en": "Nit check-raised — they almost never do this without a real hand.", "zh": "Nit check-raise——没有真牌他们几乎从不这样。", "kind": "sentence"}, {"line": 10537, "zline": 10539, "decl": "interpretOpponentLine", "en": "Called preflop then raised the flop — connected hard or semi-bluffing a big draw.", "zh": "翻前跟注然后在翻牌加注——强连接或半诈唬大听牌。", "kind": "sentence"}, {"line": 10538, "zline": 10540, "decl": "interpretOpponentLine", "en": "Flat called then raised the flop — hit the board hard or has a strong draw.", "zh": "平跟然后在翻牌加注——中了牌面或有大听牌。", "kind": "sentence"}, {"line": 10544, "zline": 10546, "decl": "interpretOpponentLine", "en": "Preflop raiser just called the flop — likely has a strong hand slow-playing or a draw.", "zh": "翻前加注者只是在翻牌跟注——可能是慢打强牌或有听牌。", "kind": "sentence"}, {"line": 10545, "zline": 10547, "decl": "interpretOpponentLine", "en": "Nit raised then just called — slowplay or picked up a draw. Watch the turn.", "zh": "Nit 加注然后只是跟注——慢打或抓了个听牌。注意转牌。", "kind": "sentence"}, {"line": 10548, "zline": 10550, "decl": "interpretOpponentLine", "en": "Preflop raiser called the flop bet — range includes strong made hands and draws.", "zh": "翻前加注者跟了翻牌下注——范围包括强成牌和听牌。", "kind": "sentence"}, {"line": 10549, "zline": 10551, "decl": "interpretOpponentLine", "en": "Raised preflop then just called — range is wide, but don't rule out a trap.", "zh": "翻前加注然后只是跟注——范围宽，但别排除陷阱。", "kind": "sentence"}, {"line": 10555, "zline": 10557, "decl": "interpretOpponentLine", "en": "Raised preflop and raised again on the flop — very tight player with two streets of aggression usually has it.", "zh": "翻前加注并在翻牌再次加注——非常紧的玩家两条街的进攻通常有牌。", "kind": "sentence"}, {"line": 10556, "zline": 10558, "decl": "interpretOpponentLine", "en": "Nit is raising twice — almost certainly the nuts or top set.", "zh": "Nit 加注两次——几乎肯定是 nuts 或顶三条。", "kind": "sentence"}, {"line": 10559, "zline": 10561, "decl": "interpretOpponentLine", "en": "Two raises on different streets — polarised, strong hand or a committed bluff.", "zh": "不同街两次加注——极化，强牌或执着的诈唬。", "kind": "sentence"}, {"line": 10560, "zline": 10562, "decl": "interpretOpponentLine", "en": "Raised twice — either they've got a monster or they're committed to the bluff.", "zh": "加注两次——要么他们有怪兽牌，要么他们诈唬到底了。", "kind": "sentence"}, {"line": 10566, "zline": 10568, "decl": "interpretOpponentLine", "en": "Raised preflop, called flop, now betting — delayed aggression, often a strong draw or slow-played hand.", "zh": "翻前加注，跟注翻牌，现在下注——延迟进攻，通常是强听牌或慢打的牌。", "kind": "sentence"}, {"line": 10567, "zline": 10569, "decl": "interpretOpponentLine", "en": "Raised then called, now coming out — delayed c-bet or they've got a hand now.", "zh": "加注然后跟注，现在出来——延迟 c-bet 或他们现在有牌了。", "kind": "sentence"}, {"line": 10573, "zline": 10575, "decl": "interpretOpponentLine", "en": "Preflop raiser called flop and checked turn — tight player going passive, likely gave up or has a marginal hand.", "zh": "翻前加注者跟了翻牌并过牌转牌——紧手变被动，可能放弃了或边缘牌。", "kind": "sentence"}, {"line": 10574, "zline": 10576, "decl": "interpretOpponentLine", "en": "Nit raised, called, then went quiet — probably gave up. Board hit you harder.", "zh": "Nit 加注、跟注、然后安静了——可能放弃了。牌面对你打击更狠。", "kind": "sentence"}, {"line": 10577, "zline": 10579, "decl": "interpretOpponentLine", "en": "Raised preflop, called flop, checked turn — passive line, could be pot control or giving up.", "zh": "翻前加注，跟注翻牌，过牌转牌——被动线路，可能是底池控制或放弃。", "kind": "sentence"}, {"line": 10578, "zline": 10580, "decl": "interpretOpponentLine", "en": "Raised then went passive on the turn — pot control or they're done with the hand.", "zh": "加注后在转牌变被动——底池控制或他们和这手牌没关系了。", "kind": "sentence"}, {"line": 10584, "zline": 10586, "decl": "interpretOpponentLine", "en": "Raised preflop, called flop, now raising — classic slow-play finally showing up. Strong range.", "zh": "翻前加注，跟注翻牌，现在加注——经典慢打终于现身了。强范围。", "kind": "sentence"}, {"line": 10585, "zline": 10587, "decl": "interpretOpponentLine", "en": "Raised preflop, called flop, now raising — they were slow-playing. Strong hand.", "zh": "翻前加注，跟注翻牌，现在加注——他们在慢打。强牌。", "kind": "sentence"}, {"line": 10591, "zline": 10593, "decl": "interpretOpponentLine", "en": "Passive caller woke up on the turn — hit the board or has a strong draw they're done slow-playing.", "zh": "被动跟注者在转牌醒了——中了牌面或有强听牌不再慢打了。", "kind": "sentence"}, {"line": 10592, "zline": 10594, "decl": "interpretOpponentLine", "en": "Fish called twice and now leads out — hit something real. Take it seriously.", "zh": "鱼跟了两次现在领打——中了真的东西。认真对待。", "kind": "sentence"}, {"line": 10595, "zline": 10597, "decl": "interpretOpponentLine", "en": "Called two streets, now leading out — often a made hand that improved, or a draw with enough equity to bet.", "zh": "跟了两条街，现在领打——通常是提升了的成牌，或有足够 equity 下注的听牌。", "kind": "sentence"}, {"line": 10596, "zline": 10598, "decl": "interpretOpponentLine", "en": "Called twice then bet — either improved or done waiting. Range is strong here.", "zh": "跟了两次然后下注——要么提升了要么等够了。这里范围很强。", "kind": "sentence"}, {"line": 10602, "zline": 10604, "decl": "interpretOpponentLine", "en": "Three streets of passive play — medium made hand or a draw that bricked. Vulnerable to a bet.", "zh": "三条街被动打法——中等成牌或没中的听牌。容易受到下注攻击。", "kind": "sentence"}, {"line": 10603, "zline": 10605, "decl": "interpretOpponentLine", "en": "Called twice and now checks — passive all the way, probably weak or a missed draw.", "zh": "跟了两次现在过牌——一直被动，可能是弱牌或没中的听牌。", "kind": "sentence"}, {"line": 10609, "zline": 10611, "decl": "interpretOpponentLine", "en": "Checked preflop then bet two streets — aggressive player building a pot, wide range.", "zh": "过牌翻前然后在两条街下注——进攻型玩家在造池，范围宽。", "kind": "sentence"}, {"line": 10610, "zline": 10612, "decl": "interpretOpponentLine", "en": "Checked then fired twice — could be strong or a standard aggression pattern for them.", "zh": "过牌然后开火两次——可能是强牌或对他们来说的标准进攻模式。", "kind": "sentence"}, {"line": 10613, "zline": 10615, "decl": "interpretOpponentLine", "en": "Checked preflop but bet flop and turn — connected with the board, likely a strong made hand or draw.", "zh": "过牌翻前但下注翻牌和转牌——连接了牌面，可能是强成牌或听牌。", "kind": "sentence"}, {"line": 10614, "zline": 10616, "decl": "interpretOpponentLine", "en": "Checked then came out firing twice — hit the board hard or has a big draw.", "zh": "过牌然后出来开火两次——中了牌面或有大听牌。", "kind": "sentence"}, {"line": 10620, "zline": 10622, "decl": "interpretOpponentLine", "en": "Checked twice, now betting — tight player waking up on the river usually means a real hand.", "zh": "过牌了两次，现在下注——紧手在河牌醒来通常意味着真有牌。", "kind": "sentence"}, {"line": 10621, "zline": 10623, "decl": "interpretOpponentLine", "en": "Nit went quiet for two streets then bet — slow-play or just hit the river. Be careful.", "zh": "Nit 安静了两条街然后下注——慢打或刚在河牌中了。小心。", "kind": "sentence"}, {"line": 10624, "zline": 10626, "decl": "interpretOpponentLine", "en": "Two checks then a bet — could be a slow-play that paid off, or a weak stab after showing passivity.", "zh": "两次过牌然后下注——可能是慢打兑现了，或展示被动后的软弱一刺。", "kind": "sentence"}, {"line": 10625, "zline": 10627, "decl": "interpretOpponentLine", "en": "Checked twice then bet — possible slow-play or a desperation stab. Read the river card.", "zh": "过牌两次然后下注——可能的慢打或绝望一刺。看河牌是什么。", "kind": "sentence"}, {"line": 10631, "zline": 10633, "decl": "interpretOpponentLine", "en": "Checked then raised — tight player check-raising is almost always a strong hand.", "zh": "过牌然后加注——紧手 check-raise 几乎总是强牌。", "kind": "sentence"}, {"line": 10632, "zline": 10634, "decl": "interpretOpponentLine", "en": "Nit check-raised — that's a monster. Fold everything marginal.", "zh": "Nit check-raise 了——那是怪兽牌。弃掉所有边缘牌。", "kind": "sentence"}, {"line": 10635, "zline": 10637, "decl": "interpretOpponentLine", "en": "Check-raised — strong hand or a semi-bluff with a big draw.", "zh": "Check-raise 了——强牌或有大听牌的半诈唬。", "kind": "sentence"}, {"line": 10636, "zline": 10638, "decl": "interpretOpponentLine", "en": "Check-raised — could be a big hand or a semi-bluff. Either way, their range is strong.", "zh": "Check-raise 了——可能是大牌或半诈唬。无论如何，他们的范围很强。", "kind": "sentence"}, {"line": 10642, "zline": 10644, "decl": "interpretOpponentLine", "en": "Checked then called — passive line, range is wide from a draw to a slow-played hand.", "zh": "过牌然后跟注——被动线路，范围很宽，从听牌到慢打的牌都有可能。", "kind": "sentence"}, {"line": 10643, "zline": 10645, "decl": "interpretOpponentLine", "en": "Checked then called — could be a draw, pot control, or setting a trap.", "zh": "过牌然后跟注——可能是听牌、底池控制或设陷阱。", "kind": "sentence"}, {"line": 10649, "zline": 10651, "decl": "interpretOpponentLine", "en": "Passive both streets — weak hand or a slow-play. Safe to bet for value or to bluff.", "zh": "两条街都被动——弱牌或慢打。安全的价值下注或诈唬。", "kind": "sentence"}, {"line": 10650, "zline": 10652, "decl": "interpretOpponentLine", "en": "Checked twice — likely weak or hoping someone else bets for them.", "zh": "过了两次牌——很可能是弱牌或希望别人为他们下注。", "kind": "sentence"}, {"line": 10656, "zline": 10658, "decl": "interpretOpponentLine", "en": "Raised preflop, bet flop, now raising — very strong range or a total bluff. High-stakes spot.", "zh": "翻前加注，翻牌下注，现在再加注——非常强的范围或完全诈唬。高 stakes 局面。", "kind": "sentence"}, {"line": 10657, "zline": 10659, "decl": "interpretOpponentLine", "en": "Three streets of escalating aggression — they've got the nuts or they're committed to the story.", "zh": "三条街不断升级的进攻——他们有坚果牌或完全投入了故事情节。", "kind": "sentence"}, {"line": 10663, "zline": 10665, "decl": "interpretOpponentLine", "en": "Tight player with two raises and a bet — almost certainly the nuts.", "zh": "紧手玩家两次加注并下注——几乎肯定是坚果牌。", "kind": "sentence"}, {"line": 10664, "zline": 10666, "decl": "interpretOpponentLine", "en": "Nit raised twice and now bets — just fold unless you have the stone nuts.", "zh": "Nit 加注两次现在下注——除非你有坚不可摧的坚果牌，否则就弃牌。", "kind": "sentence"}, {"line": 10667, "zline": 10669, "decl": "interpretOpponentLine", "en": "Raised flop, raised again, now betting — extremely strong range or polarised bluff.", "zh": "翻牌加注，再次加注，现在下注——极其强的范围或极化诈唬。", "kind": "sentence"}, {"line": 10668, "zline": 10670, "decl": "interpretOpponentLine", "en": "Two raises then a bet — big hand or total bluff. Nothing in between.", "zh": "两次加注然后下注——大牌或完全诈唬。没有中间地带。", "kind": "sentence"}, {"line": 10674, "zline": 10676, "decl": "interpretOpponentLine", "en": "Donk-bet the flop then checked turn — could have been a blocking bet or a draw that lost confidence.", "zh": "翻牌 donk 下注然后转牌过牌——可能是阻挡下注或失去信心的听牌。", "kind": "sentence"}, {"line": 10675, "zline": 10677, "decl": "interpretOpponentLine", "en": "Led the flop then went quiet — blocking bet or a draw they don't want to over-commit with.", "zh": "领打翻牌然后安静了——阻挡下注或不想过度投入的听牌。", "kind": "sentence"}, {"line": 10681, "zline": 10683, "decl": "interpretOpponentLine", "en": "Called preflop, raised flop, now betting — strong hand building the pot aggressively.", "zh": "翻前跟注，翻牌加注，现在下注——强牌在激进地建造底池。", "kind": "sentence"}, {"line": 10682, "zline": 10684, "decl": "interpretOpponentLine", "en": "Raised the flop and kept firing — strong hand or a very committed bluff.", "zh": "加注了翻牌并继续开火——强牌或非常坚定的诈唬。", "kind": "sentence"}, {"line": 10988, "zline": 10990, "decl": "facingRaise", "en": "SESSION FOCUS: Two leaks compounding here — you play too many hands (${Math.round(dm.vpip * 100)}% VPIP) AND call raises too wide (${Math.round(dm.gap * 100)}% gap). This exact spot is where your chips leak. → FOLD.", "zh": "本局重点：两个漏洞在这里叠加——你玩太多牌了（${Math.round(dm.vpip * 100)}% VPIP）并且跟注加注太宽（${Math.round(dm.gap * 100)}% gap）。这个局面正是你的筹码流失的地方。→ 弃牌。", "kind": "sentence"}, {"line": 10989, "zline": 10991, "decl": "facingRaise", "en": "SESSION FOCUS: Two leaks bleeding you out right here — your VPIP is ${Math.round(dm.vpip * 100)}% which means you play every hand like a sucker, AND you call raises too wide (${Math.round(dm.gap * 100)}% gap). This exact spot is where your money walks out the door. → FOLD.", "zh": "本局重点：两个漏洞就在这里让你流血——你的 VPIP 是 ${Math.round(dm.vpip * 100)}%，意味着你像个傻瓜一样每手牌都玩，而且你跟注加注太宽（${Math.round(dm.gap * 100)}% gap）。这个局面正是你的钱出门的地方。→ 弃牌。", "kind": "sentence"}, {"line": 10994, "zline": 10996, "decl": "facingRaise", "en": "Your VPIP is ${Math.round(dm.vpip * 100)}% — you're playing too many hands. This weak hand is exactly the kind you need to stop entering pots with. → FOLD.", "zh": "你的 VPIP 是 ${Math.round(dm.vpip * 100)}%——你玩太多牌了。这手弱牌正是你需要停止入池的那种。→ 弃牌。", "kind": "sentence"}, {"line": 10995, "zline": 10997, "decl": "facingRaise", "en": "Your VPIP is ${Math.round(dm.vpip * 100)}%? You're playing every hand like a sucker. This garbage right here is exactly what's bleeding you. → FOLD.", "zh": "你的 VPIP 是 ${Math.round(dm.vpip * 100)}%？你像个傻瓜一样每手牌都玩。这里的垃圾正是让你流血的东西。→ 弃牌。", "kind": "sentence"}, {"line": 11000, "zline": 11002, "decl": "facingRaise", "en": "You call raises too wide (${Math.round(dm.gap * 100)}% gap). Folding this to a raise is the right discipline. → FOLD.", "zh": "你跟注加注太宽（${Math.round(dm.gap * 100)}% gap）。在面对加注时弃掉这个是正确的纪律。→ 弃牌。", "kind": "sentence"}, {"line": 11001, "zline": 11003, "decl": "facingRaise", "en": "You call raises too wide — ${Math.round(dm.gap * 100)}% gap is embarrassing, kid. This is exactly where you stop. → FOLD.", "zh": "你跟注加注太宽——${Math.round(dm.gap * 100)}% 的 gap 很丢人，小子。这正是你需要止步的地方。→ 弃牌。", "kind": "sentence"}, {"line": 11006, "zline": 11008, "decl": "facingRaise", "en": "You have a strong hand but your PFR is only ${Math.round(dm.pfr * 100)}% — you under-raise significantly. This is the spot to change that. → RAISE.", "zh": "你有一手强牌但你的 PFR 只有 ${Math.round(dm.pfr * 100)}%——你明显加注不足。这就是改变它的局面。→ 加注。", "kind": "sentence"}, {"line": 11007, "zline": 11009, "decl": "facingRaise", "en": "You got a strong hand but you only raise ${Math.round(dm.pfr * 100)}% of the time preflop? You limp around like you got nothing. This is the spot to grow a spine. → RAISE.", "zh": "你有一手强牌但你翻牌前只有 ${Math.round(dm.pfr * 100)}% 的时候加注？你像个没牌的人一样平跟。这是你该挺起脊梁的局面。→ 加注。", "kind": "sentence"}, {"line": 11017, "zline": 11019, "decl": "facingRaise", "en": "fold to flop bets too often (${Math.round(dm.foldVsFlopBet * 100)}%)", "zh": "在翻牌圈弃牌太多了 (${Math.round(dm.foldVsFlopBet * 100)}%)", "kind": "sentence"}, {"line": 11019, "zline": 11021, "decl": "facingRaise", "en": "play too many hands (${Math.round(dm.vpip * 100)}% VPIP, target: ~35%)", "zh": "玩太多牌 (${Math.round(dm.vpip * 100)}% VPIP, 目标: ~35%)", "kind": "sentence"}, {"line": 11023, "zline": 11025, "decl": "facingRaise", "en": "limp too much (PFR ${Math.round(dm.pfr * 100)}% vs VPIP ${Math.round(dm.vpip * 100)}%) — limping signals weakness and kills your initiative", "zh": "limp太多 (PFR ${Math.round(dm.pfr * 100)}% vs VPIP ${Math.round(dm.vpip * 100)}%) — 溜入等于示弱，还会断送你的主动权", "kind": "sentence"}, {"line": 11025, "zline": 11027, "decl": "facingRaise", "en": "enter pots but rarely bet or raise (AFq ${Math.round(dm.afq * 100)}%) — you're a calling station", "zh": "进池了却很少下注或加注 (AFq ${Math.round(dm.afq * 100)}%) — 你是跟注站", "kind": "sentence"}, {"line": 11027, "zline": 11029, "decl": "facingRaise", "en": "your play has shifted looser recently — possible tilt", "zh": "最近的打法变松了 — 可能上头了", "kind": "sentence"}, {"line": 11034, "zline": 11036, "decl": "facingRaise", "en": "${count} of ${total} opponents here are weak players. Skip the balancing act — value bet relentlessly and cut your bluffs.", "zh": "这里有 ${count}/${total} 的对手是弱玩家。省去平衡的功夫——无情价值下注并减少诈唬。", "kind": "sentence"}, {"line": 11035, "zline": 11037, "decl": "facingRaise", "en": "${count} of ${total} players at this table are fish, kid. Forget balance — bet your made hands hard every street and stop bluffing. They'll pay you off.", "zh": "这桌 ${count}/${total} 的玩家是鱼，小子。忘掉平衡——每条街狠狠地用成牌下注，停止诈唬。他们会给你付钱的。", "kind": "sentence"}, {"line": 11038, "zline": 11040, "decl": "facingRaise", "en": "Nano", "zh": "微型", "kind": "term"}, {"line": 11038, "zline": 11040, "decl": "facingRaise", "en": "Low", "zh": "低", "kind": "term"}, {"line": 11039, "zline": 11041, "decl": "facingRaise", "en": "You're at a ${currentStakeTier} stakes table. Most opponents here make systematic mistakes — exploit them, don't try to balance. Value bet more, bluff less.", "zh": "你在 ${currentStakeTier} 级别桌。这里的大多数对手都会犯系统性错误——利用他们，别试图平衡。更多价值下注，更少诈唬。", "kind": "sentence"}, {"line": 11040, "zline": 11042, "decl": "facingRaise", "en": "${currentStakeTier} stakes, kid. These players make the same mistakes every hand — exploit them hard. More value bets, fewer bluffs. GTO is for players you'll never meet here.", "zh": "${currentStakeTier} 级别，小子。这些玩家每手牌都犯同样的错误——狠狠利用他们。更多价值下注，更少诈唬。GTO 是给你永远不会在这里遇到的玩家准备的。", "kind": "sentence"}, {"line": 11051, "zline": 11053, "decl": "facingRaise", "en": "You ${l.msg}. Opponents can exploit this by bluffing any flop. If you have any piece, hold on.", "zh": "你 ${l.msg}。对手可以通过在任何翻牌诈唬来利用这一点。如果你有任何牌面连接，坚持住。", "kind": "sentence"}, {"line": 11052, "zline": 11054, "decl": "facingRaise", "en": "You ${l.msg}. Every player at this table knows they can bluff any flop and you'll fold. If you got any piece of that board, hold on and make em prove it.", "zh": "你 ${l.msg}。这桌每个玩家都知道他们可以在任何翻牌诈唬而你会弃牌。如果你和牌面有任何关系，坚持住让他们证明给你看。", "kind": "sentence"}, {"line": 11055, "zline": 11057, "decl": "facingRaise", "en": "You ${l.msg}. More hands means more spots where you're out of position with weak holdings. Pick your spots.", "zh": "你 ${l.msg}。更多的牌意味着更多你处于没位置且持有弱牌的局面。选择好你的时机。", "kind": "sentence"}, {"line": 11056, "zline": 11058, "decl": "facingRaise", "en": "You ${l.msg}. Playing every hand like a tourist means you're always out of position with garbage. Pick your spots or keep losing.", "zh": "你 ${l.msg}。像个游客一样每手牌都玩意味着你总是没位置拿着垃圾。选好时机，否则继续输。", "kind": "sentence"}, {"line": 11059, "zline": 11061, "decl": "facingRaise", "en": "You ${l.msg}. When someone raises, 3-bet or fold. Flat-calling wide is the worst of both worlds.", "zh": "你 ${l.msg}。当有人加注时，3-bet 或弃牌。宽范围平跟是最糟糕的选择。", "kind": "sentence"}, {"line": 11060, "zline": 11062, "decl": "facingRaise", "en": "You ${l.msg}. Someone raises, you 3-bet or you fold — flat-calling wide is the worst of both worlds and Duke knows it.", "zh": "你 ${l.msg}。有人加注，你就 3-bet 或弃牌——宽范围平跟是两世界之糟，Duke 知道这点。", "kind": "sentence"}, {"line": 11063, "zline": 11065, "decl": "facingRaise", "en": "You ${l.msg}. Raise or fold preflop — limping funds the blinds and builds pots where you're at a disadvantage.", "zh": "你 ${l.msg}。翻牌前加注或弃牌——平跟是在资助盲注并建造对你处于劣势的底池。", "kind": "sentence"}, {"line": 11064, "zline": 11066, "decl": "facingRaise", "en": "You ${l.msg}. Raise or fold — limping is funding everyone else's blinds and building pots where you're already behind, kid.", "zh": "你 ${l.msg}。加注或弃牌——平跟是在给所有人的盲注买单，并建造你本来就落后的底池，小子。", "kind": "sentence"}, {"line": 11067, "zline": 11069, "decl": "facingRaise", "en": "You ${l.msg}. Take the initiative — bet your made hands, bluff your equity draws, don't just call and hope.", "zh": "你 ${l.msg}。主动出击——用成牌下注，用有胜率的听牌诈唬，别只是跟注和祈祷。", "kind": "sentence"}, {"line": 11068, "zline": 11070, "decl": "facingRaise", "en": "You ${l.msg}. Take the initiative — bet your made hands, push your draws, stop calling and hoping like a sucker.", "zh": "你 ${l.msg}。主动出击——用成牌下注，推进你的听牌，别再像个傻子一样跟注和祈祷了。", "kind": "sentence"}, {"line": 11071, "zline": 11073, "decl": "facingRaise", "en": "Your play has shifted looser than your baseline. You may be on tilt. Slow down and play tighter until you reset.", "zh": "你的打法变得比基线更松了。你可能在上头。慢下来，收紧打法直到你恢复状态。", "kind": "sentence"}, {"line": 11072, "zline": 11074, "decl": "facingRaise", "en": "Your play has gone loose and sloppy compared to your baseline. You're on tilt, pal. Slow the hell down and play tighter until you get your head right.", "zh": "你的打法相比基线变得又松又烂了。你上头了，伙计。他妈的慢下来收紧打法，直到你脑子清醒过来。", "kind": "sentence"}, {"line": 11074, "zline": 11076, "decl": "facingRaise", "en": "Leak: you ${l.msg}.", "zh": "漏洞：你 ${l.msg}。", "kind": "term"}, {"line": 11074, "zline": 11076, "decl": "facingRaise", "en": "Leak, kid: you ${l.msg}. Fix it.", "zh": "漏洞，小子：你 ${l.msg}。改掉它。", "kind": "sentence"}, {"line": 11084, "zline": 11086, "decl": "facingRaise", "en": "Two compounding leaks: you play too many hands (${Math.round(dm.vpip * 100)}% VPIP) and then fold to flop bets too often (${Math.round(dm.foldVsFlopBet * 100)}%). You're paying to see flops and giving them away. SESSION FOCUS: stop entering pots with weak hands.", "zh": "两个相互叠加的漏洞：你入池太多（${Math.round(dm.vpip * 100)}% VPIP），然后又太频繁地在翻牌弃牌（${Math.round(dm.foldVsFlopBet * 100)}%）。你在付钱看翻牌然后又还回去。本局重点：别再拿弱牌入池。", "kind": "sentence"}, {"line": 11085, "zline": 11087, "decl": "facingRaise", "en": "Two compounding leaks bleeding you dry: you play too many hands (${Math.round(dm.vpip * 100)}% VPIP — that's embarrassing) and then fold to flop bets ${Math.round(dm.foldVsFlopBet * 100)}% of the time. You're paying to see flops and handing them back. SESSION FOCUS: stop entering pots with garbage.", "zh": "两个相互叠加的漏洞在榨干你：你玩太多牌了（${Math.round(dm.vpip * 100)}% VPIP——这很丢人），然后又在翻牌弃牌 ${Math.round(dm.foldVsFlopBet * 100)}% 的时候。你付钱看翻牌又还回去了。本局重点：别再拿垃圾入池。", "kind": "sentence"}, {"line": 11089, "zline": 11091, "decl": "facingRaise", "en": "Two compounding leaks: you play too many hands (${Math.round(dm.vpip * 100)}% VPIP) and then fold to flop bets too often (${Math.round(dm.foldVsFlopBet * 100)}%). You're paying to see flops and giving them away. SESSION FOCUS: stop entering pots with weak hands.", "zh": "两个相互叠加的漏洞：你入池太多（${Math.round(dm.vpip * 100)}% VPIP），然后又太频繁地在翻牌弃牌（${Math.round(dm.foldVsFlopBet * 100)}%）。你在付钱看翻牌然后又还回去。本局重点：别再拿弱牌入池。", "kind": "sentence"}, {"line": 11090, "zline": 11092, "decl": "facingRaise", "en": "Two leaks, kid, and they're compounding each other: ${Math.round(dm.vpip * 100)}% VPIP means you play everything, then you fold to flop bets ${Math.round(dm.foldVsFlopBet * 100)}% of the time. That's chips in the trash. SESSION FOCUS: stop entering pots with weak hands.", "zh": "两个漏洞，小子，它们还在互相加剧：${Math.round(dm.vpip * 100)}% VPIP 意味着你什么都玩，然后又在翻牌弃牌 ${Math.round(dm.foldVsFlopBet * 100)}% 的时候。那就是往垃圾桶扔筹码。本局重点：别再拿弱牌入池。", "kind": "sentence"}, {"line": 11094, "zline": 11096, "decl": "facingRaise", "en": "You play too wide AND call raises wide — a ${Math.round(dm.vpip * 100)}% VPIP with a ${Math.round(dm.gap * 100)}% gap. You're entering bad pots and compounding it by calling instead of folding. SESSION FOCUS: tighten preflop range, raise or fold facing a raise.", "zh": "你范围太宽并且跟注加注也太宽——${Math.round(dm.vpip * 100)}% VPIP 配合 ${Math.round(dm.gap * 100)}% 的 gap。你在进入坏底池，然后通过跟注而不是弃牌来加剧错误。本局重点：收紧翻牌前范围，面对加注要么加注要么弃牌。", "kind": "sentence"}, {"line": 11095, "zline": 11097, "decl": "facingRaise", "en": "You play too wide AND call raises wide — ${Math.round(dm.vpip * 100)}% VPIP and a ${Math.round(dm.gap * 100)}% gap. You enter bad pots then compound the mistake by calling instead of folding. SESSION FOCUS: tighten up preflop and raise-or-fold facing a raise, pal.", "zh": "你打得太宽并且跟注加注也太宽——${Math.round(dm.vpip * 100)}% VPIP 和 ${Math.round(dm.gap * 100)}% 的 gap。你进入坏底池，然后用跟注而不是弃牌来加剧错误。本局重点：收紧翻牌前范围，面对加注要么加注要么弃牌，伙计。", "kind": "sentence"}, {"line": 11099, "zline": 11101, "decl": "facingRaise", "en": "Tilt detected AND ${second.msg}. Playing emotionally while already leaking is a bad combination. SESSION FOCUS: tighten up, fold marginal spots, reset.", "zh": "检测到上头且 ${second.msg}。情绪化地打牌同时已经存在漏洞是个糟糕的组合。本局重点：收紧，弃掉边缘局面，重置状态。", "kind": "sentence"}, {"line": 11100, "zline": 11102, "decl": "facingRaise", "en": "Tilt detected AND ${second.msg}. Playing on emotion while you're already leaking is a recipe to go broke. SESSION FOCUS: tighten up, fold the marginal spots, and reset before you do something stupid.", "zh": "检测到上头且 ${second.msg}。明明已经有漏洞了还情绪化打牌是破产的配方。本局重点：收紧，弃掉边缘局面，在干蠢事之前重置心态。", "kind": "sentence"}, {"line": 11105, "zline": 11107, "decl": "facingRaise", "en": "${leaks.length} leaks active: ${leaks.slice(0, 2).map(l => l.msg).join(', and you ')}. SESSION FOCUS: ${leaks[0].key === 'vpip_high' || leaks[0].key === 'limp' ? 'tighten preflop' : leaks[0].key === 'fold_flop' ? 'hold on to hands postflop' : 'fix your biggest leak first'}.", "zh": "${leaks.length} : "—— 对手亮出 ${bestOpp.handName}（可能是漏洞）", "kind": "sentence"}, {"line": 11419, "zline": 11421, "decl": "preflopPressure", "en": "(heavy pressure — likely correct fold)", "zh": "（压力很大——弃牌多半没错）", "kind": "sentence"}, {"line": 11424, "zline": 11426, "decl": "preflopPressure", "en": "(${ha.name} is a ${ha.typeLabel.toLowerCase()} — ${ha.afqPct}% AFq${bluffNote} — likely correct fold)", "zh": "（${ha.name} 是${ha.typeLabel}——AFq ${ha.afqPct}%${bluffNote}——弃牌多半没错）", "kind": "sentence"}, {"line": 11668, "zline": 11670, "decl": "describeFoldHandAtStreet", "en": "flush draw", "zh": "同花听牌", "kind": "term"}, {"line": 11669, "zline": 11671, "decl": "describeFoldHandAtStreet", "en": "open-ended straight draw", "zh": "双头顺听牌", "kind": "sentence"}, {"line": 11673, "zline": 11675, "decl": "describeFoldHandAtStreet", "en": "a royal flush", "zh": "皇家同花顺", "kind": "term"}, {"line": 11674, "zline": 11676, "decl": "describeFoldHandAtStreet", "en": "a straight flush", "zh": "同花顺", "kind": "term"}, {"line": 11675, "zline": 11677, "decl": "describeFoldHandAtStreet", "en": "four of a kind", "zh": "四条", "kind": "term"}, {"line": 11676, "zline": 11678, "decl": "describeFoldHandAtStreet", "en": "a full house", "zh": "葫芦", "kind": "term"}, {"line": 11677, "zline": 11679, "decl": "describeFoldHandAtStreet", "en": "a flush with a straight draw", "zh": "同花带顺子听牌", "kind": "sentence"}, {"line": 11677, "zline": 11679, "decl": "describeFoldHandAtStreet", "en": "a flush", "zh": "同花", "kind": "term"}, {"line": 11678, "zline": 11680, "decl": "describeFoldHandAtStreet", "en": "a straight", "zh": "顺子", "kind": "term"}, {"line": 11681, "zline": 11683, "decl": "describeFoldHandAtStreet", "en": "a set", "zh": "三条（口袋对）", "kind": "term"}, {"line": 11681, "zline": 11683, "decl": "describeFoldHandAtStreet", "en": "three of a kind", "zh": "三条", "kind": "term"}, {"line": 11683, "zline": 11685, "decl": "describeFoldHandAtStreet", "en": "two pair with a ${drawStr}", "zh": "两对带 ${drawStr}", "kind": "term"}, {"line": 11683, "zline": 11685, "decl": "describeFoldHandAtStreet", "en": "two pair", "zh": "两对", "kind": "term"}, {"line": 11686, "zline": 11688, "decl": "describeFoldHandAtStreet", "en": "a pocket pair", "zh": "口袋对", "kind": "term"}, {"line": 11691, "zline": 11693, "decl": "describeFoldHandAtStreet", "en": "two overcards and a ${drawStr}", "zh": "两张高牌带 ${drawStr}", "kind": "term"}, {"line": 11691, "zline": 11693, "decl": "describeFoldHandAtStreet", "en": "an overcard and a ${drawStr}", "zh": "一张高牌带 ${drawStr}", "kind": "term"}, {"line": 11692, "zline": 11694, "decl": "describeFoldHandAtStreet", "en": "two overcards", "zh": "两张高牌", "kind": "term"}, {"line": 11693, "zline": 11695, "decl": "describeFoldHandAtStreet", "en": "an overcard", "zh": "一张高牌", "kind": "term"}, {"line": 11697, "zline": 11699, "decl": "describeFoldHandAtStreet", "en": "top pair", "zh": "顶对", "kind": "term"}, {"line": 11698, "zline": 11700, "decl": "describeFoldHandAtStreet", "en": "middle pair", "zh": "中对", "kind": "term"}, {"line": 11699, "zline": 11701, "decl": "describeFoldHandAtStreet", "en": "bottom pair", "zh": "底对", "kind": "term"}, {"line": 11700, "zline": 11702, "decl": "describeFoldHandAtStreet", "en": "${type} with a ${drawStr}", "zh": "${type}带 ${drawStr}", "kind": "term"}, {"line": 11705, "zline": 11707, "decl": "describeFoldHandAtStreet", "en": "two overcards and a ${drawStr}", "zh": "两张高牌带 ${drawStr}", "kind": "term"}, {"line": 11706, "zline": 11708, "decl": "describeFoldHandAtStreet", "en": "an overcard and a ${drawStr}", "zh": "一张高牌带 ${drawStr}", "kind": "term"}, {"line": 11709, "zline": 11711, "decl": "describeFoldHandAtStreet", "en": "two overcards", "zh": "两张高牌", "kind": "term"}, {"line": 11710, "zline": 11712, "decl": "describeFoldHandAtStreet", "en": "an overcard", "zh": "一张高牌", "kind": "term"}, {"line": 11811, "zline": 11813, "decl": "winStreet", "en": "Raised preflop and took it down${isLP ? ' — positional steal' : ' — open-raise steal'}", "zh": "翻牌前加注并拿下底池${isLP ? '——位置偷盲' : '——开局加注偷盲'}", "kind": "sentence"}, {"line": 11814, "zline": 11816, "decl": "winStreet", "en": "Won preflop without raising — opponents folded to a limp or blind", "zh": "翻牌前未加注获胜——对手对溜入或盲注弃牌", "kind": "sentence"}, {"line": 11818, "zline": 11820, "decl": "winStreet", "en": "Overbet ${maxBetPct.toFixed(0)}% of stack on ${ovetBetStreet} — massive pressure, took it down", "zh": "超池下注 ${maxBetPct.toFixed(0)}% 筹码在 ${ovetBetStreet}——巨大压力，拿下底池", "kind": "sentence"}, {"line": 11821, "zline": 11823, "decl": "winStreet", "en": "Raised preflop, continuation bet the flop, took it down — standard c-bet line", "zh": "翻牌前加注，翻牌持续下注，拿下底池——标准 c-bet 路线", "kind": "sentence"}, {"line": 11828, "zline": 11830, "decl": "winStreet", "en": "Raised preflop and barreled ${parts.join(' + ')} (${streetsBet} streets) — multi-street pressure${isEscalating ? ', escalating sizing' : ''}", "zh": "翻牌前加注并连续开枪 ${parts.join(' + ')}（${streetsBet} 条街）——多条街施压${isEscalating ? '，尺寸递增' : ''}", "kind": "sentence"}, {"line": 11831, "zline": 11833, "decl": "winStreet", "en": "Checked the flop, then bet ${turnAgg > 0 ? 'the turn' : 'the river'} — delayed aggression", "zh": "翻牌过牌，然后在${turnAgg > 0 ? '转牌' : '河牌'}下注——延迟进攻", "kind": "sentence"}, {"line": 11834, "zline": 11836, "decl": "winStreet", "en": "Small bet (${maxBetPct.toFixed(1)}% of stack) on one street — minimal investment takedown", "zh": "单条街小注（${maxBetPct.toFixed(1)}% 筹码）——最小投入拿下底池", "kind": "sentence"}, {"line": 11837, "zline": 11839, "decl": "winStreet", "en": "Won without betting post-flop — opponents folded${winStreet === 'river' ? ' after all streets checked through' : ''}", "zh": "翻牌后未下注获胜——对手弃牌${winStreet === 'river' ? '，所有街都过牌到底' : ''}", "kind": "sentence"}, {"line": 11840, "zline": 11842, "decl": "winStreet", "en": "Bet on ${streetsBet} street${streetsBet > 1 ? 's' : ''} and took it down", "zh": "在 ${streetsBet} 条街下注并拿下底池", "kind": "sentence"}, {"line": 11887, "zline": 11889, "decl": "winStreet", "en": "You had a set on a draw-heavy board${boardCtx} — opponent folded. Protection was correct, but you'd prefer a call here.", "zh": "你在听牌多的牌面上有超对${boardCtx}——对手弃牌。保护性下注是正确的，但你更希望这里被跟注。", "kind": "sentence"}, {"line": 11888, "zline": 11890, "decl": "winStreet", "en": "You had a set and bet — opponent folded. They got away cheap.", "zh": "你有超对并下注——对手弃牌。他们便宜逃跑了。", "kind": "sentence"}, {"line": 11892, "zline": 11894, "decl": "winStreet", "en": "+ ${draw.flushDraw ? 'flush draw' : draw.oesd ? 'straight draw' : 'gutshot'}", "zh": "+ ${draw.flushDraw ? '同花听牌' : draw.oesd ? '顺子听牌' : '卡顺'}", "kind": "term"}, {"line": 11895, "zline": 11897, "decl": "winStreet", "en": "You had top pair${comboNote} and bet the river — opponent folded. They got away cheap.", "zh": "你有顶对${comboNote}并在河牌下注——对手弃牌。他们便宜逃跑了。", "kind": "sentence"}, {"line": 11897, "zline": 11899, "decl": "winStreet", "en": "You had top pair${comboNote} on a draw-heavy board${boardCtx} — opponent folded. Protection bet worked, equity denied.", "zh": "你在听牌多的牌面上有顶对${comboNote}${boardCtx}——对手弃牌。保护性下注有效，权益被拒绝。", "kind": "sentence"}, {"line": 11899, "zline": 11901, "decl": "winStreet", "en": "You had top pair${comboNote} and bet — opponent folded. They got away cheap.", "zh": "你有顶对${comboNote}并下注——对手弃牌。他们便宜逃跑了。", "kind": "sentence"}, {"line": 11903, "zline": 11905, "decl": "winStreet", "en": "You had nothing and bet ${streetsBet} street${streetsBet > 1 ? 's' : ''} — successful bluff", "zh": "你什么也没有并下注 ${streetsBet} 条街——成功诈唬", "kind": "sentence"}, {"line": 11906, "zline": 11908, "decl": "winStreet", "en": "You had a ${draw.flushDraw ? 'flush draw' : draw.oesd ? 'straight draw' : 'gutshot'} and bet — took it down before the draw resolved", "zh": "你有 ${draw.flushDraw ? '同花听牌' : draw.oesd ? '顺子听牌' : '卡顺'} 并下注——在听牌解决前拿下了底池", "kind": "sentence"}, {"line": 11909, "zline": 11911, "decl": "winStreet", "en": "You had a pair + ${draw.flushDraw ? 'flush draw' : draw.oesd ? 'straight draw' : 'gutshot'} — semi-value bet that worked", "zh": "你有一对 + ${draw.flushDraw ? '同花听牌' : draw.oesd ? '顺子听牌'
