.row{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;overflow:hidden}
.rh{display:flex;gap:9px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--bd);

.ln{font-family:ui-monospace,Consolas,monospace;color:var(--acc);font-weight:600}
.tag{background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:1px 6px;font-size:11px}
.tag.s{color:var(--warn)}.tag.d{color:var(--tx3)}
.pb{padding:9px 12px}

.half{display:flex;gap:10px;padding:5px 0;align-items:flex-start}
.half+.half{margin-top:5px}
.k{flex:none;width:34px;font-size:10.5px;font-weight:700;letter-spacing:.5px;border-radius:4px;

.k.en{background:var(--enb);color:var(--en)}

mark{background:#ffe58a;color:#3a2b00;border-radius:2px;padding:0 1px}

.empty{color:var(--tx3);padding:40px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:12.6px;background:var(--card);

th,td{padding:6px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}

td.mono{font-family:ui-monospace,Consolas,monospace;word-break:break-word}
.count{color:var(--tx3);font-size:12.5px;margin:6px 0 0}

e": 4234, "zline": 4236, "decl": "getBetSizing", "en": "Bet around half pot.", "zh": "下注大约半个底池。", "kind": "term"}, {"line": 4267, "zline": 4269, "decl": "getOwnHandLean", "en": "You are in position - use it.", "zh": "你有位置优势——利用它。", "kind": "sentence"}, {"line": 4267, "zline": 4269, "decl": "getOwnHandLean", "en": "Yous got position. The Duke don\\'t waste that.", "zh": "你有位置了。Duke 可不会浪费。", "kind": "sentence"}, {"line": 4268, "zline": 4270, "decl": "getOwnHandLean", "en": "You are out of position - be careful bloating the pot.", "zh": "你没位置——小心别把底池搞太大。", "kind": "sentence"}, {"line": 4268, "zline": 4270, "decl": "getOwnHandLean", "en": "Yous are out of position — don\\'t go fattenin\\' this pot, pal.", "zh": "你没位置了，伙计——别把这池子养肥了。", "kind": "sentence"}, {"line": 4272, "zline": 4274, "decl": "getOwnHandLean", "en": "You are in position - use it.", "zh": "你有位置优势——利用它。", "kind": "sentence"}, {"line": 4272, "zline": 4274, "decl": "getOwnHandLean", "en": "Yous got position. The Duke don\\'t waste that.", "zh": "你有位置了。Duke 可不会浪费。", "kind": "sentence"}, {"line": 4273, "zline": 4275, "decl": "getOwnHandLean", "en": "You are out of position — be mindful of your sizing.", "zh": "你没位置——注意你的下注额。", "kind": "sentence"}, {"line": 4273, "zline": 4275, "decl": "getOwnHandLean", "en": "Yous are out of position, pal. Pick your spots.", "zh": "你没位置了，伙计。选好你的点。", "kind": "sentence"}, {"line": 4277, "zline": 4279, "decl": "getOwnHandLean", "en": "— stack is shallow, you're near pot-committed.", "zh": "— 筹码浅，你接近套牢。", "kind": "sentence"}, {"line": 4278, "zline": 4280, "decl": "getOwnHandLean", "en": "— mid-depth. Don't build a massive pot without the goods.", "zh": "— 中等深度。没有好牌别造大池。", "kind": "sentence"}, {"line": 4279, "zline": 4281, "decl": "getOwnHandLean", "en": "— deep stack. Pot management matters here.", "zh": "— 深筹码。底池管理很重要。", "kind": "sentence"}, {"line": 4280, "zline": 4282, "decl": "getOwnHandLean", "en": "— shallow stack, pal. You're damn near pot-committed.", "zh": "— 筹码浅，伙计。你他妈快套牢了。", "kind": "sentence"}, {"line": 4281, "zline": 4283, "decl": "getOwnHandLean", "en": "— mid-depth. Don't go fattenin' this pot without the goods, kid.", "zh": "— 中等深度。没货就别把锅子搞大了，孩子。", "kind": "sentence"}, {"line": 4282, "zline": 4284, "decl": "getOwnHandLean", "en": "— deep stack, pal. Manage this pot carefully.", "zh": "— 深筹码，伙计。小心管好这个底池。", "kind": "sentence"}, {"line": 4323, "zline": 4325, "decl": "oppRangeNote", "en": "Heads up:", "zh": "注意：", "kind": "term"}, {"line": 4323, "zline": 4325, "decl": "oppRangeNote", "en": "is a NIT — their raising range is extremely narrow (top pairs, sets, two pair minimum). Even a decent hand can be crushed here.", "zh": "是个 NIT——他们的加注范围极窄（顶对、三条、两对起步）。即使不错的牌也可能被碾压。", "kind": "sentence"}, {"line": 4324, "zline": 4326, "decl": "oppRangeNote", "en": "Heads up:", "zh": "注意：", "kind": "term"}, {"line": 4324, "zline": 4326, "decl": "oppRangeNote", "en": "is a NIT — razor-thin range, kid. Top pair, sets, two pair minimum. Even a decent hand gets eaten alive here.", "zh": "是个 NIT——范围跟刀片一样薄，孩子。顶对、三条、两对起步。就算不错的牌也会被生吞。", "kind": "sentence"}, {"line": 4328, "zline": 4330, "decl": "oppRangeNote", "en": "Heads up:", "zh": "注意：", "kind": "term"}, {"line": 4328, "zline": 4330, "decl": "oppRangeNote", "en": "is a maniac — they raise with a wide range. Don't over-respect this raise.", "zh": "是个疯子——他们的加注范围很宽。不要太把这个加注当回事。", "kind": "sentence"}, {"line": 4329, "zline": 4331, "decl": "oppRangeNote", "en": "Heads up:", "zh": "注意：", "kind": "term"}, {"line": 4329, "zline": 4331, "decl": "oppRangeNote", "en": "is a maniac — raises wide. Duke ain't givin' this raise respect it don't deserve, pal.", "zh": "是个疯子——加注范围宽。杜克可不会给这个加注它不配的尊重，伙计。", "kind": "sentence"}, {"line": 4333, "zline": 4335, "decl": "oppRangeNote", "en": "Heads up:", "zh": "注意：", "kind": "term"}, {"line": 4333, "zline": 4335, "decl": "oppRangeNote", "en": "raised — fish raise a wide, often weak range. Your made hands are likely ahead.", "zh": "加注了——鱼的加注范围宽且弱。你的成牌很可能领先。", "kind": "sentence"}, {"line": 4334, "zline": 4336, "decl": "oppRangeNote", "en": "Heads up:", "zh": "注意：", "kind": "term"}, {"line": 4334, "zline": 4336, "decl": "oppRangeNote", "en": "raised — fish raise wide and weak. You got a made hand, you're probably ahead, kid. Don't overthink it.", "zh": "加注了——鱼加注宽又弱。你有成牌，你很可能领先，孩子。别想太多。", "kind": "sentence"}, {"line": 4338, "zline": 4340, "decl": "oppRangeNote", "en": "Heads up:", "zh": "注意：", "kind": "term"}, {"line": 4338, "zline": 4340, "decl": "oppRangeNote", "en": "is a Sharp player — they pick spots, so this raise is real, but not necessarily a monster.", "zh": "是个敏锐玩家——他们选时机，所以这个加注是真的，但不一定是个怪兽。", "kind": "sentence"}, {"line": 4339, "zline": 4341, "decl": "oppRangeNote", "en": "Heads up:", "zh": "注意：", "kind": "term"}, {"line": 4339, "zline": 4341, "decl": "oppRangeNote", "en": "is Sharp — they pick their spots. This raise is real, but it ain't always the stone cold nuts.", "zh": "很敏锐——他们选时机。这个加注是真的，但也不总是冷冰冰的 nuts。", "kind": "sentence"}, {"line": 4343, "zline": 4345, "decl": "oppRangeNote", "en": "Heads up:", "zh": "注意：", "kind": "term"}, {"line": 4343, "zline": 4345, "decl": "oppRangeNote", "en": "is a Cautious player who rarely bets — this raise from them is a very strong signal.", "zh": "是个谨慎玩家，很少下注——他们的这次加注是非常强的信号。", "kind": "sentence"}, {"line": 4344, "zline": 4346, "decl": "oppRangeNote", "en": "Heads up:", "zh": "注意：", "kind": "term"}, {"line": 4344, "zline": 4346, "decl": "oppRangeNote", "en": "is Cautious — they don't fire without the goods. This raise is a loud signal, pal. Believe it.", "zh": "很谨慎——没货不开火。这次加注是个响亮的信号，伙计。信它。", "kind": "sentence"}, {"line": 4418, "zline": 4420, "decl": "oppRangeNote", "en": "and", "zh": "和", "kind": "term"}, {"line": 4551, "zline": 4553, "decl": "RANK_NAME", "en": "Royal flush. The best hand in poker — you cannot lose. Slow-play or lead, whatever extracts the most.", "zh": "皇家同花顺。扑克中最好的牌——你不可能输。慢打或领打，怎么榨取最多就怎么来。", "kind": "sentence"}, {"line": 4552, "zline": 4554, "decl": "RANK_NAME", "en": "Royal flush, kid. The stone cold nuts — ain't a hand in existence that beats you. Slow-play it or go right at em. Every chip on this table is already yours.", "zh": "皇家同花顺，孩子。冷冰冰的 nuts——没有任何一手牌能打败你。慢打或直接干他们。这桌上的每一枚筹码都已经是你了。", "kind": "sentence"}, {"line": 4556, "zline": 4558, "decl": "RANK_NAME", "en": "Straight flush. Virtually unbeatable. Extract maximum value — slow-play or lead depending on what keeps them in.", "zh": "同花顺。几乎不可战胜。榨取最大价值——根据什么能留住他们来选择慢打或领打。", "kind": "sentence"}, {"line": 4557, "zline": 4559, "decl": "RANK_NAME", "en": "Straight flush, kid. Duke don't get hands like this and let em go for nothin'. Milk every last chip — slow-play or lead, whatever bleeds em driest.", "zh": "同花顺，孩子。杜克可不白拿这种牌。榨干每一枚筹码——慢打或领打，怎么让他们流血最多就怎么来。", "kind": "sentence"}, {"line": 4560, "zline": 4562, "decl": "RANK_NAME", "en": "Straight flush. Virtually unbeatable. Bet for value — get as much in the pot as possible.", "zh": "同花顺。几乎不可战胜。下注拿价值——尽可能多地往池里投钱。", "kind": "sentence"}, {"line": 4561, "zline": 4563, "decl": "RANK_NAME", "en": "Straight flush. Get every chip you can into this pot, kid. You ain't losin' this one.", "zh": "同花顺。把你所有筹码都投进这个池，孩子。你输不了这一手。", "kind": "sentence"}, {"line": 4566, "zline": 4568, "decl": "RANK_NAME", "en": "You have a flush, but the board is paired. Full houses are possible - value bet, but be ready to slow down if raised.", "zh": "你有同花，但牌面有对。可能存在葫芦——价值下注，但如果被加注就准备减速。", "kind": "sentence"}, {"line": 4567, "zline": 4569, "decl": "RANK_NAME", "en": "You got the flush, kid, but that board's paired up. Full houses are lurkin' out there. Get value in but if they start re-raisin', pump the brakes.", "zh": "你有同花，孩子，但牌面有对了。葫芦就潜伏在那里。拿价值但要是他们开始反加，就踩刹车。", "kind": "sentence"}, {"line": 4572, "zline": 4574, "decl": "RANK_NAME", "en": "Flush on the river. Bet for value and go for a call.", "zh": "河牌同花。下注拿价值，争取被跟注。", "kind": "sentence"}, {"line": 4573, "zline": 4575, "decl": "RANK_NAME", "en": "Flush on the river. Beautiful. Get your money in and take what's yours, kid. Duke don't leave value on the table.", "zh": "河牌同花。漂亮。把你的钱投进去，拿走属于你的，孩子。杜克可不把价值留在桌上。", "kind": "sentence"}, {"line": 4576, "zline": 4578, "decl": "RANK_NAME", "en": "Flush made. Strong hand - bet for value and charge draws.", "zh": "同花成牌。强牌——下注拿价值并惩罚听牌。", "kind": "sentence"}, {"line": 4577, "zline": 4579, "decl": "RANK_NAME", "en": "Flush made. Extract every last chip before the board gets ugly — bet and make em pay, kid.", "zh": "同花成牌。在牌面变难看之前榨取每一枚筹码——下注让他们付出代价，孩子。", "kind": "sentence"}, {"line": 4587, "zline": 4589, "decl": "RANK_NAME", "en": "Straight on the river, but the board is near-monotone — a flush beats you. Bet small or check down; fold to heavy aggression.", "zh": "河牌顺子，但牌面近乎单色——同花能打败你。小注或过牌；面对重压就弃牌。", "kind": "sentence"}, {"line": 4588, "zline": 4590, "decl": "RANK_NAME", "en": "Got a straight but the board's got four of a suit, kid — any flush beats you here. Small bet or check; get out if they come at you hard.", "zh": "顺子成了但牌面有四张同花，小子——任何同花都打败你。小注或过牌；他们来硬的你就撤。", "kind": "sentence"}, {"line": 4591, "zline": 4593, "decl": "RANK_NAME", "en": "Straight made, but 4 board cards share a suit — flush draws are live and beat you. Bet to charge, but be ready to fold to a raise.", "zh": "顺子成牌，但牌面有4张同花——同花听牌存在且能打败你。下注收费，但准备好面对加注时弃牌。", "kind": "sentence"}, {"line": 4592, "zline": 4594, "decl": "RANK_NAME", "en": "Straight but the board's threatening a flush, pal — four of the same suit out there. Charge the draws but don't die on this hill.", "zh": "顺子但牌面威胁同花，伙计——四张同花在外面。让听牌付费，但别在这座山上倒下。", "kind": "sentence"}, {"line": 4604, "zline": 4606, "decl": "RANK_NAME", "en": "Watch out:", "zh": "注意：牌面上有", "kind": "term"}, {"line": 4604, "zline": 4606, "decl": "RANK_NAME", "en": "flush-suit cards on board — anyone on a flush draw beats your straight if it completes.", "zh": "张同花牌——任何同花听牌的人都能在成牌后打败你的顺子。", "kind": "sentence"}, {"line": 4605, "zline": 4607, "decl": "RANK_NAME", "en": "Watch out:", "zh": "注意：那牌面上有", "kind": "term"}, {"line": 4605, "zline": 4607, "decl": "RANK_NAME", "en": "flush-suit cards on that board — any flush draw out there beats your straight if it gets there.", "zh": "张同花牌——任何同花听牌都能在成牌后打败你的顺子。", "kind": "sentence"}, {"line": 4610, "zline": 4612, "decl": "RANK_NAME", "en": "Straight on a paired board.", "zh": "成牌顺子但在有对的牌面上。", "kind": "sentence"}, {"line": 4610, "zline": 4612, "decl": "RANK_NAME", "en": "Be cautious — full houses beat you, and", "zh": "小心——葫芦打败你，而且", "kind": "sentence"}, {"line": 4610, "zline": 4612, "decl": "RANK_NAME", "en": "higher straights are possible too.", "zh": "可能还有更大的顺子。", "kind": "sentence"}, {"line": 4610, "zline": 4612, "decl": "RANK_NAME", "en": "there may be a better straight out there.", "zh": "外面可能有更好的顺子。", "kind": "sentence"}, {"line": 4611, "zline": 4613, "decl": "RANK_NAME", "en": "You got a straight but that board's got a pair on it.", "zh": "你成了顺子但牌面有一对。", "kind": "sentence"}, {"line": 4611, "zline": 4613, "decl": "RANK_NAME", "en": "Full houses eat straights for breakfast, pal. Don't go building a monument to it.", "zh": "葫芦拿顺子当早餐吃，伙计。别为它建纪念碑。", "kind": "sentence"}, {"line": 4617, "zline": 4619, "decl": "RANK_NAME", "en": "Straight on the river, but you're on the low end.", "zh": "河牌顺子，但你在低端。", "kind": "sentence"}, {"line": 4617, "zline": 4619, "decl": "RANK_NAME", "en": "Bet small for value — fold if they raise hard.", "zh": "小注拿价值——他们硬加注就弃牌。", "kind": "sentence"}, {"line": 4618, "zline": 4620, "decl": "RANK_NAME", "en": "Straight on the river but you're on the cheap end, kid.", "zh": "河牌顺子但你在便宜的一端，孩子。", "kind": "sentence"}, {"line": 4618, "zline": 4620, "decl": "RANK_NAME", "en": "Sneak a small bet in — the second they raise hard, you get out.", "zh": "偷偷塞个小注——他们一硬加注你就走人。", "kind": "sentence"}, {"line": 4621, "zline": 4623, "decl": "RANK_NAME", "en": "Straight made, but you're on the low end.", "zh": "顺子成牌，但你在低端。", "kind": "sentence"}, {"line": 4621, "zline": 4623, "decl": "RANK_NAME", "en": "Bet to charge draws, but fold to heavy resistance.", "zh": "下注惩罚听牌，但面对重压就弃牌。", "kind": "sentence"}, {"line": 4622, "zline": 4624, "decl": "RANK_NAME", "en": "You got a straight but it ain't the top of the ladder.", "zh": "你成了顺子但不在顶端。", "kind": "sentence"}, {"line": 4622, "zline": 4624, "decl": "RANK_NAME", "en": "Charge the draws, but if someone starts pushing back hard, Duke folds here.", "zh": "惩罚听牌，但如果有人用力推回来，杜克就弃牌。", "kind": "sentence"}, {"line": 4628, "zline": 4630, "decl": "RANK_NAME", "en": "Straight on the river. Bet for value unless you face heavy aggression.", "zh": "河牌顺子。下注拿价值，除非面对重压。", "kind": "sentence"}, {"line": 4629, "zline": 4631, "decl": "RANK_NAME", "en": "Straight on the river. Get your value in - only back off if they come at you like they mean it, kid.", "zh": "河牌顺子。拿你的价值——只有对方来势汹汹时才退让，孩子。", "kind": "sentence"}, {"line": 4632, "zline": 4634, "decl": "RANK_NAME", "en": "Straight made. Bet for value and protect against draws.", "zh": "顺子成牌。下注拿价值并防听牌。", "kind": "sentence"}, {"line": 4633, "zline": 4635, "decl": "RANK_NAME", "en": "You got a straight. Beautiful. Bet it and protect that pot — don't let some punk draw out on you for free.", "zh": "你成了顺子。漂亮。下注并保护底池——别让哪个小崽子免费听牌反超你。", "kind": "sentence"}, {"line": 4642, "zline": 4644, "decl": "RANK_NAME", "en": "Quads — four of a kind. Basically unbeatable. Extract maximum value; slow-play or lead depending on their tendencies.", "zh": "四条。基本不可战胜。榨取最大价值；根据他们的倾向选择慢打或领打。", "kind": "sentence"}, {"line": 4643, "zline": 4645, "decl": "RANK_NAME", "en": "Quads. Four of a kind, kid. Duke don't get hands like this and let em go cheap. Milk every last chip — slow-play or lead, whatever bleeds them driest.", "zh": "四条，孩子。杜克可不让这牌便宜了。榨干每一枚筹码——慢打或领打，怎么让他们流血最多就怎么来。", "kind": "sentence"}, {"line": 4646, "zline": 4648, "decl": "RANK_NAME", "en": "Quads — four of a kind. Slow-play or bet small to keep them in. You cannot lose this hand.", "zh": "四条。慢打或小注留住他们。你这手牌输不了。", "kind": "sentence"}, {"line": 4647, "zline": 4649, "decl": "RANK_NAME", "en": "Four of a kind. You cannot lose this hand, pal. Keep em in — bet small, slow-play, whatever it takes to keep the fish on the line.", "zh": "四条。你这手牌输不了，伙计。留住他们——小注、慢打，不管怎样都要把鱼挂在线上。", "kind": "sentence"}, {"line": 4658, "zline": 4660, "decl": "RANK_NAME", "en": "Full house — the board has trips and your pair fills the boat. Extremely strong. Bet for value.", "zh": "葫芦——牌面有三条，你的对子凑成了葫芦。极其强。价值下注。", "kind": "sentence"}, {"line": 4659, "zline": 4661, "decl": "RANK_NAME", "en": "Full house — board's got trips and your pair makes a boat. Extremely strong. Bet for value and collect, kid.", "zh": "葫芦——牌面有三条，你的对子凑成了葫芦。极其强，小子。价值下注收钱吧。", "kind": "sentence"}, {"line": 4662, "zline": 4664, "decl": "RANK_NAME", "en": "Full house — board trips plus your pair. Extremely strong. Bet for value.", "zh": "葫芦——牌面三条加你的对子。极其强。价值下注。", "kind": "sentence"}, {"line": 4663, "zline": 4665, "decl": "RANK_NAME", "en": "Full house — board trips and your pair, that's a boat. Extremely strong. Bet it, kid.", "zh": "葫芦——牌面三条加你的对子，那就是葫芦。极其强。干进去，小子。", "kind": "sentence"}, {"line": 4671, "zline": 4673, "decl": "RANK_NAME", "en": "Full house — the board pair gives you the boat. Extremely strong. Bet for value.", "zh": "葫芦——牌面对子让你凑成葫芦。极其强。价值下注。", "kind": "sentence"}, {"line": 4672, "zline": 4674, "decl": "RANK_NAME", "en": "Full house — your set filled up on that paired board. The boat, kid. Bet for value and collect.", "zh": "葫芦——你的暗三条在有对的牌面上凑成了葫芦。收钱吧，小子。价值下注。", "kind": "sentence"}, {"line": 4675, "zline": 4677, "decl": "RANK_NAME", "en": "Full house — set plus a paired board. Extremely strong. Bet for value; the board is already doing the heavy lifting.", "zh": "葫芦——暗三条加有对的牌面。极其强。价值下注；牌面已经帮你做了大部分工作。", "kind": "sentence"}, {"line": 4676, "zline": 4678, "decl": "RANK_NAME", "en": "Full house - set plus a paired board, that's a boat. Extremely strong. Bet it, the board's doing half the work for you, kid.", "zh": "葫芦——暗三条加有对的牌面，那就是葫芦。极其强。干进去，牌面已经帮你干了一半的活了，小子。", "kind": "sentence"}, {"line": 4684, "zline": 4686, "decl": "RANK_NAME", "en": "Full house ou have two ways to win. Don't overcommit, but the draw keeps you in it.", "zh": "。半可玩性：你有两种获胜方式。别过度投入，但听牌让你留在里面。", "kind": "sentence"}, {"line": 5238, "zline": 5240, "decl": "wetStrDuke", "en": "Low pair ain't much, but that", "zh": "低对不算啥，但那个", "kind": "sentence"}, {"line": 5238, "zline": 5240, "decl": "wetStrDuke", "en": "changes things, kid. You got two ways to win — pair holds or the straight gets there. Keep it reasonable.", "zh": "改变了局面，孩子。你有两种获胜方式——对子站住或顺子来。保持合理。", "kind": "sentence"}, {"line": 5242, "zline": 5244, "decl": "wetStrDuke", "en": "You have a pair but it is not top pair. Pot control - do not build a massive pot.", "zh": "你有一对但不是顶对。控制底池——别造大池。", "kind": "sentence"}, {"line": 5242, "zline": 5244, "decl": "wetStrDuke", "en": "Fold to a big raise.", "zh": "面对大加注就弃牌。", "kind": "sentence"}, {"line": 5243, "zline": 5245, "decl": "wetStrDuke", "en": "Low pair ain't gonna win you wars, kid. Keep it small or walk.", "zh": "低对赢不了战争，孩子。保持小池或走人。", "kind": "sentence"}, {"line": 5243, "zline": 5245, "decl": "wetStrDuke", "en": "Big raise? You fold.", "zh": "大加注？你就弃牌。", "kind": "term"}, {"line": 5251, "zline": 5253, "decl": "wetStr", "en": "Board is wet — fold to any real pressure.", "zh": "牌面湿润——面对任何真正压力就弃牌。", "kind": "sentence"}, {"line": 5254, "zline": 5256, "decl": "wetStrDuke", "en": "Board's wet — fold to any real pressure.", "zh": "牌面湿——面对任何真正压力就弃牌。", "kind": "sentence"}, {"line": 5258, "zline": 5260, "decl": "wetStrDuke", "en": "Pocket pair but the board has higher cards. Marginal — fold to any real pressure.", "zh": "口袋对但牌面有更高的牌。边缘——面对任何真正压力就弃牌。", "kind": "sentence"}, {"line": 5259, "zline": 5261, "decl": "wetStrDuke", "en": "Pocket pair but the board's running over you, kid. Fold to any real pressure.", "zh": "口袋对但牌面碾压了你，孩子。面对任何真正压力就弃牌。", "kind": "sentence"}, {"line": 5264, "zline": 5266, "decl": "wetStrDuke", "en": "Pocket pair, but the board has higher cards. Keep the pot small and fold to a big raise.", "zh": "口袋对，但牌面有更高的牌。保持底池小，面对大加注就弃牌。", "kind": "sentence"}, {"line": 5265, "zline": 5267, "decl": "wetStrDuke", "en": "Pocket pair but the board's got you outgunned, kid. Keep it small or walk when they raise.", "zh": "口袋对但牌面比你火力强，孩子。保持小池或他们加注你就走人。", "kind": "sentence"}, {"line": 5278, "zline": 5280, "decl": "wetStrDuke", "en": "Overcards facing a bet. You have nothing made yet — fold unless you have a solid read they are bluffing or the price is very cheap.", "zh": "高张面对下注。你还没成牌——弃牌，除非你有可靠的读牌认为他们在诈唬，或者价格非常便宜。", "kind": "sentence"}, {"line": 5279, "zline": 5281, "decl": "wetStrDuke", "en": "Overcards facing a bet. You ain't hit nothing yet, kid — get outta there unless you got a read they're running a bluff or the price is basically free.", "zh": "高张面对下注。你啥也没中，孩子——赶紧走人，除非你读准他们在诈唬，或者价格基本免费。", "kind": "sentence"}, {"line": 5284, "zline": 5286, "decl": "wetStrDuke", "en": "You have overcards - unimproved but live. One more card could give you top pair. Cheap street is fine; do not call a big bet without a stronger read.", "zh": "你有高张——未成牌但有活力。再多一张牌可能给你顶对。便宜街没问题；没有更强的读牌就别跟大注。", "kind": "sentence"}, {"line": 5285, "zline": 5287, "decl": "wetStrDuke", "en": "You ain't hit nothing yet but those high cards are live. One more card could hand you top pair. Take the cheap street, don't go blowing your stack on a prayer.", "zh": "你啥也没中但那些高牌还活着。再多一张牌可能给你顶对。走便宜街，别靠祈祷把筹码打光。", "kind": "sentence"}, {"line": 5298, "zline": 5300, "decl": "wetStrDuke", "en": "backdoor straight draw (need runner-runner)", "zh": "后门顺子听牌（需要 runner-runner）", "kind": "sentence"}, {"line": 5299, "zline": 5301, "decl": "wetStrDuke", "en": "and", "zh": "和", "kind": "term"}, {"line": 5301, "zline": 5303, "decl": "wetStrDuke", "en": "You have not connected but you have a (~ ). Don't call a significant bet for this alone. Fold unless you're getting a great price or have position.", "zh": "你没有连接上但你有 。低 equity——别仅仅因为这个就跟显著的下注。弃牌，除非你有很好的价格或有位置。", "kind": "sentence"}, {"line": 5302, "zline": 5304, "decl": "wetStrDuke", "en": "You ain't connected but you got a (~ ). Duke don't pay for", "zh": "你没连接上但你有 。低 equity——杜克可不为", "kind": "sentence"}, {"line": 5302, "zline": 5304, "decl": "wetStrDuke", "en": "dreams. Fold unless the price is basically a gift.", "zh": "的梦想买单。弃牌，除非价格基本是送的。", "kind": "sentence"}, {"line": 5305, "zline": 5307, "decl": "wetStrDuke", "en": "You haven't connected yet but have a (~ ) — it adds a small reason to see the turn cheaply, but don't rely on it.", "zh": "你还没连接上但有 。低 equity（~4-6%）——这给了你一个便宜看转牌的小理由，但别依赖它。", "kind": "sentence"}, {"line": 5306, "zline": 5308, "decl": "wetStrDuke", "en": "You ain't hit nothing yet but you got a (~ ) — take the cheap turn if they give it, otherwise fold. Don't build your future on it.", "zh": "你啥也没中但你有 。低 equity，大概 4-6%——如果他们给便宜转牌就拿，否则弃牌。别把你的未来押在上面。", "kind": "sentence"}, {"line": 5311, "zline": 5313, "decl": "wetStrDuke", "en": "You have not connected with the board and are facing a bet. Easy fold — you have no made hand and no strong draw.", "zh": "你没有和牌面连接上并且面对下注。轻松弃牌——你没有成牌也没有强听牌。", "kind": "sentence"}, {"line": 5312, "zline": 5314, "decl": "wetStrDuke", "en": "You connected with nothing on this board and they're betting. Easy fold - no made hand, no draw, no reason to be here, pal.", "zh": "你和这牌面毫无关系，他们下注了。轻松弃牌——没成牌、没听牌、没理由在这，伙计。", "kind": "sentence"}, {"line": 5315, "zline": 5317, "decl": "wetStrDuke", "en": "You have not connected with this board. You need a good reason to continue - a solid read on a bluff or a very cheap price.", "zh": "你没有和这个牌面连接上。你需要一个好理由继续——可靠的读牌认为他们在诈唬，或者非常便宜的价格。", "kind": "sentence"}, {"line": 5316, "zline": 5318, "decl": "wetStrDuke", "en": "You connected with nothing on this board. You need a real reason to continue, pal — a solid read they're bluffing or an almost-free price.", "zh": "你和这牌面毫无关系。你需要一个真正的理由继续，伙计——可靠的读牌他们诈唬，或者几乎免费的价格。", "kind": "sentence"}, {"line": 5513, "zline": 5515, "decl": "facingRaise", "en": "Re-raise — do not slow-play aces against multiple raisers. Thin the field now.", "zh": "再加注——不要在多人加注时慢打AA。现在减少人数。", "kind": "sentence"}, {"line": 5514, "zline": 5516, "decl": "facingRaise", "en": "Raise. Pocket aces are the best starting hand — raise big to narrow the field. Pitfall: limping or min-raising lets in cheap callers who can crack you with suited connectors or small pairs. Don't be tricky preflop.", "zh": "加注。口袋A是最好的起手牌——加大注码以减少入池人数。陷阱：溜入或最小加注会让便宜跟注者用同花连牌或小对子反超你。翻前别耍花样。", "kind": "sentence"}, {"line": 5516, "zline": 5518, "decl": "facingRaise", "en": "Pocket aces and there's already raises flying. Re-raise — you don't slow-play rockets against multiple raisers. Thin the field now.", "zh": "口袋A而且已经有加注飞来飞去。再加注——别在多人加注时慢打AA。现在清场。", "kind": "sentence"}, {"line": 5517, "zline": 5519, "decl": "facingRaise", "en": "Pocket aces, kid. The best hand in existence. Raise big and clear the riff-raff out. Don't limp, don't min-raise — some joker will crack you with a 7-2 suited if you let em in cheap.", "zh": "口袋A，孩子。世界上最好的牌。加注清走那些闲杂人等。别溜入，别最小加注——如果让他们便宜进来，某个小丑会用7-2同花干掉你。", "kind": "sentence"}, {"line": 5523, "zline": 5525, "decl": "facingRaise", "en": "Cowboys — re-raise. Strong enough to go all-in preflop. The only hand that beats you here is AA.", "zh": "KK——再加注。强到可以翻前全压。唯一能打败你的是AA。", "kind": "sentence"}, {"line": 5524, "zline": 5526, "decl": "facingRaise", "en": "Pocket kings. Raise big. Pitfall: many players over-fold KK when an ace hits the board — your opponent doesn't always have the ace. Don't auto-surrender to an ace without reads.", "zh": "口袋K。加注。陷阱：很多玩家在看到A时过度弃牌KK——对手并不总是有A。在没有读牌的情况下，不要见到A就自动认输。", "kind": "sentence"}, {"line": 5526, "zline": 5528, "decl": "facingRaise", "en": "Cowboys, pal. Re-raise and don't look back. Only thing that beats you is rockets. Go all-in preflop.", "zh": "KK，伙计。再加注，别回头。唯一能打败你的是AA。翻前全压。", "kind": "sentence"}, {"line": 5527, "zline": 5529, "decl": "facingRaise", "en": "Pocket kings. Raise big. Rookie mistake: folding this the second an ace hits the flop. They don't always have the ace — don't hand your chips over without a read.", "zh": "口袋K。加注大点。新手错误：翻牌一张A就弃牌。他们并不总是有A——没有读牌就别把筹码交出去。", "kind": "sentence"}, {"line": 5534, "zline": 5536, "decl": "facingRaise", "en": "Pocket queens — strong, but if you're facing a 4-bet from a tight player, you might be behind KK or AA. Re-raise with caution and consider the raiser's badge.", "zh": "口袋Q——强牌，但如果你面对紧手的4-bet，你可能落后于KK或AA。谨慎再加注，并考虑加注者的徽章。", "kind": "sentence"}, {"line": 5535, "zline": 5537, "decl": "facingRaise", "en": "Pocket queens. Raise. Pitfall: queens hate an ace or king on the flop. If a tight player bets into an A-high or K-high board, reassess. Your hand is one-pair strength post-flop.", "zh": "口袋Q。加注。陷阱：Q讨厌翻牌出现A或K。如果紧手在A高或K高牌面上下注，重新评估。你的牌翻后只有一对的强度。", "kind": "sentence"}, {"line": 5537, "zline": 5539, "decl": "facingRaise", "en": "Pocket queens facing multiple raises — strong hand but a tight 4-bettor might have you behind KK or AA. Re-raise with some respect for the action, pal.", "zh": "口袋Q面对多个加注——强牌但紧的4-bettor可能让你落后KK或AA。带着对行动的尊重再加注，伙计。", "kind": "sentence"}, {"line": 5538, "zline": 5540, "decl": "facingRaise", "en": "Pocket queens. Raise. Pitfall: queens fall apart when an ace or king lands. Tight player betting into that board? Reassess. You got one pair, not a miracle.", "zh": "口袋Q。加注。陷阱：当A或K出现时Q就崩了。紧手在那个牌面下注？重新评估。你只有一对，不是奇迹。", "kind": "sentence"}, {"line": 5546, "zline": 5548, "decl": "facingRaise", "en": "Pocket", "zh": "口袋", "kind": "term"}, {"line": 5546, "zline": 5548, "decl": "facingRaise", "en": "facing multiple raises — calling is safer than re-jamming. Overcards are likely.", "zh": "面对多个加注——跟注比重注更安全。高牌很可能存在。", "kind": "sentence"}, {"line": 5547, "zline": 5549, "decl": "facingRaise", "en": "Pocket", "zh": "口袋", "kind": "term"}, {"line": 5547, "zline": 5549, "decl": "facingRaise", "en": ". Raise, but be ready to fold if an overcard (A, K, Q) hits and a tight player shows real aggression. These hands are strong before the flop but become tricky after — don't over-commit when the board has overcards.", "zh": "。加注，但如果有高牌（A、K、Q）出现且紧手表现出真正的攻击性，准备好弃牌。这些牌翻前很强但翻后变得棘手——当牌面有高牌时不要过度投入。", "kind": "sentence"}, {"line": 5549, "zline": 5551, "decl": "facingRaise", "en": "Pocket", "zh": "口袋", "kind": "term"}, {"line": 5549, "zline": 5551, "decl": "facingRaise", "en": "and there's raises flying everywhere — calling is safer than re-jamming here, pal. Overcards are probably out there.", "zh": "而且加注到处飞——跟注比在这里重注更安全，伙计。高牌可能在外面。", "kind": "sentence"}, {"line": 5550, "zline": 5552, "decl": "facingRaise", "en": "Pocket", "zh": "口袋", "kind": "term"}, {"line": 5550, "zline": 5552, "decl": "facingRaise", "en": ". Raise, but keep your head. An overcard hits and a tight player starts showing teeth? Don't go broke on one pair.", "zh": "。加注，但保持清醒。高牌出现且紧手开始露出獠牙？别为一对破产。", "kind": "sentence"}, {"line": 5557, "zline": 5559, "decl": "facingRaise", "en": "Big Slick — re-raise. Strong enough to go all-in preflop against most ranges.", "zh": "AK——再加注。强到可以翻前全压，对抗大多数范围。", "kind": "sentence"}, {"line": 5558, "zline": 5560, "decl": "facingRaise", "en": "Ace-King", "zh": "AK", "kind": "term"}, {"line": 5558, "zline": 5560, "decl": "facingRaise", "en": ". Raise. This is a premium drawing hand — it's not made yet. Pitfall: AK misses the flop about 2/3 of the time. Don't over-commit post-flop if you whiff. It's just ace-high.", "zh": "。加注。这是一手顶级听牌牌型——还没成牌。陷阱：AK大约2/3的时间不中翻牌。如果你没中，翻后不要过度投入。它只是A高。", "kind": "sentence"}, {"line": 5558, "zline": 5560, "decl": "facingRaise", "en": "suited", "zh": "同花", "kind": "term"}, {"line": 5560, "zline": 5562, "decl": "facingRaise", "en": "Big Slick", "zh": "AK", "kind": "term"}, {"line": 5560, "zline": 5562, "decl": "facingRaise", "en": "— re-raise. Strong enough to go all-in preflop against most ranges, kid.", "zh": "——再加注。强到可以翻前全压，对抗大多数范围，孩子。", "kind": "sentence"}, {"line": 5560, "zline": 5562, "decl": "facingRaise", "en": "suited", "zh": "同花", "kind": "term"}, {"line": 5561, "zline": 5563, "decl": "facingRaise", "en": "Ace-King", "zh": "AK", "kind": "term"}, {"line": 5561, "zline": 5563, "decl": "facingRaise", "en": ". Raise it. Premium drawing hand — but it ain't made yet. Misses the flop 2 out of 3 times. Don't go throwing your stack at a whiff. It's just ace-high until the board says otherwise.", "zh": "。加注。顶级听牌牌型——但还没成牌。2/3的翻牌都不中。不要把你的筹码扔在不中的牌上。在牌面证明之前，它只是A高。", "kind": "sentence"}, {"line": 5561, "zline": 5563, "decl": "facingRaise", "en": "suited", "zh": "同花", "kind": "term"}, {"line": 5568, "zline": 5570, "decl": "facingRaise", "en": "Ace-Queen suited — solid. Call or re-raise. Against an EP raiser, be cautious about AK or AA dominating you.", "zh": "Ace-Queen 同花——不错。跟注或再加注。面对 EP 加注者，小心 AK 或 AA 压制你。", "kind": "sentence"}, {"line": 5569, "zline": 5571, "decl": "facingRaise", "en": "Ace-Queen suited. Raise from", "zh": "Ace-Queen 同花。从", "kind": "sentence"}, {"line": 5569, "zline": 5571, "decl": "facingRaise", "en": ". Strong hand with nut-flush potential. Pitfall: AQ is behind AK — against a tight 3-bettor, you may be dominated.", "zh": "加注。强牌，有坚果同花潜力。陷阱：AQ 落后于 AK——面对紧的 3-bettor，你可能被压制。", "kind": "sentence"}, {"line": 5571, "zline": 5573, "decl": "facingRaise", "en": "Ace-Queen suited — solid hand, pal. Call or re-raise. Tight EP raiser? Tread careful, AK or AA might have you dominated.", "zh": "Ace-Queen 同花——不错的牌，伙计。跟注或再加注。紧的 EP 加注者？小心点，AK 或 AA 可能压制你。", "kind": "sentence"}, {"line": 5572, "zline": 5574, "decl": "facingRaise", "en": "Ace-Queen suited. Raise from", "zh": "Ace-Queen 同花。从", "kind": "sentence"}, {"line": 5572, "zline": 5574, "decl": "facingRaise", "en": ". You got nut-flush potential on top of everything else. Pitfall: AQ loses to AK — tight 3-bettor is telling you something. Don't be stupid.", "zh": "加注。除了别的之外你还有坚果同花潜力。陷阱：AQ 输给 AK——紧的 3-bettor 在告诉你什么。别犯傻。", "kind": "sentence"}, {"line": 5578, "zline": 5580, "decl": "facingRaise", "en": "Premium hand. Re-raise or go all-in. Don't just call a 3-bet with this.", "zh": "强牌。再加注或全压。别只是跟注 3-bet。", "kind": "sentence"}, {"line": 5579, "zline": 5581, "decl": "facingRaise", "en": "Premium hand. Raise if you haven't already.", oceed carefully.", "zh": "敏锐的玩家翻前加注并过牌了翻牌。TAG 只在牌面严重偏离范围或慢打怪兽时才跳过 cbet。小心行事。", "kind": "sentence"}, {"line": 6181, "zline": 6183, "decl": "limpNote", "en": "Sharp player raised preflop and checked the flop. TAGs skip cbets only when they whiff hard or they're slowplaying a monster. Proceed careful, kid.", "zh": "敏锐的玩家翻前加注并过牌了翻牌。TAG 只在完全没中或慢打怪兽时才跳过的 cbet。小心点，孩子。", "kind": "sentence"}, {"line": 6186, "zline": 6188, "decl": "limpNote", "en": "raised preflop and checked the flop. Tight players who skip cbets either missed badly or flopped a monster and want action. The check is a polarized signal.", "zh": "翻前加注并过牌了翻牌。跳过 cbet 的紧手要么完全没中，要么翻牌中了怪兽想要行动。这个过牌是极化信号。", "kind": "sentence"}, {"line": 6187, "zline": 6189, "decl": "limpNote", "en": "raised preflop and checked the flop. Tight players who skip cbets either whiffed or flopped a monster and want action. That check is polarized.", "zh": "翻前加注并过牌了翻牌。跳过 cbet 的紧手要么没中，要么中了怪兽想要行动。那个过牌是极化的。", "kind": "sentence"}, {"line": 6190, "zline": 6192, "decl": "limpNote", "en": "Their", "zh": "他们的慢打率", "kind": "term"}, {"line": 6190, "zline": 6192, "decl": "limpNote", "en": "% slowplay rate — lean toward trap.", "zh": "%——倾向于陷阱。", "kind": "sentence"}, {"line": 6191, "zline": 6193, "decl": "limpNote", "en": "Slowplay rate", "zh": "慢打率", "kind": "term"}, {"line": 6191, "zline": 6193, "decl": "limpNote", "en": "% — lean trap.", "zh": "%——倾向陷阱。", "kind": "term"}, {"line": 6196, "zline": 6198, "decl": "limpNote", "en": "raised preflop but checked the flop. Preflop raisers who skip the cbet usually missed this board. Could be a spot to take the pot.", "zh": "翻前加注但过牌了翻牌。跳过 cbet 的翻前加注者通常没中这个牌面。可能是个夺池的机会。", "kind": "sentence"}, {"line": 6197, "zline": 6199, "decl": "limpNote", "en": "raised preflop but checked the flop. Preflop raisers who skip the c-bet usually missed. Could be a spot to snatch the pot.", "zh": "翻前加注但过牌了翻牌。跳过 c-bet 的翻前加注者通常没中。可能是个抢池的机会。", "kind": "sentence"}, {"line": 6206, "zline": 6208, "decl": "limpNote", "en": "was betting", "zh": "之前一直在", "kind": "term"}, {"line": 6206, "zline": 6208, "decl": "limpNote", "en": "but just checked the", "zh": "下注但刚刚在", "kind": "term"}, {"line": 6206, "zline": 6208, "decl": "limpNote", "en": ".", "zh": "过牌了。", "kind": "term"}, {"line": 6206, "zline": 6208, "decl": "limpNote", "en": "and", "zh": "和", "kind": "term"}, {"line": 6207, "zline": 6209, "decl": "limpNote", "en": "was firing", "zh": "一直在", "kind": "term"}, {"line": 6207, "zline": 6209, "decl": "limpNote", "en": "then checked the", "zh": "开火然后在", "kind": "term"}, {"line": 6207, "zline": 6209, "decl": "limpNote", "en": ".", "zh": "过牌了。", "kind": "term"}, {"line": 6207, "zline": 6209, "decl": "limpNote", "en": "and", "zh": "和", "kind": "term"}, {"line": 6212, "zline": 6214, "decl": "limpNote", "en": "Aggressive player stopping on the river — this is either a missed bluff (they were bluffing and gave up) or they have a made hand and want you to bet into them. Trap is a real possibility.", "zh": "进攻型玩家在河牌停下了——要么是没中的诈唬（他们之前一直在诈唬然后放弃了），要么他们有成牌想要你朝他们下注。陷阱是真实可能性。", "kind": "sentence"}, {"line": 6213, "zline": 6215, "decl": "limpNote", "en": "Aggressive player stopping on the river — either a bluff died or they got a made hand and want you to bet into it. Trap is real.", "zh": "进攻型玩家在河牌停下——要么诈唬死了，要么他们有成牌想要你下注进去。陷阱是真的。", "kind": "sentence"}, {"line": 6216, "zline": 6218, "decl": "limpNote", "en": "Their", "zh": "他们的慢打率", "kind": "term"}, {"line": 6216, "zline": 6218, "decl": "limpNote", "en": "% slowplay rate makes the trap read more likely. Proceed carefully.", "zh": "% 让陷阱读牌更可能。小心行事。", "kind": "sentence"}, {"line": 6217, "zline": 6219, "decl": "limpNote", "en": "Slowplay rate", "zh": "慢打率", "kind": "term"}, {"line": 6217, "zline": 6219, "decl": "limpNote", "en": "% makes the trap read more likely. Tread careful.", "zh": "% 让陷阱读牌更可能。小心走。", "kind": "sentence"}, {"line": 6221, "zline": 6223, "decl": "limpNote", "en": "Even maniacs don't check without reason. They may have hit a wall on this board, or they're 的范围，或是控制底池。一个时机恰当的下注能拿下底池。", "kind": "sentence"}, {"line": 6245, "zline": 6247, "decl": "limpNote", "en": "With", "zh": "AFq", "kind": "term"}, {"line": 6245, "zline": 6247, "decl": "limpNote", "en": "% AFq,", "zh": "% 的情况下，", "kind": "term"}, {"line": 6248, "zline": 6250, "decl": "limpNote", "en": "stopping the aggression on the river means weakness or a trap. If you have a made hand, bet — they either have nothing or they'll call with medium strength.", "zh": "在河牌停止进攻意味着软弱或陷阱。如果你有成牌，下注——他们要么什么都没有，要么会用中等强度牌跟注。", "kind": "sentence"}, {"line": 6249, "zline": 6251, "decl": "limpNote", "en": "shutting down on the river means weakness or a trap. If you got a made hand, bet — they either got nothing or they'll call with medium strength.", "zh": "在河牌停下意味着软弱或陷阱。如果你有成牌，下注——他们要么啥也没有，要么用中等牌跟。", "kind": "sentence"}, {"line": 6252, "zline": 6254, "decl": "limpNote", "en": "With", "zh": "AFq", "kind": "term"}, {"line": 6252, "zline": 6254, "decl": "limpNote", "en": "% AFq,", "zh": "% 的情况下，", "kind": "term"}, {"line": 6255, "zline": 6257, "decl": "limpNote", "en": "stopping the aggression here usually means weakness. Consider a bet if you have something.", "zh": "在这里停止进攻通常意味着软弱。如果你有东西，考虑下注。", "kind": "sentence"}, {"line": 6256, "zline": 6258, "decl": "limpNote", "en": "shutting down here usually means weakness. Consider a bet if you got anything.", "zh": "在这里停下通常意味着软弱。如果你有任何东西，考虑下注。", "kind": "sentence"}, {"line": 6267, "zline": 6269, "decl": "limpNote", "en": "is a Maniac (AFq", "zh": "是个疯子（AFq", "kind": "term"}, {"line": 6267, "zline": 6269, "decl": "limpNote", "en": "%) who checked. Maniacs almost never check — this board completely missed them or they're setting up a massive trap.", "zh": "%）但过牌了。疯子几乎从不这样——这个牌面完全没中他们，或他们在设大陷阱。", "kind": "sentence"}, {"line": 6268, "zline": 6270, "decl": "limpNote", "en": "is a Maniac (AFq", "zh": "是个疯子（AFq", "kind": "term"}, {"line": 6268, "zline": 6270, "decl": "limpNote", "en": "%) who checked. Maniacs don't check unless they whiffed or the 332, "decl": "limpNote", "en": "%) — checking is their default. They got something and they're waiting. Bet for value if you're ahead; don't expect them to fold, kid.", "zh": "%)——过牌是他们的默认。有点东西在等着。如果你领先就做价值下注；别指望他们会弃牌，小子。", "kind": "sentence"}, {"line": 6341, "zline": 6343, "decl": "limpNote", "en": "checked.", "zh": "过牌了。", "kind": "term"}, {"line": 6341, "zline": 6343, "decl": "limpNote", "en": "Not enough pattern to read this check definitively — play your hand, not theirs.", "zh": "模式不足以确定解读——打你的牌，不是打他们的。", "kind": "sentence"}, {"line": 6342, "zline": 6344, "decl": "limpNote", "en": "checked.", "zh": "过牌了。", "kind": "term"}, {"line": 6342, "zline": 6344, "decl": "limpNote", "en": "Not enough pattern to read this check — play your cards, not their story.", "zh": "模式不足以解读这个过牌——打你的牌，别管他们的故事。", "kind": "sentence"}, {"line": 6346, "zline": 6348, "decl": "limpNote", "en": ") checked.", "zh": ") 过牌了。", "kind": "term"}, {"line": 6346, "zline": 6348, "decl": "limpNote", "en": "With their profile, a check here is", "zh": "根据他们的档案，这里的过牌", "kind": "sentence"}, {"line": 6346, "zline": 6348, "decl": "limpNote", "en": "a deviation — likely weakness or a trap", "zh": "是异常——可能是示弱或陷阱", "kind": "sentence"}, {"line": 6346, "zline": 6348, "decl": "limpNote", "en": "consistent — they check a lot", "zh": "是一致的——他们经常过牌", "kind": "sentence"}, {"line": 6347, "zline": 6349, "decl": "limpNote", "en": ") checked.", "zh": ") 过牌了。", "kind": "term"}, {"line": 6347, "zline": 6349, "decl": "limpNote", "en": "With their profile, a check here is", "zh": "根据他们的档案，这里的过牌", "kind": "sentence"}, {"line": 6347, "zline": 6349, "decl": "limpNote", "en": ". Keep your guard up.", "zh": ". 保持警惕。", "kind": "sentence"}, {"line": 6347, "zline": 6349, "decl": "limpNote", "en": "a deviation — likely weakness or a trap", "zh": "是异常——可能是示弱或陷阱", "kind": "sentence"}, {"line": 6347, "zline": 6349, "decl": "limpNote", "en": "consistent — they check a lot", "zh": "是一致的——他们经常过牌", "kind": "sentence"}, {"line": 6364, "zline": 6366, "decl": "limpNote", "en": "is a", "zh": "是一个", "kind": "term"}, {"line": 6364, "zline": 6366, "decl": "limpNote", "en": "— they almost never bet or raise. Aggression from them is a real hand, not a bluff.", "zh": "——他们几乎从不加注或下注。他们的进攻是真牌，不是诈唬。", "kind": "sentence"}, {"line": 6365, "zline": 6367, "decl": "limpNote", "en": "is a", "zh": "是一个", "kind": "term"}, {"line": 6365, "zline": 6367, "decl": "limpNote", "en": "— they almost never fire. When they do, it's the goods. Don't get cute, kid.", "zh": "——他们几乎从不进攻。当他们出手时，那就是有货。别耍小聪明，孩子。", "kind": "sentence"}, {"line": 6369, "zline": 6371, "decl": "limpNote", "en": "On the river especially, passive players only bet when they've made something. This is a value bet.", "zh": "尤其在河牌，被动型玩家只有成牌时才下注。这是价值下注。", "kind": "sentence"}, {"line": 6370, "zline": 6372, "decl": "limpNote", "en": "On the river, passive players only bet when they've made something. That's pure value. Don't hero-call, kid.", "zh": "在河牌，被动型玩家只有成牌时才下注。那是纯价值。别做英雄式跟注，孩子。", "kind": "sentence"}, {"line": 6375, "zline": 6377, "decl": "limpNote", "en": "Low sample but their profile leans passive. Aggression from passive players tends to mean strength.", "zh": "样本量低但他们的档案偏被动。被动型玩家的进攻往往意味着有实力。", "kind": "sentence"}, {"line": 6376, "zline": 6378, "decl": "limpNote", "en": "Low sample but they look passive. When they fire, it usually means strength. Don't get stubborn, kid.", "zh": "样本量低但他们看起来很被动。当他们出手，通常意味着有实力。别固执，孩子。", "kind": "sentence"}, {"line": 6383, "zline": 6385, "decl": "limpNote", "en": "is a", "zh": "是一个", "kind": "term"}, {"line": 6383, "zline": 6385, "decl": "limpNote", "en": "— this call tells you nothing. Their hand range is still as wide as preflop. Do NOT bluff them. They call stations down to the river.", "zh": "——这个跟注说明不了什么。他们的手牌范围仍然和翻前一样宽。不要诈唬他们。他们会一路跟到底。", "kind": "sentence"}, {"line": 6384, "zline": 6386, "decl": "limpNote", "en": "is a", "zh": "是一个", "kind": "term"}, {"line": 6384, "zline": 6386, "decl": "limpNote", "en": "— this call tells you nothing. Range still wide as preflop. Do NOT bluff them. They'll call you down to the river, kid.", "zh": "——这个跟注什么都没告诉你。范围和翻前一样宽。不要诈唬他们。他们会一路跟到河牌，孩子。", "kind": "sentence"}, {"line": 6388, "zline": 6390, "decl": "limpNote", "en": "is passive and called. They're still on a wide range. Bluffing them is low-value.", "zh": "是被动的并跟注了。他们的范围仍然很宽。诈唬他们价值低。", "kind": "sentence"}, {"line": 6389, "zline": 6391, "decl": "limpNote", "en": "is passive and called. Range is still wide. Bluffing them is lighting money on fire, kid.", "zh": "是被动的并跟注了。范围仍然很宽。诈唬他们就是烧钱，孩子。", "kind": "sentence"}, {"line": 6399, "zline": 6401, "decl": "limpNote", "en": "is a", "zh": "是一个", "kind": "term"}, {"line": 6399, "zline": 6401, "decl": "limpNote", "en": "raising preflop (", "zh": "在翻牌前加注（", "kind": "term"}, {"line": 6399, "zline": 6401, "decl": "limpNote", "en": "% PFR over", "zh": "% PFR，", "kind": "term"}, {"line": 6399, "zline": 6401, "decl": "limpNote", "en": "hands). Their range is surgical — AA, KK, QQ, AK, maybe JJ or AQs. Unless you have a premium, this is a fold.", "zh": "手牌）。他们的范围非常精确——AA、KK、QQ、AK，也许JJ或AQs。除非你有顶级牌，否则这是弃牌。", "kind": "sentence"}, {"line": 6400, "zline": 6402, "decl": "limpNote", "en": "is a", "zh": "是一个", "kind": "term"}, {"line": 6400, "zline": 6402, "decl": "limpNote", "en": "raising preflop (", "zh": "在翻牌前加注（", "kind": "term"}, {"line": 6400, "zline": 6402, "decl": "limpNote", "en": "% PFR over", "zh": "% PFR，", "kind": "term"}, {"line": 6400, "zline": 6402, "decl": "limpNote", "en": "hands). Range is surgical — AA, KK, QQ, AK, maybe JJ or AQs. Unless you got a premium, you fold.", "zh": "手牌）。范围精确得像手术刀——AA、KK、QQ、AK，也许JJ或AQs。除非你有顶级牌，否则弃牌。", "kind": "sentence"}, {"line": 6405, "zline": 6407, "decl": "limpNote", "en": "has been betting", "zh": "一直在", "kind": "term"}, {"line": 6405, "zline": 6407, "decl": "limpNote", "en": "— multiple streets of aggression from a", "zh": "下注——来自一个", "kind": "sentence"}, {"line": 6405, "zline": 6407, "decl": "limpNote", "en": ". This is an extremely narrow value range. They are not bluffing.", "zh": "的多条街进攻。这是一个极其狭窄的价值范围。他们不是在诈唬。", "kind": "sentence"}, {"line": 6405, "zline": 6407, "decl": "limpNote", "en": "and", "zh": "和", "kind": "term"}, {"line": 6406, "zline": 6408, "decl": "limpNote", "en": "has been firin'", "zh": "一直在", "kind": "term"}, {"line": 6406, "zline": 6408, "decl": "limpNote", "en": "— that's multiple streets from a", "zh": "开火——来自一个", "kind": "sentence"}, {"line": 6406, "zline": 6408, "decl": "limpNote", "en": ". Razor-narrow value range. They ain't bluffing. Duke's seen this a thousand times.", "zh": "的多条街。极窄的价值范围。他们不是在诈唬。杜克见过一千次了。", "kind": "sentence"}, {"line": 6406, "zline": 6408, "decl": "limpNote", "en": "and", "zh": "和", "kind": "term"}, {"line": 6412, "zline": 6414, "decl": "limpNote", "en": "is a", "zh": "是一个", "kind": "term"}, {"line": 6412, "zline": 6414, "decl": "limpNote", "en": "betting the river. There are no draws left to protect against — a tight player betting here has a made hand, period. Sets, two pair, or strong top pair. Fold unless you have something equivalent or better.", "zh": "在河牌下注。已经没有什么听牌可以防了——紧手在这里下注就是有成牌，没得商量。三条、两对或强顶对。弃牌，除非你有同等或更好的牌。", "kind": "sentence"}, {"line": 6413, "zline": 6415, "decl": "limpNote", "en": "is a", "zh": "是一个", "kind": "term"}, {"line": 6413, "zline": 6415, "decl": "limpNote", "en": "betting the river. Ain't no draws left to hide behind — tight player firin' here has got a made hand, period. Sets, two pair, or strong top pair. Fold unless yous got something that beats that.", "zh": "在河牌下注。没有听牌可以躲了——紧手在这里开火就是有成牌，没得商量。三条、两对或强顶对。弃牌，除非你有比那更好的牌。", "kind": "sentence"}, {"line": 6418, "zline": 6420, "decl": "limpNote", "en": "is a", "zh": "是一个", "kind": "term"}, {"line": 6418, "zline": 6420, "decl": "limpNote", "en": "betting postflop. Their betting range is very narrow — sets, two pair, or top pair top kicker at minimum. Believe them.", "zh": "在翻后下注。他们的下注范围非常窄——至少是三条、两对或顶对顶踢。相信他们。", "kind": "sentence"}, {"line": 6419, "zline": 6421, "decl": "limpNote", "en": "is a", "zh": "是一个", "kind": "term"}, {"line": 6419, "zline": 6421, "decl": "limpNote", "en": "betting postflop. Range is tight — sets, two pair, or top pair top kicker at minimum. Believe them.", "zh": "在翻后下注。范围很紧——至少是三条、两对或顶对顶踢。相信他们。", "kind": "sentence"}, {"line": 6427, "zline": 6429, "decl": "limpNote", "en": "bet", "zh": "在", "kind": "term"}, {"line": 6427, "zline": 6429, "decl": "limpNote", "en": "but is calling now — tight players don't slow-play often, but when they do it's a monster. Treat this with serious respect.", "zh": "下注但现在跟注——紧手不常慢打，但当他们这样做时，那是怪兽牌。认真对待。", "kind": "sentence"}, {"line": 6428, "zline": 6430, "decl": "limpNote", "en": "bet", "zh": "在", "kind": "term"}, {"line": 6428, "zline": 6430, "decl": "limpNote", "en": "but is calling now — tight players don't slow-play often, but when they do it's a monster. Treat this with respect.", "zh": "下注但现在跟注——紧手不常慢打，但当他们这样做时，那是怪兽牌。尊重这一点。", "kind": "sentence"}, {"line": 6432, "zline": 6434, "decl": "limpNote", "en": "called on the river. Tight players don't call rivers without a made hand — top pair or better. There are no draws to chase anymore.", "zh": "在河牌跟注。紧手不会在没有成牌的情况下跟注河牌——顶对或更好。已经没有听牌可以追了。", "kind": "sentence"}, {"line": 6433, "zline": 6435, "decl": "limpNote", "en": "called on the river. Tight players don't call rivers without a made hand — top pair or better. No draws left.", "zh": "在河牌跟注。紧手不会在没有成牌的情况下跟注河牌——顶对或更好。没有听牌了。", "kind": "sentence"}, {"line": 6436, "zline": 6438, "decl": "limpNote", "en": "They have called multiple streets — their range is narrowing fast. Expect a real hand.", "zh": "他们跟注了多条街——范围正在快速收窄。期待一手真牌。", "kind": "sentence"}, {"line": 6438, "zline": 6440, "decl": "limpNote", "en": "called. Tight players don't call without decent equity. They have a real hand — top pair or a strong draw.", "zh": "跟注。紧手不会在没有足够胜率的情况下跟注。他们有一手真牌——顶对或强听牌。", "kind": "sentence"}, {"line": 6439, "zline": 6441, "decl": "limpNote", "en": "called. Tight players don't call without equity. They got a real hand — top pair or a strong draw.", "zh": "跟注。紧手没有胜率不会跟注。他们有真牌——顶对或强听牌。", "kind": "sentence"}, {"line": 6454, "zline": 6456, "decl": "limpNote", "en": "has barreled every street including the river.", "zh": "每条街都开枪了包括河牌。", "kind": "sentence"}, {"line": 6454, "zline": 6456, "decl": "limpNote", "en": "Even maniacs narrow their range over three streets — but their bluff frequency stays high. Call with any pair or better unless you have a clear reason to fold.", "zh": "即使是疯子也会在三条街后收紧范围——但他们的诈唬频率仍然很高。用任何对子或更好的牌跟注，除非你有明确的理由弃牌。", "kind": "sentence"}, {"line": 6455, "zline": 6457, "decl": "limpNote", "en": "has barreled every street including the river.", "zh": "每条街都开枪了包括河牌。", "kind": "sentence"}, {"line": 6455, "zline": 6457, "decl": "limpNote", "en": "Even maniacs tighten up over three streets, but they still bluff plenty. Call with any pair or better unless you got a clear reason to fold.", "zh": "即使是疯子也会在三条街后收紧，但他们仍然会大量诈唬。用任何对子或更好的牌跟注，除非你有明确的理由弃牌。", "kind": "sentence"}, {"line": 6461, "zline": 6463, "decl": "limpNote", "en": "is a", "zh": "是一个", "kind": "term"}, {"line": 6461, "zline": 6463, "decl": "limpNote", "en": "betting", "zh": "在河牌下注", "kind": "term"}, {"line": 6461, "zline": 6463, "decl": "limpNote", "en": "on the river.", "zh": "。", "kind": "term"}, {"line": 6461, "zline": 6463, "decl": "limpNote", "en": "This is exactly when they bluff — no more cards, last chance to push you off. Unless you're drawing dead, a call is usually right.", "zh": "这正是他们诈唬的时候——没有更多牌了，最后的机会把你打飞。除非你已经死了，跟注通常是对的。", "kind": "sentence"}, {"line": 6462, "zline": 6464, "decl": "limpNote", "en": "is a", "zh": "是一个", "kind": "term"}, {"line": 6462, "zline": 6464, "decl": "limpNote", "en": "betting", "zh": "在河牌下注", "kind": "term"}, {"line": 6462, "zline": 6464, "decl": "limpNote", "en": "on the river.", "zh": "。", "kind": "term"}, {"line": 6462, "zline": 6464, "decl": "limpNote", "en": "This is their last shot to bluff — no cards left. Unless you're dead, a call is usually right.", "zh": "这是他们最后的诈唬机会——没有牌了。除非你已经死了，跟注通常是对的。", "kind": "sentence"}, {"line": 6465, "zline": 6467, "decl": "limpNote", "en": "is a", "zh": "是一个", "kind": "term"}, {"line": 6465, "zline": 6467, "decl": "limpNote", "en": "firing on the river.", "zh": "在河牌开火。", "kind": "term"}, {"line": 6465, "zline": 6467, "decl": "limpNote", "en": "River bets from maniacs are weighted toward bluffs — they can't win at showdown, so they have to bet.", "zh": "疯子在河牌的下注偏向诈唬——他们不能在摊牌中赢，所以必须下注。", "kind": "sentence"}, {"line": 6466, "zline": 6468, "decl": "limpNote", "en": "is a", "zh": "是一个", "kind": "term"}, {"line": 6466, "zline": 6468, "decl": "limpNote", "en": "firing on the river.", "zh": "在河牌开火。", "kind": "term"}, {"line": 6466, "zline": 6468, "decl": "limpNote", "en": "River bets from maniacs skew bluff — they can't win at showdown, so they gotta bet.", "zh": "疯子在河牌的下注偏向诈唬——他们不能在摊牌中赢，所以他们必须下注。", "kind": "sentence"}, {"line": 6476, "zline": 6478, "decl": "limpNote", "en": "is a", "zh": "是一个", "kind": "term"}, {"line": 6476, "zline": 6478, "decl": "limpNote", "en": "betting", "zh": "下注", "kind": "term"}, {"line": 6476, "zline": 6478, "decl": "limpNote", "en": "Do not auto-fold — this sizing means nothing on its own.", "zh": "不要自动弃牌——这个尺寸本身不代表什么。", "kind": "sentence"}, {"line": 6477, "zline": 6479, "decl": "limpNote", "en": "is a", "zh": "是一个", "kind": "term"}, {"line": 6477, "zline": 6479, "decl": "limpNote", "en": "betting", "zh": "下注", "kind": "term"}, {"line": 6477, "zline": 6479, "decl": "limpNote", "en": "Don't auto-fold — this sizing means nothing on its own.", "zh": "别自动弃牌——这个尺寸本身不代表什么。", "kind": "sentence"}, {"line": 6480, "zline": 6482, "decl": "limpNote", "en": "is a", "zh": "是一个", "kind": "term"}, {"line": 6480, "zline": 6482, "decl": "limpNote", "en": "Their aggression does not mean strength.", "zh": "他们的进攻不代表有实力。", "kind": "sentence"}, {"line": 6481, "zline": 6483, "decl": "limpNote", "en": "is a", "zh": "是一个", "kind": "term"}, {"line": 6481, "zline": 6483, "decl": ": "敏锐型玩家跟注河牌。他们相信自己有最好的牌——没有更多听牌了，没有更多牌了。真牌。", "kind": "sentence"}, {"line": 6571, "zline": 6573, "decl": "limpNote", "en": "Multi-street calling from a TAG is extremely narrow — they're building a pot on purpose.", "zh": "来自TAG的多条街跟注极其窄——他们在刻意造池。", "kind": "sentence"}, {"line": 6573, "zline": 6575, "decl": "limpNote", "en": "is a Sharp player with a", "zh": "是一个敏锐型玩家，慢打率", "kind": "sentence"}, {"line": 6573, "zline": 6575, "decl": "limpNote", "en": "% slowplay rate. A flat call from them could be a trap.", "zh": "%。来自他们的平跟可能是个陷阱。", "kind": "sentence"}, {"line": 6574, "zline": 6576, "decl": "limpNote", "en": "is a Sharp player with a", "zh": "是一个敏锐型玩家，慢打率", "kind": "sentence"}, {"line": 6574, "zline": 6576, "decl": "limpNote", "en": "% slowplay rate. A flat call from them could be a trap.", "zh": "%。来自他们的平跟可能是个陷阱。", "kind": "sentence"}, {"line": 6574, "zline": 6576, "decl": "limpNote", "en": "Stay sharp.", "zh": "保持警觉。", "kind": "term"}, {"line": 6578, "zline": 6580, "decl": "limpNote", "en": "They have called multiple streets — range is strong.", "zh": "他们跟注了多条街——范围很强。", "kind": "sentence"}, {"line": 6580, "zline": 6582, "decl": "limpNote", "en": "Sharp player calling — they have the equity or a strong hand. Don't bluff into them.", "zh": "敏锐型玩家跟注——他们有胜率或强牌。不要诈唬他们。", "kind": "sentence"}, {"line": 6581, "zline": 6583, "decl": "limpNote", "en": "Sharp player calling — they got the equity or a strong hand. Don't bluff into them.", "zh": "敏锐型玩家跟注——他们有胜率或强牌。不要诈唬他们。", "kind": "sentence"}, {"line": 6589, "zline": 6591, "decl": "limpNote", "en": "is Cautious — they almost never bet without a real hand. This bet is a strong signal.", "zh": "是谨慎型——没有真牌他几乎不下注。这注是很强的信号。", "kind": "sentence"}, {"line": 6589, "zline": 6591, "decl": "limpNote", "en": "Bet size:", "zh": "下注尺度：", "kind": "term"}, {"line": 6590, "zline": 6592, "decl": "limpNote", "en": "is Cautious — they almost never bet without a real hand. This bet is a strong signal. Respect it, kid.", "zh": "是谨慎型——没有真牌他几乎不下注。这 e a river caller.", "zh": "%，小子。他们是河牌跟注者。", "kind": "sentence"}, {"line": 9047, "zline": 9049, "decl": "computeBluffGreenScore", "en": "Maniac — unpredictable and aggressive. They will not fold to pressure.", "zh": "疯子——不可预测且进攻性强。他们不会对压力弃牌。", "kind": "sentence"}, {"line": 9048, "zline": 9050, "decl": "computeBluffGreenScore", "en": "Maniac at the table — yous bluffin\\' them is just handin\\' your chips over. Don\\'t do it.", "zh": "桌上有疯子——你诈唬他们就是在把筹码送过去。别这么做。", "kind": "sentence"}, {"line": 9053, "zline": 9055, "decl": "computeBluffGreenScore", "en": "Calling station — they call everything down. Bluffing them is just donating chips.", "zh": "跟注站——他们什么都会跟到底。诈唬他们就是在送筹码。", "kind": "sentence"}, {"line": 9054, "zline": 9056, "decl": "computeBluffGreenScore", "en": "Calling station in the hand. Bluffin\\' them ain\\'t a play — it\\'s a donation, pal. Duke don\\'t bluff callers.", "zh": "手牌里有跟注站。诈唬他们不是打法——是在捐款，伙计。Duke 不诈唬跟注者。", "kind": "sentence"}, {"line": 9059, "zline": 9061, "decl": "computeBluffGreenScore", "en": "Fish on the river — they called this far to see cards. They are not folding now.", "zh": "河牌上有鱼——他们跟了这么远就是为了看牌。现在他们不会弃牌的。", "kind": "sentence"}, {"line": 9060, "zline": 9062, "decl": "computeBluffGreenScore", "en": "Fish on the river. They ain\\'t callin\\' three streets to lay it down now — Duke\\'s seen this a thousand times. Don\\'t bluff.", "zh": "河牌有鱼。他们不会跟注三条街然后现在弃牌——Duke 见过一千次了。别诈唬。", "kind": "sentence"}, {"line": 9065, "zline": 9067, "decl": "computeBluffGreenScore", "en": "Opponent goes to showdown", "zh": "对手", "kind": "sentence"}, {"line": 9065, "zline": 9067, "decl": "computeBluffGreenScore", "en": "% — they are not folding.", "zh": "% 到摊牌——他们不会弃牌的。", "kind": "sentence"}, {"line": 9066, "zline": 9068, "decl": "computeBluffGreenScore", "en": "Opponent calls", "zh": "对手", "kind": "term"}, {"line": 9066, "zline": 9068, "decl": "computeBluffGreenScore", "en": "% to showdown. They are not folding this, pal.", "zh": "% 跟注到摊牌。他们不会弃掉这个的，伙计。", "kind": "sentence"}, {"line": 9071, "zline": 9073, "decl": "computeBluffGreenScore", "en": "Three or more players in the pot — bluff equity collapses multiway.", "zh": "底池里有三个或更多玩家——多人池的诈唬 equity 崩溃。", "kind": "sentence"}, {"line": 9072, "zline": 9074, "decl": "computeBluffGreenScore", "en": "Three or more players in this pot. Bluffing into a crowd is just burning chips, pal.", "zh": "这个底池有三个或更多玩家。朝人群诈唬就是在烧筹码，伙计。", "kind": "sentence"}, {"line": 9077, "zline": 9079, "decl": "computeBluffGreenScore", "en": "Pure bluff on the river into a", "zh": "河牌上纯诈唬一个", "kind": "sentence"}, {"line": 9077, "zline": 9079, "decl": "computeBluffGreenScore", "en": "% showdown caller. They will not fold.", "zh": "% 的摊牌跟注者。他们不会弃牌的。", "kind": "sentence"}, {"line": 9078, "zline": 9080, "decl": "computeBluffGreenScore", "en": "River pure bluff into a", "zh": "河牌纯诈唬一个", "kind": "sentence"}, {"line": 9078, "zline": 9080, "decl": "computeBluffGreenScore", "en": "% showdown caller. They are calling you down, kid.", "zh": "% 的摊牌跟注者。他们会跟注你到底，小子。", "kind": "sentence"}, {"line": 9083, "zline": 9085, "decl": "computeBluffGreenScore", "en": "Opponent only folds", "zh": "对手在河牌只有", "kind": "term"}, {"line": 9083, "zline": 9085, "decl": "computeBluffGreenScore", "en": "% on the river — pure bluff here is burning chips.", "zh": "% 弃牌率——这里纯诈唬是在烧筹码。", "kind": "sentence"}, {"line": 9084, "zline": 9086, "decl": "computeBluffGreenScore", "en": "Opponent folds", "zh": "对手在河牌弃牌", "kind": "term"}, {"line": 9084, "zline": 9086, "decl": "computeBluffGreenScore", "en": "% on the river, kid. Pure bluff here is just giving chips away.", "zh": "%，小子。这里纯诈唬就是在白送筹码。", "kind": "sentence"}, {"line": 9089, "zline": 9091, "decl": "computeBluffGreenScore", "en": "Opponent only folds", "zh": "对手在转牌只有", "kind": "term"}, {"line": 9089, "zline": 9091, "decl": "computeBluffGreenScore", "en": "% to turn bets — they are not folding this street.", "zh": "% 弃牌率——他们这条街不会弃牌的。", "kind": "sentence"}, {"line": 9090, "zline": 9092, "decl": "computeBlu op then bet turn — likely a slow-played strong hand.", "zh": "过牌翻牌然后下注转牌——可能是慢打的强牌。", "kind": "sentence"}, {"line": 10420, "zline": 10422, "decl": "interpretOpponentLine", "en": "Nit skipped the flop and came out firing — classic trap. Be careful.", "zh": "Nit 跳过了翻牌然后开火——经典陷阱。小心。", "kind": "sentence"}, {"line": 10424, "zline": 10426, "decl": "interpretOpponentLine", "en": "Checked flop, betting now — potential trap or a delayed c-bet.", "zh": "过牌了翻牌，现在下注——可能是陷阱或延迟 c-bet。", "kind": "sentence"}, {"line": 10425, "zline": 10427, "decl": "interpretOpponentLine", "en": "Skipped the flop bet, now pulling the trigger — could be a trap or a delayed c-bet.", "zh": "跳过了翻牌下注，现在扣动扳机——可能是陷阱或延迟 c-bet。", "kind": "sentence"}, {"line": 10432, "zline": 10434, "decl": "interpretOpponentLine", "en": "Passive caller now betting — likely hit something or has a strong draw.", "zh": "被动的跟注者现在下注了——可能中了什么或有强听牌。", "kind": "sentence"}, {"line": 10433, "zline": 10435, "decl": "interpretOpponentLine", "en": "The calling station woke up — they hit something or have a big draw. Take it seriously.", "zh": "跟注站醒了——他们中了什么或有个大听牌。认真对待。", "kind": "sentence"}, {"line": 10437, "zline": 10439, "decl": "interpretOpponentLine", "en": "Called flop, now betting — floated with position or has a strong draw.", "zh": "跟了翻牌，现在下注——有位置 float 了或有强听牌。", "kind": "sentence"}, {"line": 10438, "zline": 10440, "decl": "interpretOpponentLine", "en": "Called the flop, now betting — float play or a strong draw getting aggressive.", "zh": "跟了翻牌，现在下注——float 打法或强听牌变激进了。", "kind": "sentence"}, {"line": 10444, "zline": 10446, "decl": "interpretOpponentLine", "en": "Called two streets, now raising — classic slowplay or just rivered a hand.", "zh": "跟了两条街，现在加注——经典慢打或刚在河牌成牌。", "kind": "sentence"}, {"line": 10445, "zline": 10447, "decl": "interpretOpponentLine", "en": "Two streets of calls and now a raise — slowplay or rivered something big. Danger signal.", "zh": "两条街跟注现在加注——慢打或在河牌中了大的。危险信号。", "kind": "sentence"}, {"line": 10452, "zli , "decl": "interpretOpponentLine", "en": "Aggressor c-bet — could be air or strong. Wide range on the flop.", "zh": "进攻者 c-bet——可能是空气或强牌。翻牌范围很宽。", "kind": "sentence"}, {"line": 10483, "zline": 10485, "decl": "interpretOpponentLine", "en": "Maniac c-bet — could be anything. Wait for the turn before reading too deep.", "zh": "疯子 c-bet——可能是任何东西。等转牌再看太深。", "kind": "sentence"}, {"line": 10486, "zline": 10488, "decl": "interpretOpponentLine", "en": "Raised preflop and bet the flop — standard c-bet range, wide possibilities.", "zh": "翻前加注并在翻牌下注——标准 c-bet 范围，可能性很广。", "kind": "sentence"}, {"line": 10487, "zline": 10489, "decl": "interpretOpponentLine", "en": "Raised and bet the flop — c-bet range, could be strong or just protecting.", "zh": "加注并下注翻牌——c-bet 范围，可能是强牌或只是保护。", "kind": "sentence"}, {"line": 10493, "zline": 10495, "decl": "interpretOpponentLine", "en": "Preflop raiser skipped the c-bet — likely missed the flop.", "zh": "翻前加注者跳过了 c-bet——可能没中翻牌。", "kind": "sentence"}, {"line": 10494, "zline": 10496, "decl": "interpretOpponentLine", "en": "Nit raised preflop but checked the flop — board probably missed them.", "zh": "Nit 翻前加注但过牌翻牌——牌面可能没中他们。", "kind": "sentence"}, {"line": 10497, "zline": 10499, "decl": "interpretOpponentLine", "en": "Preflop raiser checked the flop — missed their c-bet spot or slowing down.", "zh": "翻前加注者过牌了翻牌——错过了 c-bet 机会或放慢了。", "kind": "sentence"}, {"line": 10498, "zline": 10500, "decl": "interpretOpponentLine", "en": "Raised then went quiet on the flop — missed or decided to trap. Play carefully.", "zh": "加注后在翻牌安静了——没中或决定设陷阱。小心打。", "kind": "sentence"}, {"line": 10504, "zline": 10506, "decl": "interpretOpponentLine", "en": "Preflop caller leading out — likely hit the flop or has a draw.", "zh": "翻前跟注者领打——可能中了翻牌或有听牌。", "kind": "sentence"}, {"line": 10505, "zline": 10507, "decl": "interpretOpponentLine", "en": "Fish led into the flop — they hit something or have a draw they like.", "zh": "鱼领打翻牌——他们中了什么或有个他们喜欢的听牌。", "kind": "sentence"}, {"line": 105  without a real hand.", "zh": "Nit check-raise——没有真牌他们几乎从不这样。", "kind": "sentence"}, {"line": 10537, "zline": 10539, "decl": "interpretOpponentLine", "en": "Called preflop then raised the flop — connected hard or semi-bluffing a big draw.", "zh": "翻前跟注然后在翻牌加注——强连接或半诈唬大听牌。", "kind": "sentence"}, {"line": 10538, "zline": 10540, "decl": "interpretOpponentLine", "en": "Flat called then raised the flop — hit the board hard or has a strong draw.", "zh": "平跟然后在翻牌加注——中了牌面或有大听牌。", "kind": "sentence"}, {"line": 10544, "zline": 10546, "decl": "interpretOpponentLine", "en": "Preflop raiser just called the flop — likely has a strong hand slow-playing or a draw.", "zh": "翻前加注者只是在翻牌跟注——可能是慢打强牌或有听牌。", "kind": "sentence"}, {"line": 10545, "zline": 10547, "decl": "interpretOpponentLine", "en": "Nit raised then just called — slowplay or picked up a draw. Watch the turn.", "zh": "Nit 加注然后只是跟注——慢打或抓了个听牌。注意转牌。", "kind": "sentence"}, {"line": 10548, "zline": 10550, "decl": "interpretOpponentLine", "en": "Preflop raiser called the flop bet — range includes strong made hands and draws.", "zh": "翻前加注者跟了翻牌下注——范围包括强成牌和听牌。", "kind": "sentence"}, {"line": 10549, "zline": 10551, "decl": "interpretOpponentLine", "en": "Raised preflop then just called — range is wide, but don't rule out a trap.", "zh": "翻前加注然后只是跟注——范围宽，但别排除陷阱。", "kind": "sentence"}, {"line": 10555, "zline": 10557, "decl": "interpretOpponentLine", "en": "Raised preflop and raised again on the flop — very tight player with two streets of aggression usually has it.", "zh": "翻前加注并在翻牌再次加注——非常紧的玩家两条街的进攻通常有牌。", "kind": "sentence"}, {"line": 10556, "zline": 10558, "decl": "interpretOpponentLine", "en": "Nit is raising twice — almost certainly the nuts or top set.", "zh": "Nit 加注两次——几乎肯定是 nuts 或顶三条。", "kind": "sentence"}, {"line": 10559, "zline": 10561, "decl": "interpretOpponentLine", "en": "Two raises on different streets — polarised, strong hand or a committed bluff.", "zh": "不同街两次加注——极化，强牌或执着的诈唬。", "kind": "sentence"}, {"line": 10560, "zline": 10562, "decl": "interpretOpponentLine", "en": "Raised twice — either they've got a monster or they're committed to the bluff.", "zh": "加注两次——要么他们有怪兽牌，要么他们诈唬到底了。", "kind": "sentence"}, {"line": 10566, "zline": 10568, "decl": "interpretOpponentLine", "en": "Raised preflop, called flop, now betting — delayed aggression, often a strong draw or slow-played hand.", "zh": "翻前加注，跟注翻牌，现在下注——延迟进攻，通常是强听牌或慢打的牌。", "kind": "sentence"}, {"line": 10567, "zline": 10569, "decl": "interpretOpponentLine", "en": "Raised then called, now coming out — delayed c-bet or they've got a hand now.", "zh": "加注然后跟注，现在出来——延迟 c-bet 或他们现在有牌了。", "kind": "sentence"}, {"line": 10573, "zline": 10575, "decl": "interpretOpponentLine", "en": "Preflop raiser called flop and checked turn — tight player going passive, likely gave up or has a marginal hand.", "zh": "翻前加注者跟了翻牌并过牌转牌——紧手变被动，可能放弃了或边缘牌。", "kind": "sentence"}, {"line": 10574, "zline": 10576, "decl": "interpretOpponentLine", "en": "Nit raised, called, then went quiet — probably gave up. Board hit you harder.", "zh": "Nit 加注、跟注、然后安静了——可能放弃了。牌面对你打击更狠。", "kind": "sentence"}, {"line": 10577, "zline": 10579, "decl": "interpretOpponentLine", "en": "Raised preflop, called flop, checked turn — passive line, could be pot control or giving up.", "zh": "翻前加注，跟注翻牌，过牌转牌——被动线路，可能是底池控制或放弃。", "kind": "sentence"}, {"line": 10578, "zline": 10580, "decl": "interpretOpponentLine", "en": "Raised then went passive on the turn — pot control or they're done with the hand.", "zh": "加注后在转牌变被动——底池控制或他们和这手牌没关系了。", "kind": "sentence"}, {"line": 10584, "zline": 10586, "decl": "interpretOpponentLine", "en": "Raised preflop, called flop, now raising — classic slow-play finally showing up. Strong range.", "zh": "翻前加注，跟注翻牌，现在加注——经典慢打终于现身了。强范围。", "kind": "sentence"}, {"line": 10585, "zline": 10587, "decl": "interpretOpponentLine", "en": "Raised preflop, called flop, now raising — they were slow-playing. Strong hand.", "zh": "翻前加注，跟注翻牌，现在加注——他们在慢打。强牌。", "kind": "sentence"}, {"line": 10591, "zline": 10593, "decl": "interpretOpponentLine", "en": "Passive caller woke up on the turn — hit the board or has a strong draw they're done slow-playing.", "zh": "被动跟注者在转牌醒了——中了牌面或有强听牌不再慢打了。", "kind": "sentence"}, {"line": 10592, "zline": 10594, "decl": "interpretOpponentLine", "en": "Fish called twice and now leads out — hit something real. Take it seriously.", "zh": "鱼跟了两次现在领打——中了真的东西。认真对待。", "kind": "sentence"}, {"line": 10595, "zline": 10597, "decl": "interpretOpponentLine", "en": "Called two streets, now leading out — often a made hand that improved, or a draw with enough equity to bet.", "zh": "跟了两条街，现在领打——通常是提升了的成牌，或有足够 equity 下注的听牌。", "kind": "sentence"}, {"line": 10596, "zline": 10598, "decl": "interpretOpponentLine", "en": "Called twice then bet — either improved or done waiting. Range is strong here.", "zh": "跟了两次然后下注——要么提升了要么等够了。这里范围很强。", "kind": "sentence"}, {"line": 10602, "zline": 10604, "decl": "interpretOpponentLine", "en": "Three streets of passive play — medium made hand or a draw that bricked. Vulnerable to a bet.", "zh": "三条街被动打法——中等成牌或没中的听牌。容易受到下注攻击。", "kind": "sentence"}, {"line": 10603, "zline": 10605, "decl": "interpretOpponentLine", "en": "Called twice and now checks — passive all the way, probably weak or a missed draw.", "zh": "跟了两次现在过牌——一直被动，可能是弱牌或没中的听牌。", "kind": "sentence"}, {"line": 10609, "zline": 10611, "decl": "interpretOpponentLine", "en": "Checked preflop then bet two streets — aggressive player building a pot, wide range.", "zh": "过牌翻前然后在两条街下注——进攻型玩家在造池，范围宽。", "kind": "sentence"}, {"line": 10610, "zline": 10612, "decl": "interpretOpponentLine", "en": "Checked then fired twice — could be strong or a standard aggression pattern for them.", "zh": "过牌然后开火两次——可能是强牌或对他们来说的标准进攻模式。", "kind": "sentence"}, {"line": 10613, "zline": 10615, "decl": "interpretOpponentLine", "en": "Checked preflop but bet flop and turn — connected with the board, likely a strong made hand or draw.", "zh": "过牌翻前但下注翻牌和转牌——连接了牌面，可能是强成牌或听牌。", "kind": "sentence"}, {"line": 10614, "zline": 10616, "decl": "interpretOpponentLine", "en": "Checked then came out firing twice — hit the board hard or has a big draw.", "zh": "过牌然后出来开火两次——中了牌面或有大听牌。", "kind": "sentence"}, {"line": 10620, "zline": 10622, "decl": "interpretOpponentLine", "en": "Checked twice, now betting — tight player waking up on the river usually means a real hand.", "zh": "过牌了两次，现在下注——紧手在河牌醒来通常意味着真有牌。", "kind": "sentence"}, {"line": 10621, "zline": 10623, "decl": "interpretOpponentLine", "en": "Nit went quiet for two streets then bet — slow-play or just hit the river. Be careful.", "zh": "Nit 安静了两条街然后下注——慢打或刚在河牌中了。小心。", "kind": "sentence"}, {"line": 10624, "zline": 10626, "decl": "interpretOpponentLine", "en": "Two checks then a bet — could be a slow-play that paid off, or a weak stab after showing passivity.", "zh": "两次过牌然后下注——可能是慢打兑现了，或展示被动后的软弱一刺。", "kind": "sentence"}, {"line": 10625, "zline": 10627, "decl": "interpretOpponentLine", "en": "Checked twice then bet — possible slow-play or a desperation stab. Read the river card.", "zh": "过牌两次然后下注——可能的慢打或绝望一刺。看河牌是什么。", "kind": "sentence"}, {"line": 10631, "zline": 10633, "decl": "interpretOpponentLine", "en": "Checked then raised — tight player check-raising is almost always a strong hand.", "zh": "过牌然后加注——紧手 check-raise 几乎总是强牌。", "kind": "sentence"}, {"line": 10632, "zline": 10634, "decl": "interpretOpponentLine", "en": "Nit check-raised — that's a monster. Fold everything marginal.", "zh": "Nit check-raise 了——那是怪兽牌。弃掉所有边缘牌。", "kind": "sentence"}, {"line": 10635, "zline": 10637, "decl": "interpretOpponentLine", "en": "Check-raised — strong hand or a semi-bluff with a big draw.", "zh": "Check-raise 了——强牌或有大听牌的半诈唬。", "kind": "sentence"}, {"line": 10636, "zline": 10638, "decl": "interpretOpponentLine", "en": "Check-raised — could be a big hand or a semi-bluff. Either way, their range is strong.", "zh": "Check-raise 了——可能是大牌或半诈唬。无论如何，他们的范围很强。", "kind": "sentence"}, {"line": 10642, "zline": 10644, "decl": "interpretOpponentLine", "en": "Checked then called — passive line, range is wide from a draw to a slow-played hand.", "zh": "过牌然后跟注——被动线路，范围很宽，从听牌到慢打的牌都有可能。", "kind": "sentence"}, {"line": 10643, "zline": 10645, "decl": "interpretOpponentLine", "en": "Checked then called — could be a draw, pot control, or setting a trap.", "zh": "过牌然后跟注——可能是听牌、底池控制或设陷阱。", "kind": "sentence"}, {"line": 10649, "zline": 10651, "decl": "interpretOpponentLine", "en": "Passive both streets — weak hand or a slow-play. Safe to bet for value or to bluff.", "zh": "两条街都被动——弱牌或慢打。安全的价值下注或诈唬。", "kind": "sentence"}, {"line": 10650, "zline": 10652, "decl": "interpretOpponentLine", "en": "Checked twice — likely weak or hoping someone else bets for them.", "zh": "过了两次牌——很可能是弱牌或希望别人为他们下注。", "kind": "sentence"}, {"line": 10656, "zline": 10658, "decl": "interpretOpponentLine", "en": "Raised preflop, bet flop, now raising — very strong range or a total bluff. High-stakes spot.", "zh": "翻前加注，翻牌下注，现在再加注——非常强的范围或完全诈唬。高 stakes 局面。", "kind": "sentence"}, {"line": 10657, "zline": 10659, "decl": "interpretOpponentLine", "en": "Three streets of escalating aggression — they've got the nuts or they're committed to the story.", "zh": "三条街不断升级的进攻——他们有坚果牌或完全投入了故事情节。", "kind": "sentence"}, {"line": 10663, "zline": 10665, "decl": "interpretOpponentLine", "en": "Tight player with two raises and a bet — almost certainly the nuts.", "zh": "紧手玩家两次加注并下注——几乎肯定是坚果牌。", "kind": "sentence"}, {"line": 10664, "zline": 10666, "decl": "interpretOpponentLine", "en": "Nit raised twice and now bets — just fold unless you have the stone nuts.", "zh": "Nit 加注两次现在下注——除非你有坚不可摧的坚果牌，否则就弃牌。", "kind": "sentence"}, {"line": 10667, "zline": 10669, "decl": "interpretOpponentLine", "en": "Raised flop, raised again, now betting — extremely strong range or polarised bluff.", "zh": "翻牌加注，再次加注，现在下注——极其强的范围或极化诈唬。", "kind": "sentence"}, {"line": 10668, "zline": 10670, "decl": "interpretOpponentLine", "en": "Two raises then a bet — big hand or total bluff. Nothing in between.", "zh": "两次加注然后下注——大牌或完全诈唬。没有中间地带。", "kind": "sentence"}, {"line": 10674, "zline": 10676, "decl": "interpretOpponentLine", "en": "Donk-bet the flop then checked turn — could have been a blocking bet or a draw that lost confidence.", "zh": "翻牌 donk 下注然后转牌过牌——可能是阻挡下注或失去信心的听牌。", "kind": "sentence"}, {"line": 10675, "zline": 10677, "decl": "interpretOpponentLine", "en": "Led the flop then went quiet — blocking bet or a draw they don't want to over-commit with.", "zh": "领打翻牌然后安静了——阻挡下注或不想过度投入的听牌。", "kind": "sentence"}, {"line": 10681, "zline": 10683, "decl": "interpretOpponentLine", "en": "Called preflop, raised flop, now betting — strong hand building the pot aggressively.", "zh": "翻前跟注，翻牌加注，现在下注——强牌在激进地建造底池。", "kind": "sentence"}, {"line": 10682, "zline": 10684, "decl": "interpretOpponentLine", "en": "Raised the flop and kept firing — strong hand or a very committed bluff.", "zh": "加注了翻牌并继续开火——强牌或非常坚定的诈唬。", "kind": "sentence"}, {"line": 10988, "zline": 10990, "decl": "facingRaise", "en": "SESSION FOCUS: Two leaks compounding here — you play too many hands (", "zh": "本局重点：两个漏洞在这里叠加——你玩太多牌了（", "kind": "sentence"}, {"line": 10988, "zline": 10990, "decl": "facingRaise", "en": "% VPIP) AND call raises too wide (", "zh": "% VPIP）并且跟注加注太宽（", "kind": "sentence"}, {"line": 10988, "zline": 10990, "decl": "facingRaise", "en": "% gap). This exact spot is where your chips leak. → FOLD.", "zh": "% gap）。这个局面正是你的筹码流失的地方。→ 弃牌。", "kind": "sentence"}, {"line": 10989, "zline": 10991, "decl": "facingRaise", "en": "SESSION FOCUS: Two leaks bleeding you out right here — your VPIP is", "zh": "本局重点：两个漏洞就在这里让你流血——你的 VPIP 是", "kind": "sentence"}, {"line": 10989, "zline": 10991, "decl": "facingRaise", "en": "% which means you play every hand like a sucker, AND you call raises too wide (", "zh": "%，意味着你像个傻瓜一样每手牌都玩，而且你跟注加注太宽（", "kind": "sentence"}, {"line": 10989, "zline": 10991, "decl": "facingRaise", "en": "% gap). This exact spot is where your money walks out the door. → FOLD.", "zh": "% gap）。这个局面正是你的钱出门的地方。→ 弃牌。", "kind": "sentence"}, {"line": 10994, "zline": 10996, "decl": "facingRaise", "en": "Your VPIP is", "zh": "你的 VPIP 是", "kind": "term"}, {"line": 10994, "zline": 10996, "decl": "facingRaise", "en": "% — you're playing too many hands. This weak hand is exactly the kind you need to stop entering pots with. → FOLD.", "zh": "%——你玩太多牌了。这手弱牌正是你需要停止入池的那种。→ 弃牌。", "kind": "sentence"}, {"line": 10995, "zline": 10997, "decl": "facingRaise", "en": "Your VPIP is", "zh": "你的 VPIP 是", "kind": "term"}, {"line": 10995, "zline": 10997, "decl": "facingRaise", "en": "%? You're playing every hand like a sucker. This garbage right here is exactly what's bleeding you. → FOLD.", "zh": "%？你像个傻瓜一样每手牌都玩。这里的垃圾正是让你流血的东西。→ 弃牌。", "kind": "sentence"}, {"line": 11000, "zline": 11002, "decl": "facingRaise", "en": "You call raises too wide (", "zh": "你跟注加注太宽（", "kind": "sentence"}, {"line": 11000, "zline": 11002, "decl": "facingRaise", "en": "% gap). Folding this to a raise is the right discipline. → FOLD.", "zh": "% gap）。在面对加注时弃掉这个是正确的纪律。→ 弃牌。", "kind": "sentence"}, {"line": 11001, "zline": 11003, "decl": "facingRaise", "en": "You call raises too wide —", "zh": "你跟注加注太宽——", "kind": "sentence"}, {"line": 11001, "zline": 11003, "decl": "facingRaise", "en": "% gap is embarrassing, kid. This is exactly where you stop. → FOLD.", "zh": "% 的 gap 很丢人，小子。这正是你需要止步的地方。→ 弃牌。", "kind": "sentence"}, {"line": 11006, "zline": 11008, "decl": "facingRaise", "en": "You have a strong hand but your PFR is only", "zh": "你有一手强牌但你的 PFR 只有", "kind": "sentence"}, {"line": 11006, "zline": 11008, "decl": "facingRaise", "en": "% — you under-raise significantly. This is the spot to change that. → RAISE.", "zh": "%——你明显加注不足。这就是改变它的局面。→ 加注。", "kind": "sentence"}, {"line": 11007, "zline": 11009, "decl": "facingRaise", "en": "You got a strong hand but you only raise", "zh": "你有一手强牌但你翻牌前只有", "kind": "sentence"}, {"line": 11007, "zline": 11009, "decl": "facingRaise", "en": "% of the time preflo  11039, "zline": 11041, "decl": "facingRaise", "en": "You're at a", "zh": "你在", "kind": "term"}, {"line": 11039, "zline": 11041, "decl": "facingRaise", "en": "stakes table. Most opponents here make systematic mistakes — exploit them, don't try to balance. Value bet more, bluff less.", "zh": "级别桌。这里的大多数对手都会犯系统性错误——利用他们，别试图平衡。更多价值下注，更少诈唬。", "kind": "sentence"}, {"line": 11040, "zline": 11042, "decl": "facingRaise", "en": "stakes, kid. These players make the same mistakes every hand — exploit them hard. More value bets, fewer bluffs. GTO is for players you'll never meet here.", "zh": "级别，小子。这些玩家每手牌都犯同样的错误——狠狠利用他们。更多价值下注，更少诈唬。GTO 是给你永远不会在这里遇到的玩家准备的。", "kind": "sentence"}, {"line": 11051, "zline": 11053, "decl": "facingRaise", "en": "You", "zh": "你", "kind": "term"}, {"line": 11051, "zline": 11053, "decl": "facingRaise", "en": ". Opponents can exploit this by bluffing any flop. If you have any piece, hold on.", "zh": "。对手可以通过在任何翻牌诈唬来利用这一点。如果你有任何牌面连接，坚持住。", "kind": "sentence"}, {"line": 11052, "zline": 11054, "decl": "facingRaise", "en": "You", "zh": "你", "kind": "term"}, {"line": 11052, "zline": 11054, "decl": "facingRaise", "en": ". Every player at this table knows they can bluff any flop and you'll fold. If you got any piece of that board, hold on and make em prove it.", "zh": "。这桌每个玩家都知道他们可以在任何翻牌诈唬而你会弃牌。如果你和牌面有任何关系，坚持住让他们证明给你看。", "kind": "sentence"}, {"line": 11055, "zline": 11057, "decl": "facingRaise", "en": "You", "zh": "你", "kind": "term"}, {"line": 11055, "zline": 11057, "decl": "facingRaise", "en": ". More hands means more spots where you're out of position with weak holdings. Pick your spots.", "zh": "。更多的牌意味着更多你处于没位置且持有弱牌的局面。选择好你的时机。", "kind": "sentence"}, {"line": 11056, "zline": 11058, "decl": "facingRaise", "en": "You", "zh": "你", "kind": "term"}, {"line": 11056, "zline": 11058, "decl": "facingRaise", "en": ". Playing every hand like a tourist means you're always out of position with garbage. Pick your spots or keep losing.", "zh": "。像个游客一样每手牌都玩意味着你总是没位置拿着垃圾。选好时机，否则继续输。", "kind": "sentence"}, {"line": 11059, "zline": 11061, "decl": "facingRaise", "en": "You", "zh": "你", "kind": "term"}, {"line": 11059, "zline": 11061, "decl": "facingRaise", "en": ". When someone raises, 3-bet or fold. Flat-calling wide is the worst of both worlds.", "zh": "。当有人加注时，3-bet 或弃牌。宽范围平跟是最糟糕的选择。", "kind": "sentence"}, {"line": 11060, "zline": 11062, "decl": "facingRaise", "en": "You", "zh": "你", "kind": "term"}, {"line": 11060, "zline": 11062, "decl": "facingRaise", "en": ". Someone raises, you 3-bet or you fold — flat-calling wide is the worst of both worlds and Duke knows it.", "zh": "。有人加注，你就 3-bet 或弃牌——宽范围平跟是两世界之糟，Duke 知道这点。", "kind": "sentence"}, {"line": 11063, "zline": 11065, "decl": "facingRaise", "en": "You", "zh": "你", "kind": "term"}, {"line": 11063, "zline": 11065, "decl": "facingRaise", "en": ". Raise or fold preflop — limping funds the blinds and builds pots where you're at a disadvantage.", "zh": "。翻牌前加注或弃牌——平跟是在资助盲注并建造对你处于劣势的底池。", "kind": "sentence"}, {"line": 11064, "zline": 11066, "decl": "facingRaise", "en": "You", "zh": "你", "kind": "term"}, {"line": 11064, "zline": 11066, "decl": "facingRaise", "en": ". Raise or fold — limping is funding everyone else's blinds and building pots where you're already behind, kid.", "zh": "。加注或弃牌——平跟是在给所有人的盲注买单，并建造你本来就落后的底池，小子。", "kind": "sentence"}, {"line": 11067, "zline": 11069, "decl": "facingRaise", "en": "You", "zh": "你", "kind": "term"}, {"line": 11067, "zline": 11069, "decl": "facingRaise", "en": ". Take the initiative — bet your made hands, bluff your equity draws, don't just call and hope.", "zh": "。主动出击——用成牌下注，用有胜率的听牌诈唬，别只是跟注和祈祷。", "kind": "sentence"}, {"line": 11068, "zline": 11070, "decl": "facingRaise", "en": "You", "zh": "你", "kind": "term"}, {"line": 11068, "zline": 11070, "decl": "facingRaise", "en": ". Take the initiative — bet your made hands, push your draws, stop calling and hoping like a sucker.", "zh": "。主动出击——用成牌下注，推进你的听牌，别再像个傻子一样跟注和祈祷了。", "kind": "sentence"}, {"line"
