 "Ultra-tight. Only plays absolute premiums — even tighter than a nit.", "zh": "超紧。只玩绝对强牌——比紧弱型还紧。", "kind": "sentence"}, {"line": 12993, "zline": 12995, "decl": "TYPES", "en": "Rarely Plays", "zh": "紧弱型", "kind": "term"}, {"line": 12993, "zline": 12995, "decl": "TYPES", "en": "Folds almost everything. Only enters pots with very strong hands.", "zh": "几乎什么都弃。只用非常强的牌入池。", "kind": "sentence"}, {"line": 12994, "zline": 12996, "decl": "TYPES", "en": "Cautious", "zh": "谨慎型", "kind": "term"}, {"line": 12994, "zline": 12996, "decl": "TYPES", "en": "Plays few hands and mostly checks/calls. Avoids confrontation.", "zh": "玩的牌少，多数时候过牌/跟注。避免对抗。", "kind": "sentence"}, {"line": 12995, "zline": 12997, "decl": "TYPES", "en": "Passive Gambler", "zh": "松弱型", "kind": "term"}, {"line": 12995, "zline": 12997, "decl": "TYPES", "en": "Plays many hands but rarely bets or raises. Drifts along and calls a lot.", "zh": "玩很多牌但极少下注或加注。随波逐流，跟注很多。", "kind": "sentence"}, {"line": 12996, "zline": 12998, "decl": "TYPES", "en": "Unpredictable", "zh": "混合型", "kind": "term"}, {"line": 12996, "zline": 12998, "decl": "TYPES", "en": "No clear pattern yet. Could be adapting, or genuinely hard to read.", "zh": "尚无明确模式。可能在调整，或者真的难以解读。", "kind": "sentence"}, {"line": 12997, "zline": 12999, "decl": "TYPES", "en": "Unknown", "zh": "未知", "kind": "term"}, {"line": 12997, "zline": 12999, "decl": "TYPES", "en": "Not enough hands seen to form a read.", "zh": "观察手数不足，无法形成解读。", "kind": "sentence"}, {"line": 13004, "zline": 13006, "decl": "POKER_TYPE_OVERRIDES", "en": "Calling Station", "zh": "跟注站", "kind": "term"}, {"line": 13005, "zline": 13007, "decl": "POKER_TYPE_OVERRIDES", "en": "Nit", "zh": "紧弱型", "kind": "term"}, {"line": 13006, "zline": 13008, "decl": "POKER_TYPE_OVERRIDES", "en": "Tight-Passive", "zh": "紧弱型", "kind": "term"}, {"line": 13007, "zline": 13009, "decl": "POKER_TYPE_OVERRIDES", "en": "Loose-Passive", "zh": "松弱型", "kind": "term"}, {"line": 13012, "zline": 13014, "decl": "STAT_LABELS", "en": "Plays h  {"line": 13457, "zline": 13459, "decl": "sdTotal", "en": "Frequent bluffer — weight their bets accordingly", "zh": "频繁诈唬 — 据此调整对其下注的判断", "kind": "sentence"}, {"line": 13459, "zline": 13461, "decl": "sdTotal", "en": "Chases draws often — be wary of wet boards", "zh": "经常追牌 — 谨防湿润牌面", "kind": "sentence"}, {"line": 13461, "zline": 13463, "decl": "sdTotal", "en": "Shows strong hands at showdown — respect their bets", "zh": "摊牌多为强牌 — 尊重他们的下注", "kind": "sentence"}, {"line": 13463, "zline": 13465, "decl": "sdTotal", "en": "Often overplays marginal hands", "zh": "经常过度游戏边缘牌", "kind": "sentence"}, {"line": 13467, "zline": 13469, "decl": "sdTotal", "en": "Loose caller confirmed by cards", "zh": "已通过底牌确认松跟注", "kind": "sentence"}, {"line": 13471, "zline": 13473, "decl": "sdTotal", "en": "Protection bettor — aware of texture", "zh": "保护性下注 — 了解牌面结构", "kind": "sentence"}, {"line": 13486, "zline": 13488, "decl": "buildReasonHtml", "en": "Need at least 5 hands before a reason can be given.", "zh": "至少需要 5 手牌才能给出理由。", "kind": "sentence"}, {"line": 13494, "zline": 13496, "decl": "callsOnly", "en": "Plays ${vpipPct}% of hands — enters the pot almost constantly. That's ${s.vpipCount} times out of ${n} hands watched.", "zh": "入池率 ${vpipPct}%——几乎每手牌都进池。${n} 手牌里进了 ${s.vpipCount} 次。", "kind": "sentence"}, {"line": 13496, "zline": 13498, "decl": "callsOnly", "en": "Plays ${vpipPct}% of hands — enters more pots than most players. ${s.vpipCount} times out of ${n} hands.", "zh": "入池率 ${vpipPct}%——比大多数玩家更爱进池。${n} 手牌里进了 ${s.vpipCount} 次。", "kind": "sentence"}, {"line": 13498, "zline": 13500, "decl": "callsOnly", "en": "Plays ${vpipPct}% of hands — selective but not overly tight. ${s.vpipCount} entries in ${n} hands.", "zh": "入池率 ${vpipPct}%——有选择性，但不算过紧。${n} 手牌里进了 ${s.vpipCount} 次。", "kind": "sentence"}, {"line": 13500, "zline": 13502, "decl": "callsOnly", "en": "Only plays ${vpipPct}% of hands — very picky about which hands they enter. Just ${s.vpipCount} times in ${n} hands.", "zh": "只玩 ${vpipPct}% 的手牌——对入池的牌非常挑剔。${n} 手里只进了 ${s.vpipCount} 次。", "kind": "sentence"}, {"line": 13504, "zline": 13506, "decl": "callsOnly", "en": "Has not raised preflop once in ${n} hands — always calls or folds.", "zh": "在${n}手牌中一次都没有翻牌前加注 — 总是跟注或弃牌。", "kind": "sentence"}, {"line": 13516, "zline": 13518, "decl": "callsOnly", "en": "Nearly always raises when entering a pot — rarely just calls preflop.", "zh": "入池时几乎总是加注 — 极少翻牌前平跟。", "kind": "sentence"}, {"line": 13523, "zline": 13525, "decl": "postPass", "en": "After the flop, bets or raises ${afqPct}% of the time — ${postAgg} aggressive actions vs ${postPass} passive ones. Very active.", "zh": "A翻牌后下注或加注率 ${afqPct}% of the time — ${postAgg} 次攻击性行动 vs ${postPass} 次被动行动.非常活跃.", "kind": "sentence"}, {"line": 13525, "zline": 13527, "decl": "postPass", "en": "Moderately active after the flop — bets or raises ${afqPct}% of the time (${postAgg} aggressive, ${postPass} passive actions).", "zh": "翻牌后适度活跃 — 下注或加注率 ${afqPct}%（攻击性${postAgg}次，被动${postPass}次）。", "kind": "sentence"}, {"line": 13527, "zline": 13529, "decl": "postPass", "en": "Passive after the flop — mostly checks or calls. Only bets or raises ${afqPct}% of the time (${postAgg} aggressive vs ${postPass} passive).", "zh": "翻牌后偏被动 — 大多过牌或跟注。仅 ${afqPct}% 的次数下注或加注（${postAgg}次攻击性 vs ${postPass}次被动）。", "kind": "sentence"}, {"line": 13531, "zline": 13533, "decl": "postTotal", "en": "Not enough postflop action recorded yet to judge (${postTotal} postflop actions seen).", "zh": "翻牌后行动数据不足，无法判断（已记录${postTotal}次翻牌后行动）。", "kind": "sentence"}, {"line": 13538, "zline": 13540, "decl": "postTotal", "en": "Goes to showdown ${wtsdPct}% of the time when they see the flop — hard to get off a hand. ${s.wentToShowdownCount} showdowns total.", "zh": "看到翻牌后有 ${wtsdPct}% 的情况会走到摊牌 — 很难让他们弃牌。共 ${s.wentToShowdownCount} 次摊牌。", "kind": "sentence"}, {"line": 13540, "zline": 13542, "decl": "postTotal", "en": "Folds before showdown most of the time — only goes to the end ${wtsdPct}% of flops seen. ${s.wentToShowdownCount} showdowns total.", "zh": "大多数情况下在摊牌前就弃牌 — 看到翻牌后只有 ${wtsdPct}% 走到最后。共 ${s.wentToShowdownCount} 次摊牌。", "kind": "sentence"}, {"line": 13543, "zline": 13545, "decl": "postTotal", "en": "When at showdown, wins ${wsdPct}% of the time (${s.wonAtShowdownCount} wins out of ${s.wentToShowdownCount}).", "zh": "摊牌时赢 ${wsdPct}%（${s.wentToShowdownCount} 次摊牌赢了 ${s.wonAtShowdownCount} 次）。", "kind": "sentence"}, {"line": 13551, "zline": 13553, "decl": "postTotal", "en": "Shows up to showdown with weak hands often — ${s.showdownWeak} out of ${s.wentToShowdownCount} showdowns were high card or a pair.${conditionedTxt}", "zh": "经常拿弱牌走到摊牌——${s.wentToShowdownCount} 次里有 ${s.showdownWeak} 次是单张或一对。${conditionedTxt}", "kind": "sentence"}, {"line": 13553, "zline": 13555, "decl": "postTotal", "en": "Usually shows up with strong hands at showdown — ${s.showdownStrong} out of ${s.wentToShowdownCount} were two pair or better.${conditionedTxt}", "zh": "摊牌时通常拿的是强牌——${s.wentToShowdownCount} 次里有 ${s.showdownStrong} 次是两对及以上。${conditionedTxt}", "kind": "sentence"}, {"line": 13558, "zline": 13560, "decl": "postTotal", "en": "Won ${s.wonNoShowdownCount} pot${s.wonNoShowdownCount > 1 ? 's' : ''} without showing cards.", "zh": "没亮牌就拿下了 ${s.wonNoShowdownCount} 个底池。", "kind": "sentence"}, {"line": 13582, "zline": 13584, "decl": "passiveRate", "en": "Hands seen at showdown: ${examples}", "zh": "摊牌看到的底牌：${examples}", "kind": "term"}, {"line": 13591, "zline": 13593, "decl": "passiveRate", "en": "bet/raised ${riverBets + riverRaises}×", "zh": "下注/加注${riverBets + riverRaises}次", "kind": "term"}, {"line": 13592, "zline": 13594, "decl": "passiveRate", "en": "called ${riverCalls}×", "zh": "跟注${riverCalls}次", "kind": "term"}, {"line": 13593, "zline": 13595, "decl": "passiveRate", "en": "folded ${riverFolds}×", "zh": "弃牌${riverFolds}次", "kind": "term"}, {"line": 13594, "zline": 13596, "decl": "passiveRate", "en": "On the river (from history): ${parts.join(', ')}.", "zh": "河牌行动（来自历史记录）：${parts.join(', ')}。", "kind": "sentence"}, {"line": 13598, "zline": 13600, "decl": "passiveRate", "en": "Low", "zh": "低", "kind": "term"}, {"line": 13598, "zline": 13600, "decl": "passiveRate", "en": "early read, pattern may still shift.", "zh": "初步判断，模式可能还会变化。", "kind": "sentence"}, {"line": 13599, "zline": 13601, "decl": "passiveRate", "en": "Medium", "zh": "中", "kind": "term"}, {"line": 13599, "zline": 13601, "decl": "passiveRate", "en": "pattern is emerging but could change.", "zh": "模式正在形成，但仍可能改变。", "kind": "sentence"}, {"line": 13600, "zline": 13602, "decl": "passiveRate", "en": "High", "zh": "高", "kind": "term"}, {"line": 13600, "zline": 13602, "decl": "passiveRate", "en": "fairly reliable at this point.", "zh": "目前较为可靠。", "kind": "sentence"}, {"line": 13601, "zline": 13603, "decl": "passiveRate", "en": "Very High", "zh": "极高", "kind": "term"}, {"line": 13601, "zline": 13603, "decl": "passiveRate", "en": "very solid read.", "zh": "非常可靠的判断。", "kind": "term"}, {"line": 13607, "zline": 13609, "decl": "passiveRate", "en": "Won ${s.wonNoShowdownCount} pot${s.wonNoShowdownCount > 1 ? 's' : ''} without showing cards — took it down before showdown every time.", "zh": "没亮牌就拿下了 ${s.wonNoShowdownCount} 个底池——每次都是在摊牌之前收走。", "kind": "sentence"}, {"line": 13610, "zline": 13612, "decl": "passiveRate", "en": "Voluntarily showed cards after winning uncontested ${s.voluntaryShowAfterWin} time${s.voluntaryShowAfterWin > 1 ? 's' : ''} — may have been bluffing or just showing off.", "zh": "无争议赢下后主动亮牌 ${s.voluntaryShowAfterWin} 次——可能是在诈唬，也可能只是炫一下。", "kind": "sentence"}, {"line": 13623, "zline": 13625, "decl": "passiveRate", "en": "High aggression after the flop (${pct(dm.afq)}) but rarely goes to showdown (${pct(dm.wtsd)}) — may be bluffing opponents off hands frequently.", "zh": "翻牌后高攻击性（${pct(dm.afq)}）但很少走到摊牌（${pct(dm.wtsd)}）— 可能经常诈唬让对手弃牌。", "kind": "sentence"}, {"line": 13651, "zline": 13653, "decl": "looseRate", "en": "Folds to turn bets ${Math.round(foldRate * 100)}% of the time — exploitable, consider floating more on the turn.", "zh": "面对转牌下注弃牌率 ${Math.round(foldRate * 100)}% — 可被剥削，考虑在转牌更多漂浮跟注。", "kind": "sentence"}, {"line": 13656, "zline": 13658, "decl": "looseRate", "en": "Folds to river bets ${Math.round(foldRate * 100)}% of the time — over-folding, can be bluffed off strong-ish hands.", "zh": "面对河牌下注弃牌率 ${Math.round(foldRate * 100)}% — 弃牌过多，可以用中等强度的牌把他们诈唬走。", "kind": "sentence"}, {"line": 13662, "zline": 13664, "decl": "looseRate", "en": "Barreled multiple streets ${s.ucBarrelWinCount} times and took it uncontested — applies sustained pressure. Could be value or bluff.", "zh": "多条街连续下注 ${s.ucBarrelWinCount} 次并拿下无争议底池 — 持续施压。可能是价值也可能是诈唬。", "kind": "sentence"}, {"line": 13664, "zline": 13666, "decl": "looseRate", "en": "Used overbet pressure ${s.ucOverbetCount} time${s.ucOverbetCount > 1 ? 's' : ''} to win uncontested — polarised sizing, likely very strong or a bluff.", "zh": "用超池下注施压 ${s.ucOverbetCount} 次赢下无争议底池 — 极化下注尺寸，很可能极强或是在诈唬。", "kind": "sentence"}, {"line": 13666, "zline": 13668, "decl": "looseRate", "en": "Steals preflop ${s.ucStealCount}/${ucTotal} uncontested wins — high steal frequency, consider defending wider.", "zh": "翻前偷盲 ${s.ucStealCount}/${ucTotal} 次无争议赢池 — 偷盲频率高，考虑更宽范围防守。", "kind": "sentence"}, {"line": 13670, "zline": 13672, "decl": "looseRate", "en": "No strong bluff signals detected yet. Need more showdown and river history.", "zh": "尚未检测到强烈诈唬信号。需要更多摊牌和河牌历史。", "kind": "sentence"}, {"line": 14425, "zline": 14427, "decl": "renderBadge", "en": "Heads-up — stats paused, reads don\\'t apply", "zh": "单挑 — 已暂停数据，解读不适用", "kind": "sentence"}, {"line": 14565, "zline": 14567, "decl": "createBadge", "en": "No data yet", "zh": "暂无数据", "kind": "term"}, {"line": 14654, "zline": 14656, "decl": "syncAutoTagIndicator", "en": "Notable plays auto-tagged — click to view", "zh": "已自动标记的显著玩法——点击查看", "kind": "sentence"}, {"line": 14991, "zline": 14993, "decl": "QR_STREET_LABEL", "en": "Preflop", "zh": "翻前", "kind": "term"}, {"line": 14991, "zline": 14993, "decl": "QR_STREET_LABEL", "en": "Flop", "zh": "翻牌", "kind": "term"}, {"line": 14991, "zline": 14993, "decl": "QR_STREET_LABEL", "en": "Turn", "zh": "转牌", "kind": "term"}, {"line": 14991, "zline": 14993, "decl": "QR_STREET_LABEL", "en": "River", "zh": "河牌", "kind": "term"}, {"line": 15063, "zline": 15065, "decl": "bar", "en": "Board vs their range", "zh": "牌面 vs their range", "kind": "term"}, {"line": 15204, "zline": 15206, "decl": "syncEmojiIndicators", "en": "Frequent bluffer (card-verified)", "zh": "频繁诈唬（已牌面验证）", "kind": "sentence"}, {"line": 15205, "zline": 15207, "decl": "syncEmojiIndicators", "en": "Chases draws often", "zh": "经常追牌", "kind": "term"}, {"line": 15206, "zline": 15208, "decl": "syncEmojiIndicators", "en": "Shows strong hands at showdown", "zh": "摊牌时亮强牌", "kind": "sentence"}, {"line": 15207, "zline": 15209, "decl": "syncEmojiIndicators", "en": "Often overplays marginal hands", "zh": "经常过度游戏边缘牌", "kind": "sentence"}, {"line": 15208, "zline": 15210, "decl": "syncEmojiIndicators", "en": "Loose caller (card-verified)", "zh": "松跟注（已牌面验证）", "kind": "sentence"}, {"line": 15269, "zline": 15271, "decl": "buildOpponentHintHtml", "en": "Stop trying to bluff them off hands — they call with anything. Sit back and trap. When you flop strong, check and let them bet into you, then raise. Tighten your preflop range and be patient. Their chips will come to you — don't rush it.", "zh": "别想诈唬他们弃牌——他们什么牌都跟。坐等陷阱。当你翻牌中了强牌，过牌让他们下注，然后加注。收紧你的翻前范围，耐心等待。他们的筹码会主动送上门——别着急。", "kind": "sentence"}, {"line": 15270, "zline": 15272, "decl": "buildOpponentHintHtml", "en": "Don't fold too quickly to their bets — they fire a lot of bluffs. Call them down with medium-strength hands more than you normally would. 3-bet them back for value when you have it, and let their own aggression cost them chips.", "zh": "别太快弃牌给他们——他们打了很多诈唬。用中等牌力多跟注，比平时更多一些。有牌力的时候反加注3-bet，让他们自己的激进打法付出筹码代价。", "kind": "sentence"}, {"line": 15271, "zline": 15273, "decl": "buildOpponentHintHtml", "en": "Most dangerous player at the table. Their range is tight and strong — respect their bets. Fold marginal hands when they show resistance. Don't try to run bluffs without a clear read. If they raise on a scary board, believe them. Pick up pots when they're not in the hand and avoid big confrontations without a strong holding.", "zh": "桌上最危险的玩家。他们的范围紧且强——尊重他们的下注。当他们表现出抵抗时，弃掉边缘牌。没有明确读牌不要试图诈唬。如果他们在危险的牌面加注，相信他们。当他们不参与底池时捡走底池，没有强牌避免正面交锋。", "kind": "sentence"}, {"line": 15272, "zline": 15274, "decl": "buildOpponentHintHtml", "en": "This is your ATM. They play way too many hands and barely raise — just call and call. Value bet relentlessly with any made hand. Don't bluff them, don't get fancy. Bet big when you have it, check when you don't. They'll pay you off with bottom pair and gutshot draws all day long.", "zh": "这是你的提款机。他们玩太多牌了，几乎不加注——只会跟注、跟注。有成型牌就无情地价值下注。别诈唬他们，别玩花哨的。有牌就下大注，没牌就过牌。他们会用底对和卡顺听牌一直支付你。", "kind": "sentence"}, {"line": 15273, "zline": 15275, "decl": "buildOpponentHintHtml", "en": "Never bluff them. They will call down to the river with bottom pair — full stop. Your only weapon is value. Bet big when you have it. Don't slow-play or trap. Thin value bets work here too — even top pair with a weak kicker is worth multiple streets. Just show up at showdown with the better hand.", "zh": "永远别诈唬他们。他们会用底对跟注到河牌——句号。你唯一的武器就是价值。有牌就下大注。别慢打或设陷阱。薄价值下注也有效——即使顶对弱踢脚也值得多条街下注。只需要在摊牌时拿出更好的牌就行。", "kind": "sentence"}, {"line": 15274, "zline": 15276, "decl": "buildOpponentHintHtml", "en": "Even tighter than a nit — they play almost nothing. Steal their blinds every single orbit from any position. When they finally put chips in, run. Their range is AA/KK/AK and not much else. Don't waste a single chip trying to play back at them unless you're holding the nuts.", "zh": "比紧弱型还紧 —— 他们几乎不玩牌。每圈从任何位置偷他们的盲注。当他们终于往底池里投筹码时，快跑。他们的范围就是AA/KK/AK，没别的了。除非你拿着坚果牌，否则别浪费一个筹码试图反打他们。", "kind": "sentence"}, {"line": 15275, "zline": 15277, "decl": "buildOpponentHintHtml", "en": "Steal their blinds relentlessly from late position — they fold almost everything. When they finally show resistance, get out immediately. Their bets mean a very strong hand. Take the easy money repeatedly and don't pay them off when they wake up.", "zh": "从后位无情地偷他们的盲注——他们几乎什么都弃牌。当他们终于表现出抵抗时，立即撤退。他们的下注意味着非常强的牌。反复拿这些轻松的钱，别在他们\"醒过来\"时支付他们。", "kind": "sentence"}, {"line": 15276, "zline": 15278, "decl": "buildOpponentHintHtml", "en": "C-bet almost every flop — they check-fold a lot. Steal blinds freely. When they call or raise, slow down and reassess. They avoid confrontation heavily, so their aggression is almost always real strength. Pick up small pots constantly, bleed them out.", "zh": "几乎每个翻牌都C-bet——他们经常过牌-弃牌。随意偷盲。当他们跟注或加注时，放慢节奏重新评估。他们极力避免对抗，所以他们的激进几乎总是真牌。持续捡走小底池，慢慢放干他们的血。", "kind": "sentence"}, {"line": 15277, "zline": 15279, "decl": "buildOpponentHintHtml", "en": "Value bet relentlessly. They'll call with middle pair, weak draws, anything marginal. Don't bother bluffing — they call too much for it to work consistently. Play straightforward ABC poker and make them pay every single street when you have something real.", "zh": "无情地价值下注。他们会用中对、弱听牌、任何边缘牌跟注。别费心诈唬了——他们跟注太多，诈唬很难持续有效。打直接的ABC扑克，当你真有牌时，每条街都让他们付出代价。", "kind": "sentence"}, {"line": 15278, "zline": 15280, "decl": "buildOpponentHintHtml", "en": "No clear pattern yet — don't make fancy plays until you have a proper read. Watch how they respond to bets. Do they fold? Do they call? Do they fight back? Use the next few hands to build a real picture before committing big chips.", "zh": "还没有明确的模式——在你有清晰的读牌之前，别玩花哨的。观察他们如何回应下注。他们弃牌吗？跟注吗？反击吗？用接下来几手牌建立真实画像，然后再投入大筹码。", "kind": "sentence"}, {"line": 15279, "zline": 15281, "decl": "buildOpponentHintHtml", "en": "Not enough hands seen yet. Play standard poker and observe their tendencies.", "zh": "观察的手牌还不够多。打标准扑克，观察他们的倾向。", "kind": "sentence"}, {"line": 15283, "zline": 15285, "decl": "buildOpponentHintHtml", "en": "How to Play Against ${resolvedType(type).label}", "zh": "对抗${resolvedType(type).label}的策略", "kind": "term"}, {"line": 15289, "zline": 15291, "decl": "vsPool", "en": "above", "zh": "高于", "kind": "term"}, {"line": 15289, "zline": 15291, "decl": "vsPool", "en": "below", "zh": "低于", "kind": "term"}, {"line": 15290, "zline": 15292, "decl": "vsPool", "en": "${label} the Torn-wide average of ${pct(avg)}", "zh": "${label} Torn 全服均值 ${pct(avg)}", "kind": "sentence"}, {"line": 15296, "zline": 15298, "decl": "vsPool", "en": "C-bet every flop — they fold to flop bets ${pct(m.foldVsFlopBet)} of the time, well ${vsPool(POOL_AVG.foldVsFlopCbet, 'above')}. You don't need to connect with the board.", "zh": "每个翻牌都 C-bet —— 他们面对翻牌下注有 ${pct(m.foldVsFlopBet)} 会弃牌，明显${vsPool(POOL_AVG.foldVsFlopCbet, 'above')}。你不需要跟牌面有任何关系。", "kind": "sentence"}, {"line": 15298, "zline": 15300, "decl": "vsPool", "en": "Cut your bluffs on the flop — they only fold ${pct(m.foldVsFlopBet)}, well ${vsPool(POOL_AVG.foldVsFlopCbet, 'below')}. Only bet when you have real equity behind it.", "zh": "翻牌上少诈唬 —— 他们只弃 ${pct(m.foldVsFlopBet)}，明显${vsPool(POOL_AVG.foldVsFlopCbet, 'below')}。只有真的有赢率支撑时才下注。", "kind": "sentence"}, {"line": 15302, "zline": 15304, "decl": "vsPool", "en": "C-bet them specifically as the preflop raiser — they fold to a continuation bet ${pct(dm.foldToCbet)} of the time, ${vsPool(POOL_AVG.foldVsFlopCbet, 'above')}. This is the cleanest \"just fire\" read in the tab.", "zh": "作为翻前加注者专门 C-bet 他们 —— 他们面对持续下注有 ${pct(dm.foldToCbet)} 会弃牌，${vsPool(POOL_AVG.foldVsFlopCbet, 'above')}。这是这一页里最干脆的「直接开火」信号。", "kind": "sentence"}, {"line": 15304, "zline": 15306, "decl": "vsPool", "en": "Don't auto-c-bet them — they defend a continuation bet specifically ${pct(1 - dm.foldToCbet)} of the time, ${vsPool(POOL_AVG.foldVsFlopCbet, 'below')}. Check back more with marginal hands instead of firing on autopilot.", "zh": "别对他们无脑 C-bet —— 他们面对持续下注的防守率是 ${pct(1 - dm.foldToCbet)}，${vsPool(POOL_AVG.foldVsFlopCbet, 'below')}。边缘牌多过牌，别自动驾驶式开火。", "kind": "sentence"}, {"line": 15308, "zline": 15310, "decl": "vsPool", "en": "Bet into their checked-back flops — as the preflop raiser they only continuation-bet ${pct(dm.cbetFlop)} of the time, well below the Torn average of ${pct(POOL_AVG.cbetFlop)}. A missed c-bet from them is a real \"I whiffed\" signal — take the pot away.", "zh": "他们过牌后要下注 —— 作为翻前加注者，他们的持续下注率只有 ${pct(dm.cbetFlop)}，远低于 Torn 全服均值 ${pct(POOL_AVG.cbetFlop)}。他们漏掉 C-bet 就是明确的「我没中」信号 —— 把底池拿走。", "kind": "sentence"}, {"line": 15310, "zline": 15312, "decl": "vsPool", "en": "Their c-bet means less than most players' — ${pct(dm.cbetFlop)} continuation-bet rate, well above the Torn average of ${pct(POOL_AVG.cbetFlop)}. Call or raise light with any piece of the board instead of folding to it automatically.", "zh": "他们的 C-bet 没有别人那么可信 —— 持续下注率 ${pct(dm.cbetFlop)}，远高于 Torn 全服均值 ${pct(POOL_AVG.cbetFlop)}。只要沾到牌面就跟注或轻加注，别条件反射式弃牌。", "kind": "sentence"}, {"line": 15313, "zline": 15315, "decl": "vsPool", "en": "Isolate their limps — they limp in ${pct(m.limpPct)} of the time. Raise it up in position to play heads-up with a range advantage against a weak entry.", "zh": "隔离他们的溜入 —— 他们有 ${pct(m.limpPct)} 的时候是溜入。有位置时加注，和他们单挑，用范围优势去打一次弱开池。", "kind": "sentence"}, {"line": 15316, "zline": 15318, "decl": "vsPool", "en": "Open wide when they're in the blinds — they almost never 3-bet (${pct(m.threeBetPct)}, right at the Torn average of ${pct(POOL_AVG.threeBet)}). Steal freely and don't respect their flat-calls.", "zh": "他们在盲注位时放宽开池 —— 他们几乎从不 3-bet（${pct(m.threeBetPct)}，正好在 Torn 全服均值 ${pct(POOL_AVG.threeBet)} 上）。放心偷盲，不用把他们的平跟当回事。", "kind": "sentence"}, {"line": 15318, "zline": 15320, "decl": "vsPool", "en": "Tighten your open range when they're left to act — they 3-bet ${pct(m.threeBetPct)}, over 3x the Torn average of ${pct(POOL_AVG.threeBet)}. Don't open junk and get blown off it.", "zh": "收紧开池范围 —— 他们后面还没行动时：他们的 3-bet 率是 ${pct(m.threeBetPct)}，超过 Torn 全服均值 ${pct(POOL_AVG.threeBet)} 的三倍。别开烂牌然后被打飞。", "kind": "sentence"}, {"line": 15322, "zline": 15324, "decl": "vsPool", "en": "3-bet them light — they fold to 3-bets ${pct(m.foldTo3BetPct)} of the time, ${vsPool(POOL_AVG.foldTo3Bet, 'above')}. Squeeze them off wide opens with almost anything.", "zh": "用轻牌 3-bet 他们 —— 他们面对 3-bet 有 ${pct(m.foldTo3BetPct)} 会弃牌，${vsPool(POOL_AVG.foldTo3Bet, 'above')}。他们宽范围开池时，用几乎任何牌挤压逼退。", "kind": "sentence"}, {"line": 15324, "zline": 15326, "decl": "vsPool", "en": "Don't 3-bet without a real hand — they call or re-raise 3-bets ${pct(1 - m.foldTo3BetPct)} of the time, already ${vsPool(POOL_AVG.foldTo3Bet, 'below')} for the whole pool. Light squeezes will get you in trouble.", "zh": "没有真牌别 3-bet —— 他们面对 3-bet 有 ${pct(1 - m.foldTo3BetPct)} 会跟注或反加，对整个池子来说已经${vsPool(POOL_AVG.foldTo3Bet, 'below')}了。轻挤压会把你带进坑里。", "kind": "sentence"}, {"line": 15327, "zline": 15329, "decl": "vsPool", "en": "Take their squeezes seriously — they re-raise a caller ${pct(dm.squeezePct)} of the time (Torn pool average is ${pct(POOL_AVG.squeeze)} — this is one of the rare players who actually does it). It's not a bluff for fold equity in this pool, it's value. Fold the marginal hands you'd normally continue with.", "zh": "把他们的挤压当真 —— 他们面对跟注者有 ${pct(dm.squeezePct)} 会反加（Torn 全服均值 ${pct(POOL_AVG.squeeze)}，这是少数真会这么打的玩家）。在这个池子里那不是为了弃牌率而诈唬，是价值。平时你会继续跟的边缘牌，这里弃掉。", "kind": "sentence"}, {"line": 15329, "zline": 15331, "decl": "vsPool", "en": "Give their check-raises real credit — they check-raise the flop ${pct(dm.crFlop)} of flops seen, versus a Torn-wide average of ${pct(POOL_AVG.checkRaiseFlop)} (near-extinct pool-wide). When they do it, they almost always have it.", "zh": "他们的过牌-加注要认真对待 —— 他们看过的翻牌里有 ${pct(dm.crFlop)} 会过牌-加注，而 Torn 全服均值是 ${pct(POOL_AVG.checkRaiseFlop)}（全服范围内几乎绝迹）。他们这么打的时候，基本都是有货。", "kind": "sentence"}, {"line": 15331, "zline": 15333, "decl": "vsPool", "en": "Watch for donk-bets into your raise — they bet into the preflop raiser ${pct(dm.donkFlop)} of the time after just calling preflop. Unusual line — usually a made hand protecting equity or a real draw, rarely a total bluff. Don't auto-raise through it.", "zh": "小心他们往你的加注里领打 —— 翻前只是跟注之后，他们有 ${pct(dm.donkFlop)} 的时候会直接下注打翻前加注者。这条线很少见 —— 通常是成牌在保护赢率，或者真听牌，很少是纯诈唬。别条件反射式加注。", "kind": "sentence"}, {"line": 15333, "zline": 15335, "decl": "vsPool", "en": "Don't try to bluff them off hands post-flop — they go to showdown ${pct(m.wtsd)} of flops they see. They're not folding.", "zh": "翻后别想诈唬他们弃牌 —— 他们看过的翻牌里有 ${pct(m.wtsd)} 会走到摊牌。他们不会弃。", "kind": "sentence"}, {"line": 15337, "zline": 15339, "decl": "vsPool", "en": "Bet thin value freely — ${Math.round(weakRate * 100)}% of their showdowns were one pair or worse. They call down with trash.", "zh": "薄价值放心下注 —— 他们摊牌的手里有 ${Math.round(weakRate * 100)}% 是一对或更差。他们会用垃圾牌一直跟。", "kind": "sentence"}, {"line": 15344, "zline": 15346, "decl": "vsPool", "en": "Playing looser than usual right now — either tilting or on a rush. Tighten up and make them pay when you have it.", "zh": "他现在比平时更松 —— 要么在情绪化，要么在顺风期。收紧一点，你有牌的时候让他付出代价。", "kind": "sentence"}, {"line": 15346, "zline": 15348, "decl": "vsPool", "en": "Playing much tighter than normal — card-dead or nursing chips. Their rare bets are even more credible right now.", "zh": "他现在比平时紧很多 —— 要么牌死，要么在护筹码。他偶尔的下注现在更可信。", "kind": "sentence"}, {"line": 15349, "zline": 15351, "decl": "vsPool", "en": "Heavy caller, rarely raises — ${pct(m.gap)} gap between VPIP and PFR. Their range post-flop is full of weak speculative hands. Bet for value on safe boards.", "zh": "跟注多、极少加注 —— VPIP 和 PFR 之间差 ${pct(m.gap)}。他翻后的范围里全是弱的投机牌。牌面安全就下注拿价值。", "kind": "sentence"}, {"line": 15352, "zline": 15354, "decl": "vsPool", "en": "Probe-size raises (avg ${dm.avgRaisePct.toFixed(1)}% of stack) — they're not committed. Float their raise and take the pot on the turn when they check.", "zh": "试探性加注（均占筹码 ${dm.avgRaisePct.toFixed(1)}%） —— 他们没打算投入。跟注他的加注，转牌他过牌时把底池拿走。", "kind": "sentence"}, {"line": 15354, "zline": 15356, "decl": "vsPool", "en": "Large raise commitment (avg ${dm.avgRaisePct.toFixed(1)}% of stack) — when they raise they have something real. 3-bet for value or fold. Don't float.", "zh": "加注投入很重（均占筹码 ${dm.avgRaisePct.toFixed(1)}%） —— 他加注的时候是真有牌。要么价值 3-bet，要么弃牌。别跟着试探。", "kind": "sentence"}, {"line": 15357, "zline": 15359, "decl": "vsPool", "en": "Commits big on calls (avg ${dm.avgCallPct.toFixed(1)}% of stack) — they won't fold after a big call. Forget bluffing — just charge them every street.", "zh": "跟注时投入很重（均占筹码 ${dm.avgCallPct.toFixed(1)}%） —— 大额跟注之后他不会弃。别想诈唬 —— 每条街都收他的钱。", "kind": "sentence"}, {"line": 15359, "zline": 15361, "decl": "vsPool", "en": "Loses showdowns often (${pct(m.wsd)}) — calls down with hands that can't beat much. Value bet every street you're ahead.", "zh": "摊牌输得很频繁（${pct(m.wsd)}） —— 他会用打不过什么的牌跟到底。你领先的时候每条街都下注拿价值。", "kind": "sentence"}, {"line": 15362, "zline": 15364, "decl": "vsPool", "en": "They rarely win once a flop is seen — ${pct(dm.wwsf)} WWSF, well below the Torn average of ${pct(POOL_AVG.wwsf)}. Contest pots against them; folding out to a WWSF this low is a leak on your part, not theirs.", "zh": "他们看到翻牌后很少赢 —— WWSF 只有 ${pct(dm.wwsf)}，远低于 Torn 全服均值 ${pct(POOL_AVG.wwsf)}。多和他争底池；面对这么低的 WWSF 你还弃牌，是你的漏洞，不是他的。", "kind": "sentence"}, {"line": 15364, "zline": 15366, "decl": "vsPool", "en": "They win a lot once they see a flop — ${pct(dm.wwsf)} WWSF, well above the Torn average of ${pct(POOL_AVG.wwsf)}. That's either genuine skill or a rush — don't assume every pot they take is a bluff.", "zh": "他们看到翻牌后赢很多 —— WWSF ${pct(dm.wwsf)}，远高于 Torn 全服均值 ${pct(POOL_AVG.wwsf)}。这要么是真本事，要么是顺风期 —— 别把他每次拿下底池都当成诈唬。", "kind": "sentence"}, {"line": 15375, "zline": 15377, "decl": "vsPool", "en": "Respect their late-position raises more than usual — PFR jumps from ${pct(epPfr)} early to ${pct(lpPfr)} late. Most of this pool barely adjusts by seat at all (Torn-wide average moves only 16.1% → 14.5%), so this player is actually playing positionally aware poker. A late \"steal\" from them might not be one.", "zh": "对他的后位加注比平时更尊重 —— PFR 从前位 ${pct(epPfr)} 跳到后位 ${pct(lpPfr)}。这个池子里大多数人几乎不按位置调整（Torn 全服均值只从 16.1% 动到 14.5%），所以他其实是真的有位置意识。他后位的「偷盲」可能不是偷。", "kind": "sentence"}, {"line": 15377, "zline": 15379, "decl": "vsPool", "en": "Their position is backwards — raises MORE from early position (${pct(epPfr)}) than late (${pct(lpPfr)}), the opposite of standard theory. Their early opens are looser than they look; their late-position raises are the ones to actually respect.", "zh": "他的位置打反了 —— 前位加注（${pct(epPfr)}）比后位（${pct(lpPfr)}）还多，和标准理论正好相反。他的前位开池比看起来松；真正要尊重的是他后位的加注。", "kind": "sentence"}, {"line": 15381, "zline": 15383, "decl": "vsPool", "en": "Specific Exploits", "zh": "具体漏洞", "kind": "term"}, {"line": 15384, "zline": 15386, "decl": "vsPool", "en": "a few more 3-bet spots", "zh": "再多几个 3-bet 机会", "kind": "sentence"}, {"line": 15385, "zline": 15387, "decl": "vsPool", "en": "more flop bets faced", "zh": "再多面对几次翻牌下注", "kind": "term"}, {"line": 15386, "zline": 15388, "decl": "vsPool", "en": "more flops seen", "zh": "再多看几次翻牌", "kind": "term"}, {"line": 15387, "zline": 15389, "decl": "vsPool", "en": "Needs ${needed.slice(0, 2).join(' and ')} to unlock most of them.", "zh": "还需要${needed.slice(0, 2).join('和')}，才能解锁大部分。", "kind": "sentence"}, {"line": 15388, "zline": 15390, "decl": "vsPool", "en": "Specific Exploits", "zh": "具体漏洞", "kind": "term"}, {"line": 15389, "zline": 15391, "decl": "vsPool", "en": "No specific exploit cleared the bar yet — this player's rates so far are close to typical Torn averages, or the sample's too thin to say otherwise.${needStr}", "zh": "还没有哪条具体漏洞达到阈值 —— 这名玩家目前的数据接近 Torn 的典型均值，或者样本太薄还看不出来。${needStr}", "kind": "sentence"}, {"line": 15395, "zline": 15397, "decl": "vsPool", "en": "Don't tilt-call because they're being annoying. Every bad call is chips you're giving away. Wait for a real hand and trap.", "zh": "别因为他们烦人就情绪化跟注。每次糟糕的跟注都是在白送筹码。等一手真牌然后设陷阱。", "kind": "sentence"}, {"line": 15397, "zline": 15399, "decl": "vsPool", "en": "They'll 3-bet light to retake the pot. Don't open weak hands when they're left to act — they will fight back.", "zh": "他们会用轻牌 3-bet 把底池拿回去。他们后面还没行动时别开弱牌 —— 他们会反击。", "kind": "sentence"}, {"line": 15399, "zline": 15401, "decl": "vsPool", "en": "3-bets ${pct(m.threeBetPct)} preflop — well above the Torn average of ${pct(POOL_AVG.threeBet)} and one of the highest at the table. Tighten your opening range when they have position or are in the blinds.", "zh": "翻前3-bet率为${pct(m.threeBetPct)}——桌上最高的之一。当他们有位置或在盲注位时，收紧你的开池范围。", "kind": "sentence"}, {"line": 15401, "zline": 15403, "decl": "vsPool", "en": "Wins ${pct(m.wsd)} of showdowns reached — when they call to the river, they usually have it. Don't fire into them on wet boards without the goods.", "zh": "摊牌胜率为${pct(m.wsd)}——当他们跟注到河牌时，通常真有牌。没有好牌别在湿润牌面往他们身上开火。", "kind": "sentence"}, {"line": 15403, "zline": 15405, "decl": "vsPool", "en": "Rarely folds AND wins at showdown a lot — do not bluff. Only put chips in when you're confident you're ahead.", "zh": "很少弃牌，而且摊牌赢率很高——不要诈唬。只有当你确信领先时才投入筹码。", "kind": "sentence"}, {"line": 15405, "zline": 15407, "decl": "vsPool", "en": "Tight range, almost always strong. Fold marginal hands to their bets. Don't try to outplay them without the nuts.", "zh": "范围紧，几乎总是强牌。对他们的下注弃掉边缘牌。没有坚果牌别想胜过他们。", "kind": "sentence"}, {"line": 15407, "zline": 15409, "decl": "vsPool", "en": "Watch their position — a TAG raising in position is value, not a steal. Don't 3-bet light expecting a fold.", "zh": "注意他们的位置——TAG在有位置时加注是价值，不是偷盲。别指望轻量3-bet就能让他们弃牌。", "kind": "sentence"}, {"line": 15409, "zline": 15411, "decl": "vsPool", "en": "Don't get frustrated when they suck out — bad players get lucky short term. Stay disciplined, keep value betting, the math wins over time.", "zh": "别因为他们反超就沮丧——差玩家短期内也会走运。保持纪律，持续价值下注，长期来看数学会赢。", "kind": "sentence"}, {"line": 15411, "zline": 15413, "decl": "vsPool", "en": "Almost never folds post-flop (${pct(m.postFoldPct)}) — your bluffs are burning chips. Only bet when you have real equity or a made hand.", "zh": "翻牌后几乎从不弃牌（${pct(m.postFoldPct)}）——你的诈唬在烧筹码。只有当你真的有赢率或成型牌时才下注。", "kind": "sentence"}, {"line": 15413, "zline": 15415, "decl": "vsPool", "en": "Large raise sizes (avg ${dm.avgRaisePct.toFixed(1)}% of stack) — when they raise, they're committed. Don't try to push them off it.", "zh": "大额加注尺寸（均占筹码的${dm.avgRaisePct.toFixed(1)}%）——他们加注时已经投入了。别试图把他们赶走。", "kind": "sentence"}, {"line": 15419, "zline": 15421, "decl": "stackWinCount", "en": "At least ${stackWinCount} recent showdown win${stackWinCount > 1 ? 's' : ''} happened without them actually holding the best hand (bigger stack getting a side pot / uncalled bet back). Don't read every pot they've won as proof their hand was good — check the History tab for the flagged hands.", "zh": "最近至少有 ${stackWinCount} 次摊牌「赢」，他手里其实并不是最好的牌（筹码多的一方拿边池／拿回无人跟的下注）。别把他赢下的每个底池都当成他牌好的证据 —— 去「历史」页看被标记的那几手。", "kind": "sentence"}, {"line": 15426, "zline": 15428, "decl": "gambledRate", "en": "Gambles into hands with nothing ${Math.round(gambledRate * 100)}% of the time and gets there — their early-street aggression doesn't mean they had it, some of it is a draw or air that got bailed out later. Don't over-credit a flop/turn bet from them as proof of a made hand; wait for the river to judge this player.", "zh": "有 ${Math.round(gambledRate * 100)}% 的时候他拿着空气就往底池里赌，然后还真成了 —— 他前几条街的激进不代表他有牌，其中一部分是听牌或空气后来被救回来。别把他翻牌／转牌的下注高估成成牌的证据；要判断这个人，等河牌再说。", "kind": "sentence"}, {"line": 15430, "zline": 15432, "decl": "gambledRate", "en": "Watch Out For", "zh": "注意", "kind": "term"}, {"line": 15464, "zline": 15466, "decl": "buildStartingHandCard", "en": "${h._key}: ${h.dealt} dealt, ${vpipPct}% VPIP, ${winPct}% win", "zh": "${h._key}：发到 ${h.dealt} 次，VPIP ${vpipPct}%，赢率 ${winPct}%", "kind": "sentence"}, {"line": 15472, "zline": 15474, "decl": "buildStartingHandCard", "en": "Costing you chips:", "zh": "正在吃掉你的筹码：", "kind": "term"}, {"line": 15474, "zline": 15476, "decl": "buildStartingHandCard", "en": "${h._key}: ${h.dealt} dealt, ${winPct}% win — drop this.", "zh": "${h._key}：发到 ${h.dealt} 次，赢率 ${winPct}% —— 这手该丢。", "kind": "sentence"}, {"line": 15483, "zline": 15485, "decl": "buildStartingHandCard", "en": "Over-played losers:", "zh": "玩过头的老输家：", "kind": "term"}, {"line": 15486, "zline": 15488, "decl": "buildStartingHandCard", "en": "You play ${h._key} almost every time (${vpipPct}% VPIP) but only win ${winPct}%.", "zh": "你几乎每次都玩 ${h._key}（VPIP ${vpipPct}%），但只赢 ${winPct}%。", "kind": "sentence"}, {"line": 15495, "zline": 15497, "decl": "buildStartingHandCard", "en": "Under-played winners:", "zh": "玩得太少的赢家：", "kind": "term"}, {"line": 15497, "zline": 15499, "decl": "buildStartingHandCard", "en": "And you've never raised it — raising builds bigger pots when you're ahead.", "zh": "而且你从未加注过 —— 当你领先时加注能建立更大的底池。", "kind": "sentence"}, {"line": 15498, "zline": 15500, "decl": "buildStartingHandCard", "en": "You fold ${h._key} too often — when you do play it, you win ${winPct}%.${neverRaised}", "zh": "你太常弃掉 ${h._key} —— 真玩的时候，赢率是 ${winPct}%。${neverRaised}", "kind": "sentence"}, {"line": 15503, "zline": 15505, "decl": "noLeaksNote", "en": "No obvious hand selection leaks detected.", "zh": "没有发现明显的起手牌选择漏洞。", "kind": "sentence"}, {"line": 15506, "zline": 15508, "decl": "noLeaksNote", "en": "Top 5 most played:${top5Html}", "zh": "最常玩的 5 手牌：${top5Html}", "kind": "term"}, {"line": 15513, "zline": 15515, "decl": "noLeaksNote", "en": "Starting Hand Report", "zh": "起手牌报告", "kind": "term"}, {"line": 15532, "zline": 15534, "decl": "buildFoldDisciplineCard", "en": "(${examples[0]}${examples.length > 1 ? ` and ${examples.length - 1} more` : ''})", "zh": "（${examples[0]}${examples.length > 1 ? ` 等 ${examples.length} 手` : ''}）", "kind": "term"}, {"line": 15534, "zline": 15536, "decl": "buildFoldDisciplineCard", "en": "Folded strong hands ${strongCount} times${exStr}. Review whether the bet sizing justified it — ${strongCount} times is a pattern.", "zh": "弃掉了强牌 ${strongCount} 次${exStr}。回顾一下当时的尺度是否真的该弃——${strongCount} 次已经成模式了。", "kind": "sentence"}, {"line": 15536, "zline": 15538, "decl": "buildFoldDisciplineCard", "en": "Folded a strong hand once${exStr}. Could be correct — monitor if it becomes a pattern.", "zh": "有一次弃掉了强牌${exStr}。可能是正确的——观察是否形成模式。", "kind": "sentence"}, {"line": 15542, "zline": 15544, "decl": "buildFoldDisciplineCard", "en": "Folded draws that completed ${drawHitCount} out of ${drawCount} times. You may be folding too early when pot odds justify calling.", "zh": "在成牌的听牌上弃牌 ${drawCount} 次里有 ${drawHitCount} 次。赔率够跟的时候，你可能弃得太早了。", "kind": "sentence"}, {"line": 15544, "zline": 15546, "decl": "buildFoldDisciplineCard", "en": "Folded ${drawCount} draws — ${drawHitCount} hit, ${missCount} missed. Fold discipline on draws looks reasonable.", "zh": "弃掉了${drawCount}次听牌——${drawHitCount}次成牌，${missCount}次没成。听牌上的弃牌纪律看起来合理。", "kind": "sentence"}, {"line": 15548, "zline": 15550, "decl": "buildFoldDisciplineCard", "en": "Correctly folded nothing ${airCount} times. Good discipline — don't call just because you're invested.", "zh": "正确地弃掉空气牌 ${airCount} 次。纪律不错——别因为已经投了钱就跟。", "kind": "sentence"}, {"line": 15551, "zline": 15553, "decl": "buildFoldDisciplineCard", "en": "Folded marginal hands ${marginalCount} times. Judgment calls — no clear leak unless you're folding them to minimum bets.", "zh": "在边缘牌上弃牌 ${marginalCount} 次。这属于判断题——除非你面对最小注也弃，否则不算明显漏洞。", "kind": "sentence"}, {"line": 15554, "zline": 15556, "decl": "buildFoldDisciplineCard", "en": "Fold Discipline", "zh": "弃牌纪律", "kind": "term"}, {"line": 15570, "zline": 15572, "decl": "buildTurnRiverCourageCard", "en": "You fold to turn bets ${pct(rate)} of the time (${foldVsTurn}/${facedTurn}). Opponents who notice this will barrel you off hands every turn. This is a clear leak.", "zh": "你面对转牌下注有 ${pct(rate)} 会弃牌（${foldVsTurn}/${facedTurn}）。注意到这点的对手会每条转牌都把你轰走。这是明确的漏洞。", "kind": "sentence"}, {"line": 15572, "zline": 15574, "decl": "buildTurnRiverCourageCard", "en": "You fold to turn bets ${pct(rate)} of the time — on the high side. Start calling more with top pair or strong draws.", "zh": "你面对转牌下注有 ${pct(rate)} 会弃牌 —— 偏高。顶对或强听牌可以多跟一些。", "kind": "sentence"}, {"line": 15574, "zline": 15576, "decl": "buildTurnRiverCourageCard", "en": "You only fold ${pct(rate)} to turn bets — you're a tough call-down. Make sure you're not bleeding chips calling with middle pair on scary boards.", "zh": "你面对转牌下注只弃 ${pct(rate)} —— 别人很难把你轰走。留意别在吓人的牌面上用中对一直跟、白流筹码。", "kind": "sentence"}, {"line": 15576, "zline": 15578, "decl": "buildTurnRiverCourageCard", "en": "Turn fold rate is ${pct(rate)} — reasonable. No obvious leak.", "zh": "转牌弃牌率 ${pct(rate)}——还算合理，没有明显漏洞。", "kind": "sentence"}, {"line": 15582, "zline": 15584, "decl": "buildTurnRiverCourageCard", "en": "You fold to river bets ${pct(rate)} of the time (${foldVsRiver}/${facedRiver}). Any decent player will bluff your river after you call the turn. Fix this.", "zh": "你面对河牌下注有 ${pct(rate)} 会弃牌（${foldVsRiver}/${facedRiver}）。只要你跟了转牌，任何像样的对手都会在河牌诈唬你。这个得改。", "kind": "sentence"}, {"line": 15584, "zline": 15586, "decl": "buildTurnRiverCourageCard", "en": "You fold to river bets ${pct(rate)} — getting towards exploitable territory.", "zh": "你面对河牌下注弃牌 ${pct(rate)} —— 已经接近被针对的区间了。", "kind": "sentence"}, {"line": 15586, "zline": 15588, "decl": "buildTurnRiverCourageCard", "en": "You almost never fold the river (${pct(rate)}). Good if you have strong reads — expensive if you're just stubborn.", "zh": "你河牌几乎从不弃牌（${pct(rate)}）。有靠谱读牌是好事 —— 只是死磕的话会很贵。", "kind": "sentence"}, {"line": 15588, "zline": 15590, "decl": "buildTurnRiverCourageCard", "en": "River fold rate is ${pct(rate)} — balanced.", "zh": "河牌弃牌率 ${pct(rate)} —— 比较平衡。", "kind": "sentence"}, {"line": 15595, "zline": 15597, "decl": "buildTurnRiverCourageCard", "en": "You fold a lot on both late streets. Aggressive opponents will barrel you relentlessly — you're giving up pots you've already invested in.", "zh": "你在两条后街都弃牌很多。激进的对手会无情地连续下注——你在放弃已经投入了的底池。", "kind": "sentence"}, {"line": 15597, "zline": 15599, "decl": "buildTurnRiverCourageCard", "en": "You call down hard on both streets. Make sure you're not paying off value bets with weak holdings.", "zh": "你在两条街都硬跟到底。确保你没有用弱牌支付别人的价值下注。", "kind": "sentence"}, {"line": 15601, "zline": 15603, "decl": "buildTurnRiverCourageCard", "en": "Turn & River Courage", "zh": "转牌与河牌勇气", "kind": "term"}, {"line": 15616, "zline": 15618, "decl": "pct", "en": "You're playing too many hands from early position (${pct(EP.vpip, EP.hands)}% VPIP). Tighten to premium pairs and strong broadways from UTG.", "zh": "你在前位玩的牌太多了（VPIP ${pct(EP.vpip, EP.hands)}%）。前位收紧到大对子和强高张。", "kind": "sentence"}, {"line": 15619, "zline": 15621, "decl": "pct", "en": "You're not stealing enough from late position (${pct(LP.pfr, LP.hands)}% PFR). When it folds to you on the button, raise wider — any ace, any pair, any two broadways.", "zh": "你在后位偷盲不够（PFR ${pct(LP.pfr, LP.hands)}%）。轮到按钮位全弃到你时，放宽加注 —— 任何像样的带 A 牌、任何对子、任何两张高张。", "kind": "sentence"}, {"line": 15622, "zline": 15624, "decl": "pct", "en": "You over-defend your big blind by calling too much (${pct(BB.vpip, BB.hands)}% VPIP, ${pct(BB.pfr, BB.hands)}% PFR). Either fold or raise — stop flatting everything.", "zh": "你在大盲防守过度、跟注太多（VPIP ${pct(BB.vpip, BB.hands)}%，PFR ${pct(BB.pfr, BB.hands)}%）。要么弃牌、要么加注 —— 别什么都平跟。", "kind": "sentence"}, {"line": 15628, "zline": 15630, "decl": "pct", "en": "You play the same way regardless of position (LP ${lpPfr}% PFR, EP ${epPfr}% PFR). Position is the single biggest edge in poker — start exploiting it.", "zh": "你不分位置都这么打（后位 PFR ${lpPfr}%，前位 PFR ${epPfr}%）。位置是扑克里最大的优势 —— 开始利用它。", "kind": "sentence"}, {"line": 15630, "zline": 15632, "decl": "pct", "en": "Good position awareness — LP PFR ${lpPfr}% vs EP PFR ${epPfr}%. Keep adjusting by position.", "zh": "位置意识不错 —— 后位 PFR ${lpPfr}% 对前位 PFR ${epPfr}%。继续保持按位置调整。", "kind": "sentence"}, {"line": 15634, "zline": 15636, "decl": "pct", "en": "Position Awareness", "zh": "位置意识", "kind": "term"}, {"line": 15650, "zline": 15652, "decl": "buildUncontestedCard", "en": "You've won ${ucTotal} uncontested pots but never with a bluff — opponents will learn your bets always mean something and stop paying you off. Mix in some air.", "zh": "你拿下过 ${ucTotal} 个无人跟的底池，但一次都不是诈唬 —— 对手会学到你的下注永远代表有牌，然后不再支付你。掺一些空气进去。", "kind": "sentence"}, {"line": 15654, "zline": 15656, "decl": "buildUncontestedCard", "en": "${bluffPct}% of your uncontested wins were bluffs or semi-bluffs (${totalBluffs}/${ucTotal}) — getting away with it for now, but tighten up if opponents start adjusting.", "zh": "你无人跟的底池里有 ${bluffPct}% 是诈唬或半诈唬（${totalBluffs}/${ucTotal}）—— 目前还没被抓，但对手一旦开始调整就收着点。", "kind": "sentence"}, {"line": 15656, "zline": 15658, "decl": "buildUncontestedCard", "en": "${bluffPct}% of uncontested wins were bluffs — solid balance between value and air.", "zh": "无人跟的底池里有 ${bluffPct}% 是诈唬 —— 价值和空气的平衡不错。", "kind": "sentence"}, {"line": 15660, "zline": 15662, "decl": "buildUncontestedCard", "en": "Opponents folded to your value bets ${valueWins} times — you're not extracting max value. Try smaller sizing to get calls.", "zh": "对手对你的价值下注弃牌 ${valueWins} 次 —— 你没榨到最大价值。试试下小一点换跟注。", "kind": "sentence"}, {"line": 15663, "zline": 15665, "decl": "buildUncontestedCard", "en": "C-bets working — ${cbetWins} uncontested c-bet wins. Keep firing.", "zh": "C-bet 有效 —— ${cbetWins} 次无人跟的 C-bet 拿下底池。继续开火。", "kind": "sentence"}, {"line": 15666, "zline": 15668, "decl": "buildUncontestedCard", "en": "Stolen preflop ${stealWins} times — effective blind pressure.", "zh": "翻前偷盲 ${stealWins} 次 —— 盲注位压力有效。", "kind": "sentence"}, {"line": 15669, "zline": 15671, "decl": "buildUncontestedCard", "en": "Uncontested Wins", "zh": "不战而胜", "kind": "term"}, {"line": 15736, "zline": 15738, "decl": "buildLooseCallCard", "en": "Recent example: \"${examples[0]}.\"", "zh": "最近一例：「${examples[0]}」", "kind": "term"}, {"line": 15737, "zline": 15739, "decl": "buildLooseCallCard", "en": "Had a real-but-not-great hand run into something better ${overplayed} times (${rate}% of graded hands).${exStr} When the price to continue jumps — a raise, not just a bet — that's the moment to re-check whether your hand beats what's left in the pot, not just whether it beat what was there a street ago.", "zh": "有真牌但不够强的牌撞上更强的牌 ${overplayed} 次（占已评分手牌的 ${rate}%）。${exStr} 当继续下去的代价突然变高 —— 是加注而不只是下注 —— 那一刻就该重新确认：你的牌打得过底池里还在的那些牌吗，而不只是打得过一条街之前的那些牌吗。", "kind": "sentence"}, {"line": 15742, "zline": 15744, "decl": "buildLooseCallCard", "en": "Graded as a loose call ${looseCalls} times (${rate}% of graded hands) — calls that weren't justified by price or hand strength at the time.", "zh": "被判为过松跟注 ${looseCalls} 次（占已评分手牌的 ${rate}%）—— 这些跟注按当时的赔率或牌力都不成立。", "kind": "sentence"}, {"line": 15746, "zline": 15748, "decl": "buildLooseCallCard", "en": "Calling Off Too Light", "zh": "跟注太松", "kind": "term"}, {"line": 15781, "zline": 15783, "decl": "buildSizingVsTextureCard", "en": "Bet pot-sized or bigger with just a ${dryExamples[0] || 'pair'} on a board with no real draw (no flush or obvious straight threat) ${dryOverbets} time${dryOverbets > 1 ? 's' : ''} this session${wetOverbets ? `, versus ${wetOverbets} on boards that actually had a draw live` : ''}. If the size doesn't move with the board texture, it isn't sized to deny anything — check whether you're betting the board or betting how you feel about the hand.", "zh": "本局有 ${dryOverbets} 次在完全没有听牌的牌面（没有同花、也没有明显的顺子威胁）上，只拿着 ${dryExamples[0] || '一对'} 就下了一个底池或更大的注${wetOverbets ? `，而有真听牌的牌面上只有 ${wetOverbets} 次` : ''}。如果下注量不跟着牌面湿润度走，这个量就不是在拒绝什么 —— 想想你是在对着牌面下注，还是对着自己对这手牌的感觉下注。", "kind": "sentence"}, {"line": 15782, "zline": 15784, "decl": "buildSizingVsTextureCard", "en": "Bet Sizing vs. Board Texture", "zh": "下注量 vs 牌面湿润度", "kind": "sentence"}, {"line": 15809, "zline": 15811, "decl": "m", "en": "Lost ${nonNut.length} hand${nonNut.length > 1 ? 's' : ''} this session holding a flush that wasn't the nuts — no Ace of the flush suit in hand, so no way to rule out a bigger one.", "zh": "本局有 ${nonNut.length} 手拿着非坚果同花输掉 —— 手里没有同花色的 A，就没法排除别人有更大的同花。", "kind": "sentence"}, {"line": 15811, "zline": 15813, "decl": "m", "en": "${pushed.length} of those you bet or raised into, not just called. A non-nut flush with no blocker only gets action from hands that already beat it — one bet for value is usually the right amount of greed, not a raising war.", "zh": "其中 ${pushed.length} 次你不只是跟注，还下注或加注了。没有阻断牌的非坚果同花，只会有已经比你大的牌来跟 —— 打一条街价值通常是合适的贪心，而不是加注大战。", "kind": "sentence"}, {"line": 15812, "zline": 15814, "decl": "m", "en": "Non-Nut Flush Awareness", "zh": "非坚果同花意识", "kind": "term"}, {"line": 15855, "zline": 15857, "decl": "contrib", "en": "${flagged} of your biggest losses this session (15%+ of your stack committed in one hand) landed either while you were already down for the session (${downCount}) or right after a new session-high (${peakCount}).", "zh": "本局你最大的几笔亏损（单手投入 15% 以上筹码）里，有 ${flagged} 笔是发生在你本局已经处于亏损时（${downCount}），或者刚创下本局新高之后（${peakCount}）。", "kind": "sentence"}, {"line": 15856, "zline": 15858, "decl": "contrib", "en": "Both are exactly the moments a small correct win stops feeling like enough. This isn't proof any single one of those was wrong — but it's worth checking your own state before committing big on a hand that lands right after a swing, not just checking the cards.", "zh": "这两种时刻，正是一次正确的小赢开始显得不够的时候。这不能证明其中任何一笔是错的 —— 但在一手紧跟在波动之后到来的牌上投入大筹码之前，值得先检查一下自己的状态，而不只是检查牌。", "kind": "sentence"}, {"line": 15858, "zline": 15860, "decl": "contrib", "en": "Result-Chasing Pattern", "zh": "追结果模式", "kind": "term"}, {"line": 15872, "zline": 15874, "decl": "buildSelfHintHtml", "en": "You're in almost every hand and betting constantly. This occasionally bullies weaker players into folding, but any patient player with a real hand will stack you. You're bleeding chips on the hands you have no business being in.", "zh": "你几乎每手牌都参与，不停地押注。这偶尔能欺负弱玩家弃牌，但任何有耐心且有真牌的玩家都会清空你。你在那些不该进的牌局中流血筹码。", "kind": "sentence"}, {"line": 15873, "zline": 15875, "decl": "buildSelfHintHtml", "en": "Aggressive and involved — this can be a strong winning style when backed by real hand equity. You can accumulate chips fast, but you can spew them equally fast. The line between LAG and Maniac is discipline in hand selection.", "zh": "激进且参与度高——当有真实手牌赢率支持时，这可以是一种很强的赢利风格。你可以快速积累筹码，但也能同样快地挥霍掉。LAG和Maniac之间的界限在于起手牌选择的纪律性。", "kind": "sentence"}, {"line": 15874, "zline": 15876, "decl": "buildSelfHintHtml", "en": "You're playing the most profitable style in a casual pool. Selective hand selection, aggressive when you play, hard to put on a hand. The biggest risk from here is getting bored and gradually drifting your range wider.", "zh": "你在休闲局中打的是最盈利的风格。选择性起手牌，玩的时候就激进，很难被读牌。最大的风险是感到无聊，逐渐把范围放宽。", "kind": "sentence"}, {"line": 15875, "zline": 15877, "decl": "buildSelfHintHtml", "en": "You're playing far too many hands and almost never raising when you do. This is the most expensive style in poker — you're giving every opponent at the table correct odds and free information every hand. The good news: the fix is simple and the improvement will be dramatic.", "zh": "你玩的牌太多太多了，而且几乎从不加注。这是扑克中最昂贵的风格——你在每一手牌都给桌上每个对手正确的赔率和免费信息。好消息是：修复方法很简单，改善效果会非常显著。", "kind": "sentence"}, {"line": 15876, "zline": 15878, "decl": "buildSelfHintHtml", "en": "You enter a lot of pots but rarely raise. You're consistently calling with hands that should either fold or raise — callers fund other people's winnings. You're giving opponents correct odds to draw against you every hand.", "zh": "你进入很多底池但很少加注。你一直用应该弃牌或加注的牌在跟注——跟注者是在资助别人的赢利。你在每一手牌都给对手正确的听牌赔率。", "kind": "sentence"}, {"line": 15877, "zline": 15879, "decl": "buildSelfHintHtml", "en": "You fold almost everything. Your range is so tight that everyone at the table knows exactly what you have when you play a hand. You're giving up all the small pots and only winning when you have the absolute best of it — which isn't enough to grow your stack.", "zh": "你几乎弃掉一切。你的范围太紧了，桌上每个人都知道你玩牌时拿的是什么。你放弃了所有小底池，只有在拿到绝对最好的牌时才能赢——这不足以增长你的筹码。", "kind": "sentence"}, {"line": 15878, "zline": 15880, "decl": "buildSelfHintHtml", "en": "You're playing so tight you're leaving money on the table. You avoid bad spots — but you're also never stealing blinds, never applying pressure, and every player at the table has noticed they can fold when you bet.", "zh": "你玩得太紧了，把筹码留在了桌上。你避免了坏局面——但你也从不偷盲，从不施加压力，而且桌上每个玩家都注意到你下注时他们可以弃牌。", "kind": "sentence"}, {"line": 15879, "zline": 15881, "decl": "buildSelfHintHtml", "en": "You play few hands and don't raise enough when you do. That combo means you win small pots and lose small pots — but your chip count doesn't grow. You're playing scared money and giving away value every session.", "zh": "你玩的牌不多，玩的时候加注也不够。这个组合意味着你赢小底池、输小底池——但你的筹码数不会增长。你在玩害怕的钱，每次session都在白送价值。", "kind": "sentence"}, {"line": 15880, "zline": 15882, "decl": "buildSelfHintHtml", "en": "You're playing a lot of hands but checking and calling instead of betting and raising. This is one of the most expensive styles in poker. You give better-positioned and more aggressive players free information and cheap odds to outdraw you constantly.", "zh": "你玩了很多牌，但总是过牌和跟注，而不是下注和加注。这是扑克中最昂贵的风格之一。你给有位置优势、更激进的玩家免费信息和便宜的赔率，让他们不断反超你。", "kind": "sentence"}, {"line": 15881, "zline": 15883, "decl": "buildSelfHintHtml", "en": "Your play doesn't have a consistent enough pattern yet — could be genuine adaptation, could be inconsistency. Keep playing and check back once there's more data.", "zh": "你的打法还没有足够一致的模式——可能是真正的适应，也可能是不稳定。继续玩，等有更多数据后再回来看。", "kind": "sentence"}, {"line": 15882, "zline": 15884, "decl": "buildSelfHintHtml", "en": "Not enough hands tracked yet. Keep playing and come back.", "zh": "追踪的手牌还不够。继续玩，稍后再来。", "kind": "sentence"}, {"line": 15892, "zline": 15894, "decl": "buildSelfHintHtml", "en": "Across ${dm.n.toLocaleString()} hands your stats sit between ${resolvedType(TYPES[scored[0][0]]).label} and ${resolvedType(TYPES[scored[1][0]]).label}, with ${resolvedType(TYPES[scored[0][0]]).label} the closest fit. A blended profile is fine when it's deliberate, and it makes you harder to read. Check the stat notes below to see which half of the blend earns and which leaks.", "zh": "${dm.n.toLocaleString()} 手牌下来，你的数据介于 ${resolvedType(TYPES[scored[0][0]]).label} 和 ${resolvedType(TYPES[scored[1][0]]).label} 之间，更接近 ${resolvedType(TYPES[scored[0][0]]).label}。混合型只要是有意为之就不成问题，反而更难被读穿。看看下面的数据说明，就知道混合的两半里哪一半在赚钱、哪一半在漏钱。", "kind": "sentence"}, {"line": 15896, "zline": 15898, "decl": "buildSelfHintHtml", "en": "You Are: ${resolvedType(type).label}", "zh": "你的类型: ${resolvedType(type).label}", "kind": "term"}, {"line": 15901, "zline": 15903, "decl": "buildSelfHintHtml", "en": "Your VPIP is ${vpipPct}% — you're entering too many pots. Aim for 18–30%. Start folding weak suited connectors, off-suit Broadway hands below J, and any hand you're \"hoping works out\".", "zh": "你的 VPIP 是 ${vpipPct}% —— 进池太多了。目标 18–30%。开始弃掉弱的同花连牌、J 以下的不同花高张，以及那些你只是「盼着能成」的牌。", "kind": "sentence"}, {"line": 15909, "zline": 15911, "decl": "buildSelfHintHtml", "en": "Your most-played losing hand is ${h} (${d.dealt} dealt, ${winPct}% win rate) — consider dropping it.", "zh": "你玩得最多、又最亏的是 ${h}（发到 ${d.dealt} 次，赢率 ${winPct}%）—— 考虑丢掉它。", "kind": "sentence"}, {"line": 15913, "zline": 15915, "decl": "buildSelfHintHtml", "en": "Your VPIP is ${vpipPct}% — you're folding a lot. Something around 18–28% gives you more spots to work with. Open more from the button and cutoff when action folds to you.", "zh": "你的 VPIP 是 ${vpipPct}% —— 你弃牌太多了。18–28% 左右能让你有更多可打的局面。轮到按钮位、关煞位全弃到你时，多开池。", "kind": "sentence"}, {"line": 15915, "zline": 15917, "decl": "buildSelfHintHtml", "en": "Your VPIP is ${vpipPct}% — solid range. Keep it there.", "zh": "你的 VPIP 是 ${vpipPct}% —— 范围很扎实，保持住。", "kind": "sentence"}, {"line": 15918, "zline": 15920, "decl": "buildSelfHintHtml", "en": "Your PFR is only ${pfrPct}% — you're entering pots but not raising. Limping and flat-calling gives opponents good odds and hands initiative to them. Aim for 14–22%.", "zh": "你的 PFR 只有 ${pfrPct}% —— 你在进池，但不在加注。溜入和平跟给了对手好赔率，还把主动权交出去。目标 14–22%。", "kind": "sentence"}, {"line": 15920, "zline": 15922, "decl": "buildSelfHintHtml", "en": "Your PFR is ${pfrPct}% — good aggression preflop. You're taking initiative and defining your range.", "zh": "你的 PFR 是 ${pfrPct}% —— 翻前激进度不错。你在拿主动权，也在划定自己的范围。", "kind": "sentence"}, {"line": 15922, "zline": 15924, "decl": "buildSelfHintHtml", "en": "Your PFR is ${pfrPct}% — raising a lot preflop. Make sure you have hands that can handle a 3-bet or a caller who connects with the flop.", "zh": "你的 PFR 是 ${pfrPct}% —— 翻前加注太多了。确保你选的牌扛得住 3-bet，也扛得住跟注后中了翻牌的对手。", "kind": "sentence"}, {"line": 15925, "zline": 15927, "decl": "buildSelfHintHtml", "en": "You have a ${gap}% gap between VPIP and PFR — you call significantly more than you raise. Passive calling is a leak. Every hand you flat-call instead of raise, you're giving up edge.", "zh": "你的 VPIP 和 PFR 之间差了 ${gap}% —— 跟注明显多于加注。被动跟注是个漏洞。每一次你平跟而不是加注，都在让出优势。", "kind": "sentence"}, {"line": 15929, "zline": 15931, "decl": "buildSelfHintHtml", "en": "Your post-flop aggression is ${afqPct}% — you check and call too often. Bet your strong hands and semi-bluff draws. Passive play leaks value every session.", "zh": "你的翻后攻击率是 ${afqPct}%——过牌和跟注太多。强牌要下注，听牌要半诈唬。被动打法每局都在白丢价值。", "kind": "sentence"}, {"line": 15931, "zline": 15933, "decl": "buildSelfHintHtml", "en": "Your post-flop aggression is ${afqPct}% — good balance.", "zh": "你的翻后攻击率是 ${afqPct}%——平衡得不错。", "kind": "sentence"}, {"line": 15933, "zline": 15935, "decl": "buildSelfHintHtml", "en": "Your post-flop aggression is ${afqPct}% — you're firing a lot. Pick opponents who actually fold.", "zh": "你的翻后攻击率是 ${afqPct}%——你开火很多。挑那些真会弃牌的对手下手。", "kind": "sentence"}, {"line": 15937, "zline": 15939, "decl": "buildSelfHintHtml", "en": "Your Stats Breakdown", "zh": "你的数据分解", "kind": "term"}, {"line": 15956, "zline": 15958, "decl": "buildSelfHintHtml", "en": "Fold more preflop — especially from early position. The earlier you act, the stronger your hand needs to be.", "zh": "翻前多弃牌 —— 尤其是前位。你行动越早，牌就需要越强。", "kind": "sentence"}, {"line": 15962, "zline": 15964, "decl": "buildSelfHintHtml", "en": "Start by dropping ${toBeDropped.map(([h]) => h).join('<\/b> and <b>')} — you've played them repeatedly with poor results.", "zh": "先从丢掉 ${toBeDropped.map(([h]) => h).join('<\/b> 和 <b>')} 开始 —— 你反复玩它们，结果都不好。", "kind": "sentence"}, {"line": 15966, "zline": 15968, "decl": "buildSelfHintHtml", "en": "Open more from late position — when action folds to you on the button or cutoff, raise with any decent ace, any pair, any two broadways. Stop folding to free chips.", "zh": "后位多开池 —— 轮到按钮位或关煞位全弃到你时，任何像样的带 A 牌、任何对子、任何两张高张都可以加注。别再对着白送的筹码弃牌。", "kind": "sentence"}, {"line": 15968, "zline": 15970, "decl": "buildSelfHintHtml", "en": "Raise instead of call preflop — entering with a raise takes initiative, builds the pot when you're ahead, and makes your hand harder to play against.", "zh": "翻前加注代替跟注 —— 加注入池能拿到主动权、在你领先时把底池做大，也让你的牌更难被针对。", "kind": "sentence"}, {"line": 15974, "zline": 15976, "decl": "buildSelfHintHtml", "en": "You've played ${neverRaised.map(([h]) => h).join('<\/b> and <b>')} multiple times but never raised — if a hand is worth playing, raise.", "zh": "你玩过 ${neverRaised.map(([h]) => h).join('<\/b> 和 <b>')} 好几次，但一次都没加注 —— 一手牌既然值得玩，就值得加注。", "kind": "sentence"}, {"line": 15978, "zline": 15980, "decl": "buildSelfHintHtml", "en": "Bet your strong hands post-flop instead of checking — top pair on a dry board, a flopped flush draw, two pair — all deserve a bet. Passive play leaks value every session.", "zh": "翻后用下注代替过牌来打你的强牌 — 干燥牌面的顶对、翻牌同花听牌、两对——都值得下注。被动打法每一局都在白白丢掉价值。", "kind": "sentence"}, {"line": 15980, "zline": 15982, "decl": "buildSelfHintHtml", "en": "Close the VPIP-PFR gap — before calling, ask yourself \"should I raise here instead?\" The answer is yes more often than you think.", "zh": "缩小 VPIP-PFR 缺口 —— 跟注之前，先问自己「我这里是不是该加注？」多数情况下答案是「该」。", "kind": "sentence"}, {"line": 15983, "zline": 15985, "decl": "buildSelfHintHtml", "en": "Path to ${resolvedType(TYPES.TAG).label}", "zh": "通往${resolvedType(TYPES.TAG).label}之路", "kind": "term"}, {"line": 15993, "zline": 15995, "decl": "buildSelfHintHtml", "en": "Watch out — ${drifting.map(([h]) => h).join('<\/b>, <b>')} ${drifting.length > 1 ? 'are' : 'is'} creeping into your range with poor results. That's how VPIP drift starts.", "zh": "注意 —— ${drifting.map(([h]) => h).join('<\/b>、<b>')} 正在悄悄溜进你的范围，结果还不好。VPIP 漂移就是这么开始的。", "kind": "sentence"}, {"line": 15997, "zline": 15999, "decl": "epPos", "en": "Your early position play is loosening — ${Math.round(epPos.vpip / epPos.hands * 100)}% VPIP from EP. Tighten back up.", "zh": "你的前位开始变松了 —— 前位 VPIP 已经到 ${Math.round(epPos.vpip / epPos.hands * 100)}%。收回来。", "kind": "sentence"}, {"line": 16002, "zline": 16004, "decl": "epPos", "en": "You're folding to turn bets ${Math.round((s.foldedVsTurnBetCount || 0) / facedTurn * 100)}% of the time — even TAG players shouldn't be this exploitable on the turn.", "zh": "面对转牌下注你有 ${Math.round((s.foldedVsTurnBetCount || 0) / facedTurn * 100)}% 的时候弃牌——就算是紧凶型，也不该在转牌这么容易被针对。", "kind": "sentence"}, {"line": 16004, "zline": 16006, "decl": "epPos", "en": "River fold rate is ${Math.round((s.foldedVsRiverBetCount || 0) / facedRiver * 100)}% — getting high even for a TAG. Bluffers will find this.", "zh": "河牌弃牌率 ${Math.round((s.foldedVsRiverBetCount || 0) / facedRiver * 100)}%——对紧凶型来说也偏高了。诈唬的人会盯上这点。", "kind": "sentence"}, {"line": 16008, "zline": 16010, "decl": "epPos", "en": "Don't drift. The biggest leak for TAG players is gradually opening weaker hands out of boredom — that VPIP starts creeping up a few percent, then a few more. If the table is passive and no one fights back, you can add controlled aggression with suited connectors in position. Otherwise, stay the course.", "zh": "别漂移。TAG玩家最大的漏洞是出于无聊逐渐打开更弱的牌——VPIP开始悄悄上涨几个百分点，然后又几个百分点。如果牌桌被动，没人反击，你可以在有位置时用同花连牌增加可控的侵略性。否则，坚持住。", "kind": "sentence"}, {"line": 16009, "zline": 16011, "decl": "epPos", "en": "Stay Sharp", "zh": "保持敏锐", "kind": "term"}, {"line": 16013, "zline": 16015, "decl": "epPos", "en": "Still building your profile — play more hands to unlock all insights.", "zh": "还在建立你的画像 —— 多打几手牌来解锁全部解读。", "kind": "sentence"}, {"line": 16022, "zline": 16024, "decl": "buildHintHtml", "en": "? `${n || 0}/5 hands tracked so far — keep playing to unlock your full improvement profile.`", "zh": "? `目前已追踪 ${n || 0}/5 手牌 —— 继续玩，解锁完整的改进画像。`", "kind": "sentence"}, {"line": 16023, "zline": 16025, "decl": "buildHintHtml", "en": ": 'Need at least 5 hands to generate hints.'", "zh": ": '至少需要 5 手牌才能生成解读。'", "kind": "sentence"}, {"line": 16026, "zline": 16028, "decl": "buildHintHtml", "en": "Need at least 5 hands to generate hints.", "zh": "至少需要 5 手牌才能生成解读。", "kind": "sentence"}, {"line": 16098, "zline": 16100, "decl": "fmtAmt", "en": "OB", "zh": "超池", "kind": "term"}, {"line": 16098, "zline": 16100, "decl": "fmtAmt", "en": "probe", "zh": "试探", "kind": "term"}, {"line": 16150, "zline": 16152, "decl": "showRow", "en": "no showdown", "zh": "无争议", "kind": "term"}, {"line": 16150, "zline": 16152, "decl": "showRow", "en": "Won uncontested", "zh": "无争议获胜", "kind": "term"}, {"line": 16176, "zline": 16178, "decl": "LABEL_MAP", "en": "↩ Folded strong hand", "zh": "↩ 弃强牌", "kind": "term"}, {"line": 16177, "zline": 16179, "decl": "LABEL_MAP", "en": "↩ Good fold — strong hand, right call", "zh": "↩ 好弃牌——强牌，正确决定", "kind": "sentence"}, {"line": 16178, "zline": 16180, "decl": "LABEL_MAP", "en": "↩ Folded draw — it hit", "zh": "↩ 弃听牌——中了", "kind": "sentence"}, {"line": 16179, "zline": 16181, "decl": "LABEL_MAP", "en": "↩ Folded draw — missed", "zh": "↩ 弃听牌——没中", "kind": "sentence"}, {"line": 16180, "zline": 16182, "decl": "LABEL_MAP", "en": "↩ Folded marginal hand", "zh": "↩ 弃边缘牌", "kind": "term"}, {"line": 16181, "zline": 16183, "decl": "LABEL_MAP", "en": "↩ Folded nothing", "zh": "↩ 弃垃圾牌", "kind": "term"}, {"line": 16223, "zline": 16225, "decl": "foldFollowRow", "en": "⚠ Won without the best hand", "zh": "⚠ 赢 without the best hand", "kind": "sentence"}, {"line": 16330, "zline": 16332, "decl": "shared", "en": "Heads-up (1v1) hands aren't recorded — turn on \"Heads-up tracking\" in Settings if you want them here.", "zh": "单挑（1v1）的手牌不会被记录 — 想在这里看到它们，请在设置里打开「单挑（1v1）数据」。", "kind": "sentence"}, {"line": 16442, "zline": 16444, "decl": "buildRangeHtml", "en": "Hand", "zh": "手牌", "kind": "term"}, {"line": 16445, "zline": 16447, "decl": "buildRangeHtml", "en": "Won", "zh": "赢", "kind": "term"}, {"line": 16472, "zline": 16474, "decl": "buildRangeHtml", "en": "Hand", "zh": "手牌", "kind": "term"}, {"line": 16477, "zline": 16479, "decl": "buildRangeHtml", "en": "Won", "zh": "赢", "kind": "term"}, {"line": 16596, "zline": 16598, "decl": "buildTablesHtml", "en": "${bar(statLbl('vpip'), lifetimeDm.vpip, '#2ecc71', '', `${s.vpipCount || 0} / ${s.handsObserved || 0} hands`)}", "zh": "${bar(statLbl('vpip'), lifetimeDm.vpip, '#2ecc71', '', `${s.vpipCount || 0} / ${s.handsObserved || 0} 手牌`)}", "kind": "term"}, {"line": 16597, "zline": 16599, "decl": "buildTablesHtml", "en": "${bar(statLbl('pfr'), lifetimeDm.pfr, '#e74c3c', '', `${s.pfrCount || 0} / ${s.handsObserved || 0} hands`)}", "zh": "${bar(statLbl('pfr'), lifetimeDm.pfr, '#e74c3c', '', `${s.pfrCount || 0} / ${s.handsObserved || 0} 手牌`)}", "kind": "term"}, {"line": 16598, "zline": 16600, "decl": "buildTablesHtml", "en": "${bar(statLbl('afq'), lifetimeDm.afq, '#e67e22', '', `${(s.postBets || 0) + (s.postRaises || 0)} aggressive / ${((s.postBets || 0) + (s.postRaises || 0) + (s.postCalls || 0) + (s.postFolds || 0))} counted actions`)}", "zh": "${bar(statLbl('afq'), lifetimeDm.afq, '#e67e22', '', `${(s.postBets || 0) + (s.postRaises || 0)} 次攻击性 / ${((s.postBets || 0) + (s.postRaises || 0) + (s.postCalls || 0) + (s.postFolds || 0))} 次有效行动`)}", "kind": "sentence"}, {"line": 16626, "zline": 16628, "decl": "labelHtml", "en": "${bar('Plays hands', dm.vpip, '#2ecc71', 'Voluntarily enters the pot preflop. BB checks (free looks) are not counted.', `${t.vpipCount || 0} / ${t.handsObserved || 0} hands`)}", "zh": "${bar('入池率', dm.vpip, '#2ecc71', '翻前主动入池。大盲注的免费看牌（过牌）不计入。', `${t.vpipCount || 0} / ${t.handsObserved || 0} 手牌`)}", "kind": "term"}, {"line": 16627, "zline": 16629, "decl": "labelHtml", "en": "${bar('Raises preflop', dm.pfr, '#e74c3c', 'How often they raise before the flop', `${t.pfrCount || 0} / ${t.handsObserved || 0} hands`)}", "zh": "${bar('翻牌前加注率', dm.pfr, '#e74c3c', '翻前加注的频率', `${t.pfrCount || 0} / ${t.handsObserved || 0} 手牌`)}", "kind": "term"}, {"line": 16628, "zline": 16630, "decl": "labelHtml", "en": "${t.limpCount > 0 ? bar('Limps in', dm.limpPct, '#f39c12', 'Calls preflop without raising', `${t.limpCount || 0} / ${t.handsObserved || 0} hands`) : ''}", "zh": "${t.limpCount > 0 ? bar('溜入', dm.limpPct, '#f39c12', '翻前平跟入池，不加注', `${t.limpCount || 0} / ${t.handsObserved || 0} 手牌`) : ''}", "kind": "sentence"}, {"line": 16629, "zline": 16631, "decl": "labelHtml", "en": "${dm.threeBetPct != null ? bar('3-bets', dm.threeBetPct, '#e74c3c', 'Re-raises preflop when facing a raise', `${t.threeBetCount || 0} / ${t.threeBetOpportunities || 0} opportunities`) : ''}", "zh": "${dm.threeBetPct != null ? bar('3-Bet率', dm.threeBetPct, '#e74c3c', '面对加注时翻前反加的频率', `${t.threeBetCount || 0} / ${t.threeBetOpportunities || 0} 次机会`) : ''}", "kind": "sentence"}, {"line": 16631, "zline": 16633, "decl": "labelHtml", "en": "${bar('Bets/raises post', dm.afq, '#e67e22', 'How aggressively they play after the flop', `${(t.postBets || 0) + (t.postRaises || 0)} aggressive / ${((t.postBets || 0) + (t.postRaises || 0) + (t.postCalls || 0) + (t.postFolds || 0))} counted actions`)}", "zh": "${bar('翻牌后下注/加注', dm.afq, '#e67e22', '翻后激进程度', `${(t.postBets || 0) + (t.postRaises || 0)} 次激进 / ${((t.postBets || 0) + (t.postRaises || 0) + (t.postCalls || 0) + (t.postFolds || 0))} 次计数行动`)}", "kind": "sentence"}, {"line": 16632, "zline": 16634, "decl": "labelHtml", "en": "${dm.foldVsFlopBet != null ? bar('Folds to flop bet', dm.foldVsFlopBet, '#3498db', 'Folds when bet into on the flop', `${t.foldedVsFlopBetCount || 0} / ${t.facedFlopBetCount || 0} opportunities`) : ''}", "zh": "${dm.foldVsFlopBet != null ? bar('弃牌率vs翻牌下注', dm.foldVsFlopBet, '#3498db', '翻牌圈面对下注时弃牌', `${t.foldedVsFlopBetCount || 0} / ${t.facedFlopBetCount || 0} 次机会`) : ''}", "kind": "sentence"}, {"line": 16637, "zline": 16639, "decl": "labelHtml", "en": "${dm.postFoldPct != null ? bar('Folds post-flop', dm.postFoldPct, '#7f8c8d', 'How often they fold to any post-flop action', `${t.postFolds || 0} / ${((t.postFolds || 0) + (t.postCalls || 0) + (t.postBets || 0) + (t.postRaises || 0) + (t.postChecks || 0))} actions`) : ''}", "zh": "${dm.postFoldPct != null ? bar('翻后弃牌率', dm.postFoldPct, '#7f8c8d', '面对翻后行动时弃牌的频率', `${t.postFolds || 0} / ${((t.postFolds || 0) + (t.postCalls || 0) + (t.postBets || 0) + (t.postRaises || 0) + (t.postChecks || 0))} 次行动`) : ''}", "kind": "sentence"}, {"line": 16638, "zline": 16640, "decl": "labelHtml", "en": "${t.sawFlopCount > 0 ? bar('Stays till showdown', dm.wtsd, '#3498db', 'How often they stay in until showdown', `${t.wentToShowdownCount || 0} / ${t.sawFlopCount || 0} flops seen`) : ''}", "zh": "${t.sawFlopCount > 0 ? bar('摊牌率', dm.wtsd, '#3498db', '坚持到摊牌的频率', `${t.wentToShowdownCount || 0} / ${t.sawFlopCount || 0} 次翻牌`) : ''}", "kind": "sentence"}, {"line": 16639, "zline": 16641, "decl": "labelHtml", "en": "${t.wentToShowdownCount > 0 ? bar('Wins showdowns', dm.wsd, '#9b59b6', 'How often they win when they reach showdown', `${t.wonAtShowdownCount || 0} / ${t.wentToShowdownCount || 0} showdowns`) : ''}", "zh": "${t.wentToShowdownCount > 0 ? bar('摊牌胜率', dm.wsd, '#9b59b6', '摊牌时的获胜频率', `${t.wonAtShowdownCount || 0} / ${t.wentToShowdownCount || 0} 次摊牌`) : ''}", "kind": "sentence"}, {"line": 16700, "zline": 16702, "decl": "tiltBannerHtml", "en": "Plays ${deltaPct}pp looser right after dropping a big pot (${tiltTrigger.sampleSize} sampled)", "zh": "丢掉大池之后入池率松了 ${deltaPct}pp（样本 ${tiltTrigger.sampleSize} 手）", "kind": "sentence"}, {"line": 16701, "zline": 16703, "decl": "tiltBannerHtml", "en": "Plays ${Math.abs(deltaPct)}pp tighter right after dropping a big pot (${tiltTrigger.sampleSize} sampled)", "zh": "丢掉大池之后入池率紧了 ${Math.abs(deltaPct)}pp（样本 ${tiltTrigger.sampleSize} 手）", "kind": "sentence"}, {"line": 16705, "zline": 16707, "decl": "trendHtml", "en": "⚠ Heads-up mode — stats paused, reads from this table don't apply", "zh": "⚠ 单挑模式——数据已暂停，这张桌的解读不适用", "kind": "sentence"}, {"line": 16830, "zline": 16832, "decl": "profit", "en": "Playtime", "zh": "游戏时长", "kind": "term"}, {"line": 16834, "zline": 16836, "decl": "profit", "en": "Profit", "zh": "盈利", "kind": "term"}, {"line": 16843, "zline": 16845, "decl": "lostPct", "en": "▼ Down ${Math.round(lostPct)}% from peak — high tilt risk", "zh": "▼ 距峰值下跌 ${Math.round(lostPct)}% — 高上头风险", "kind": "sentence"}, {"line": 16844, "zline": 16846, "decl": "lostPct", "en": "▽ Down ${Math.round(lostPct)}% from peak — watch aggression", "zh": "▽ 距峰值下跌 ${Math.round(lostPct)}% — 注意激进程度", "kind": "sentence"}, {"line": 16848, "zline": 16850, "decl": "lostPct", "en": "Rebought ${panelRebuys}× — watch for tilt", "zh": "重购 ${panelRebuys}× — 注意上头", "kind": "sentence"}, {"line": 16884, "zline": 16886, "decl": "notesHtml", "en": "Auto-Tagged Plays", "zh": "Auto-Tagged 入池率", "kind": "term"}, {"line": 16913, "zline": 16915, "decl": "lifetimeDesc", "en": "Hand HistoryHH", "zh": "手牌 HistoryHH", "kind": "term"}, {"line": 17033, "zline": 17035, "decl": "exportHistJson", "en": "No data yet", "zh": "暂无数据", "kind": "term"}, {"line": 17039, "zline": 17041, "decl": "exportHistJson", "en": "Reset ALL stats? This will delete records for ${count} player${count === 1 ? '' : 's'} and cannot be undone.", "zh": "重置所有数据？这将删除 ${count} 名玩家的记录，且无法撤销。", "kind": "sentence"}, {"line": 17208, "zline": 17210, "decl": "serializeHandHistory", "en": "Hand #${snap.handId}${tablePart}${bbPart}", "zh": "手牌 #${snap.handId}${tablePart}${bbPart}", "kind": "term"}, {"line": 17273, "zline": 17275, "decl": "cards", "en": "(showdown)", "zh": "（摊牌）", "kind": "term"}, {"line": 17273, "zline": 17275, "decl": "cards", "en": "(uncontested)", "zh": "（无争议）", "kind": "term"}, {"line": 17274, "zline": 17276, "decl": "cards", "en": "${name} wins${amtPart}${how}", "zh": "${name}赢${amtPart}${how}", "kind": "term"}, {"line": 17278, "zline": 17280, "decl": "cards", "en": "Showdown:", "zh": "摊牌:", "kind": "term"}, {"line": 17312, "zline": 17314, "decl": "showHandHistoryModal", "en": "Hand History", "zh": "手牌历史", "kind": "term"}, {"line": 17312, "zline": 17314, "decl": "showHandHistoryModal", "en": "Hand History (last ${recentHandHistories.length})", "zh": "手牌历史（最近 ${recentHandHistories.length} 手）", "kind": "term"}, {"line": 17314, "zline": 17316, "decl": "showHandHistoryModal", "en": "No hands recorded yet. Complete a hand to see history here.", "zh": "还没有记录任何牌局。打完一手就能在这里看到历史。", "kind": "sentence"}, {"line": 17319, "zline": 17321, "decl": "showHandHistoryModal", "en": "Hand ${i + 1}", "zh": "手牌 ${i + 1}", "kind": "term"}, {"line": 17326, "zline": 17328, "decl": "showHandHistoryModal", "en": "Copy to clipboardCopy", "zh": "复制到剪贴板复制", "kind": "term"}, {"line": 17347, "zline": 17349, "decl": "showHandHistoryModal", "en": "Copied!", "zh": "已复制！", "kind": "term"}, {"line": 17348, "zline": 17350, "decl": "showHandHistoryModal", "en": "Copy", "zh": "复制", "kind": "term"}, {"line": 17350, "zline": 17352, "decl": "showHandHistoryModal", "en": "Failed", "zh": "失败", "kind": "term"}, {"line": 17351, "zline": 17353, "decl": "showHandHistoryModal", "en": "Copy", "zh": "复制", "kind": "term"}, {"line": 17391, "zline": 17393, "decl": "pctColor", "en": "Board${cardsHtml(boardCards, true)}", "zh": "牌面${cardsHtml(boardCards, true)}", "kind": "term"}, {"line": 17431, "zline": 17433, "decl": "pct", "en": "Board at fold (${e.street})${cardsHtml(streetBoard, true)}", "zh": "牌面 at fold (${e.street})${cardsHtml(streetBoard, true)}", "kind": "term"}, {"line": 17470, "zline": 17472, "decl": "tbPct", "en": "Squeezed", "zh": "被挤压", "kind": "term"}, {"line": 17558, "zline": 17560, "decl": "leaderboardTier", "en": "Unknown", "zh": "未知", "kind": "term"}, {"line": 17558, "zline": 17560, "decl": "leaderboardTier", "en": "Too few hands to score — keep playing against them.", "zh": "手数太少无法评分——继续跟他打吧。", "kind": "sentence"}, {"line": 17560, "zline": 17562, "decl": "leaderboardTier", "en": "Whale", "zh": "鲸鱼", "kind": "term"}, {"line": 17560, "zline": 17562, "decl": "leaderboardTier", "en": "Loose and consistently losing — high-value target with a solid sample.", "zh": "松且持续输钱——高价值目标，样本充足。", "kind": "sentence"}, {"line": 17561, "zline": 17563, "decl": "leaderboardTier", "en": "Fish", "zh": "鱼", "kind": "term"}, {"line": 17561, "zline": 17563, "decl": "leaderboardTier", "en": "Plays too many hands and loses often at showdown — exploitable.", "zh": "玩太多牌且常在摊牌输钱——容易剥削。", "kind": "sentence"}, {"line": 17562, "zline": 17564, "decl": "leaderboardTier", "en": "Reg", "zh": "职业", "kind": "term"}, {"line": 17562, "zline": 17564, "decl": "leaderboardTier", "en": "Tight, selective, and winning at showdown — treat with caution.", "zh": "紧、有选择性且在摊牌赢钱——谨慎对待。", "kind": "sentence"}, {"line": 17563, "zline": 17565, "decl": "leaderboardTier", "en": "Regular", "zh": "普通", "kind": "term"}, {"line": 17563, "zline": 17565, "decl": "leaderboardTier", "en": "Average profile — no strong read either way yet.", "zh": "平均数据——尚无明确解读。", "kind": "sentence"}, {"line": 17588, "zline": 17590, "decl": "TIER_FILTERS", "en": "Whale", "zh": "鲸鱼", "kind": "term"}, {"line": 17588, "zline": 17590, "decl": "TIER_FILTERS", "en": "Fish", "zh": "鱼", "kind": "term"}, {"line": 17588, "zline": 17590, "decl": "TIER_FILTERS", "en": "Reg", "zh": "职业", "kind": "term"}, {"line": 17588, "zline": 17590, "decl": "TIER_FILTERS", "en": "Regular", "zh": "普通", "kind": "term"}, {"line": 17588, "zline": 17590, "decl": "TIER_FILTERS", "en": "Unknown", "zh": "未知", "kind": "term"}, {"line": 17773, "zline": 17775, "decl": "patternCount", "en": "Triple barrel bluff", "zh": "三重枪诈唬", "kind": "term"}, {"line": 17775, "zline": 17777, "decl": "patternCount", "en": "Probably chasing the flush with ${flushCard} — missed and kept firing anyway.", "zh": "可能是在用${flushCard}追同花 — 没中但继续开枪。", "kind": "sentence"}, {"line": 17776, "zline": 17778, "decl": "patternCount", "en": "Likely on a straight draw that bricked.", "zh": "很可能是顺子听牌没中。", "kind": "sentence"}, {"line": 17777, "zline": 17779, "decl": "patternCount", "en": "${nthTime} triple-barrelling a bluff — compulsive bluffer. 4-bet or float and let them hang themselves.", "zh": "${nthTime}连续三枪诈唬 — 强迫性诈唬者。4-bet或漂浮跟注，让他们自取灭亡。", "kind": "sentence"}, {"line": 17777, "zline": 17779, "decl": "patternCount", "en": "Note the board texture he picks for triple barrels.", "zh": "注意他选择三枪诈唬的牌面结构。", "kind": "sentence"}, {"line": 17778, "zline": 17780, "decl": "patternCount", "en": "Committed three streets with nothing.${chaseNote}${pattern}", "zh": "三街连续下注但没有任何牌。${chaseNote}${pattern}", "kind": "sentence"}, {"line": 17781, "zline": 17783, "decl": "patternCount", "en": "Bluffed to showdown", "zh": "诈唬到摊牌", "kind": "term"}, {"line": 17784, "zline": 17786, "decl": "patternCount", "en": "High flush card, understandable semi-bluff", "zh": "高同花牌，可以理解的半诈唬", "kind": "sentence"}, {"line": 17784, "zline": 17786, "decl": "patternCount", "en": "Low flush card, bad spot to bluff", "zh": "低同花牌，不适合诈唬的位置", "kind": "sentence"}, {"line": 17785, "zline": 17787, "decl": "patternCount", "en": "${quality} — chasing with ${flushCard} on a flush-draw board.${sizeNote}Didn't catch it. Classic chaser. Bet them off draws hard, they call too wide.", "zh": "${quality} — 在听同花牌面上用${flushCard}追牌。${sizeNote}没追上。经典追牌者。用下注赶走他们的听牌，他们跟注范围太宽。", "kind": "sentence"}, {"line": 17787, "zline": 17789, "decl": "patternCount", "en": "Probable straight draw that missed. Bluffed into the wrong person. Note the connected board — this player bets when they pick up equity, even low equity.", "zh": "可能是顺子听牌没中。诈唬错了人。注意关联牌面 — 这个玩家在有胜率时就会下注，即使胜率很低。", "kind": "sentence"}, {"line": 17801, "zline": 17803, "decl": "patternCount", "en": "Slowplay trap — checked ${street} with ${handName || 'a strong hand'} then raised. Be cautious when this player checks. They're willing to give a free card to spring a trap.", "zh": "慢打陷阱 — 在${street}过牌${handName ? '持有' + handName : '持强牌'}然后加注。这位玩家过牌时需谨慎。他们愿意送免费牌来设陷阱。", "kind": "sentence"}, {"line": 17806, "zline": 17808, "decl": "patternCount", "en": "3-bet bluff", "zh": "3-bet 诈唬", "kind": "term"}, {"line": 17808, "zline": 17810, "decl": "patternCount", "en": "${nthTime} 3-bet bluffing${posNote}. Either a serial bluffer or overvaluing marginal hands. Consider 4-betting light — they're folding or playing badly postflop.", "zh": "${nthTime} 3-bet诈唬${posNote}。要么是连续诈唬者，要么是高估了边缘牌。考虑用轻4-bet — 他们会弃牌或翻牌后打得很差。", "kind": "sentence"}, {"line": 17809, "zline": 17811, "decl": "patternCount", "en": "3-bet with nothing${posNote}. Could be a one-off or a pattern. Track frequency — if they do it again, 4-bet them.", "zh": "用空气牌3-bet${posNote}。可能是一次性的，也可能是模式。追踪频率 — 如果他们再做一次，就4-bet他们。", "kind": "sentence"}, {"line": 17812, "zline": 17814, "decl": "patternCount", "en": "Called off big stack with weak hand", "zh": "用弱牌跟注大筹码", "kind": "sentence"}, {"line": 17814, "zline": 17816, "decl": "patternCount", "en": "Chasing the flush with ${flushCard}${highFlushCard ? ' — high card, pot odds might have looked okay' : ' — low card, terrible odds'}. Called off ${tag.extra || 'a big chunk'} and missed. Textbook chaser. Bet them off draws — they won't fold but they'll often miss.", "zh": "用${flushCard}追同花${highFlushCard ? ' — 高牌，底池赔率可能看起来还行' : ' — 低牌，赔率很差'}。投入了${tag.extra || '大量筹码'}然后没中。教科书式追牌者。用下注赶走他们的听牌 — 他们不会弃牌但经常不中。", "kind": "sentence"}, {"line": 17816, "zline": 17818, "decl": "patternCount", "en": "Called a big bet drawing to a straight. ${tag.extra || 'Significant'} stack at risk on a draw. Can be exploited — deny equity hard on draw-heavy boards.", "zh": "用顺子听牌跟注大注。${tag.extra || '大量'}筹码冒险追牌。可被利用 — 在听牌多的牌面上强硬拒绝胜率。", "kind": "sentence"}, {"line": 17817, "zline": 17819, "decl": "patternCount", "en": "Called off ${tag.extra || 'big'} with ${handName || 'a weak hand'} — no draw, just bad call. Station tendencies. Value bet mercilessly, don't bluff.", "zh": "用${handName || '弱牌'}投入${tag.extra || '大额'}筹码 — 没有听牌，纯粹是糟糕的跟注。站台式倾向。无情地价值下注，不要诈唬。", "kind": "sentence"}, {"line": 17820, "zline": 17822, "decl": "patternCount", "en": "Limp-reraise preflop", "zh": "翻前平跟反加", "kind": "term"}, {"line": 17821, "zline": 17823, "decl": "patternCount", "en": "Limp-reraise with ${handName || 'a hand'} — classic trap with premiums (AA/KK). When this player limps and re-raises, give them maximum credit. Fold unless you have the nuts.", "zh": "用${handName || '一手牌'}溜入-再加注 — 经典的超强牌陷阱（AA/KK）。当这位玩家溜入并反加时，给予最大尊重。除非你有坚果，否则弃牌。", "kind": "sentence"}, {"line": 17825, "zline": 17827, "decl": "patternCount", "en": "Donk-bet flop into PFA", "zh": "翻牌反主动下注打翻前攻击者", "kind": "term"}, {"line": 17826, "zline": 17828, "decl": "patternCount", "en": "Donk-bet into the preflop aggressor and took it down. Either very strong or found a spot the PFA couldn't defend. Watch if they repeat this — could be a positional exploit or just luck.", "zh": "向翻牌前攻击者反主动下注并拿下底池。要么是非常强，要么是找到了PFA无法防守的场合。注意他们是否重复此行为 — 可能是位置剥削或只是运气好。", "kind": "sentence"}, {"line": 17827, "zline": 17829, "decl": "patternCount", "en": "Donk-bet into the preflop aggressor and lost. Doesn't respect position. Easy to exploit — raise their donk-bets and they'll fold or misplay.", "zh": "向翻牌前攻击者反主动下注并输掉。不尊重位置。容易被利用 — 加注他们的反主动下注，他们会弃牌或打错。", "kind": "sentence"}, {"line": 17854, "zline": 17856, "decl": "renderAutoTagEntry", "en": "Hand", "zh": "手牌", "kind": "term"}, {"line": 17863, "zline": 17865, "decl": "renderAutoTagEntry", "en": "Board", "zh": "牌面", "kind": "term"}, {"line": 17901, "zline": 17903, "decl": "showAutoTagsModal", "en": "Notable Plays — ${escHtml(displayName)}", "zh": "Notable 入池率 — ${escHtml(displayName)}", "kind": "term"}, {"line": 18038, "zline": 18040, "decl": "STREETS", "en": "Pre", "zh": "翻前", "kind": "term"}, {"line": 18038, "zline": 18040, "decl": "STREETS", "en": "Flop", "zh": "翻牌", "kind": "term"}, {"line": 18038, "zline": 18040, "decl": "STREETS", "en": "Turn", "zh": "转牌", "kind": "term"}, {"
